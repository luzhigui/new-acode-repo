<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI','PingFang SC',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.header{background:#16213e;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #0f3460;flex-wrap:wrap}

@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}100%{transform:translateX(0)}}

.side-panel{width:340px;min-width:340px;display:flex;flex-direction:column;border-left:1px solid #0f3460}
.tabs{display:flex;background:#16213e;border-bottom:1px solid #0f3460}

.tab.active{color:#ffd700;border-bottom-color:#ffd700}

.panel-content{flex:1;overflow-y:auto;padding:8px;font-size:0.78rem;line-height:1.5}
.log-entry{margin-bottom:3px;padding:1px 0;word-break:break-word}
.log-entry .sub-entry{padding:0 2px}
.log-entry.combat-text{color:#ccc}
.log-entry.detail{color:#888;font-size:0.72rem}
.log-entry.damage-text{color:#ff6b6b}
.log-entry.info{color:#aaa}

.log-entry .blue{color:#6ab0ff}

.log-entry .small{font-size:0.7rem}

.stats-table{width:100%;border-collapse:collapse;font-size:0.72rem}
.stats-table th{background:#16213e;color:#ffd700;padding:4px;text-align:left;border-bottom:1px solid #0f3460;position:sticky;top:0}
.stats-table td{padding:3px 4px;border-bottom:1px solid #1a1a3e}
.stats-table tr.dead td{opacity:.5}
.result-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#16213e;border:2px solid #ffd700;border-radius:12px;padding:20px 40px;text-align:center;z-index:100;box-shadow:0 0 30px rgba(255,215,0,.3)}
.result-banner h2{color:#ffd700;font-size:1.4rem;margin-bottom:8px}
.result-banner p{color:#aaa;font-size:0.85rem}
.dmg-float{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:0.75rem;font-weight:bold;color:#f44336;pointer-events:none;animation:dmgFloat 1s ease forwards;z-index:10}
.heal-float{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:0.75rem;font-weight:bold;color:#4caf50;pointer-events:none;animation:dmgFloat 1s ease forwards;z-index:10}
@keyframes dmgFloat{0%{opacity:1;top:0}100%{opacity:0;top:-30px}}
/* Buff 选择弹窗 */
.buff-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}

.buff-choices{display:flex;flex-direction:column;gap:8px}

.buff-choice:hover{background:#1a4a7a;border-color:#ffd700}
.buff-choice .buff-title{font-size:0.9rem;font-weight:bold;color:#ffd700}
.buff-choice .buff-desc{font-size:0.75rem;color:#aaa;margin-top:4px}
.buff-slots{display:flex;gap:6px;align-items:center}
.buff-slot{background:#0f3460;border:1px solid #1a4a7a;border-radius:4px;padding:2px 8px;font-size:0.7rem;color:#888}
.buff-slot.active{color:#ffd700;border-color:#ffd700;background:#2a2a4e}
</style>
</head>
<body>
<div class="header">
  <h1>光明顶5v5</h1>
  <span class="ver">响应式架构 · 事件驱动 V2</span>
  <div class="buff-slots" id="buffSlots">
    <span class="buff-slot" id="buffSlot0">buff1</span>
    <span class="buff-slot" id="buffSlot1">buff2</span>
  </div>
  <div class="controls">
    <select id="stageSelect">
      <option value="1">第一关</option>
      <option value="2">第二关</option>
      <option value="3">第三关</option>
      <option value="4">第四关</option>
      <option value="5">第五关</option>
      <option value="6">第六关</option>
    </select>
    <button id="btnStart">▶ 开始战斗</button>
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnSkip">⏭ 跳过</button>
    <button id="btnSpeed" data-speed="1" class="active">1x</button>
    <button id="btnSpeed2" data-speed="2">2x</button>
    <button id="btnSpeed4" data-speed="4">4x</button>
  </div>
</div>
<div class="main">
  <div class="battlefield" id="battlefield">
    <div class="team-section">
      <div class="team-label enemy">六大派</div>
      <div class="grid" id="gridEnemy"></div>
    </div>
    <div class="team-section">
      <div class="team-label ally">明教</div>
      <div class="grid" id="gridAlly"></div>
    </div>
  </div>
  <div class="side-panel">
    <div class="tabs">
      <div class="tab active" data-tab="log">战斗日志</div>
      <div class="tab" data-tab="stats">数据统计</div>
    </div>
    <div class="panel-content" id="tabLog"></div>
    <div class="panel-content" id="tabStats" style="display:none"></div>
  </div>
</div>

<script type="module">
import { CONFIG, ENEMY_M } from './core/01config-5v5-test.js';
import { Unit } from './core/02unit.js';
import { rand } from './core/03battle-utils.js';
import { runBattle } from './core/06battle-engine-core.js';

const C = CONFIG;
const ALL_BUFF_KEYS = Object.keys(C.BUFFS);

// ==================== 响应式状态仓库 ====================
function createStore(initialState, reducer) {
    let state = initialState;
    const listeners = [];
    return {
        getState: () => state,
        dispatch(action) {
            const next = reducer(state, action);
            if (next === state) return;
            state = next;
            listeners.forEach(fn => { try { fn(state, action); } catch(e) { console.error(e); } });
        },
        subscribe(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); }
    };
}

// ==================== reducer ====================
function battleReducer(state, action) {
    switch (action.type) {
        case 'BATTLE_INIT':
            return { ...state, units: action.units, round: 0, phase: 'ready', winner: null, activeBuffs: action.activeBuffs || [] };
        case 'LOG_ENTRY': {
            const entry = action.entry;
            let units = state.units;
            let stats = state.stats || {};
            // 拒马生成
            if (entry.type === 'buff-summon' && entry.horseUid) {
                const horseUnit = { uid: entry.horseUid, name: '拒马', role: '防战', camp: 'ally', pos: entry.horsePos, hp: 50, maxHp: 50, atk: 0, def: 5, alive: true, isHorse: true, dmgDealt: 0, dmgTaken: 0, healDone: 0, dodgeCount: 0, critCount: 0, survivedRounds: 0 };
                units = [...units, horseUnit];
            }
            // 拒马销毁
            else if (entry.type === 'buff-destroy' && entry.horseUid) {
                units = units.map(u => u.uid === entry.horseUid ? { ...u, alive: false, hp: 0, _isDead: true } : u);
            }
            else if (entry.type === 'attack-group') {
                const result = applyAttackGroup(units, entry, stats);
                units = result.units;
                stats = result.stats;
            } else if (entry._events) {
                units = applyEvents(units, entry._events);
            }
            // 回合变更时给存活单位 +1 survivedRounds
            if (entry.type === 'round-end') {
                units = units.map(u => u.alive ? { ...u, survivedRounds: (u.survivedRounds || 0) + 1 } : u);
            }
            return { ...state, units, stats, lastEntry: entry };
        }
        case 'ROUND_CHANGE':
            return { ...state, round: action.round };
        case 'BATTLE_END': {
            const synced = syncFinalState(state.units, action.ally, action.enemy);
            return { ...state, phase: 'ended', winner: action.winner, units: synced };
        }
        default:
            return state;
    }
}

// 从 attack-group 日志条目中提取状态变更 + 推导统计值
function applyAttackGroup(units, entry, oldStats) {
    let next = units.map(u => ({ ...u }));
    let stats = { ...oldStats };

    const attackerId = entry.uidA;
    const defenderId = entry.uidD;
    const dmg = entry._dmg || 0;
    const isMiss = entry.isMiss;
    const isDodge = entry.isDodge;

    // 统计推导：伤害/承伤
    if (dmg > 0 && !isMiss && !isDodge && defenderId != null) {
        const aIdx = next.findIndex(u => u.uid === attackerId);
        const dIdx = next.findIndex(u => u.uid === defenderId);
        if (aIdx >= 0) next[aIdx].dmgDealt = (next[aIdx].dmgDealt || 0) + dmg;
        if (dIdx >= 0) next[dIdx].dmgTaken = (next[dIdx].dmgTaken || 0) + dmg;
    }

    // 闪避计数
    if (isDodge && defenderId != null) {
        const dIdx = next.findIndex(u => u.uid === defenderId);
        if (dIdx >= 0) next[dIdx].dodgeCount = (next[dIdx].dodgeCount || 0) + 1;
    }

    // 更新被攻击者 HP
    if (defenderId != null && entry.hpAfter != null) {
        const idx = next.findIndex(u => u.uid === defenderId);
        if (idx >= 0) {
            next[idx].hp = entry.hpAfter;
            next[idx].alive = entry.alive !== undefined ? entry.alive : next[idx].alive;
            if (!next[idx].alive) next[idx]._isDead = true;
        }
    }

    // 更新攻击者 HP（闪避反击场景，uidA 是反击目标）
    if (isDodge && attackerId != null && entry.hpAfter != null) {
        const idx = next.findIndex(u => u.uid === attackerId);
        if (idx >= 0) {
            next[idx].hp = entry.hpAfter;
            next[idx].alive = entry.alive !== undefined ? entry.alive : next[idx].alive;
            if (!next[idx].alive) next[idx]._isDead = true;
        }
    }

    // 从 entries 子条目中提取额外信息
    if (entry.entries) {
        for (const sub of entry.entries) {
            // 暴击计数
            if (sub.type === 'detail' && sub.text && sub.text.includes('暴击')) {
                const aIdx = next.findIndex(u => u.uid === attackerId);
                if (aIdx >= 0) next[aIdx].critCount = (next[aIdx].critCount || 0) + 1;
            }
            // 治疗
            if (sub.isHealEntry && sub.healAmount) {
                const healTargetUid = sub.healUnitUid || attackerId;
                const idx = next.findIndex(u => u.uid === healTargetUid);
                if (idx >= 0) next[idx].healDone = (next[idx].healDone || 0) + sub.healAmount;
            }
            // 反弹
            if (sub.buffType === 'rebound' && sub.text) {
                const m = sub.text.match(/反弹(\d+)/);
                if (m) {
                    const rebound = parseInt(m[1]);
                    const aIdx = next.findIndex(u => u.uid === attackerId);
                    if (aIdx >= 0) {
                        next[aIdx].dmgTaken = (next[aIdx].dmgTaken || 0) + rebound;
                        next[aIdx].reboundDone = (next[aIdx].reboundDone || 0) + rebound;
                    }
                }
            }
            // 吸血
            if (sub.isHealEntry && sub.text && sub.text.includes('吸血')) {
                const m = sub.text.match(/吸血\+(\d+)/);
                if (m) {
                    const leech = parseInt(m[1]);
                    const aIdx = next.findIndex(u => u.uid === attackerId);
                    if (aIdx >= 0) {
                        next[aIdx].leechDone = (next[aIdx].leechDone || 0) + leech;
                        next[aIdx].healDone = (next[aIdx].healDone || 0) + leech;
                    }
                }
            }
        }
    }

    // 应用事件中的 HP 变更（覆盖前面推导的值，事件是引擎产出的精确值）
    if (entry._events && entry._events.length > 0) {
        next = applyEvents(next, entry._events);
    }

    return { units: next, stats };
}

function applyEvents(units, events) {
    if (!events || events.length === 0) return units;
    let next = units.map(u => ({ ...u }));
    for (const ev of events) {
        const idx = next.findIndex(u => u.uid === ev.unitUid);
        if (idx < 0) continue;
        const p = ev.payload;
        if (p.hp !== undefined) next[idx].hp = p.hp;
        if (p.maxHp !== undefined) next[idx].maxHp = p.maxHp;
        if (p.alive !== undefined) next[idx].alive = p.alive;
        if (p.atk !== undefined) next[idx].atk = p.atk;
        if (p.def !== undefined) next[idx].def = p.def;
        if (p.dmgDealt !== undefined) next[idx].dmgDealt = p.dmgDealt;
        if (p.dmgTaken !== undefined) next[idx].dmgTaken = p.dmgTaken;
        if (p.healDone !== undefined) next[idx].healDone = p.healDone;
        if (p.reboundDone !== undefined) next[idx].reboundDone = p.reboundDone;
        if (p.leechDone !== undefined) next[idx].leechDone = p.leechDone;
        if (p.dodgeCount !== undefined) next[idx].dodgeCount = p.dodgeCount;
        if (p.critCount !== undefined) next[idx].critCount = p.critCount;
        if (p.survivedRounds !== undefined) next[idx].survivedRounds = p.survivedRounds;
    }
    return next;
}

function syncFinalState(units, ally, enemy) {
    let next = units.map(u => ({ ...u }));
    const all = [...ally, ...enemy];
    for (const src of all) {
        const idx = next.findIndex(u => u.uid === src.uid);
        if (idx >= 0) {
            next[idx].hp = src.hp;
            next[idx].maxHp = src.maxHp;
            next[idx].alive = src.alive;
            next[idx].atk = src.atk;
            next[idx].def = src.def;
            next[idx].dmgDealt = src.dmgDealt || 0;
            next[idx].dmgTaken = src.dmgTaken || 0;
            next[idx].healDone = src.healDone || 0;
            next[idx].reboundDone = src.reboundDone || 0;
            next[idx].leechDone = src.leechDone || 0;
            next[idx].dodgeCount = src.dodgeCount || 0;
            next[idx].critCount = src.critCount || 0;
            next[idx].survivedRounds = src.survivedRounds || 0;
            next[idx]._isDead = !src.alive;
        }
    }
    return next;
}

// ==================== 阵容生成（复刻原版逻辑） ====================
function generateAllyTeam(stage) {
    const squad = C.MING_SQUADS[stage];
    let config;
    if (stage === 1 && Array.isArray(squad[0])) {
        config = squad[rand(0, squad.length - 1)];
    } else {
        config = squad;
    }
    if (!Array.isArray(config)) config = [config];

    const team = [];
    const takenPos = new Set();
    for (const item of config) {
        let name, mVal;
        if (typeof item === 'string') {
            name = item; mVal = C.MING_M[name] || 95;
        } else {
            mVal = item;
            if (mVal === 95) {
                const count = team.filter(u => u.name && u.name.startsWith('明教弟子')).length;
                name = '明教弟子' + (count + 1);
            } else {
                const used = team.map(u => u.name);
                const candidates = Object.entries(C.MING_M).filter(([n, v]) => v === mVal && !used.includes(n));
                name = candidates.length > 0 ? candidates[rand(0, candidates.length - 1)][0] : '明教弟子' + (team.length + 1);
            }
        }
        const role = name === '张无忌' ? '远程' : (name === '韦一笑' ? '飞行' : C.ROLES[rand(0, 3)]);
        const unit = new Unit(name, mVal, role, 'ally');
        if (name === '张无忌') unit.isZhang = true;
        if (name === '韦一笑') unit.isWei = true;
        unit.init(); unit.applyBonus();
        team.push(unit);
    }
    const zhang = team.find(u => u.isZhang);
    const wei = team.find(u => u.isWei);
    if (zhang) { zhang.pos = 5; takenPos.add(5); }
    if (wei) { wei.pos = 6; takenPos.add(6); }
    const others = team.filter(u => !u.isZhang && !u.isWei);
    if (others.length > 0 && zhang && !takenPos.has(2)) { others[0].pos = 2; takenPos.add(2); others.shift(); }
    let slots = [1,2,3,4,5,6,7,8,9].filter(p => !takenPos.has(p));
    for (const u of others) {
        if (slots.length > 0) { const i = rand(0, slots.length - 1); u.pos = slots[i]; takenPos.add(slots[i]); slots.splice(i, 1); }
        else u.pos = 5;
    }
    return team;
}

function generateEnemyTeam(stage) {
    const squad = C.ENEMY_SQUADS[stage];
    const units = [];
    const posSet = new Set();
    for (const item of squad) {
        if (typeof item === 'object' && item.name) {
            const u = new Unit(item.name, item.m, item.role, 'enemy');
            u.init(); u.applyBonus();
            units.push(u);
        } else {
            const mVal = item;
            const pool = Object.entries(ENEMY_M).filter(([n, v]) => v === mVal);
            const used = units.map(u => u.name);
            let name = null;
            const defs = Object.values(C.ENEMY_SQUADS).flat();
            for (const d of defs) { if (typeof d === 'object' && d.m === mVal && !used.includes(d.name)) { name = d.name; break; } }
            if (!name && pool.length > 0) {
                let tries = 0;
                while ((!name || used.includes(name)) && tries < 50) { name = pool[rand(0, pool.length - 1)][0]; tries++; }
            }
            if (!name) name = '六大派弟子';
            const role = C.ROLES[rand(0, 3)];
            const u = new Unit(name, mVal, role, 'enemy');
            u.init(); u.applyBonus();
            units.push(u);
        }
    }
    const xuanmingCount = units.filter(u => u.name === '鹿杖客' || u.name === '鹤笔翁').length;
    if (stage === 5 && xuanmingCount === 2) {
        const pool = Object.entries(ENEMY_M).filter(([n, v]) => v === 104);
        const used = units.map(u => u.name);
        let name = null;
        while ((!name || used.includes(name)) && pool.length > 0) { const p = pool[rand(0, pool.length - 1)]; name = p[0]; if (used.includes(name)) { name = null; pool.splice(pool.indexOf(p), 1); } }
        if (!name) name = '六大派弟子';
        const u = new Unit(name, 104, C.ROLES[rand(0, 3)], 'enemy');
        u.init(); u.applyBonus();
        units.push(u);
    }
    const template = C.ENEMY_POS_TEMPLATES[stage];
    const eliteDefs = C.ELITE_POOL[stage] || [];
    const eliteUnits = units.filter(u => eliteDefs.some(e => e.name === u.name));
    const normalUnits = units.filter(u => !eliteUnits.includes(u));
    if (template) {
        for (const [role, poses] of Object.entries(template)) {
            if (role === 'random') continue;
            for (const pos of poses) {
                const u = normalUnits.find(u => u.role === role && u.pos == null);
                if (u && !posSet.has(pos)) { u.pos = pos; u._originalPos = pos; posSet.add(pos); }
            }
        }
    }
    let empty = [1,2,3,4,5,6,7,8,9].filter(p => !posSet.has(p));
    for (const u of normalUnits.filter(u => u.pos == null)) {
        if (empty.length > 0) { const i = rand(0, empty.length - 1); u.pos = empty[i]; u._originalPos = u.pos; posSet.add(empty[i]); empty.splice(i, 1); }
    }
    const zhou = eliteUnits.find(u => u.name === '周芷若');
    const song = eliteUnits.find(u => u.name === '宋青书');
    if (zhou) { for (const p of [2,3,4,5,6,7,8,9]) { if (!posSet.has(p)) { zhou.pos = p; zhou._originalPos = p; posSet.add(p); break; } } }
    if (song) {
        const zp = zhou ? zhou.pos : 0;
        for (let p = zp + 1; p <= 9; p++) { if (!posSet.has(p)) { song.pos = p; song._originalPos = p; posSet.add(p); break; } }
        if (song.pos == null) { for (let p = 1; p <= 9; p++) { if (!posSet.has(p)) { song.pos = p; song._originalPos = p; posSet.add(p); break; } } }
    }
    for (const u of eliteUnits.filter(u => u !== zhou && u !== song && u.pos == null)) {
        empty = [1,2,3,4,5,6,7,8,9].filter(p => !posSet.has(p));
        if (empty.length > 0) { const i = rand(0, empty.length - 1); u.pos = empty[i]; u._originalPos = u.pos; posSet.add(empty[i]); }
    }
    return units;
}

// ==================== Buff 选择 ====================
let activeBuffs = [];

function generateBuffChoices() {
    const activeKeys = activeBuffs.map(b => b.key);
    const available = ALL_BUFF_KEYS.filter(k => !activeKeys.includes(k));
    const shuffled = [...available].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, C.BUFF_CHOICES);
}

function showBuffSelection() {
    return new Promise(resolve => {
        const choices = generateBuffChoices();
        const modal = document.createElement('div');
        modal.className = 'buff-modal';
        modal.innerHTML = `
            <div class="buff-modal-content">
                <h3>选择 Buff（持续 ${C.BUFF_DURATION} 回合）</h3>
                <div class="buff-choices">
                    ${choices.map(key => {
                        const buff = C.BUFFS[key];
                        return `<div class="buff-choice" data-key="${key}"><div class="buff-title">${buff.icon} ${buff.name}</div><div class="buff-desc">${buff.desc}</div></div>`;
                    }).join('')}
                </div>
            </div>`;
        document.body.appendChild(modal);
        modal.querySelectorAll('.buff-choice').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.key;
                const buff = C.BUFFS[key];
                activeBuffs.push({ key, name: buff.name, icon: buff.icon, remaining: C.BUFF_DURATION });
                updateBuffSlots();
                appendLog({ type: 'info', text: `<span class="gold">✨ 获得 Buff：${buff.icon} ${buff.name}（持续${C.BUFF_DURATION}回合）</span>` });
                modal.remove();
                resolve();
            });
        });
    });
}

function updateBuffSlots() {
    for (let i = 0; i < 2; i++) {
        const slot = document.getElementById('buffSlot' + i);
        if (!slot) continue;
        if (i < activeBuffs.length) {
            const buff = activeBuffs[i];
            slot.textContent = `${buff.icon}${buff.name}/${buff.remaining}回`;
            slot.classList.add('active');
        } else {
            slot.textContent = 'buff' + (i + 1);
            slot.classList.remove('active');
        }
    }
}

// ==================== UI 渲染 ====================
function renderGrid(gridEl, units, camp, activeBuffKeys = []) {
    gridEl.innerHTML = '';
    for (let pos = 1; pos <= 9; pos++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + camp;
        cell.dataset.pos = pos;
        const unit = units.find(u => u.pos === pos);
        if (!unit || !unit.alive) {
            if (unit) {
                cell.classList.add('dead');
                cell.innerHTML = `<span class="unit-pos">${pos}</span><span class="unit-name" style="text-decoration:line-through">${unit.name}</span><span class="unit-role">${unit.role}</span>`;
            } else {
                cell.classList.add('empty');
                cell.innerHTML = `<span class="unit-pos">${pos}</span>`;
            }
            gridEl.appendChild(cell);
            continue;
        }
        cell.classList.add(camp);
        const hpPct = (unit.hp / unit.maxHp) * 100;
        const hpClass = hpPct > 60 ? 'high' : (hpPct > 30 ? 'mid' : 'low');
        let tags = '';
        if (unit.isZhang) tags += '👑';
        if (unit.isWei) tags += '🦇';
        if (unit.isHorse) tags += '🐴';
        // Buff 图标
        let buffIcons = '';
        if (camp === 'ally' && activeBuffKeys.length > 0) {
            buffIcons = activeBuffKeys.map(k => C.BUFFS[k]?.icon || '').join('');
        }
        cell.innerHTML = `
            <span class="unit-pos">${pos}</span>
            ${buffIcons ? `<div class="buff-badge">${activeBuffKeys.map(k => `<span class="buff-icon">${C.BUFFS[k]?.icon || ''}</span>`).join('')}</div>` : ''}
            <span class="unit-name">${tags}${unit.name}</span>
            <span class="unit-role">${unit.role} M${unit.m}</span>
            <div class="hp-bar"><div class="hp-fill ${hpClass}" style="width:${hpPct}%"></div></div>
            <span class="hp-text">${Math.floor(unit.hp)}/${Math.floor(unit.maxHp)}</span>
            <div class="unit-stats"><span>⚔${Math.floor(unit.atk)}</span><span>🛡${Math.floor(unit.def)}</span></div>
        `;
        gridEl.appendChild(cell);
    }
}

function renderAll(state) {
    const allyUnits = state.units.filter(u => u.camp === 'ally');
    const enemyUnits = state.units.filter(u => u.camp === 'enemy');
    const buffKeys = (state.activeBuffs || []).map(b => b.key);
    renderGrid(document.getElementById('gridAlly'), allyUnits, 'ally', buffKeys);
    renderGrid(document.getElementById('gridEnemy'), enemyUnits, 'enemy', []);
}

function renderStats(state) {
    const tab = document.getElementById('tabStats');
    const all = [...state.units].sort((a, b) => (b.dmgDealt || 0) - (a.dmgDealt || 0));
    let html = '<table class="stats-table"><thead><tr><th>名称</th><th>阵营</th><th>输出</th><th>承伤</th><th>治疗</th><th>闪避</th><th>暴击</th><th>存活</th><th>状态</th></tr></thead><tbody>';
    for (const u of all) {
        html += `<tr class="${u.alive ? '' : 'dead'}"><td>${u.name}</td><td>${u.camp === 'ally' ? '明教' : '六大派'}</td><td>${u.dmgDealt||0}</td><td>${u.dmgTaken||0}</td><td>${u.healDone||0}</td><td>${u.dodgeCount||0}</td><td>${u.critCount||0}</td><td>${u.survivedRounds||0}</td><td>${u.alive ? '✅' : '💀'}</td></tr>`;
    }
    html += '</tbody></table>';
    tab.innerHTML = html;
}

function appendLog(entry) {
    const tab = document.getElementById('tabLog');
    const div = document.createElement('div');
    div.className = 'log-entry ' + (entry.type || 'info');
    if (entry.text) {
        div.innerHTML = entry.text;
    } else if (entry.type === 'attack-group') {
        if (entry.entries && entry.entries.length > 0) {
            div.innerHTML = entry.entries.map(e => `<div class="sub-entry ${e.type||''}">${e.text || ''}</div>`).join('');
        } else {
            div.innerHTML = '';
        }
    } else {
        div.innerHTML = '';
    }
    tab.appendChild(div);
    tab.scrollTop = tab.scrollHeight;
}

// 高亮攻击/受击动画
function highlightAttack(state, entry) {
    if (entry.type !== 'attack-group') return;
    const attackerUid = entry.uidA;
    const defenderUid = entry.uidD;
    const units = state.units;
    const attacker = units.find(u => u.uid === attackerUid);
    const defender = units.find(u => u.uid === defenderUid);
    if (attacker) {
        const grid = attacker.camp === 'ally' ? document.getElementById('gridAlly') : document.getElementById('gridEnemy');
        const cell = grid.querySelector(`.cell[data-pos="${attacker.pos}"]`);
        if (cell) { cell.classList.add('attacking'); setTimeout(() => cell.classList.remove('attacking'), 400); }
    }
    if (defender) {
        const grid = defender.camp === 'ally' ? document.getElementById('gridAlly') : document.getElementById('gridEnemy');
        const cell = grid.querySelector(`.cell[data-pos="${defender.pos}"]`);
        if (cell) {
            if (entry.isDodge) cell.classList.add('dodging');
            else if (!entry.isMiss) cell.classList.add('damaged');
            setTimeout(() => { cell.classList.remove('damaged', 'dodging'); }, 400);
        }
        // 伤害飘字
        if (!entry.isMiss && !entry.isDodge && entry._dmg) {
            const float = document.createElement('div');
            float.className = 'dmg-float';
            float.textContent = '-' + entry._dmg;
            cell.appendChild(float);
            setTimeout(() => float.remove(), 1000);
        }
        if (entry.isDodge) {
            const float = document.createElement('div');
            float.className = 'dmg-float';
            float.style.color = '#888';
            float.textContent = '闪避!';
            cell.appendChild(float);
            setTimeout(() => float.remove(), 1000);
        }
        if (entry.isMiss) {
            const float = document.createElement('div');
            float.className = 'dmg-float';
            float.style.color = '#888';
            float.textContent = '未命中!';
            cell.appendChild(float);
            setTimeout(() => float.remove(), 1000);
        }
    }
}

// ==================== 播放器 ====================
let store = null;
let playbackController = null;
let isPaused = false;
let currentSpeed = 1;
let isSkipped = false;

async function startBattle() {
    const stage = parseInt(document.getElementById('stageSelect').value);
    document.getElementById('btnStart').disabled = true;
    document.getElementById('tabLog').innerHTML = '';
    isPaused = false;
    isSkipped = false;

    // 生成阵容
    const allyTeam = generateAllyTeam(stage);
    const enemyTeam = generateEnemyTeam(stage);

    // 设置引擎需要的全局变量
    window._battleEvents = [];
    window._currentBattleState = { ally: allyTeam, enemy: enemyTeam };

    // 初始化 store
    const allUnits = [...allyTeam.map(u => ({...u, camp: 'ally'})), ...enemyTeam.map(u => ({...u, camp: 'enemy'}))];
    const initialState = { units: allUnits, round: 0, phase: 'ready', winner: null, lastEntry: null, activeBuffs: [] };
    store = createStore(initialState, battleReducer);

    store.subscribe(state => {
        renderAll(state);
        if (document.getElementById('tabStats').style.display !== 'none') {
            renderStats(state);
        }
    });

    renderAll(store.getState());
    appendLog({ type: 'info', text: `<span class="gold">⚔️ 光明顶5v5 · 第${stage}关战斗开始！</span>` });

    // Buff 选择（2次）
    activeBuffs = [];
    updateBuffSlots();
    for (let i = 0; i < 2; i++) {
        if (isSkipped) break;
        await showBuffSelection();
    }

    // 运行完整战斗引擎
    const snapshot = {
        ally: allyTeam.map(u => u.clone()),
        enemy: enemyTeam.map(u => u.clone())
    };

    // 给引擎传 Buff（引擎期望 activeBuffs 是对象数组）
    const buffsForEngine = activeBuffs.map(b => ({ key: b.key, remaining: b.remaining }));

    window._battleEvents = [];
    window._currentBattleState = { ally: snapshot.ally, enemy: snapshot.enemy };
    const result = runBattle(snapshot, buffsForEngine, {});

    console.log('引擎跑完，总回合:', result.rounds, '胜者:', result.winner);
    console.log('日志条目数:', result.log.length);
    
    // 保存引擎最终状态用于精度对比
    window._engineFinalState = result;

    // 更新 store 的 Buff 状态
    const finalBuffKeys = (result.activeBuffs?.ally || []).map(b => b.key);
    store.dispatch({ type: 'BATTLE_INIT', units: allUnits, activeBuffs: activeBuffs });

    // 播放日志
    await playbackLog(result);

    // 更新 Buff 槽显示剩余回合
    if (result.activeBuffs?.ally) {
        activeBuffs = result.activeBuffs.ally.map(b => ({ key: b.key, name: C.BUFFS[b.key]?.name || b.key, icon: C.BUFFS[b.key]?.icon || '', remaining: b.remaining }));
        updateBuffSlots();
    }
}

async function playbackLog(result) {
    const baseDelay = 600 / currentSpeed;

    for (let i = 0; i < result.log.length; i++) {
        if (playbackController?.aborted) {
            // 跳过：直接到结束
            break;
        }

        const entry = result.log[i];

        while (isPaused) {
            await new Promise(r => setTimeout(r, 100));
            if (playbackController?.aborted) break;
        }
        if (playbackController?.aborted) break;

        let delay = baseDelay;

        if (entry.type === 'round-start') {
            const roundMatch = entry.text?.match(/第(\d+)回合/);
            if (roundMatch) {
                store.dispatch({ type: 'ROUND_CHANGE', round: parseInt(roundMatch[1]) });
            }
            delay = baseDelay * 0.5;
        } else if (entry.type === 'round-end') {
            store.dispatch({ type: 'LOG_ENTRY', entry });
            delay = baseDelay * 0.3;
        } else if (entry.type === 'attack-group') {
            store.dispatch({ type: 'LOG_ENTRY', entry });
            highlightAttack(store.getState(), entry);
            delay = baseDelay;
        } else if (entry.type === 'info') {
            delay = baseDelay * 0.5;
        } else {
            delay = baseDelay * 0.3;
        }

        appendLog(entry);

        await new Promise(r => setTimeout(r, delay));
    }

    // 战斗结束，同步最终状态
    store.dispatch({
        type: 'BATTLE_END',
        winner: result.winner,
        ally: result.ally,
        enemy: result.enemy
    });

    appendLog({ type: 'info', text: `<span class="gold">🏁 战斗结束！${result.winner}获胜！共${result.rounds}回合</span>` });

    const banner = document.createElement('div');
    banner.className = 'result-banner';
    banner.innerHTML = `<h2>${result.winner} 获胜！</h2><p>共 ${result.rounds} 回合</p>`;
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 4000);

    document.getElementById('btnStart').disabled = false;
    
    // 精度对比：播放器状态 vs 引擎最终状态
    verifyAccuracy(result);
}

function verifyAccuracy(result) {
    const storeState = store.getState();
    const mismatches = [];
    
    // 引擎最终状态
    const engineUnits = [...result.ally, ...result.enemy];
    
    for (const eu of engineUnits) {
        const su = storeState.units.find(u => u.uid === eu.uid);
        if (!su) { mismatches.push(`${eu.name}: 播放器中不存在`); continue; }
        
        const fields = ['hp', 'maxHp', 'atk', 'def', 'alive', 'dmgDealt', 'dmgTaken', 'healDone', 'reboundDone', 'leechDone', 'dodgeCount', 'critCount', 'survivedRounds'];
        for (const f of fields) {
            const ev = Math.floor(eu[f] || 0);
            const sv = Math.floor(su[f] || 0);
            if (ev !== sv) {
                mismatches.push(`${eu.name}.${f}: 引擎=${ev} 播放器=${sv}`);
            }
        }
    }
    
    if (mismatches.length === 0) {
        console.log('✅ 精度验证通过：播放器状态与引擎完全一致');
    } else {
        console.warn(`⚠️ 精度偏差 ${mismatches.length} 处：`);
        mismatches.forEach(m => console.warn('  ' + m));
    }
}

// ==================== 控制器 ====================
document.getElementById('btnStart').addEventListener('click', () => {
    document.querySelector('.result-banner')?.remove();
    playbackController = { aborted: false };
    startBattle();
});

document.getElementById('btnPause').addEventListener('click', function() {
    isPaused = !isPaused;
    this.textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
    this.classList.toggle('active', isPaused);
});

document.getElementById('btnSkip').addEventListener('click', () => {
    isPaused = false;
    if (playbackController) playbackController.aborted = true;
});

document.querySelectorAll('[id^="btnSpeed"]').forEach(btn => {
    btn.addEventListener('click', function() {
        currentSpeed = parseInt(this.dataset.speed);
        document.querySelectorAll('[id^="btnSpeed"]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
    });
});

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const target = this.dataset.tab;
        document.getElementById('tabLog').style.display = target === 'log' ? 'block' : 'none';
        document.getElementById('tabStats').style.display = target === 'stats' ? 'block' : 'none';
        if (target === 'stats' && store) renderStats(store.getState());
    });
});
