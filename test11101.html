function showErr(msg) { errBox.style.display = 'block'; errBox.textContent += msg + '\n'; }

window.addEventListener('unhandledrejection', (e) => showErr('[Promise错误] ' + String(e.reason)));

(async () => {
  try {
    const html = await fetch('./index.html', { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
    const m = html.match(/<style>[\s\S]*?<\/style>/i);
    if (!m) throw new Error('index.html 里没找到 <style> 块');

// ============================== 虚拟时间接管 ==============================
const FRAME_MS = 1000 / 60;
const TOTAL_FRAMES = 200;
const MAX_T = TOTAL_FRAMES * FRAME_MS;

const realPerfNow = performance.now.bind(performance);
const realRAF = window.requestAnimationFrame.bind(window);
const realCAF = window.cancelAnimationFrame.bind(window);
let vt = 0;
let playing = false;
let seeking = false;

performance.now = () => vt;
window.requestAnimationFrame = (cb) => realRAF(() => cb(vt));
window.cancelAnimationFrame = (id) => realCAF(id);

let lastReal = realPerfNow();
function driver() {
  const r = realPerfNow();
  const d = Math.min(r - lastReal, 100);
  lastReal = r;
  if (playing && !seeking) {
    vt += d;
    if (vt >= MAX_T) { vt = MAX_T; playing = false; updatePlayBtn(); }
    syncReadout();
  }
  guardTick();
  realRAF(driver);
}

const mc = new MessageChannel();
const yieldQueue = [];
mc.port1.onmessage = () => { const r = yieldQueue.shift(); if (r) r(); };
const yieldMacro = () => new Promise((res) => { yieldQueue.push(res); mc.port2.postMessage(0); });

function stepClock(dt) {
  if (dt <= 0) return;
  vt += dt;
  clock._realLast = vt;
  clock._realNow += dt;
  clock.now += dt * clock.timescale;
  clock._flush();
}

let seed = 20261023;
function seedRandom(s) { seed = s; }
Math.random = () => {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
};

const SCENES = {

// ============================== 状态 ==============================
let sceneKey = 'A';

// ============================== store 装配 ==============================
function buildStore(key) {
  const sc = SCENES[key];
  const units = [...sc.enemy, ...sc.ally].map((u) => ({ ...u, state: { ...(u.state || {}) } }));
  const s = createStore({ units, round: 1 }, battleReducer);
  GlobalStore.set('battleStore', s);
  setGridStore(s);
  targetUid = sc.targetUid;
  return s;
}

// ============================== 前段规划（照抄 modules/315） ==============================
const PUSH_PATH = {
  0: [1, 4, 7, 2, 5, 8, 3, 6, 9],
  1: [2, 5, 8, 1, 4, 7, 3, 6, 9],
  2: [3, 6, 9, 2, 5, 8, 1, 4, 7]
};
const isAirborne = (u) => !!(u.state && (u.state._spiderFlying || u.state._butterflyHost ||
  u.state._flyMode === 'spider' || u.state._flyMode === 'butterfly'));
const immuneOf = (u) => !!(u.state && u.state._ctrlImmune);

function forceInsert(team, unit, targetPos) {
  if (unit.pos === targetPos) return { ok: true, moved: [] };
  const occAtTarget = team.find((u) => u !== unit && u.pos === targetPos && u.alive);
  if (occAtTarget) {
    if (immuneOf(occAtTarget)) return { ok: false, reason: 'blocked-target-immune', blocked: occAtTarget, moved: [] };
    if (isAirborne(occAtTarget)) return { ok: false, reason: 'blocked-target-airborne', blocked: occAtTarget, moved: [] };
  }
  if (!occAtTarget) return { ok: true, moved: [{ unit, from: unit.pos, to: targetPos, isDash: true }] };

  const col = (targetPos - 1) % 3;
  const path = PUSH_PATH[col];
  const startIdx = path.indexOf(targetPos);
  if (startIdx === -1) return { ok: false, reason: 'bad-pos', moved: [] };

  let emptyIdx = -1, blocked = null;
  for (let i = startIdx + 1; i < path.length; i++) {
    const p = path[i];
    const occ = team.find((u) => u !== unit && u.pos === p && u.alive);
    if (occ) {
      if (immuneOf(occ)) { blocked = occ; break; }
      if (isAirborne(occ)) continue;
      continue;
    }
    emptyIdx = i; break;
  }
  if (blocked) return { ok: false, reason: 'blocked-path-immune', blocked, moved: [] };
  if (emptyIdx === -1) return { ok: false, reason: 'full', moved: [] };

  const moved = [];
  for (let i = emptyIdx; i > startIdx; i--) {
    const curr = path[i], prev = path[i - 1];
    const mover = team.find((u) => u !== unit && u.pos === prev && u.alive);
    if (mover && !isAirborne(mover)) moved.push({ unit: mover, from: prev, to: curr });
  }
  moved.push({ unit, from: unit.pos, to: targetPos, isDash: true });
  return { ok: true, moved };
}

function forceInsertAnyColumn(team, unit, preferredPos) {
  const r0 = forceInsert(team, unit, preferredPos);
  if (r0.ok) return r0;
  const prefCol = (preferredPos - 1) % 3;
  const altCols = prefCol === 1 ? [0, 2] : (prefCol === 0 ? [1, 2] : [0, 1]);
  for (const c of altCols) {
    const r = forceInsert(team, unit, c + 1);
    if (r.ok) return r;
  }
  return { ok: false, reason: 'all-blocked', moved: [] };
}

function blockText(res) {
  if (res.reason === 'full') return '无空位';
  if (res.reason === 'all-blocked') return '全部列被免疫/飞天挡下、整侧不动';
  const b = res.blocked;
  return `被 ${b ? b.name : '?'}${b && isAirborne(b) ? '（飞天/附身）' : '免疫'} 挡下、整侧不动`;
}

function planDash(uid) {
  const units = store.getState().units;
  const tw = units.find((u) => u.isTangWenLiang && u.alive);
  const target = units.find((u) => u.uid === uid && u.alive);
  if (!tw || !target) return null;

  const cfg = getSkillParams('唐文亮', 'chongCi') || {};
  const dmgRatio = cfg.dmgRatio != null ? cfg.dmgRatio : 0.45;
  const selfDmgRatio = cfg.selfDmgRatio != null ? cfg.selfDmgRatio : 0.45;

  const frontPos = ((target.pos - 1) % 3) + 1;
  const twFrom = tw.pos;
  const targetFrom = target.pos;
  const allyTeam = units.filter((u) => u.camp === target.camp && u.alive);
  const enemyTeam = units.filter((u) => u.camp === tw.camp && u.alive);

  const allyRes = target.pos > 3 ? forceInsertAnyColumn(allyTeam, target, frontPos) : { ok: true, moved: [] };
  const enemyRes = forceInsertAnyColumn(enemyTeam, tw, frontPos);

  const twTo = enemyRes.ok ? (enemyRes.moved.find((m) => m.unit === tw) || {}).to : tw.pos;
  const targetTo = allyRes.ok ? (allyRes.moved.find((m) => m.unit === target) || {}).to : target.pos;

  const toFoe = Math.max(0, Math.min(Math.round(target.hp * dmgRatio), Math.floor(target.hp) - 1));
  const toSelf = Math.max(0, Math.min(Math.round(tw.hp * selfDmgRatio), Math.floor(tw.hp) - 1));

  const moves = [...(enemyRes.ok ? enemyRes.moved : []), ...(allyRes.ok ? allyRes.moved : [])]
    .map((m) => ({ uid: m.unit.uid, camp: m.unit.camp, from: m.from, to: m.to, isDash: !!m.isDash }));
  const hits = [
    toFoe > 0 ? { uid: target.uid, dmg: toFoe } : null,
    toSelf > 0 ? { uid: tw.uid, dmg: toSelf } : null
  ].filter(Boolean);

  const dash = {
    fromUid: tw.uid, fromPos: twFrom, toPos: twTo, fromCamp: tw.camp,
    targetUid: target.uid, targetFromPos: targetFrom, targetToPos: targetTo, targetCamp: target.camp,
    moves, hits
  };
  return { tw, target, dash, enemyRes, allyRes, toFoe, toSelf, dmgRatio };
}

function renderPlan(p) {
  if (!p) { $('planPanel').innerHTML = '<span style="color:#999">规划失败：找不到唐文亮或目标。</span>'; return; }
  const listText = (res) => res.moved.map((m) => `${m.unit.name} ${m.from}→${m.to}`).join('、');
  const enemyText = p.enemyRes.ok ? (listText(p.enemyRes) || '唐文亮原地未动') : `唐文亮无法落位（${blockText(p.enemyRes)}）`;
  const allyText = p.target.pos > 3
    ? (p.allyRes.ok ? (listText(p.allyRes) || `${p.target.name} 原地未动`) : `目标侧${blockText(p.allyRes)}`)
    : `${p.target.name} 已在前排（不被推）`;
  $('planPanel').innerHTML =
    `<span class="ph">【规划】</span>唐文亮 ${p.tw.pos} → ${p.dash.toPos}（目标列 ${((p.target.pos - 1) % 3) + 1} 的前排位）<br>` +
    `冲方：${enemyText}<br>目标侧：${allyText}<br>` +
    `真伤（当前生命 ${Math.round(p.dmgRatio * 100)}%，不吃防、不致死）：目标 <span class="num">-${p.toFoe}</span>、自身 <span class="num">-${p.toSelf}</span>`;
}

// ============================== 工具函数 ==============================
function getCellRect(camp, pos) {
  const el = getCellByPos(camp, pos);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { left: r.left, top: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
}

function roleIconOf(u) {
  if (!u) return '⚔️';
  if (u.role === ROLE_TYPES.WARRIOR) return '⚔️';
  if (u.role === ROLE_TYPES.DEFENDER) return '🛡️';
  if (u.role === ROLE_TYPES.RANGED) return '🏹';
  if (u.role === ROLE_TYPES.JAVELIN) return '🪠';
  if (u.role === ROLE_TYPES.FLYER) return '🦅';
  return '⚔️';
}

function cardHtml(u) {
  const pct = Math.max(0, Math.floor((u.hp / u.maxHp) * 100));
  const hpCls = pct > 70 ? 'hp-text-green' : (pct > 40 ? 'hp-text-orange' : 'hp-text-red');
  const bar = pct > 70 ? '#4caf50' : (pct > 40 ? '#ff9800' : '#f44336');
  return `<span class="cell-icon">${roleIconOf(u)}</span>` +
    `<div class="cell-info"><span class="cell-name">${u.name}</span>` +
    `<span class="cell-stats">攻${Math.round(u.atk)} 防${Math.round(u.def)} <span class="${hpCls}">血${fmtHp(u.hp)}</span></span></div>` +
    `<div class="hp-bar-wrap"><div class="hp-bar-inner" style="height:${pct}%;background:${bar};"></div></div>`;
}

// 自绘克隆体：从 store 取单位，摆在 fromPos 格 rect 上（不依赖终点格 DOM）
function makeGhost(camp, fromPos, uid, z) {
  const rect = getCellRect(camp, fromPos);
  if (!rect) return null;
  const u = store.getState().units.find((x) => x.uid === uid);
  if (!u) return null;
  const el = document.createElement('div');
  el.className = 'cell';
  el.setAttribute('data-fx', 'temporary');
  el.innerHTML = cardHtml(u);
  el.style.cssText += `;position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.w}px;height:${rect.h}px;` +
    `margin:0;z-index:${z};pointer-events:none;box-sizing:border-box;opacity:1;visibility:visible;transition:none;`;
  document.body.appendChild(el);
  return { el, from: rect };
}

// 血条单一时间线：每帧对比 store 里的真实血量，变了才重绘克隆体/预览卡内卡。
//   不再强制改真格血条 DOM（那是 render/405 的地盘，两边各写一份才会「变了又变回去」）
const _hpSnap = new Map();
function guardTick() {
  if (!store) return;
  const units = store.getState().units;
  const upd = (el, uid) => {
    if (!el || !el.parentNode) return;
    const u = units.find((x) => x.uid === uid);
    if (!u) return;
    if (_hpSnap.get(uid) === u.hp) return;
    _hpSnap.set(uid, u.hp);
    el.innerHTML = cardHtml(u);
  };
  for (const gh of activeGhosts) if (gh.g && gh.g.el) upd(gh.g.el, gh.uid);
}

// 格子脉冲（只动 box-shadow）
function pulseCell(uid, color, durationMs) {
  const el = document.querySelector(`[data-uid="${uid}"]`);
  if (!el) return;
  const base = el.style.boxShadow;
  clock.animateReal(durationMs, (p) => {
    const g = Math.sin(p * Math.PI) * (1 - p * 0.3);
    el.style.boxShadow = g > 0.05 ? `inset 0 0 14px 3px ${color.replace('ALPHA', (0.7 * g).toFixed(2))}` : '';
  }).then(() => { el.style.boxShadow = base || ''; });
}

// 格子上方飘字
function floatOnCell(uid, text, color, sizePx) {
  const el = document.querySelector(`[data-uid="${uid}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.setAttribute('data-fx', 'temporary');
  d.textContent = text;
  const sz = sizePx || 20;
  d.style.cssText = `position:fixed;left:${r.left + r.width / 2}px;top:${r.top + r.height * 0.15}px;` +
    `transform:translate(-50%,0);font-size:${sz}px;font-weight:900;color:${color};` +
    `text-shadow:0 0 10px rgba(0,0,0,0.85),0 2px 4px rgba(0,0,0,0.9);z-index:10080;pointer-events:none;opacity:0;`;
  document.body.appendChild(d);
  clock.animateReal(900, (p) => {
    const e = 1 - Math.pow(1 - p, 2.2);
    d.style.opacity = p < 0.15 ? (p / 0.15).toFixed(2) : (1 - (p - 0.15) / 0.85).toFixed(2);
    d.style.transform = `translate(-50%,${(-40 * e).toFixed(1)}px)`;
  }).then(() => d.remove());
}

// 回春 logo：格子上挂 🌿 图标（一次演出内持续存在）
function showHealLogo(uid) {

// ============================== DOM 特效元素 ==============================
let maskEl = null;
let chainEl = null;
let chainHead = null;
let activeGhosts = [];

function ensureFxOverlay() {
  if (!maskEl) {
    maskEl = document.createElement('div');
    maskEl.setAttribute('data-fx', 'temporary');
    maskEl.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9990;pointer-events:none;opacity:0;';

    document.body.appendChild(chainEl);

function clearFxOverlay() {

// ============================== 演出链各段 ==============================
const S_TIMESCALE = 1700 / 2910;
const T = (v) => Math.round(v * S_TIMESCALE);

function computeChainLen(p) {
  const a = getCellRect(p.tw.camp, p.tw.pos);
  const b = getCellRect(p.target.camp, p.target.pos);
  if (!a || !b) return 0;
  return Math.hypot(b.cx - a.cx, b.cy - a.cy);
}

// 卡边取点：原版源码，把「格中心 → 对方中心」的射线裁到本格边框上
function edgeOf(r, tx, ty) {
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const kx = dx ? (r.width / 2) / Math.abs(dx) : Infinity;
  const ky = dy ? (r.height / 2) / Math.abs(dy) : Infinity;
  const k = Math.min(kx, ky);
  return { x: cx + dx * k, y: cy + dy * k };
}

function placeChain(p) {
  if (!chainEl) return;
  const twG = activeGhosts.find((g) => g.uid === p.tw.uid);
  const tgG = activeGhosts.find((g) => g.uid === p.target.uid);
  const getRect = (el, camp, pos) => {
    if (el) return el.getBoundingClientRect();
    return getCellByPos(camp, pos)?.getBoundingClientRect();
  };
  const rTw = getRect(twG?.g.el, p.tw.camp, p.tw.pos);
  const rTg = getRect(tgG?.g.el, p.target.camp, p.target.pos);
  if (!rTw || !rTg) return;
  
  const twCx = rTw.left + rTw.width / 2, twCy = rTw.top + rTw.height / 2;
  const tgCx = rTg.left + rTg.width / 2, tgCy = rTg.top + rTg.height / 2;
  
  const pa = edgeOf(rTw, tgCx, tgCy);
  const pb = edgeOf(rTg, twCx, twCy);
  
  const dx = pb.x - pa.x, dy = pb.y - pa.y;
  const len = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  
  const h = 9;
  chainEl.style.left = pa.x + 'px';
  chainEl.style.top = (pa.y - h / 2) + 'px';
  chainEl.style.width = len + 'px';
  chainEl.style.transform = `rotate(${ang}deg) scaleX(1)`;
  if (chainHead) {
    chainHead.style.left = (pb.x - 5.5) + 'px';
    chainHead.style.top = (pb.y - 5.5) + 'px';
  }
}

// 写位置 + fly 隐身（写的是终点坐标，防止后续走位时真格提前显形）
function writePositions(p) {
  const moves = p.dash.moves.filter((m) => m.uid != null && m.to != null);
  const events = moves.map((m) => ({ eventType: UNIT_EVENT_TYPES.POS_CHANGE, uid: m.uid, pos: m.to }));
  if (events.length > 0) store.dispatch({ type: STORE_ACTION_TYPES.APPLY_EVENTS, events });
  for (const m of moves) store.dispatch({ type: STORE_ACTION_TYPES.SET_VISUAL, uid: m.uid, _renderFlyMode: 'fly' });
  // 这里千万不要调 updateGridUI()，否则整个DOM重排，坐标全变 0！
}

function createGhosts(p) {
  activeGhosts = [];
  const zMap = {};
  for (const m of p.dash.moves) {
    const isTw = m.uid === p.tw.uid;
    const isTarget = m.uid === p.target.uid;
    const z = (isTw || isTarget) ? 10070 : 10040;
    const g = makeGhost(m.camp, m.from, m.uid, z);
    if (!g) continue;
    
    let baseScale = 1;
    if (!isTw && !isTarget) {
      baseScale = 0.82;
      g.el.style.opacity = '0.55';
    } else if (isTw) {
      g.el.classList.add('tw-hl'); // 唐文亮：金边
    } else {
      g.el.classList.add('tg-hl'); // 目标：橙红锁框
    }
    
    // 初始偏移为 0，缩放靠 transform
    g.el.style.transform = `translate(0px, 0px) scale(${baseScale})`;
    
    activeGhosts.push({ ...m, g, toRect: getCellRect(m.camp, m.to), baseScale });
    zMap[m.uid] = g;
  }
  return activeGhosts;
}

function moveGhosts(pp) {
  for (const gh of activeGhosts) {
    if (!gh.toRect || !gh.g) continue;
    const f = gh.g.from, t = gh.toRect;
    const dx = t.left - f.left, dy = t.top - f.top;
    
    if (gh.isDash) {
      const dist = Math.hypot(dx, dy) || 1;
      const ovMax = Math.min(16, dist * 0.22);
      const e = 1 - Math.pow(1 - Math.min(1, pp / 0.68), 3);
      const over = pp < 0.68 ? ovMax * (1 - Math.pow(1 - pp / 0.68, 3)) : ovMax * (1 - (1 - Math.pow(1 - (pp - 0.68) / 0.32, 3)));
      const px = dx * e + (dx / dist) * over;
      const py = dy * e + (dy / dist) * over;
      gh.g.el.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px) scale(${gh.baseScale})`;
    } else if (gh.uid === (plan && plan.target && plan.target.uid)) {
      const q = Math.max(0, (pp - 0.16) / 0.84);
      const e2 = 1 - Math.pow(1 - q, 3);
      gh.g.el.style.transform = `translate(${(dx * e2).toFixed(1)}px, ${(dy * e2).toFixed(1)}px) scale(${gh.baseScale})`;
    } else {
      const q = Math.min(1, pp * 1.4);
      const e3 = 1 - Math.pow(1 - q, 3);
      gh.g.el.style.transform = `translate(${(dx * e3).toFixed(1)}px, ${(dy * e3).toFixed(1)}px) scale(${gh.baseScale})`;
    }
  }
}

// 落定：left/top 固化到终点（关键修正：后续普攻不弹回起点）
function freezeGhosts() {
  for (const gh of activeGhosts) {
    if (!gh.toRect || !gh.g) continue;
    gh.g.el.style.left = gh.toRect.left + 'px';
    gh.g.el.style.top = gh.toRect.top + 'px';
    gh.g.el.style.transform = gh.el_scale || '';
  }
}

// 碰撞：白闪 + 冲击环 + 火花 + 屏震 + 掉血（同一帧）
function onCollision(p, my) {
  if (my !== runId) return;
  freezeGhosts();
  // 白闪
  const flash = document.createElement('div');
  flash.setAttribute('data-fx', 'temporary');
  flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:10080;pointer-events:none;opacity:0;';
  document.body.appendChild(flash);
  clock.animateReal(T(400), (pp) => {
    flash.style.opacity = pp < 0.35 ? (0.75 * pp / 0.35).toFixed(3) : Math.max(0, 0.75 * (1 - (pp - 0.35) / 0.65)).toFixed(3);
  }).then(() => flash.remove());
  // 冲击环 + 火花只给主角（唐文亮 / 目标）：被挤队友不画，别把光晕带到他身上
  const mains = activeGhosts.filter((gh) => gh.uid === p.tw.uid || gh.uid === p.target.uid);
  // 冲击环
  for (const gh of mains) {
    if (!gh.toRect) continue;
    const d = document.createElement('div');
    d.setAttribute('data-fx', 'temporary');
    d.style.cssText = `position:fixed;left:${gh.toRect.cx}px;top:${gh.toRect.cy}px;width:${gh.toRect.w}px;height:${gh.toRect.h}px;border:3px solid rgba(255,209,102,0.95);border-radius:12px;pointer-events:none;z-index:10062;box-shadow:0 0 24px rgba(255,209,102,0.95);`;
    document.body.appendChild(d);
    clock.animateReal(T(620), (pp) => {
      const e = 1 - Math.pow(1 - pp, 2);
      d.style.transform = `translate(-50%,-50%) scale(${(0.5 + e * 1.1).toFixed(2)})`;
      d.style.opacity = (1 - pp).toFixed(3);
    }).then(() => d.remove());
  }
  // 火花（用固定种子生成，每帧 seek 一致）
  let seedBak = seed;
  seed = 424242;
  for (const gh of mains) {
    if (!gh.toRect) continue;
    for (let i = 0; i < 10; i++) {
      const a = (Math.PI * 2 * i) / 10 + Math.random() * 0.6;
      const sp = 26 + Math.random() * 40;
      const sz = 3 + Math.random() * 3;
      const sd = document.createElement('div');
      sd.setAttribute('data-fx', 'temporary');
      sd.style.cssText = `position:fixed;left:${gh.toRect.cx}px;top:${gh.toRect.cy}px;width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;border-radius:50%;background:#ffd166;box-shadow:0 0 9px #ffd166;pointer-events:none;z-index:10063;`;
      document.body.appendChild(sd);
      clock.animateReal(T(380 + Math.random() * 240), (pp) => {
        const e = 1 - Math.pow(1 - pp, 2.4);
        sd.style.transform = `translate(${(Math.cos(a) * sp * e).toFixed(1)}px,${(Math.sin(a) * sp * e + 30 * pp * pp).toFixed(1)}px) scale(${(1 - pp * 0.7).toFixed(2)})`;
        sd.style.opacity = (1 - pp * pp).toFixed(3);
      }).then(() => sd.remove());
    }
  }
  seed = seedBak;
  // 屏震
  const bf = document.getElementById('battlefield');
  if (bf) {
    clock.animateReal(T(220), (pp) => {
      const m = 4 * (1 - pp);
      bf.style.transform = `translate(${((Math.random() - 0.5) * 2 * m).toFixed(2)}px,${((Math.random() - 0.5) * 2 * m).toFixed(2)}px)`;
    }).then(() => { bf.style.transform = ''; });
  }
  // 掉血（同一帧）
  for (const h of (p.dash.hits || [])) {
    if (!(h.dmg > 0) || h.uid == null) continue;
    const su = store.getState().units.find((u) => u.uid === h.uid);
    if (!su) continue;
    const newHp = Math.max(0, su.hp - h.dmg);
    store.dispatch({ type: STORE_ACTION_TYPES.HP_CHANGE, unitUid: h.uid, payload: { hp: newHp } });
    // 克隆体/预览卡的血条由 guardTick 每帧对比 store 后重绘（单一时间线）
    floatOnCell(h.uid, `💥-${h.dmg}`, '#ffe9a8', 24);
  }
  logLine(`碰撞：双方掉血（目标 -${p.toFoe}、自身 -${p.toSelf}）`, 'hit');
}

// 回春：唐文亮格子挂 🌿 + 头顶飘字 + 回血
function onHeal1(p, my) {
  if (my !== runId) return;
  const twUid = p.tw.uid;
  const ratio = 0.15;
  const lost = p.tw.maxHp - store.getState().units.find((u) => u.uid === twUid).hp;
  const heal = Math.floor(lost * ratio);
  if (heal <= 0) return;
  const su = store.getState().units.find((u) => u.uid === twUid);
  const newHp = Math.min(su.maxHp, su.hp + heal);
  store.dispatch({ type: STORE_ACTION_TYPES.HP_CHANGE, unitUid: twUid, payload: { hp: newHp } });
  // 克隆体血条由 guardTick 每帧对比 store 后重绘（单一时间线，不再手动改 DOM）
  showHealLogo(twUid);
  pulseCell(twUid, 'rgba(80,220,130,ALPHA)', 700);
  floatOnCell(twUid, `🌿 回春术 +${heal}`, '#9ff0b0', 22);
  logLine(`回春：唐文亮 +${heal}（${fmtHp(su.hp)} → ${fmtHp(newHp)}）`, 'heal');
}

// 普攻（蓄力后缩 → 冲刺 → 命中掉血 → 退回）
async function runPunch(p, my) {
  if (my !== runId) return;
  const twUid = p.tw.uid;
  const tgtUid = p.target.uid;
  const twGH = activeGhosts.find((g) => g.uid === twUid);
  const tgtGH = activeGhosts.find((g) => g.uid === tgtUid);
  if (!twGH || !twGH.g || !tgtGH || !tgtGH.g) return;
  const twEl = twGH.g.el;
  const tgtEl = tgtGH.g.el;
  const twR = twEl.getBoundingClientRect();
  const tgR = tgtEl.getBoundingClientRect();
  const dx = tgR.left - twR.left, dy = tgR.top - twR.top;
  const dist = Math.hypot(dx, dy) || 1;
  const nx = dx / dist, ny = dy / dist;
  const baseLeft = parseFloat(twEl.style.left) || twR.left;
  const baseTop = parseFloat(twEl.style.top) || twR.top;

  // 1. 唐文亮微微后仰蓄力
  await clock.animateReal(T(120), (pp) => {
    const e = 1 - Math.pow(1 - pp, 3);
    twEl.style.left = (baseLeft - nx * 8 * e).toFixed(1) + 'px';
    twEl.style.top = (baseTop - ny * 8 * e).toFixed(1) + 'px';
  });
  if (my !== runId) return;

  // 2. 纯 CSS 绘制一根粗壮的标枪（避免 emoji 在部分电脑端渲染失败）
  const jv = document.createElement('div');
  jv.setAttribute('data-fx', 'temporary');
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  // translate(-100%, -50%) 配合 transform-origin，让枪的最右侧尖头始终对准坐标点
  jv.style.cssText = `position:fixed;z-index:10080;pointer-events:none;transform:translate(-100%, -50%) rotate(${angle}deg);transform-origin: 100% 50%;display:flex;align-items:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));`;
  
  const shaft = document.createElement('div');
  shaft.style.cssText = 'width:64px;height:8px;background:linear-gradient(180deg, #8b6f4b, #5c4033);border-radius:4px 0 0 4px;box-shadow:inset 0 2px 2px rgba(255,255,255,0.2);';
  
  const head = document.createElement('div');
  head.style.cssText = 'width:0;height:0;border-left:22px solid #e0e0e0;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 0 6px rgba(255,255,255,0.9));';
  
  jv.appendChild(shaft);
  jv.appendChild(head);
  document.body.appendChild(jv);

  const startX = baseLeft + twR.width/2;
  const startY = baseTop + twR.height/2;
  const endX = tgR.left + tgR.width/2;
  const endY = tgR.top + tgR.height/2;

  // 飞慢一点，用 400ms，让肉眼能看清这根粗壮的标枪
  await clock.animateReal(T(400), (pp) => {
    // 略微带点二段加速，飞得更像标枪
    const e = pp < 0.5 ? 2 * pp * pp : 1 - Math.pow(-2 * pp + 2, 2) / 2;
    jv.style.left = (startX + (endX - startX) * e).toFixed(1) + 'px';
    jv.style.top = (startY + (endY - startY) * e).toFixed(1) + 'px';
  });
  if (my !== runId) return;
  // 扎中之后不要立刻删，让标枪插在目标身上停留 200ms，配合闪光
  await clock.waitReal(T(200));
  jv.remove();

  // 3. 命中：白闪 + 火花 + 抖动 + 掉血 + 叠回春
  const flash = document.createElement('div');
  flash.setAttribute('data-fx', 'temporary');
  flash.style.cssText = `position:fixed;left:${tgR.left}px;top:${tgR.top}px;width:${tgR.width}px;height:${tgR.height}px;border-radius:6px;background:radial-gradient(circle,#fff 0%,rgba(255,240,180,0.4) 60%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:10080;`;
  document.body.appendChild(flash);
  clock.animateReal(T(230), (pp) => {
    flash.style.opacity = (1 - pp).toFixed(3);
    flash.style.transform = `scale(${(1 + pp * 0.18).toFixed(2)})`;
  }).then(() => flash.remove());
  
  tgtEl.classList.add('shake');
  clock.waitReal(T(420)).then(() => tgtEl.classList.remove('shake'));
  
  const su2 = store.getState().units.find((u) => u.uid === tgtUid);
  const punchDmg = Math.max(1, Math.round(su2.hp * 0.12));
  const newHp = Math.max(0, su2.hp - punchDmg);
  store.dispatch({ type: STORE_ACTION_TYPES.HP_CHANGE, unitUid: tgtUid, payload: { hp: newHp } });
  floatOnCell(tgtUid, `💥-${punchDmg}`, '#ffe9a8', 20);
  logLine(`标枪命中：目标 -${punchDmg}`, 'hit');

  const twGH2 = activeGhosts.find((g) => g.uid === twUid);
  if (twGH2 && twGH2.g) showHealLogo(twUid);
  floatOnCell(twUid, '🌿 回春术 +1 层', '#9ff0b0', 18);
  logLine('普攻触发回春术 +1 层', 'heal');

  // 4. 唐文亮恢复原位
  await clock.animateReal(T(150), (pp) => {
    const e = 1 - Math.pow(1 - pp, 3);
    twEl.style.left = (baseLeft + nx * 8 * (1 - e)).toFixed(1) + 'px';
    twEl.style.top = (baseTop + ny * 8 * (1 - e)).toFixed(1) + 'px';
  });
  twEl.style.left = baseLeft + 'px';
  twEl.style.top = baseTop + 'px';
}

// 回春生效（普攻之后）
function onHealTick(p, my) {
  if (my !== runId) return;
  const twUid = p.tw.uid;
  const su = store.getState().units.find((u) => u.uid === twUid);
  const lost = su.maxHp - su.hp;
  if (lost <= 0) return;
  // 按已叠层数（冲刺 +1 + 普攻 +1 = 2 层）计算
  const heal = Math.floor(lost * 0.15) * 2;
  if (heal <= 0) return;
  const newHp = Math.min(su.maxHp, su.hp + heal);
  store.dispatch({ type: STORE_ACTION_TYPES.HP_CHANGE, unitUid: twUid, payload: { hp: newHp } });
  pulseCell(twUid, 'rgba(80,220,130,ALPHA)', 800);
  floatOnCell(twUid, `💚 回春术 +${heal}`, '#9ff0b0', 22);
  logLine(`回春生效：唐文亮 +${heal}（${fmtHp(su.hp)} → ${fmtHp(newHp)}）`, 'heal');
}

// 收势：清 fly → 真格显形 → 克隆体淡出
function onEnd(p, ghosts) {
  for (const m of p.dash.moves) {
    if (m.uid != null) store.dispatch({ type: STORE_ACTION_TYPES.SET_VISUAL, uid: m.uid, _renderFlyMode: null });
  }
  updateGridUI();
  // 转战士（纯视觉，不是战斗逻辑）
  store.dispatch({
    type: STORE_ACTION_TYPES.SET_UNITS,
    units: store.getState().units.map((u) => u.uid === p.tw.uid ? { ...u, role: ROLE_TYPES.WARRIOR } : u)
  });
  updateGridUI();
  // 克隆体淡出
  if (ghosts && ghosts.length > 0) {
    clock.animateReal(T(160), (pp) => {
      for (const gh of ghosts) if (gh.g && gh.g.el) gh.g.el.style.opacity = String(1 - pp);
    }).then(() => {
      for (const gh of ghosts) if (gh.g && gh.g.el && gh.g.el.parentNode) gh.g.el.remove();
      activeGhosts = [];
    });
  }
  logLine('收势：真格显形、转战士', 'ph1');
}

// ============================== 演出主链 ==============================
async function runSequence(p, my) {
  ensureFxOverlay();
  maskEl.style.opacity = '0';
  chainEl.style.opacity = '0';
  chainEl.style.width = '0px';
  
  const cellTw = getCellByPos(p.tw.camp, p.tw.pos);
  const cellTgt = getCellByPos(p.target.camp, p.target.pos);
  if (cellTw) cellTw.classList.add('tw-hl');
  if (cellTgt) cellTgt.classList.add('tg-hl');

  placeChain(p);

  clock.animateReal(T(350), (pp) => { maskEl.style.opacity = (0.34 * pp).toFixed(3); });
  await clock.waitReal(T(350));
  if (my !== runId) return;

  const chainLen = computeChainLen(p);
  await clock.animateReal(T(240), (pp) => {
    if (!chainEl) return;
    chainEl.style.width = (chainLen * pp).toFixed(1) + 'px';
    chainEl.style.opacity = (0.9 * pp).toFixed(3);
    if (chainHead) chainHead.style.opacity = (0.9 * pp).toFixed(3);
  });
  if (my !== runId) return;

  if (cellTw) cellTw.classList.remove('tw-hl');
  if (cellTgt) cellTgt.classList.remove('tg-hl');

  // 1. 生成克隆体，锁定坐标
  createGhosts(p);

  // 2. 在 store 里移位置
  writePositions(p);
  
  // 3. 手动把这俩格子变成空字（绝对不调 updateGridUI 防止坐标清零）
  for (const m of p.dash.moves) {
    const cellFrom = getCellByPos(m.camp, m.from);
    if (cellFrom) { cellFrom.className = 'cell'; cellFrom.innerHTML = '<span style="color:#999;">空</span>'; }
    const cellTo = getCellByPos(m.camp, m.to);
    if (cellTo) { cellTo.className = 'cell'; cellTo.innerHTML = '<span style="color:#999;">空</span>'; }
  }

  // 5. 克隆体飞向终点
  await clock.animateReal(T(620), (pp) => { moveGhosts(pp); placeChain(p); });
  if (my !== runId) return;

  onCollision(p, my);
  if (chainEl) chainEl.style.opacity = '0';
  if (chainHead) chainHead.style.opacity = '0';
  await clock.waitReal(T(400));
  if (my !== runId) return;

  onHeal1(p, my);
  await clock.waitReal(T(360));
  if (my !== runId) return;

  await runPunch(p, my);
  if (my !== runId) return;

  onHealTick(p, my);
  await clock.waitReal(T(500));
  if (my !== runId) return;

  onEnd(p, activeGhosts);
}

// ============================== 一次重放 ==============================
async function restartRun() {
  const my = ++runId;
  vt = 0;
  clock.reset();
  await yieldMacro();
  removeTempFx();
  clearFxOverlay();
  activeGhosts = [];

  store = buildStore(sceneKey);
  updateGridUI();
  plan = planDash(targetUid);
  renderPlan(plan);
  if (!plan) return false;

  seedRandom(20261023);
  _hpSnap.clear();
  vt = 0;
  clock.reset();

  runSequence(plan, my);
  runReady = true;
  return true;
}

// ============================== 时间轴 ==============================
const SEG = [
  { name: '遮罩渐暗', ms: 0, dur: 350 },
  { name: '锁链展开', ms: 350, dur: 240 },
  { name: '走位', ms: 590, dur: 620 },
  { name: '碰撞·掉血', ms: 1210, dur: 400 },
  { name: '回春·回血', ms: 1610, dur: 360 },
  { name: '普攻·命中', ms: 1970, dur: 410 },
  { name: '回春生效', ms: 2380, dur: 300 },
  { name: '收势', ms: 2680, dur: 300 }
];

function renderMarks() {
  const parts = SEG.map((s) => {
    const f = Math.round(s.ms / FRAME_MS);
    return `<span title="${s.name} · ${s.ms}ms">${s.name} ${f}</span>`;
  });
  $('tlMarks').innerHTML = parts.join('');
}

function phaseText(t) {
  let cur = '未开始';
  for (const s of SEG) {
    if (t >= s.ms && t < s.ms + s.dur) { cur = s.name; break; }
    if (t >= s.ms + s.dur) cur = s.name;
  }
  return cur;
}

function syncReadout() {
  const frame = Math.round(vt / FRAME_MS);
  curFrame = Math.min(TOTAL_FRAMES, frame);
  $('tl').value = String(curFrame);
  if (document.activeElement !== $('frameInput')) $('frameInput').value = String(curFrame);
  $('tlInfo').innerHTML = `帧 <b>${curFrame}</b> / ${TOTAL_FRAMES}　·　t = ${Math.round(vt)} ms　·　<span id="tlPhase">${runReady ? phaseText(vt) : '未开始'}</span>`;
}

function updatePlayBtn() {
  $('btnPlay').textContent = playing ? '⏸ 暂停' : '▶ 播放';
}

async function seekTo(frame) {
  const target = Math.max(0, Math.min(TOTAL_FRAMES, Math.round(frame)));
  const my = ++seekToken;
  seeking = true;
  playing = false;
  updatePlayBtn();

  const T2 = target * FRAME_MS;
  if (!runReady || vt > T2 + 0.5) {
    if (!(await restartRun())) { seeking = false; return; }
    if (my !== seekToken) return;
  }
  let acc = vt;
  while (acc < T2) {
    const dt = Math.min(FRAME_MS, T2 - acc);
    stepClock(dt);
    acc += dt;
    await yieldMacro();
    if (my !== seekToken) return;
  }
  vt = T2;
  curFrame = target;
  seeking = false;
  syncReadout();
}

let pendingSeek = null;
let queueRunning = false;
function requestSeek(frame) {
  pendingSeek = frame;
  runSeekQueue();
}
async function runSeekQueue() {
  if (queueRunning) return;
  queueRunning = true;
  while (pendingSeek != null) {
    const f = pendingSeek;
    pendingSeek = null;
    await seekTo(f);
  }
  queueRunning = false;
}

async function togglePlay() {
  if (playing) { playing = false; updatePlayBtn(); return; }
  if (!runReady || vt >= MAX_T - 1) { if (!(await restartRun())) return; curFrame = 0; }
  playing = true;
  lastReal = realPerfNow();
  updatePlayBtn();
}

// ============================== 目标可点 ==============================
function markTargetsClickable() {
  document.querySelectorAll('#allyGrid .cell,#enemyGrid .cell').forEach((el) => {
    el.removeAttribute('data-pick-uid');
  });
  const tgt = store.getState().units.find((u) => u.uid === targetUid);
  if (!tgt) return;
  store.getState().units.forEach((u) => {
    if (u.camp !== tgt.camp || !u.alive) return;
    const el = getCellByPos(u.camp, u.pos);
    if (el) { el.dataset.pickUid = u.uid; } // 只用 dataset，不加任何 class
  });
}
document.addEventListener('click', (e) => {
  const cell = e.target.closest && e.target.closest('.cell');
  if (!cell || !cell.dataset.pickUid) return;
  const uid = cell.dataset.pickUid;
  if (!uid || uid === targetUid) return;
  targetUid = uid;
  playing = false; updatePlayBtn();
  runReady = false;
  markTargetsClickable();
  const u = store.getState().units.find((x) => x.uid === uid);
  logLine(`目标切换 → ${u.name}（${u.pos} 号位）`, 'ph1');
  plan = planDash(uid);
  renderPlan(plan);
  requestSeek(0);
});

// ============================== 场景 ==============================
function switchScene(key) {
  sceneKey = key;
  playing = false; seeking = false; updatePlayBtn();
  runId++;
  runReady = false;
  vt = 0;
  clock.reset();
  removeTempFx();
  clearFxOverlay();
  activeGhosts = [];
  store = buildStore(sceneKey);
  updateGridUI();
  plan = planDash(targetUid);
  renderPlan(plan);
  $('demoLog').innerHTML = '';
  logLine('场景：' + SCENES[key].label, 'ph1');
  markTargetsClickable();
  syncReadout();
  requestSeek(0);
}

// ============================== 绑定 ==============================
$('btnSceneA').addEventListener('click', () => {
  $('btnSceneA').classList.add('on'); $('btnSceneB').classList.remove('on'); switchScene('A');
});
$('btnSceneB').addEventListener('click', () => {
  $('btnSceneB').classList.add('on'); $('btnSceneA').classList.remove('on'); switchScene('B');
});
$('btnPlay').addEventListener('click', () => { if (!seeking) togglePlay(); });
$('btnPrev').addEventListener('click', () => requestSeek(curFrame - 1));
$('btnNext').addEventListener('click', () => requestSeek(curFrame + 1));
$('btnReset').addEventListener('click', () => requestSeek(0));
$('tl').addEventListener('input', (e) => { playing = false; updatePlayBtn(); requestSeek(Number(e.target.value)); });
$('btnJump').addEventListener('click', () => { playing = false; updatePlayBtn(); requestSeek(Number($('frameInput').value || 0)); });
$('frameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('btnJump').click(); } });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); requestSeek(curFrame - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); requestSeek(curFrame + 1); }
  else if (e.key === ' ') { e.preventDefault(); if (!seeking) togglePlay(); }
});

// ============================== 启动 ==============================
clock.start();
GlobalStore.set('speed', 300);
$('tl').max = String(TOTAL_FRAMES);
renderMarks();
store = buildStore('A');
updateGridUI();
plan = planDash(targetUid);
renderPlan(plan);
markTargetsClickable();
syncReadout();
realRAF(driver);
logLine('场景：' + SCENES.A.label, 'ph1');
logLine('拖动时间轴逐帧定位（←/→ 单帧步进，空格播放/暂停）', 'warn');

// 调试探针
window.__tw = () => ({
  vt, curFrame, seeking, queueRunning, pendingSeek, runReady, runId,
  clockNow: clock.now, realNow: clock._realNow, tweens: clock._tweens.length,
  realTweens: clock._realTweens.length, waits: clock._waits.length, realWaits: clock._realWaits.length
});
</script>
