<!-- V6.1.0 | ~22000 bytes | 2026-09-27 随机组队+战斗整段搬进 116 Worker（kind:'random'）并行，本页只派发/聚合/渲染：
     原先唯一的主线程串行工具（数百场把页面占死、移动端弹无响应）；seed 逐场不变，池大小走 getPoolSize() -->
<!-- V6.0.0 | ~22000 bytes | 2026-08-16 5v5/6v6 全随机职业+站位，固定六大派先手，无海克斯 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>职业平衡分析 · 全随机站位</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#eee;font-family:monospace;padding:16px;max-width:1000px;margin:0 auto}
h1{color:#ffd700;font-size:20px;margin-bottom:8px}
.tip{color:#888;font-size:12px;margin-bottom:12px;line-height:1.6}
.config{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.config label{color:#ffd700;font-weight:bold}
.config input{width:90px;padding:8px;border-radius:6px;border:1px solid #555;background:#111;color:#eee;font-size:14px;text-align:center}
button{padding:10px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:monospace;font-size:13px}
.run5{background:#ffd700;color:#1a1a2e}
.run6{background:#ff9800;color:#1a1a2e}
button:disabled{opacity:0.4;cursor:not-allowed}
.progress{color:#4fc3f7;font-size:12px;min-height:20px;margin-bottom:8px}
.section{margin-bottom:24px;background:#16213e;border:1px solid #333;border-radius:12px;padding:16px}
.section h2{color:#ffd700;font-size:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
th{background:#2a2a4e;color:#ffd700;padding:8px;text-align:center}
td{padding:6px 8px;border-bottom:1px solid #333;color:#ccc;text-align:center}
.strong{color:#f44336;font-weight:bold}
.weak{color:#4fc3f7}
.empty{color:#888;text-align:center;margin-top:12px}
</style>
</head>
<body>
<h1>⚖️ 职业平衡分析 · 全随机站位</h1>
<p class="tip">
双方全随机职业 + 全随机站位，固定六大派先手，无海克斯，全员 M=100。<br>
统计口径：某方拥有该职业 0/1/2/3+ 个时该方胜率。5v5 与 6v6 独立跑，结果对比。
</p>
<div class="config">
<label>每组场次：</label>
<input type="number" id="roundsInput" value="200" min="50" max="1000" step="50">
<button class="run5" id="run5Btn">▶ 跑 5v5</button>
<button class="run6" id="run6Btn">▶ 跑 6v6</button>
</div>
<div class="progress" id="progress"></div>

<div class="section" id="section5">
<h2>5v5 结果</h2>
<div id="result5"><div class="empty">尚未运行</div></div>
</div>

<div class="section" id="section6">
<h2>6v6 结果</h2>
<div id="result6"><div class="empty">尚未运行</div></div>
</div>

<script type="module">
import { ROLE_TYPES } from '../infra/56-battle-enums.js';
import { runParallel, getPoolSize } from './117-shared-worker-runner.js';

const ROLES = [ROLE_TYPES.DEFENDER, ROLE_TYPES.WARRIOR, ROLE_TYPES.FLYER, ROLE_TYPES.RANGED];
const ROLE_ICONS = { [ROLE_TYPES.DEFENDER]: '🛡️', [ROLE_TYPES.WARRIOR]: '⚔️', [ROLE_TYPES.FLYER]: '🦅', [ROLE_TYPES.RANGED]: '🏹' };

function initStats() {
    const stats = { allyCounts: {}, enemyCounts: {} };
    for (const role of ROLES) {
        stats.allyCounts[role] = {};
        stats.enemyCounts[role] = {};
    }
    return stats;
}

// 每片场次：随机组队 + 整局战斗全在 worker 内，主线程只合并各片的 { 职业数量 → 场次/胜场 }
function mergeStats(dst, src) {
    for (const side of ['allyCounts', 'enemyCounts']) {
        for (const role of Object.keys(src[side] || {})) {
            const srcRole = src[side][role];
            const dstRole = dst[side][role] || (dst[side][role] = {});
            for (const cnt of Object.keys(srcRole)) {
                const d = dstRole[cnt] || (dstRole[cnt] = { total: 0, wins: 0 });
                d.total += srcRole[cnt].total;
                d.wins += srcRole[cnt].wins;
            }
        }
    }
}

const CHUNK = 10; // 分片场次：片越细 worker 空手越早领到下一片，长尾越短

async function runAnalysis(size, rounds, progressEl) {
    const stats = initStats();
    const masterSeed = Date.now();
    const jobs = [];
    for (let s = 0; s < rounds; s += CHUNK) {
        jobs.push({ size, seed: masterSeed, startIndex: s, runs: Math.min(CHUNK, rounds - s) });
    }
    const poolSize = getPoolSize();
    let doneRuns = 0;
    // seed 口径与原主线程版逐场一致：片内 seed = masterSeed + (startIndex + i)*7919，敌队 seed+1。
    // 分片只决定「哪台机器跑哪几场」，不改变任何一场的 seed，统计结果与原串行版同值。
    await runParallel({
        jobs,
        kind: 'random',
        poolSize,
        nextJobMsg: (job, id) => ({ jobId: id, kind: 'random', size: job.size, seed: job.seed, startIndex: job.startIndex, runs: job.runs }),
        onJobDone: (finished, jobTotal, job, result) => {
            if (result) mergeStats(stats, result);
            doneRuns += job.runs;
            progressEl.textContent = `${size}v${size} 进度：${Math.min(doneRuns, rounds)}/${rounds}（${jobs.length} 片｜${poolSize} 线程并行）`;
        }
    });
    progressEl.textContent = `✅ ${size}v${size} 完成：${rounds} 场`;
    return stats;
}

function renderStats(container, stats, size) {
    const maxCount = size;
    const counts = [0, 1, 2, 3];

    let html = '<h3 style="color:#ffd700;margin:12px 0 8px;">明教方拥有该职业数量 vs 明教胜率</h3>';
    html += '<table><tr><th>职业</th>';
    for (const c of counts) html += `<th>${c}个</th>`;
    html += '</tr>';
    const allyNet = {};
    for (const role of ROLES) {
        html += `<tr><td>${ROLE_ICONS[role]}${role}</td>`;
        let win0 = null, winAny = null;
        for (const c of counts) {
            const d = stats.allyCounts[role][c];
            if (d && d.total > 0) {
                const pct = (d.wins / d.total * 100).toFixed(1);
                html += `<td>${d.total}场 ${pct}%</td>`;
                if (c === 0) win0 = d.wins / d.total;
                else winAny = (winAny === null) ? d.wins / d.total : winAny;
            } else {
                html += '<td>-</td>';
            }
        }
        html += '</tr>';
        allyNet[role] = (winAny !== null && win0 !== null) ? winAny - win0 : null;
    }
    html += '</table>';

    html += '<h3 style="color:#ffd700;margin:12px 0 8px;">六大派方拥有该职业数量 vs 明教胜率（越低=敌方越强）</h3>';
    html += '<table><tr><th>职业</th>';
    for (const c of counts) html += `<th>${c}个</th>`;
    html += '</tr>';
    const enemyNet = {};
    for (const role of ROLES) {
        html += `<tr><td>${ROLE_ICONS[role]}${role}</td>`;
        let win0 = null, winAny = null;
        for (const c of counts) {
            const d = stats.enemyCounts[role][c];
            if (d && d.total > 0) {
                const pct = (d.wins / d.total * 100).toFixed(1);
                html += `<td>${d.total}场 ${pct}%</td>`;
                if (c === 0) win0 = d.wins / d.total;
                else winAny = (winAny === null) ? d.wins / d.total : winAny;
            } else {
                html += '<td>-</td>';
            }
        }
        html += '</tr>';
        enemyNet[role] = (winAny !== null && win0 !== null) ? winAny - win0 : null;
    }
    html += '</table>';

    html += '<h3 style="color:#ffd700;margin:12px 0 8px;">职业净收益排行（我方多一个的收益 − 敌方多一个的威胁）</h3>';
    html += '<table><tr><th>职业</th><th>我方收益</th><th>敌方威胁</th><th>净收益</th></tr>';
    const netRows = ROLES.map(role => {
        const a = allyNet[role];
        const e = enemyNet[role];
        const aStr = a !== null ? (a > 0 ? '+' : '') + (a * 100).toFixed(1) + '%' : '-';
        const eStr = e !== null ? (e > 0 ? '+' : '') + (e * 100).toFixed(1) + '%' : '-';
        const net = (a !== null && e !== null) ? a - e : null;
        const netStr = net !== null ? (net > 0 ? '+' : '') + (net * 100).toFixed(1) + '%' : '-';
        return { role, net, aStr, eStr, netStr };
    }).sort((a, b) => (b.net ?? -Infinity) - (a.net ?? -Infinity));
    for (const r of netRows) {
        const cls = r.net !== null && r.net > 0.03 ? 'strong' : (r.net !== null && r.net < -0.03 ? 'weak' : '');
        html += `<tr class="${cls}"><td>${ROLE_ICONS[r.role]}${r.role}</td><td>${r.aStr}</td><td>${r.eStr}</td><td>${r.netStr}</td></tr>`;
    }
    html += '</table>';

    container.innerHTML = html;
}

const roundsInput = document.getElementById('roundsInput');
const progressEl = document.getElementById('progress');
const run5Btn = document.getElementById('run5Btn');
const run6Btn = document.getElementById('run6Btn');
const result5 = document.getElementById('result5');
const result6 = document.getElementById('result6');

run5Btn.addEventListener('click', async () => {
    const rounds = parseInt(roundsInput.value) || 200;
    run5Btn.disabled = true;
    run6Btn.disabled = true;
    result5.innerHTML = '<div class="empty">运行中...</div>';
    try {
        const stats = await runAnalysis(5, rounds, progressEl);
        renderStats(result5, stats, 5);
    } catch (e) {
        result5.innerHTML = `<div class="empty">出错：${e.message}</div>`;
    } finally {
        run5Btn.disabled = false;
        run6Btn.disabled = false;
    }
});

run6Btn.addEventListener('click', async () => {
    const rounds = parseInt(roundsInput.value) || 200;
    run5Btn.disabled = true;
    run6Btn.disabled = true;
    result6.innerHTML = '<div class="empty">运行中...</div>';
    try {
        const stats = await runAnalysis(6, rounds, progressEl);
        renderStats(result6, stats, 6);
    } catch (e) {
        result6.innerHTML = `<div class="empty">出错：${e.message}</div>`;
    } finally {
        run5Btn.disabled = false;
        run6Btn.disabled = false;
    }
});
</script>
</body>
</html>
