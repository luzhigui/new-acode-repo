<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>参数对照实验台</title>
<style>

.step-no{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#ffd700;color:#1a1a2e;font-size:12px}

/* 参数中文说明区：选中即解释「这个数字是干啥的」 */
.knob-help{background:#101a30;border:1px solid #2f3b5c;border-left:3px solid #4fc3f7;border-radius:8px;padding:10px 12px;margin:8px 0 10px;font-size:12px;line-height:1.75}

/* 柱状图（绝对刻度：满宽 = 100% 胜率，不做视觉放大） */
.chart{margin:6px 0 14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}

/* 受影响阵容：只列变了的。名字单独一行，避免长阵容名被截断 */

.aff-loss{position:absolute;top:0;height:100%;background:#ff6b81;opacity:.9}
details{margin-top:12px;border-top:1px solid #2f3b5c;padding-top:10px}
summary{color:#7f8aa8;font-size:12px;cursor:pointer;user-select:none}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}

</style>
</head>
<body>
<h1>参数对照实验台</h1>
<p class="hint" style="margin-bottom:14px">
改一个数值，看明教胜率变多少。<b>同一批对局跑两遍</b>——现状一遍、改后一遍，对手阵容、随机种子、海克斯全都一样，只差你改的那一个数字。所以「胜率变化」和「哪几局翻了盘」就是这一个数字的净效果，不是噪声。
</p>

<div class="card">
    <div class="step"><span class="step-no">1</span>选关卡</div>
    <div class="row">
        <select id="stageSel"></select>
        <label class="mini">每套阵容跑 <input type="number" id="runsInput" value="100" min="10" max="2000"> 局</label>
        <span class="pill" id="lineupPill">阵容准备中…</span>
    </div>
    <div class="hint">明教侧固定 15 套「最常出现的阵容」（按精英组合归类），属性固定；六大派照常随机。局数越大越准，100 局约十来秒。</div>
    <div class="msg" id="prepMsg"></div>
</div>

<div class="card">
    <div class="step"><span class="step-no">2</span>挑一个数值，填个新值</div>
    <div class="row">
        <input type="text" id="knobSearch" placeholder="搜角色 / 技能 / 字段名">
        <select id="knobSel"></select>
        <span class="cur" id="knobCur"></span>
    </div>
    <div class="knob-help" id="knobHelp"></div>
    <div class="row">
        <label class="mini">改成 <input type="number" id="knobVal" step="any" placeholder="新数值"></label>
        <button id="addPatchBtn">加入</button>
        <button id="clearPatchBtn" class="ghost">清空</button>
    </div>
    <div id="patchBox"><div class="empty">还没改任何数值 —— 也可以直接点第 3 步只跑现状</div></div>
    <label class="mini" style="margin-top:10px">
        <input type="checkbox" id="showAllKnobs"> 展开全部字段（含 skills 表里的参数：可能只是文案，也可能被引擎真读）
    </label>
</div>

<div class="card">
    <div class="step"><span class="step-no">3</span>跑</div>
    <div class="row">
        <button id="runBtn" class="big" disabled>▶ 开始对照</button>
        <span class="hint" id="runScale"></span>
    </div>
    <div class="progress" id="runProgress"></div>
    <div class="msg" id="runMsg"></div>
</div>

<div id="resultBox"></div>

<script type="module">
import { ensureGameData, listNumericKnobs, pickTypicals } from './120-param-lab-core.js';
import { runParallel, getPoolSize } from './117-shared-worker-runner.js';
import { describeKnob, fmtValue, charSkillLines, UNIT } from './120-param-lab-glossary.js';

const WORKER_URL = new URL('./120-param-lab-worker.js', import.meta.url);
const SAMPLE_BASE = 20000;   // 采样 seed 起点（与 CLI --sample 默认一致）
const COMPARE_BASE = 1;      // 对照 seed 起点（与 CLI 默认一致）
const SAMPLE_RUNS = 1000;    // 采样次数固定：用来定出「15 套典型阵容」
const PICK = 15;
const CHUNK = 25;

const $ = id => document.getElementById(id);
const stageSel = $('stageSel'), runsInput = $('runsInput'), lineupPill = $('lineupPill');
const prepMsg = $('prepMsg');
const knobSearch = $('knobSearch'), knobSel = $('knobSel'), knobCur = $('knobCur'), knobHelp = $('knobHelp');
const knobVal = $('knobVal'), addPatchBtn = $('addPatchBtn'), clearPatchBtn = $('clearPatchBtn');
const showAllKnobs = $('showAllKnobs'), patchBox = $('patchBox');
const runBtn = $('runBtn'), runScale = $('runScale'), runProgress = $('runProgress'), runMsg = $('runMsg');
const resultBox = $('resultBox');

let lineups = [];            // 固定 15 套典型阵容（全跑，不给勾选，省得选）
let allKnobs = [];           // listNumericKnobs 全量
let gameRoot = null;         // 参数表根对象（中文说明要读它）
let patchOps = [];           // [{ path, value, orig, label, char, unit }]
let lastMd = '';
let running = false;

const win = w => w === '明教';
const isErr = w => w && String(w).startsWith('ERROR');
const fmtPct = x => (x * 100).toFixed(1) + '%';
const fmtDelta = d => (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + ' 个百分点';
const baseName = n => { const i = String(n).indexOf('·'); return i >= 0 ? String(n).slice(0, i) : String(n); };
// 阵容标签：'张无忌+小昭·姊+韦一笑' → '3 精英：张无忌 + 小昭·姊 + 韦一笑'（光看加号不知道是几个）
const niceLabel = l => {
    const k = String((l && l.label) || '');
    if (!k || k === '无精英') return '无精英';
    const parts = k.split('+');
    return `${parts.length} 精英：${parts.join(' + ')}`;
};

// ---------------------------------------------------------------------------
// 初始化：关卡下拉
// ---------------------------------------------------------------------------
for (let s = 1; s <= 7; s++) {
    const o = document.createElement('option');
    o.value = String(s); o.textContent = `第 ${s} 关`;
    if (s === 3) o.selected = true;
    stageSel.appendChild(o);
}

// ---------------------------------------------------------------------------
// 旋钮：按角色分组；默认只列 mechanics 下的「真旋钮」
//   skills.*.params.* 既供文案插值、也可能被引擎真读（张无忌·乾坤等），说不准，默认藏起来，
//   勾「展开全部字段」才显示；说明区会写清楚它的身份，实际是否生效以跑出来的结果为准。
// 【待办 2026-09-28】这个筛法有漏，改起来先看这里：胖远桥 / 金毛狮王谢逊 / 张三丰 / 小昭 这 4 位
//   在 content/200game-data.json 里**没有 mechanics 字段**（13 个角色只有 9 个有），真参数全在
//   skills.params 里且被引擎实读（modules/20、26、27 的 getSkillParams），默认状态下他们的旋钮
//   一个都看不到。修法：默认池 = mechanics 旋钮 + 「该角色没有 mechanics」时的 skills.params。
//   完整三条待办见 文件汇总20260730/优化-想法和优化.md「工具链优化待办」。
// ---------------------------------------------------------------------------
const isRealKnob = k => k.path.includes('.mechanics.');
const charOfPath = p => { const a = String(p).split('.'); return a[0] === 'characters' ? a[1] : ''; };
// 「张无忌 · mechanics[0].onHitEffects[0].pct」→ 角色=张无忌，短名=onHitEffects[0].pct
function shortPath(k) {
    const m = String(k.label).split(' · ');
    return m.length > 1 ? m[1] : String(k.label);
}
// 参数的中文说明（技能名 / 字段名 / 单位 / 技能原文），由 120-param-lab-glossary.js 提供。
// 下拉文字、说明区、补丁行都用它 —— 否则用户面对 `mechanics[0].onHitEffects[0].pct` 只能瞎选。
function knobInfo(k) {
    return gameRoot ? describeKnob(k.path, gameRoot) : { kind: 'mechanics', title: shortPath(k), unit: UNIT.raw, lines: [] };
}

function fillKnobSelect() {
    const q = knobSearch.value.trim().toLowerCase();
    const pool = allKnobs.filter(k => (showAllKnobs.checked || isRealKnob(k)));
    const hit = q
        ? pool.filter(k => (charOfPath(k.path) + ' ' + knobInfo(k).title + ' ' + k.label + ' ' + k.path).toLowerCase().includes(q))
        : pool;
    knobSel.innerHTML = '';
    const groups = new Map();
    for (const k of hit) {
        const c = charOfPath(k.path) || '其他';
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(k);
    }
    for (const [c, list] of groups) {
        const og = document.createElement('optgroup');
        og.label = c;
        for (const k of list) {
            const info = knobInfo(k);
            const o = document.createElement('option');
            o.value = k.path;
            o.textContent = `${info.title}（当前 ${fmtValue(k.value, info.unit)}）`;
            o.dataset.orig = String(k.value);
            o.dataset.char = c;
            o.dataset.title = info.title;
            o.dataset.unit = info.unit;
            og.appendChild(o);
        }
        knobSel.appendChild(og);
    }
    if (!hit.length) {
        const o = document.createElement('option');
        o.textContent = allKnobs.length ? '（没搜到，换个词试试）' : '（未发现数值参数）';
        o.value = '';
        knobSel.appendChild(o);
    }
    showCur();
}
// 选中即解释：这个数字是干啥的、单位怎么换算、属于哪个技能（附该角色全部技能原文）
function showCur() {
    const o = knobSel.selectedOptions[0];
    const k = (o && o.value) ? allKnobs.find(x => x.path === o.value) : null;
    if (!k) { knobCur.textContent = ''; knobHelp.innerHTML = ''; return; }
    const info = knobInfo(k);
    knobCur.textContent = `当前值 ${fmtValue(k.value, info.unit)}`;
    knobVal.placeholder = info.unit === UNIT.pct ? '如 0.3 = 30%' : '新数值';
    const chName = charOfPath(k.path);
    const skills = gameRoot ? charSkillLines(gameRoot, chName) : [];
    knobHelp.innerHTML =
        `<div class="kh-head${info.kind === 'skill' ? ' kh-warn' : ''}">${chName} · ${info.title}</div>`
        + `<div class="kh-body">${info.lines.map(l => `<div>${l}</div>`).join('')}</div>`
        + (skills.length
            ? `<details><summary>${chName} 的全部技能说明</summary>${skills.map(s =>
                `<div class="kh-skill"><b>${s.name}</b>：${s.desc || '（无说明）'}</div>`).join('')}</details>`
            : '');
}
knobSearch.addEventListener('input', fillKnobSelect);
showAllKnobs.addEventListener('change', fillKnobSelect);
knobSel.addEventListener('change', showCur);

async function initKnobs() {
    try {
        gameRoot = await ensureGameData();
        allKnobs = listNumericKnobs(gameRoot);
        fillKnobSelect();
    } catch (e) {
        prepMsg.className = 'msg err';
        prepMsg.textContent = `参数表加载失败：${e.message}`;
    }
}

// ---------------------------------------------------------------------------
// ① 准备阵容：页面打开（及换关）就自动采样，用户不用点
// ---------------------------------------------------------------------------
async function prepareLineups() {
    const stage = parseInt(stageSel.value, 10) || 3;
    lineupPill.textContent = '阵容准备中…';
    runBtn.disabled = true;
    try {
        const [done] = await runParallel({
            jobs: [{ label: `sample@stage${stage}`, stage }],
            workerUrl: WORKER_URL,
            nextJobMsg: (job, id) => ({ jobId: id, kind: 'lab-sample', stage: job.stage, runs: SAMPLE_RUNS, base: SAMPLE_BASE })
        });
        lineups = pickTypicals({ list: done.result.list }, PICK);
        lineupPill.textContent = `已备好 ${lineups.length} 套典型阵容`;
        prepMsg.className = 'hint';
        prepMsg.textContent = '';
        refreshScale();
    } catch (e) {
        lineupPill.textContent = '阵容准备失败';
        prepMsg.className = 'msg err';
        prepMsg.textContent = `阵容准备失败：${e.message}`;
    }
}
stageSel.addEventListener('change', prepareLineups);
runsInput.addEventListener('input', refreshScale);
function refreshScale() {
    const runs = Math.max(10, parseInt(runsInput.value, 10) || 100);
    const n = lineups.length || PICK;
    const arm = n * runs;
    runBtn.disabled = running || !lineups.length;
    runScale.textContent = patchOps.length
        ? `跑 ${arm} 局 × 2 遍（现状 + 改后）= ${arm * 2} 局`
        : `${arm} 局（只跑现状；想对比先在第 2 步加一个改动）`;
}

// ---------------------------------------------------------------------------
// ② 补丁：人只填「改成几」，路径与当前值由页面记
// ---------------------------------------------------------------------------
// 补丁行也讲人话：显示中文说明，比例类补一句换算
function pctNote(o) {
    if (o.unit !== UNIT.pct || typeof o.value !== 'number') return '';
    const p = o.value * 100;
    return `（= ${p.toFixed(p % 1 === 0 ? 0 : 1)}%）`;
}
function renderPatch() {
    if (!patchOps.length) {
        patchBox.innerHTML = '<div class="empty">还没改任何数值 —— 也可以直接点第 3 步只跑现状</div>';
        refreshScale();
        return;
    }
    patchBox.innerHTML = patchOps.map((o, i) => `
        <div class="patch-row">
            <span class="pname">${o.char} · ${o.label}</span>
            <span>${o.orig != null ? o.orig : '?'} → <span class="pval">${o.value}</span> ${pctNote(o)}</span>
            <button class="pdel" data-del="${i}">删掉</button>
        </div>`).join('');
    patchBox.querySelectorAll('button[data-del]').forEach(b => {
        b.addEventListener('click', () => { patchOps.splice(parseInt(b.dataset.del, 10), 1); renderPatch(); });
    });
    refreshScale();
}
addPatchBtn.addEventListener('click', () => {
    const o = knobSel.selectedOptions[0];
    if (!o || !o.value) { runMsg.className = 'msg err'; runMsg.textContent = '先在上面挑一个参数'; return; }
    const raw = knobVal.value.trim();
    const v = Number(raw);
    if (raw === '' || !Number.isFinite(v)) { runMsg.className = 'msg err'; runMsg.textContent = '新值要填数字'; return; }
    const ex = patchOps.find(x => x.path === o.value);
    if (ex) ex.value = v;
    else patchOps.push({ path: o.value, value: v, orig: Number(o.dataset.orig), label: o.dataset.title, char: o.dataset.char, unit: o.dataset.unit });
    knobVal.value = '';
    runMsg.className = 'msg ok';
    runMsg.textContent = `已记下：${o.dataset.char} 的「${o.dataset.title}」改成 ${v}${o.dataset.unit === UNIT.pct ? `（= ${(v * 100).toFixed(v * 100 % 1 === 0 ? 0 : 1)}%）` : ''}`;
    renderPatch();
});
clearPatchBtn.addEventListener('click', () => { patchOps = []; renderPatch(); });

// ---------------------------------------------------------------------------
// ③ 跑对照：现状臂 →（有改动则）改后臂，两臂同序同种子
// ---------------------------------------------------------------------------
runBtn.addEventListener('click', async () => {
    if (!lineups.length) return;
    const stage = parseInt(stageSel.value, 10) || 3;
    const runs = Math.max(10, parseInt(runsInput.value, 10) || 100);
    const patch = patchOps.map(o => ({ path: o.path, value: o.value }));
    const poolSize = getPoolSize();
    const n = lineups.length;

    running = true; refreshScale();
    runProgress.textContent = '';
    runMsg.className = 'msg'; runMsg.textContent = '';
    resultBox.innerHTML = '<div class="empty">跑着呢…</div>';

    const baseResults = {}, patchResults = {};
    for (let i = 0; i < n; i++) { baseResults[i] = new Array(runs).fill(null); patchResults[i] = new Array(runs).fill(null); }

    const buildJobs = arm => {
        const jobs = [];
        for (let i = 0; i < n; i++) {
            for (let s = 0; s < runs; s += CHUNK) {
                jobs.push({ idx: i, startIndex: s, runs: Math.min(CHUNK, runs - s), arm, label: `${lineups[i].id}@${s}` });
            }
        }
        return jobs;
    };
    const nextMsg = arm => (job, id) => ({
        jobId: id, kind: 'lab-run', arm: job.arm, stage,
        spec: lineups[job.idx].spec, base: COMPARE_BASE,
        startIndex: job.startIndex, runs: job.runs,
        patchOps: job.arm === 'patch' ? patch : undefined
    });
    const makeCollect = (store, label) => {
        const total = n * runs;
        let done = 0;
        return (finished, jobTotal, job, result) => {
            const arr = store[job.idx], w = result.winners || [];
            for (let i = 0; i < w.length; i++) arr[job.startIndex + i] = w[i];
            done += job.runs;
            runProgress.textContent = `${label} ${Math.min(done, total)}/${total} 局（${poolSize} 线程并行）`;
        };
    };

    try {
        await runParallel({
            jobs: buildJobs('base'), workerUrl: WORKER_URL, poolSize,
            nextJobMsg: nextMsg('base'), onJobDone: makeCollect(baseResults, '现状')
        });
        if (patch.length) {
            await runParallel({
                jobs: buildJobs('patch'), workerUrl: WORKER_URL, poolSize,
                nextJobMsg: nextMsg('patch'), onJobDone: makeCollect(patchResults, '改后')
            });
        }
        renderResults(stage, runs, patch.length > 0, baseResults, patchResults);
        runProgress.textContent = '✅ 跑完了';
    } catch (e) {
        runProgress.textContent = '';
        runMsg.className = 'msg err';
        runMsg.textContent = `跑挂了：${e.message}`;
        resultBox.innerHTML = `<div class="empty">跑挂了：${e.message}</div>`;
    } finally {
        running = false; refreshScale();
    }
});

// ---------------------------------------------------------------------------
// 结果渲染：结论卡 + 柱状图 + 只列变了的阵容；原始表收进 details
// ---------------------------------------------------------------------------
function renderResults(stage, runs, hasPatch, baseResults, patchResults) {
    const n = lineups.length;
    const rows = [];
    for (let i = 0; i < n; i++) {
        const b = baseResults[i] || [];
        const p = hasPatch ? (patchResults[i] || []) : [];
        const bw = b.filter(win).length;
        const err = b.filter(isErr).length + p.filter(isErr).length;
        let up = 0, down = 0, pw = 0;
        if (hasPatch) {
            pw = p.filter(win).length;
            for (let k = 0; k < runs; k++) {
                if (!win(b[k]) && win(p[k])) up++;
                else if (win(b[k]) && !win(p[k])) down++;
            }
        }
        rows.push({ i, l: lineups[i], bw, pw, up, down, net: up - down, err,
            base: bw / runs, patched: pw / runs, freq: (lineups[i].rosterCount || 0) / SAMPLE_RUNS });
    }

    const meanBase = rows.reduce((s, r) => s + r.base, 0) / n;
    const meanPatch = hasPatch ? rows.reduce((s, r) => s + r.patched, 0) / n : meanBase;
    const delta = meanPatch - meanBase;
    const upAll = rows.reduce((s, r) => s + r.up, 0);
    const downAll = rows.reduce((s, r) => s + r.down, 0);
    const netAll = upAll - downAll;
    const changed = rows.filter(r => r.net !== 0);
    const errAll = rows.reduce((s, r) => s + r.err, 0);

    const chName = patchOps.length ? baseName(charOfPath(patchOps[0].path)) : '';
    const touchedChar = chName ? rows.filter(r => r.l.spec.some(e => baseName(e.label) === chName)) : [];
    const changedAllHaveChar = chName && changed.length > 0 && changed.every(r => r.l.spec.some(e => baseName(e.label) === chName));

    const el = [];

    if (!hasPatch) {
        el.push(`<div class="card">
            <div class="verdict v-none">
                <div class="v-icon">📋</div>
                <div><div class="v-title">只跑了现状（没做改动）</div>
                <div class="v-sub">这是第 ${stage} 关、15 套典型阵容的现状基线。想看点改动的影响，回第 2 步填一个新值再跑一次。</div></div>
            </div>
            <div class="chart">
                ${barRow('明教胜率', meanBase, 'bar-base')}
            </div>
            <div class="hint">15 套阵容差异极大是正常的：阵容强度主要由「带几个精英」决定。</div>
            ${detailTable(stage, rows, runs, false, meanBase, meanBase, upAll, downAll)}
        </div>`);
        resultBox.innerHTML = el.join('');
        lastMd = buildMd(stage, runs, rows, false, meanBase, meanBase, upAll, downAll);
        bindResult();
        return;
    }

    // 结论：幅度分档 + 方向
    const ad = Math.abs(delta);
    let cls, icon, title;
    if (ad >= 0.10) { cls = delta > 0 ? 'v-up' : 'v-down'; icon = delta > 0 ? '🚀' : '💥'; title = delta > 0 ? '影响很大：明教明显变强' : '影响很大：明教明显变弱'; }
    else if (ad >= 0.03) { cls = 'v-mild'; icon = '⚠️'; title = delta > 0 ? '有影响：偏强一些' : '有影响：偏弱一些'; }
    else if (ad >= 0.01) { cls = 'v-mild'; icon = '🟡'; title = delta > 0 ? '影响轻微，略偏强' : '影响轻微，略偏弱'; }
    else if (netAll !== 0) { cls = 'v-none'; icon = '⚪'; title = '胜率几乎没动，但个别对局翻了盘'; }
    else { cls = 'v-none'; icon = '⚪'; title = '基本没影响：胜率和对局结果都没变'; }

    const sub = `明教胜率 <b>${fmtPct(meanBase)}</b> → <b>${fmtPct(meanPatch)}</b>（${fmtDelta(delta)}）<br>`
        + `${n} 套阵容 × ${runs} 局 = ${n * runs} 局里，有 <b>${changed.length}</b> 套阵容的结果变了，`
        + `共改写 ${upAll + downAll} 局（${upAll} 局由输变赢、${downAll} 局由赢变输）`;

    el.push(`<div class="card">
        <div class="verdict ${cls}">
            <div class="v-icon">${icon}</div>
            <div><div class="v-title">${title}</div><div class="v-sub">${sub}</div></div>
        </div>
        <div class="chart">
            ${barRow('现状', meanBase, 'bar-base')}
            ${barRow('改后', meanPatch, 'bar-patch' + (delta < 0 ? ' lower' : ''))}
        </div>
        <div class="hint">绝对刻度：柱子满宽 = 100% 胜率，没有做视觉放大。</div>`);

    // 人话解释
    const notes = [];
    if (!changed.length) {
        notes.push(`两种跑法逐局比对，${n * runs} 局结果一模一样 —— 这个数值在本关对胜负没有任何影响。`);
    } else {
        const pct = (changed.length / n * 100).toFixed(0);
        notes.push(`${n} 套阵容里只有 ${changed.length} 套（${pct}%）的结果有变化，其余 ${n - changed.length} 套逐局完全相同。`);
        if (chName && touchedChar.length && changedAllHaveChar) {
            notes.push(`变了的全都含「${chName}」，不含它的 ${n - touchedChar.length} 套纹丝不动 —— 说明这个数值确实只作用在「${chName}」身上，改对了位置。`);
        } else if (chName && touchedChar.length) {
            notes.push(`注意：变了的阵容里有不含「${chName}」的 —— 可能是间接影响（比如队友/敌人被打乱节奏），也可能是局数不够的随机波动，建议把局数加大到 300 再跑一次确认。`);
        }
        if (Math.abs(netAll) <= Math.max(2, n * runs * 0.002)) {
            notes.push(`翻盘局数太少（净 ${netAll >= 0 ? '+' : ''}${netAll} 局），和随机波动差不多，别据此下结论。`);
        } else if (netAll > 0) {
            notes.push(`净翻盘 +${netAll} 局（输变赢比赢变输多）——改后整体是往强的方向走。`);
        } else {
            notes.push(`净翻盘 ${netAll} 局（赢变输比输变赢多）——改后整体是往弱的方向走。`);
        }
    }
    if (errAll) notes.push(`⚠️ 有 ${errAll} 局跑出异常，别急着信这个结论，先看看控制台报错。`);

    el.push(`<div class="hint" style="margin:2px 0 14px">${notes.join('<br>')}</div>`);

    // 只列「变了的」阵容
    if (changed.length) {
        el.push('<div class="aff-title">变了的是这几套</div>');
        const maxRate = Math.max(...rows.map(r => Math.max(r.base, r.patched)), 0.01);
        const w = x => x / maxRate * 100;   // 相对最强者归一，让 0~5% 的小阵容也看得出差异
        for (const r of changed.slice().sort((a, b) => Math.abs(b.net) - Math.abs(a.net))) {
            const lo = Math.min(w(r.base), w(r.patched));
            const hi = Math.max(w(r.base), w(r.patched));
            const seg = `<span class="${r.net > 0 ? 'aff-gain' : 'aff-loss'}" style="left:${lo.toFixed(2)}%;width:${Math.max(0.6, hi - lo).toFixed(2)}%"></span>`;
            el.push(`<div class="aff-item">
                <div class="aff-head">
                    <span class="aff-name">${niceLabel(r.l)}</span>
                    <span class="aff-tag ${r.net > 0 ? 'up' : 'down'}">${(r.base * 100).toFixed(0)}% → ${(r.patched * 100).toFixed(0)}%　${r.net > 0 ? '+' : ''}${r.net} 局</span>
                </div>
                <div class="aff-track"><span class="aff-b" style="width:${w(r.base).toFixed(2)}%"></span>${seg}</div>
            </div>`);
        }
        el.push('<div class="hint" style="margin-top:6px">灰条 = 现状胜率，绿/红那一截 = 改动带来的变化（横轴按最强的那套阵容归一，方便看小阵容）。</div>');
    }

    el.push(detailTable(stage, rows, runs, true, meanBase, meanPatch, upAll, downAll));
    el.push('</div>');
    resultBox.innerHTML = el.join('');
    lastMd = buildMd(stage, runs, rows, true, meanBase, meanPatch, upAll, downAll);
    bindResult();
}

function barRow(name, v, cls) {
    return `<div class="bar-row"><span class="bar-name">${name}</span>
        <span class="bar-wrap"><span class="bar ${cls}" style="width:${(v * 100).toFixed(1)}%"></span></span>
        <span class="bar-val">${fmtPct(v)}</span></div>`;
}

function detailTable(stage, rows, runs, hasPatch, meanBase, meanPatch, upAll, downAll) {
    let h = '<details><summary>原始数据 / 导出</summary>';
    h += '<table><tr><th>阵容</th><th>出现频率</th><th>现状胜率</th>'
        + (hasPatch ? '<th>改后胜率</th><th>净翻盘</th>' : '') + '<th>异常局</th></tr>';
    for (const r of rows) {
        h += `<tr><td class="left">${r.l.id} ${niceLabel(r.l)}</td><td>${(r.freq * 100).toFixed(1)}%</td><td>${fmtPct(r.base)}</td>`;
        if (hasPatch) h += `<td>${fmtPct(r.patched)}</td><td style="color:${r.net > 0 ? '#66bb6a' : (r.net < 0 ? '#ff6b81' : '#c2cade')}">${r.net >= 0 ? '+' : ''}${r.net}</td>`;
        h += `<td>${r.err || 0}</td></tr>`;
    }
    h += '</table>';
    h += `<div class="hint" style="margin:10px 0">等权汇总（15 套一视同仁）：现状 ${fmtPct(meanBase)}`
        + (hasPatch ? ` → 改后 ${fmtPct(meanPatch)}（${fmtDelta(meanPatch - meanBase)}）；总翻盘 输变赢 ${upAll} 局 / 赢变输 ${downAll} 局，净 ${upAll - downAll >= 0 ? '+' : ''}${upAll - downAll}` : '')
        + `<br>第 ${stage} 关｜每套 ${runs} 局｜海克斯固定｜同种子配对</div>`;
    h += '<div class="row"><button id="exportBtn" class="ghost">下载 md 报告</button>'
        + '<button id="copyBtn" class="ghost">复制到剪贴板</button></div>';
    h += '</details>';
    return h;
}
function bindResult() {
    const e = $('exportBtn'), c = $('copyBtn');
    const stage = parseInt(stageSel.value, 10) || 3;
    if (e) e.addEventListener('click', () => {
        const blob = new Blob([lastMd], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lab-stage${stage}.md`;
        a.click();
        URL.revokeObjectURL(a.href);
    });
    if (c) c.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(lastMd); runMsg.className = 'msg ok'; runMsg.textContent = '报告已复制（可以直接粘给我）'; }
        catch (err) { runMsg.className = 'msg err'; runMsg.textContent = `复制失败：${err.message}`; }
    });
}

function buildMd(stage, runs, rows, hasPatch, meanBase, meanPatch, upAll, downAll) {
    let md = `# 参数对照实验 · 第 ${stage} 关\n\n`;
    md += `- 每套阵容 ${runs} 局；15 套典型阵容；海克斯固定；同种子配对对照\n`;
    md += `- 改动：${hasPatch ? patchOps.map(o => `${o.char} · ${o.label} = ${o.value}${pctNote(o)}（原 ${o.orig}）`).join('、') : '无（只跑现状）'}\n\n`;
    md += `## 结论\n\n明教胜率 ${fmtPct(meanBase)}${hasPatch ? ` → ${fmtPct(meanPatch)}（${fmtDelta(meanPatch - meanBase)}）` : ''}\n\n`;
    if (hasPatch) md += `总翻盘：输变赢 ${upAll} 局 / 赢变输 ${downAll} 局，净 ${upAll - downAll >= 0 ? '+' : ''}${upAll - downAll}\n\n`;
    md += `| 阵容 | 出现频率 | 现状胜率 |` + (hasPatch ? ` 改后胜率 | 净翻盘 |` : '') + `\n|---|---|---|` + (hasPatch ? `---|---|` : '') + `\n`;
    for (const r of rows) {
        md += `| ${r.l.id} ${niceLabel(r.l)} | ${(r.freq * 100).toFixed(1)}% | ${fmtPct(r.base)} |`;
        if (hasPatch) md += ` ${fmtPct(r.patched)} | ${r.net >= 0 ? '+' : ''}${r.net} |`;
        md += `\n`;
    }
    return md;
}

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
initKnobs();
prepareLineups();
renderPatch();
</script>
</body>
</html>
