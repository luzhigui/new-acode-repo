</head>

<div class="container">

// ==================== 小工具 ====================
function num(v) {
    const n = parseInt(v, 10);
    return (isNaN(n) || n < 0) ? 0 : n;
}
// 小数版解析（属性点可为 0.1 / 0.25），保留 2 位
function numF(v) {
    const n = parseFloat(v);
    return (isNaN(n) || n < 0) ? 0 : Math.round(n * 100) / 100;
}
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}
function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 16777619) >>> 0;
    }
    return h >>> 0;
}

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ==================== 每日折扣（日期串做种子，零存储、确定性） ====================
function getDailyDiscount(dateStr) {
    let seed = hashStr(dateStr);
    const rnd = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
    };
    const pool = ['unlock', 'pointAtk', 'pointDef', 'pointHp'];
    const count = 1 + Math.floor(rnd() * 2);   // 每天 1-2 个可购项
    const picked = {};
    for (let i = 0; i < count && pool.length > 0; i++) {
        const idx = Math.floor(rnd() * pool.length);
        const id = pool.splice(idx, 1)[0];
        picked[id] = 5 + Math.floor(rnd() * 5);  // 5/6/7/8/9 折
    }
    return picked;
}

// ==================== 等级与经验曲线 ====================
// 等级 = 总 M = baseM + 属性点点数三项之和（M 值多少就是多少级，不做二次换算）
// R(n) = E(n) ± W(n)，下限 5；E(n) = 10 + 5n；W 按「窄—宽」交替 5, 15（n 为第 n 次经验升级）
function expNeed(name, n) {
    const E = 10 + 5 * n;
    const W = (n % 2 === 1) ? 5 : 15;
    const lo = Math.max(5, E - W);
    const hi = Math.max(lo, E + W);
    return lo + (hashStr(name + '|' + n) % (hi - lo + 1));
}

// ==================== 存档读写 ====================
function normalizeShop(raw) {
    const d = (raw && typeof raw === 'object') ? raw : {};
    const bag = d.bag || {};
    const bought = d.bought || {};
    return {
        v: 2,
        bag: { atk: num(bag.atk), def: num(bag.def), hp: num(bag.hp), free: num(bag.free), exp: num(bag.exp) },
        bought: { heroes: num(bought.heroes), points: num(bought.points) },
        exp: (d.exp && typeof d.exp === 'object') ? d.exp : {}
    };
}
function normalizeCultivated(raw) {
    const list = (raw && Array.isArray(raw.list)) ? raw.list : [];
    const out = [];
    for (const it of list) {
        if (!it || !it.name) continue;
        const meta = HERO_META[it.name];
        const p = it.points || {};
        out.push({
            name: it.name,
            baseM: num(it.baseM) || (meta ? meta.baseM : 100),
            role: it.role || (meta ? meta.role : '战士'),
            points: { atk: numF(p.atk), def: numF(p.def), hp: numF(p.hp) },
            skills: Array.isArray(it.skills) ? it.skills : [],
            equips: Array.isArray(it.equips) ? it.equips : []
        });
    }
    return { v: 1, list: out };
}
function loadShop() {
    try {
        const raw = localStorage.getItem(SHOP_KEY);
        if (raw) return normalizeShop(JSON.parse(raw));
    } catch (e) {}
    return normalizeShop(null);
}
function loadCultivated() {
    try {
        const raw = localStorage.getItem(HERO_KEY);
        if (raw) return normalizeCultivated(JSON.parse(raw));
    } catch (e) {}
    return normalizeCultivated(null);
}
function saveShop() { localStorage.setItem(SHOP_KEY, JSON.stringify(shopData)); }
function saveCultivated() { localStorage.setItem(HERO_KEY, JSON.stringify(cultivated)); }

function getToken() { return num(localStorage.getItem(TOKEN_KEY)); }
function setToken(v) { localStorage.setItem(TOKEN_KEY, String(Math.max(0, num(v)))); }
function getScore() { return num(localStorage.getItem(SCORE_KEY)); }
function getChests() { return num(localStorage.getItem(CHEST_KEY)); }
function setChests(v) { localStorage.setItem(CHEST_KEY, String(Math.max(0, num(v)))); }
// 老版本迁移：圣火令余额曾存在商店存档里
function ensureToken() {
    if (localStorage.getItem(TOKEN_KEY) === null) {
        let t = 0;
        try {
            const old = JSON.parse(localStorage.getItem(SHOP_KEY) || '{}');
            t = num(old.items && old.items['圣火令']);
        } catch (e) {}
        localStorage.setItem(TOKEN_KEY, String(t));
    }
}

let shopData = null;
let cultivated = null;
let dailyDiscount = getDailyDiscount(todayStr());

function findEntry(name) {
    for (const it of cultivated.list) if (it.name === name) return it;
    return null;
}
function heroTotalM(entry) {
    return entry.baseM + entry.points.atk + entry.points.def + entry.points.hp;
}
// 自由点权重（2026-10-10 定）：攻/防 +0.1、血 +0.25；购买的属性点仍是各 +1（自带一级）
const FREE_POINT_VALUE = { atk: 0.1, def: 0.1, hp: 0.25 };
function lvDisplay(entry) { return Math.round(heroTotalM(entry)); }
function fmtNum(v) { return Math.round(v * 100) / 100; }
function expState(name) {
    if (!shopData.exp[name]) shopData.exp[name] = { lv: 1, exp: 0 };
    const st = shopData.exp[name];
    st.lv = num(st.lv) || 1;
    st.exp = num(st.exp);
    return st;
}

// ==================== 定价 / 折扣 ====================
function unlockPrice() { return shopData.bought.heroes === 0 ? PRICE_UNLOCK_FIRST : PRICE_UNLOCK_NEXT; }
function pointPrice() { return shopData.bought.points === 0 ? PRICE_POINT_FIRST : PRICE_POINT_NEXT; }
function finalPrice(base, itemId) {
    const d = dailyDiscount[itemId];
    return d ? Math.max(1, Math.round(base * d / 10)) : base;
}
function priceHtml(base, itemId) {
    const d = dailyDiscount[itemId];
    if (!d) return '<span class="price-now">' + base + '🔥</span>';
    return '<span class="price-old">' + base + '</span>' +
        '<span class="price-now">' + finalPrice(base, itemId) + '🔥</span>' +
        '<span class="badge-discount">' + d + '折</span>';
}

// ==================== 购买 / 分配 ====================
function buyHero(name) {
    const price = finalPrice(unlockPrice(), 'unlock');
    const token = getToken();
    if (token < price) { showToast('圣火令不足，需要 ' + price + ' 令（现有 ' + token + '）'); return; }
    const meta = HERO_META[name] || { baseM: 100, role: '战士' };
    setToken(token - price);
    cultivated.list.push({
        name: name,
        baseM: meta.baseM,
        role: meta.role,
        points: { atk: 0, def: 0, hp: 0 },
        skills: [],
        equips: []
    });
    saveCultivated();
    shopData.bought.heroes += 1;
    expState(name);
    saveShop();
    renderAll();
    showToast('已解锁 ' + name + '（花费 ' + price + ' 🔥）');
}

function buyPoint(type) {
    const base = pointPrice();
    const price = finalPrice(base, type.id);
    const token = getToken();
    if (token < price) { showToast('圣火令不足，需要 ' + price + ' 令（现有 ' + token + '）'); return; }
    setToken(token - price);
    shopData.bag[type.key] += 1;
    shopData.bought.points += 1;
    saveShop();
    renderAll();
    showToast('已购买 ' + type.name + ' ×1（花费 ' + price + ' 🔥），已进背包');
}

function allocatePoint(name, key) {
    const entry = findEntry(name);
    if (!entry || shopData.bag[key] <= 0) return;
    shopData.bag[key] -= 1;
    entry.points[key] += 1;
    saveShop(); saveCultivated();
    renderAll(); renderHeroModal(name);
    showToast(POINT_LABEL[key] + ' +1 → ' + name + '（Lv' + lvDisplay(entry) + '）');
}

function allocateFree(name, key) {
    const entry = findEntry(name);
    if (!entry || shopData.bag.free <= 0) return;
    const add = FREE_POINT_VALUE[key] || 0.1;
    shopData.bag.free -= 1;
    entry.points[key] = Math.round((entry.points[key] + add) * 100) / 100;
    saveShop(); saveCultivated();
    renderAll(); renderHeroModal(name);
    showToast('自由点 → ' + POINT_LABEL[key] + ' +' + add + '（Lv' + lvDisplay(entry) + '）');
}

function useExpPool(name) {
    const pool = shopData.bag.exp;
    const entry = findEntry(name);
    if (!entry || pool <= 0) return;
    const st = expState(name);
    let amount = pool;
    let gained = 0;
    let guard = 0;
    while (amount > 0 && guard++ < 500) {
        const need = expNeed(name, st.lv);
        const rest = need - st.exp;
        if (amount >= rest) {
            amount -= rest;
            st.exp = 0;
            st.lv += 1;
            gained += 1;
            entry.baseM += 1;          // 经验升级 → baseM +1
            shopData.bag.free += 1;    // 经验升级 → 1 个自由点
        } else {
            st.exp += amount;
            amount = 0;
        }
    }
    shopData.bag.exp = 0;
    saveShop(); saveCultivated();
    renderAll(); renderHeroModal(name);
    if (gained > 0) {
        showToast('投入 ' + pool + ' 经验：升 ' + gained + ' 级（Lv' + lvDisplay(entry) + '），获得 ' + gained + ' 个自由点');
    } else {
        showToast('投入 ' + pool + ' 经验（当前 ' + st.exp + ' / ' + expNeed(name, st.lv) + '）');
    }
}

// ==================== 宝箱 ====================
function openChest() {
    const c = getChests();
    if (c <= 0) { showToast('暂无宝箱（通关掉落）'); return; }
    setChests(c - 1);
    const r = Math.random();
    if (r < 0.4) {
        const keys = ['atk', 'def', 'hp'];
        const k = keys[Math.floor(Math.random() * 3)];
        shopData.bag[k] += 1;
        showToast('宝箱开出 属性点：' + POINT_LABEL[k] + ' +1（已进背包）');
    } else if (r < 0.8) {
        const gain = 8 + Math.floor(Math.random() * 8);  // 8-15
        shopData.bag.exp += gain;
        showToast('宝箱开出 经验 +' + gain + '（已进经验池）');
    } else {
        setToken(getToken() + 1);
        showToast('宝箱开出 圣火令 +1');
    }
    saveShop();
    renderAll();
}

// ==================== 串码系统 ====================
function checksum(str) {
    let sum = 0;
    for (let i = 0; i < str.length; i++) sum += str.charCodeAt(i);
    return (sum & 0xFFFF).toString(16).padStart(4, '0').toUpperCase();
}
function encode(data) {
    const json = JSON.stringify(data);
    const base64 = btoa(unescape(encodeURIComponent(json)));
    const chunked = base64.replace(/(.{6})/g, '$1-').replace(/-$/, '');
    return 'M5V2-' + chunked + '-' + checksum(base64);
}
function decode(code) {
    try {
        if (!code.startsWith('M5V2-')) return null;
        const body = code.slice(5);
        const lastDash = body.lastIndexOf('-');
        if (lastDash === -1) return null;
        const payload = body.substring(0, lastDash);
        const check = body.substring(lastDash + 1);
        const base64 = payload.replace(/-/g, '');
        if (checksum(base64) !== check) return null;
        const json = decodeURIComponent(escape(atob(base64)));
        return JSON.parse(json);
    } catch (e) { return null; }
}

const codeDisplay = document.getElementById('codeDisplay');
const importInput = document.getElementById('importInput');
const resultText = document.getElementById('resultText');

document.getElementById('serialBtn').addEventListener('click', () => serialModal.classList.add('show'));
document.getElementById('closeModalBtn').addEventListener('click', () => serialModal.classList.remove('show'));
serialModal.addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
});
document.querySelectorAll('#serialModal .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#serialModal .tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('#serialModal .tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
    });
});
document.getElementById('genCodeBtn').addEventListener('click', () => {
    rebuildState();
    const code = encode({
        v: 2,
        score: getScore(),
        token: getToken(),
        chest: getChests(),
        shop: shopData,
        heroes: cultivated
    });
    codeDisplay.textContent = code;
    navigator.clipboard.writeText(code).then(() => {
        codeDisplay.style.borderColor = '#4caf50';
        resultText.textContent = '✅ 串码已复制到剪贴板';
        resultText.className = 'result-text ok';
    });
});
codeDisplay.addEventListener('click', () => {
    if (codeDisplay.textContent === '点击生成串码') return;
    navigator.clipboard.writeText(codeDisplay.textContent).then(() => {
        codeDisplay.style.borderColor = '#4caf50';
        setTimeout(() => codeDisplay.style.borderColor = '#333', 1500);
    });
});
document.getElementById('importBtn').addEventListener('click', () => {
    const code = importInput.value.trim();
    if (!code) { resultText.textContent = '请先粘贴串码'; resultText.className = 'result-text err'; return; }
    const data = decode(code);
    if (!data) { resultText.textContent = '串码无效（校验失败）'; resultText.className = 'result-text err'; return; }
    localStorage.setItem(SHOP_KEY, JSON.stringify(normalizeShop(data.shop)));
    localStorage.setItem(HERO_KEY, JSON.stringify(normalizeCultivated(data.heroes)));
    if (data.token !== undefined) setToken(data.token);
    if (data.chest !== undefined) setChests(data.chest);
    if (data.score !== undefined) localStorage.setItem(SCORE_KEY, String(num(data.score)));
    rebuildState();
    renderAll();
    resultText.textContent = '导入成功！积分 ' + getScore() + '，圣火令 ' + getToken() + '，角色 ' + cultivated.list.length + ' 个';
    resultText.className = 'result-text ok';
});

// 返回游戏
document.getElementById('backBtn').addEventListener('click', () => {
    window.close();
    setTimeout(() => {
        if (!window.closed) window.location.href = '../index.html';
    }, 1000);
});

// demo 测试入口
document.getElementById('addTokenBtn').addEventListener('click', () => {
    setToken(getToken() + 10);
    renderStats();
    showToast('圣火令 +10');
});
document.getElementById('addChestBtn').addEventListener('click', () => {
    setChests(getChests() + 1);
    renderStats();
    showToast('宝箱 +1');
});
document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('重置养成存档？（清空角色养成 / 背包 / 购买计数 / 宝箱，不影响积分与圣火令）')) return;
    localStorage.removeItem(SHOP_KEY);
    localStorage.removeItem(HERO_KEY);
    setChests(0);
    rebuildState();
    renderAll();
    showToast('养成存档已重置');
});

// ==================== 启动 ====================
ensureToken();
rebuildState();
renderAll();
</script>
</body>
</html>
