<!DOCTYPE html>
<!-- tools/838-bug-records.html — Bug 记录独立浏览页（不进游戏）
     V1.0.3 | 2026-11-23 删除单条后保持原滚动位置（页面 + #list 双层还原，不再跳回顶部）
     V1.0.2 | 2026-11-19 新建表单拆成三个常驻小标题的框（①本来应该怎样 ②怎么复现 ③实际看到什么），
       保存合并成【应该】【步骤】【实际】三段，与 modules/303 V6.6.8 完全同口径。
     V1.0.1 | 2026-11-19 新增「＋ 新建一条」（页面内直接手写一条记录，存同一份 localStorage）；
       卡片按时间顺序编号 #N，与「一键复制/下载报告」的条目号一一对应（最新 = 最大号）。
     V1.0.0 | 2026-11-19 新建：把游戏内「🐞 记录Bug → 打开列表」整段拎出来，
       直接读同一份 localStorage（dsh_bug_records_v1），dev-index「🐛 Bug记录」一键可达。
       卡片/复制/详情/删除/清空口径与 modules/303 已保存列表一致（含战斗日志原文锚点与现场切片 JSON）。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐛 Bug 记录 · 光明顶5v5</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --line: #2c2f39; --text: #d8dae2; --dim: #8b8f9c;
    --gold: #ffd700; --ok: #4caf50; --warn: #ffa726; --bad: #ff5252;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  header { padding: 18px 20px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 19px; color: var(--gold); font-weight: 600; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; align-items: center;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .bar .sp { flex: 1; }
  button { font: inherit; cursor: pointer; }
  .primary { background: linear-gradient(135deg,#c9a227,#ffd700); color: #1a1a1a; border: 0;
    padding: 7px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--dim);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  .ghost:hover { color: var(--text); border-color: #4a4f5c; }
  .danger { color: #ff9a8a !important; }
  main { padding: 14px 20px 60px; }
  .stat { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .card { border: 1px solid #3a2c1f; border-radius: 10px; background: #171410;
    padding: 10px 12px; margin-bottom: 10px; }
  .head { font-size: 11px; color: #8d7d5f; margin-bottom: 6px; }
  .note { font-size: 13px; color: #ffcf7a; word-break: break-word; margin-bottom: 3px; }
  .units { font-size: 12px; color: #cbb98f; margin-bottom: 3px; }
  .ent { font-size: 13px; color: #e8d9b5; word-break: break-word; margin-bottom: 2px; }
  .detail { display: none; max-height: 40vh; overflow: auto; background: #0b0803;
    border: 1px solid #3a2c1a; border-radius: 6px; padding: 8px; margin-top: 8px;
    font-size: 10px; line-height: 1.35; color: #b8ad96; white-space: pre-wrap; word-break: break-all; }
  .ops { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ops button { background: #262932; border: 1px solid var(--line); color: var(--text);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; }
  .ops button:hover { border-color: #4a4f5c; }
  .empty { padding: 30px 10px; text-align: center; color: #9a8a6a; font-size: 13px; }
  .empty b { color: var(--gold); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(30,20,10,.95); border: 1px solid var(--gold); color: var(--gold);
    padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 50; }
  /* 新建一条：轻量弹层（页面在手边随时想到随时记） */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 40;
    align-items: center; justify-content: center; padding: 16px; }
  .mask.on { display: flex; }
  .modal { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; }
  .modal h2 { margin: 0 0 10px; font-size: 15px; color: var(--gold); font-weight: 600; }
  .modal textarea, .modal input { width: 100%; background: #0f1115; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; margin-bottom: 8px; }
  .modal textarea { min-height: 54px; resize: vertical; }
  .modal .fl { display: block; font-size: 12px; color: #cbb98f; margin: 6px 0 4px; }
  .modal .hint { color: var(--dim); font-size: 11px; margin: -4px 0 10px; }
  .modal .ops { margin-top: 4px; justify-content: flex-end; }
  .modal .ops .primary { padding: 6px 16px; }
</style>
</head>
<body>
<header>
  <h1>🐛 Bug 记录</h1>
  <p>直接读游戏保存在本机的记录（localStorage · dsh_bug_records_v1），不用进游戏。</p>
</header>
<div class="bar">
  <button class="primary" id="btnNew">＋ 新建一条</button>
  <button class="ghost" id="btnCopyAll">一键复制全部</button>
  <button class="ghost" id="btnDownload">下载完整报告</button>
  <span class="sp"></span>
  <button class="ghost danger" id="btnClear">清空历史</button>
  <button class="ghost" id="btnBack">← 开发入口</button>
</div>
<main>
  <div class="stat" id="stat">读取中…</div>
  <div id="list"></div>
</main>
<div class="mask" id="newMask">
  <div class="modal">
    <h2>新建一条 Bug 记录</h2>
    <label class="fl">① 本来应该怎样</label>
    <textarea id="newNote1" placeholder="例：这个技能应该打敌方，不该打自己人"></textarea>
    <label class="fl">② 怎么复现</label>
    <textarea id="newNote2" placeholder="例：第7回合 · 暂停后点圣火令 · 拖到寒离飒 · 全自动模式"></textarea>
    <label class="fl">③ 实际看到什么</label>
    <textarea id="newNote3" placeholder="例：寒离飒掉了 19 血，日志显示「受到 19 点伤害」"></textarea>
    <input id="newUnits" placeholder="涉及角色（可选，用顿号或逗号分隔，例：寒离飒、张松溪）">
    <div class="hint">保存后与游戏内记录存在同一份本地列表里，复制 / 下载口径完全一致。</div>
    <div class="ops">
      <button class="ghost" id="btnNewCancel">取消</button>
      <button class="primary" id="btnNewSave">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var BUG_STORE_KEY = 'dsh_bug_records_v1';

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso || '');
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
            ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function loadSaved() {
        try {
            var raw = localStorage.getItem(BUG_STORE_KEY);
            var arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }
    function writeSaved(arr) {
        try { localStorage.setItem(BUG_STORE_KEY, JSON.stringify(arr)); return true; }
        catch (e) { toast('本地存储写入失败（空间可能已满）'); return false; }
    }

    var toastTimer = null;
    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2000);
    }

    // 与 modules/303 同口径：日志原文逐字带出，▶ 为锚点行；logBudget 控制本条日志预算。
    function recordLines(r, idx, logBudget) {
        var lines = [];
        var t = fmtTime(r.createdAt);
        var manual = r.mode === 'manual';
        var sums = (r.entries || []).map(function (e) { return e.summary; }).filter(Boolean).join('；');
        if (manual) {
            lines.push((idx + 1) + '. ' + t + ' ｜ [手动] ' + (r.note || '（无描述）'));
            if ((r.units || []).length) lines.push('   角色：' + r.units.join('、'));
            if (sums) lines.push('   同时选中报错：' + sums);
        } else {
            lines.push((idx + 1) + '. ' + t + ' ｜ [自动] ' + (sums || r.note || '（无摘要）'));
            if (sums && r.note) lines.push('   备注：' + r.note);
        }
        var lc = r.detail && r.detail.logCtx;
        if (lc && Array.isArray(lc.log) && lc.log.length) {
            var block = [];
            var noAt = function (k) {
                return (Array.isArray(lc.nos) && typeof lc.nos[k] === 'number') ? lc.nos[k] + 1 : lc.from + k + 1;
            };
            block.push('   ── 战斗日志原文（' + (lc.src === 'manual' ? '手动记录' : '自动抓取') +
                ' · 锚点来源：' + (lc.anchorSrc === 'user' ? '用户点选' : '自动推测（未点选）') +
                ' · 第 ' + noAt(0) + '~' + noAt(lc.log.length - 1) + ' 行 / 共 ' + lc.total +
                ' 行 · 出事单位：' + (lc.unit || '未识别') +
                ((lc.names || []).length > 1 ? ' · 出现：' + lc.names.join('、') : '') + '）');
            lc.log.forEach(function (txt, k) {
                block.push('   ' + noAt(k) + ' │ ' + (k === lc.anchor ? '▶ ' : '  ') + txt);
            });
            var cost = block.join('\n').length;
            if (cost <= logBudget) { lines.push.apply(lines, block); return { lines: lines, cost: cost }; }
            lines.push('   （本条日志原文见列表「详情」）');
        }
        return { lines: lines, cost: 0 };
    }

    function buildSavedCopyText(list) {
        var lines = ['【Bug 记录】共 ' + list.length + ' 条', ''];
        var logBudget = 16000;
        list.forEach(function (r, i) {
            var res = recordLines(r, i, logBudget);
            lines.push.apply(lines, res.lines);
            logBudget -= res.cost;
        });
        return lines.join('\n');
    }

    function buildSingleRecordText(r) {
        var res = recordLines(r, 0, 16000);
        var lines = ['【Bug 记录】1 条', ''].concat(res.lines);
        if (r.hasDetail && r.detail) {
            lines.push('');
            lines.push('── 现场切片' + (r.detailBytes ? '（' + (r.detailBytes / 1024).toFixed(1) + 'KB）' : ''));
            try { lines.push(JSON.stringify(r.detail, null, 2)); }
            catch (e) { lines.push(String(r.detail)); }
        }
        return lines.join('\n');
    }

    function buildFullReport(list) {
        var lines = ['# 光明顶5v5 · Bug 记录全量报告', '', '导出时间：' + fmtTime(new Date().toISOString()),
            '共 ' + list.length + ' 条', ''];
        list.slice().reverse().forEach(function (r, i) {
            var res = recordLines(r, i, 16000);
            lines.push.apply(lines, res.lines);
            if (r.hasDetail && r.detail) {
                lines.push('');
                lines.push('── 现场切片' + (r.detailBytes ? '（' + (r.detailBytes / 1024).toFixed(1) + 'KB）' : ''));
                try { lines.push(JSON.stringify(r.detail, null, 2)); }
                catch (e) { lines.push(String(r.detail)); }
            }
            lines.push('', '---', '');
        });
        return lines.join('\n');
    }

    function copyText(text, okMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, function () { fallbackCopy(text, okMsg); });
        } else fallbackCopy(text, okMsg);
    }
    function fallbackCopy(text, okMsg) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast(okMsg); }
        catch (e) { toast('复制失败，请手动选择文本'); }
        document.body.removeChild(ta);
    }
    function downloadText(text, name) {
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    function smallBtn(label, cls) {
        var b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        return b;
    }

    // 删除单条会整页重排（#list 全量重建），浏览器会把滚动位置打回顶部。
    //   删除前把「页面滚动 + 列表滚动」暂存，重建完再还原，删完停在原处。
    var _keepScroll = null;
    function restoreScroll() {
        var keep = _keepScroll;
        _keepScroll = null;
        if (!keep) return;
        requestAnimationFrame(function () {
            window.scrollTo(0, keep.win);
            var el = document.getElementById('list');
            if (el) el.scrollTop = keep.list;
        });
    }

    function render() {
        var list = loadSaved();
        var stat = document.getElementById('stat');
        var listBox = document.getElementById('list');
        stat.textContent = '共 ' + list.length + ' 条（#号按时间正序：数字越大越新；页面里新的排前面）';
        listBox.innerHTML = '';
        if (!list.length) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = '还没有记录。<br>点上方 <b>＋ 新建一条</b> 直接写，或进游戏暂停点 <b>🐞 记录Bug</b> 保存后回来刷新。';
            listBox.appendChild(empty);
            restoreScroll();
            return;
        }
        list.slice().reverse().forEach(function (rec, revIdx) {
            var seq = list.length - revIdx;              // 按时间正序编号：1 = 最早，最大号 = 最新（与复制/下载的报告一致）
            var card = document.createElement('div');
            card.className = 'card';

            var manual = rec.mode === 'manual';
            var errCount = (rec.entries || []).length;
            var head = document.createElement('div');
            head.className = 'head';
            head.textContent = '#' + seq + '　' + fmtTime(rec.createdAt) + ' ｜ ' + (manual ? '手动记录' : (errCount + ' 条错误')) +
                (rec.hasDetail && rec.detailBytes ? ' · 切片 ' + (rec.detailBytes / 1024).toFixed(1) + 'KB' : '');
            card.appendChild(head);

            if (manual) {
                var n = document.createElement('div');
                n.className = 'note';
                n.textContent = rec.note || '（无描述）';
                card.appendChild(n);
                if ((rec.units || []).length) {
                    var u = document.createElement('div');
                    u.className = 'units';
                    u.textContent = '角色：' + rec.units.join('、');
                    card.appendChild(u);
                }
            }
            (rec.entries || []).forEach(function (e) {
                var line = document.createElement('div');
                line.className = 'ent';
                line.textContent = (e.type === 'warn' ? '⚠️ ' : '❌ ') + e.summary;
                card.appendChild(line);
            });
            if (!manual && rec.note) {
                var nn = document.createElement('div');
                nn.className = 'note';
                nn.textContent = '备注：' + rec.note;
                card.appendChild(nn);
            }

            var detail = document.createElement('pre');
            detail.className = 'detail';
            if (rec.hasDetail && rec.detail) {
                try { detail.textContent = JSON.stringify(rec.detail, null, 2); }
                catch (e) { detail.textContent = String(rec.detail); }
            } else {
                detail.textContent = '（保存时未勾选详细数据）';
            }
            card.appendChild(detail);

            var ops = document.createElement('div');
            ops.className = 'ops';
            var detailBtn = smallBtn('详情');
            detailBtn.onclick = function () {
                var open = detail.style.display !== 'block';
                detail.style.display = open ? 'block' : 'none';
                detailBtn.textContent = open ? '收起' : '详情';
            };
            var copyOne = smallBtn('复制这一条');
            copyOne.onclick = function () { copyText(buildSingleRecordText(rec), '已复制这一条'); };
            var del = smallBtn('删除', 'danger');
            del.onclick = function () {
                if (!confirm('确认删除这一条记录？')) return;
                var arr = loadSaved().filter(function (x) { return x.id !== rec.id; });
                if (!writeSaved(arr)) return;
                toast('已删除，剩 ' + arr.length + ' 条');
                _keepScroll = { win: window.scrollY, list: (document.getElementById('list') || {}).scrollTop || 0 };
                render();
            };
            ops.appendChild(detailBtn); ops.appendChild(copyOne); ops.appendChild(del);
            card.appendChild(ops);

            listBox.appendChild(card);
        });
        restoreScroll();
    }

    // ---------- 新建一条：页面内直接手写，存同一份本地列表（结构与 modules/303 手动记录一致） ----------
    var MAX_SAVED = 60;
    var newMask = document.getElementById('newMask');
    var newNotes = [
        { key: '应该', el: document.getElementById('newNote1') },
        { key: '步骤', el: document.getElementById('newNote2') },
        { key: '实际', el: document.getElementById('newNote3') }
    ];
    // 三段合并成一条备注（空段跳过），与游戏内 303 完全同口径
    function newNoteValue() {
        return newNotes
            .map(function (x) { return { key: x.key, v: x.el.value.trim() }; })
            .filter(function (x) { return x.v; })
            .map(function (x) { return '【' + x.key + '】' + x.v; })
            .join('\n');
    }
    var newUnits = document.getElementById('newUnits');
    function openNew() {
        newNotes.forEach(function (x) { x.el.value = ''; });
        newUnits.value = '';
        newMask.classList.add('on');
        setTimeout(function () { try { newNotes[0].el.focus(); } catch (e) {} }, 30);
    }
    function closeNew() { newMask.classList.remove('on'); }
    document.getElementById('btnNew').onclick = openNew;
    document.getElementById('btnNewCancel').onclick = closeNew;
    newMask.onclick = function (e) { if (e.target === newMask) closeNew(); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNew(); });
    document.getElementById('btnNewSave').onclick = function () {
        var noteVal = newNoteValue();
        if (!noteVal) { toast('请至少填①②③中的一项'); try { newNotes[0].el.focus(); } catch (e) {} return; }
        var units = newUnits.value.split(/[、,，\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
        var rec = {
            id: String(Date.now()) + '-' + Math.floor(Math.random() * 1000),
            createdAt: new Date().toISOString(),
            mode: 'manual',
            entries: [],
            note: noteVal,
            units: units,
            hasDetail: false
        };
        var arr = loadSaved();
        arr.push(rec);
        while (arr.length > MAX_SAVED) arr.shift();   // 与 modules/303 同口径：超 60 条丢最老
        if (!writeSaved(arr)) return;
        closeNew();
        toast('已保存，列表共 ' + arr.length + ' 条');
        render();
    };

    document.getElementById('btnCopyAll').onclick = function () {
        var list = loadSaved();
        if (!list.length) { toast('列表还是空的'); return; }
        copyText(buildSavedCopyText(list), '已复制 ' + list.length + ' 条记录');
    };
    document.getElementById('btnDownload').onclick = function () {
        var list = loadSaved();
        if (!list.length) { toast('列表还是空的'); return; }
        downloadText(buildFullReport(list), 'bug-report-' + Date.now() + '.md');
        toast('已开始下载完整报告');
    };
    document.getElementById('btnClear').onclick = function () {
        var list = loadSaved();
        if (!list.length) { toast('列表已经是空的'); return; }
        if (!confirm('确定清空全部 Bug 历史记录？此操作不可恢复。')) return;
        if (!writeSaved([])) return;
        toast('已清空历史');
        render();
    };
    document.getElementById('btnBack').onclick = function () { location.href = '../dev-index.html'; };

    render();
})();
</script>
</body>
</html>
