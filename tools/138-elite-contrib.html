<!DOCTYPE html>
<!-- tools/138-elite-contrib.html — 弱精英机制贡献评估（V1.2.0 | 2026-10-28）
     目的：112「弱精英评测」只给胜率 Δ，看不出「机制到底触发了几次 / 精英本人干了什么」。
     本页复用 116 V1.15.0 的 kind:'weakContrib'：配对臂（精英臂 vs 自然臂）与 112 完全同口径
     （同种子公式 masterSeed + stage*131 + eliteIdx*7717、同 CHUNK/startIndex、同 clean 剔除），
     精英臂额外逐条扫战斗日志（core/06 onStep），聚合：
       技能触发/场（SKILL_ANNOUNCE by skillName）、
       自身 fact/场（unitName=精英）、被指向 fact/场（target=精英）、
       关键字探针/场（note/reason 命中，如「护罩挡下这一击」「穴道，本回合无法行动」）。
     不改主代码、不改战斗逻辑；所有数字都是观测，不是估分。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弱精英机制贡献评估</title>
<style>
  body { background:#14141f; color:#e8e8ef; font-family:monospace; margin:0; padding:18px; }
  h1 { color:#ffd700; font-size:20px; margin:0 0 6px; }
  .tip { color:#999; font-size:12px; line-height:1.7; margin-bottom:12px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:#1b1b2b; border:1px solid #333; border-radius:10px; padding:12px; }
  .bar label { font-size:13px; color:#ccc; }
  input[type=number] { width:80px; background:#0e0e17; color:#ffd700; border:1px solid #444; border-radius:6px; padding:6px 8px; font-family:monospace; }
  button { padding:9px 18px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-family:monospace; font-size:13px; }
  #runBtn { background:#ffd700; color:#14141f; }
  #runBtn:disabled { background:#555; color:#999; cursor:wait; }
  #progress { margin:10px 0; font-size:12px; color:#9ad; min-height:18px; }
  #errBox { display:none; background:#4a1010; border:1px solid #f44336; color:#ffb4b4; border-radius:8px; padding:10px; font-size:12px; white-space:pre-wrap; margin:10px 0; }
  table { border-collapse:collapse; width:100%; margin-top:10px; font-size:12px; }
  th { background:#2a2a44; color:#ffd700; padding:7px 8px; text-align:left; white-space:nowrap; }
  td { padding:6px 8px; border-bottom:1px solid #2c2c3c; color:#ccc; vertical-align:top; }
  .sub { color:#888; font-size:11px; }
  .pos { color:#4caf50; } .neg { color:#ff5252; } .mid { color:#ffd700; } .dim { color:#777; }
  h2 { color:#9ad; font-size:14px; margin:18px 0 4px; }
  .detail { margin-top:8px; font-size:11px; color:#aaa; line-height:1.8; }
</style>
</head>
<body>
<h1>🧬 弱精英机制贡献评估</h1>
<div class="tip">
  配对口径与 112「🐦 弱精英评测」完全一致：同一关同一片，精英臂与自然臂共用种子，Δ = 精英臂 − 自然臂（明教胜率）；<br>
  自然臂只剔除「目标精英本人自然登场」的局（其他弱精英保持自然分布）。精英臂额外观测技能/事实触发次数——这是 112 表上没有的那一半。<br>
  <span class="dim">观测项说明：技能触发 = 该精英发出的 SKILL_ANNOUNCE（按技能名计数）；关键字探针 = 日志 note/reason 命中指定关键字（如空见的「护罩挡下这一击」）。</span>
</div>
<div class="bar">
  <label>每关每臂场次 <input type="number" id="runsInput" value="120" min="20" step="10"></label>
  <span class="sub">总样本 / 精英 = 场次 × 7 关（每只弱精英各跑一套）</span>
  <button id="runBtn">▶ 开始跑批</button>
  <button id="loadBtn">📂 载入上次</button>
</div>
<div id="progress"></div>
<div id="errBox"></div>
<div id="result"></div>

<script type="module">
import { runParallel } from './117-shared-worker-runner.js';
import { WEAK_ELITES } from './127-tool-registry.js';

const VERSION = '138-elite-contrib V1.2.0';
const CHUNK = 50;
const CONTRIB_KEY = 'ming_weak_elite_contrib';   // V1.2.0：跑批结果落盘，关页面后仍能「📂 载入上次」；126 报警也能读它做交叉印证
const STAGES = [1, 2, 3, 4, 5, 6, 7];
const VARIANTS = ['胖远桥', '宋青书', '标准'];
// 关键字探针（只做展示归类，不改判据）：note/reason 文本包含即计一次
const PROBES = {
  '空见': ['护罩挡下这一击', '逗你玩'],
  '唐文亮': ['七伤齐发'],
  '杨逍': ['穴道，本回合无法行动', '穴道还麻着'],
  '何太冲': ['重新标记', '标记 ', '红血'],
  '殷天正': []
};

const runsInput = document.getElementById('runsInput');
const runBtn = document.getElementById('runBtn');
const progressEl = document.getElementById('progress');
const errBox = document.getElementById('errBox');
const resultEl = document.getElementById('result');

const num = v => Number(v || 0);
const pctStr = (w, r) => r > 0 ? (w / r * 100).toFixed(1) + '%' : '—';
const per = (v, r) => r > 0 ? (v / r).toFixed(2) : '—';
const topList = (obj, runs, limit) => {
  const arr = Object.entries(obj || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, limit);
  if (!arr.length) return '<span class="dim">—</span>';
  return arr.map(([k, v]) => `${k} ${per(v, runs)}/场`).join('<br>');
};
// 显著性：两比例差（保守按独立样本，SE = √(p1(1-p1)/n1 + p2(1-p2)/n2)，配对会更紧故不夸大）
function sigOf(eWins, eRuns, nWins, nRuns) {
  if (!eRuns || !nRuns) return null;
  const p1 = eWins / eRuns, p2 = nWins / nRuns;
  const delta = p1 - p2;
  const se = Math.sqrt(p1 * (1 - p1) / eRuns + p2 * (1 - p2) / nRuns);
  const z = se > 0 ? delta / se : 0;
  return { delta, se, z, sig: Math.abs(z) >= 1.96, ciLo: delta - 1.96 * se, ciHi: delta + 1.96 * se };
}
const signedPP = x => (x > 0 ? '+' : '') + x.toFixed(1) + 'pp';
// 一句话结论：把机制连到结果（数据现成，只差一句串起来）
function verdictOf(w, e, contribPP, sig) {
  const runs = e.runs || 1;
  const dmg = e.sumDmg / runs, taken = e.sumTaken / runs, heal = e.sumHeal / runs;
  const sideTxt = w.side === 'ally' ? '我方' : '敌方';
  const sigTxt = sig ? '显著' : '仍在噪声范围内';
  const probeTop = Object.entries(e.probes || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])[0];
  const skillTop = Object.entries(e.skills || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])[0];
  let mech;
  if (taken > 250 && dmg > 110) mech = `高承伤(${Math.round(taken)}/场)+高输出(${Math.round(dmg)}/场)的前排压制`;
  else if (probeTop && /穴道|标记|护罩|红血|麻/.test(probeTop[0])) mech = `控制/减益（「${probeTop[0]}」${per(probeTop[1], runs)}/场）`;
  else if (heal > 30) mech = `治疗续航(${Math.round(heal)}/场)`;
  else mech = `以「${skillTop ? skillTop[0] : '技能'}」为核心（${skillTop ? per(skillTop[1], runs) : '—'}/场）`;
  return `${sideTxt}弱精英，对本方净贡献 <b class="${contribPP > 0 ? 'pos' : 'neg'}">${signedPP(contribPP)}</b>（${sigTxt}）。机制上${mech}。`;
}

// 累加器：by[elite][stage][arm]['总'|variant]
const by = {};
function slot(elite, stage, arm) {
  const e = by[elite] || (by[elite] = {});
  const s = e[stage] || (e[stage] = { elite: null, natural: null });
  return s[arm] || (s[arm] = { runs: 0, wins: 0, sumSurv: 0, sumDmg: 0, sumTaken: 0, sumHeal: 0, skills: {}, factsSelf: {}, factsTarget: {}, probes: {} });
}
function addInto(dst, r) {
  dst.runs += r.runs; dst.wins += r.wins;
  dst.sumSurv += num(r.sumSurv); dst.sumDmg += num(r.sumDmg); dst.sumTaken += num(r.sumTaken); dst.sumHeal += num(r.sumHeal);
  for (const k of ['skills', 'factsSelf', 'factsTarget', 'probes']) {
    for (const [key, v] of Object.entries(r[k] || {})) dst[k][key] = (dst[k][key] || 0) + v;
  }
}
function totals(elite, arm) {
  const t = { runs: 0, wins: 0, sumSurv: 0, sumDmg: 0, sumTaken: 0, sumHeal: 0, skills: {}, factsSelf: {}, factsTarget: {}, probes: {} };
  for (const st of STAGES) {
    const s = by[elite] && by[elite][st];
    if (!s || !s[arm]) continue;
    addInto(t, s[arm]);
  }
  return t;
}

function setErr(msg) {
  errBox.style.display = msg ? 'block' : 'none';
  errBox.textContent = msg || '';
}

// V1.2.0：结果落盘（by 是纯嵌套对象，可直接 JSON 化）。关页面后仍能「📂 载入上次」，
//   也供 126 报警读它做「138 独立配对实验 vs 112 弱精英 Δ」的交叉印证。
function saveContrib() {
  try {
    localStorage.setItem(CONTRIB_KEY, JSON.stringify({ ts: Date.now(), by }));
  } catch (e) { /* 配额满就放弃，不影响本次展示 */ }
}
function loadContrib() {
  let raw;
  try { raw = localStorage.getItem(CONTRIB_KEY); } catch (e) { raw = null; }
  if (!raw) { setErr('没有上次结果（先跑一次批，会自动落盘）'); return false; }
  try {
    const o = JSON.parse(raw);
    // 防御：结构损坏就清空，不让坏数据污染展示
    if (!o || typeof o.by !== 'object' || !o.by) { setErr('上次结果已损坏，已忽略'); localStorage.removeItem(CONTRIB_KEY); return false; }
    for (const k in by) delete by[k];
    Object.assign(by, o.by);
    const d = new Date(o.ts);
    progressEl.textContent = `📂 已载入 ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 的结果（未重跑）`;
    render();
    return true;
  } catch (e) { setErr('载入失败：' + (e && e.message ? e.message : e)); return false; }
}

// V1.2.0：与 112「弱精英评测」快照交叉印证——同一批弱精英，138 用配对实验、112 用自然配对对照，
//   两份都是「精英臂 − 自然对照的明教胜率 Δ」，同口径。若方向/量级一致 → 结论站得住；方向相反 → 必有一方测量有误。
//   只读 112 快照（ming_elite_eval_snaps），不改它。遍历快照里实际存在的变体键，避免与 112 变体命名不一致导致漏算。
function crossCheck112() {
  let snaps;
  try { snaps = JSON.parse(localStorage.getItem('ming_elite_eval_snaps') || '[]'); } catch (e) { return null; }
  if (!Array.isArray(snaps) || !snaps.length) return null;
  const weak = snaps[0] && snaps[0].parts && snaps[0].parts.weak;
  if (!weak || !weak.byStage || !weak.stages) return null;
  const byStage = weak.byStage, stages = weak.stages;
  const acc = {};
  for (const w of WEAK_ELITES) acc[w.name] = { eRuns: 0, eWins: 0, nRuns: 0, nWins: 0 };
  for (const st of stages) {
    const stSec = byStage[st];
    if (!stSec) continue;
    for (const v of Object.keys(stSec)) {
      const slot = stSec[v];
      if (!slot) continue;
      for (const w of WEAK_ELITES) {
        const d = slot[w.name];
        if (d && d.runs) { acc[w.name].eRuns += d.runs; acc[w.name].eWins += d.wins; }
        const nb = slot.__natural && slot.__natural.clean && slot.__natural.clean[w.name];
        if (nb && nb.runs) { acc[w.name].nRuns += nb.runs; acc[w.name].nWins += nb.wins; }
      }
    }
  }
  const rows = [];
  for (const w of WEAK_ELITES) {
    const a = acc[w.name];
    if (!a.eRuns || !a.nRuns) continue;
    const d112 = (a.eWins / a.eRuns - a.nWins / a.nRuns) * 100;
    const e = totals(w.name, 'elite'), n = totals(w.name, 'natural');
    if (!e.runs || !n.runs) continue;
    const d138 = (e.wins / e.runs - n.wins / n.runs) * 100;
    const diff = d138 - d112;
    let tag;
    if (Math.abs(diff) <= 5) tag = '一致';
    else if ((d138 > 0) === (d112 > 0)) tag = '同向·量级有差';
    else tag = '方向相反⚠️';
    rows.push({ name: w.name, side: w.side, d112, d138, diff, tag });
  }
  return rows.length ? { rows, snapAge: snaps[0].ts } : null;
}

function render() {
  let html = '<h2>总评（七关合计，按对本方贡献排序）</h2><table><tr><th>弱精英</th><th>侧</th><th>样本</th><th>精英胜率</th><th>对照胜率</th><th>Δ(明教)</th><th>对本方贡献</th><th>存活</th><th>输出/场</th><th>承伤/场</th><th>治疗/场</th><th>技能触发/场</th><th>关键事件/场</th></tr>';
  // V1.2.0：总表按「对本方贡献」从高到低排，最猛的弱精英一眼在最上；贡献计算与下行一致
  const contribOf = w => {
    const e = totals(w.name, 'elite'), n = totals(w.name, 'natural');
    if (!e.runs || !n.runs) return null;
    const d = (e.wins / e.runs - n.wins / n.runs) * 100;
    return w.side === 'ally' ? d : -d;
  };
  const order = WEAK_ELITES
    .map(w => ({ w, c: contribOf(w) }))
    .filter(x => x.c !== null)
    .sort((a, b) => b.c - a.c)
    .map(x => x.w);
  for (const w of order) {
    const e = totals(w.name, 'elite');
    const n = totals(w.name, 'natural');
    if (!e.runs) { html += `<tr><td>${w.name}</td><td>${w.side === 'ally' ? '明教' : '六大派'}</td><td colspan="11" class="dim">无数据（该精英未上场或未跑）</td></tr>`; continue; }
    const er = e.wins / e.runs;
    const nr = n.runs ? n.wins / n.runs : NaN;
    const deltaPP = isNaN(nr) ? NaN : (er - nr) * 100;
    const contribPP = isNaN(deltaPP) ? NaN : (w.side === 'ally' ? deltaPP : -deltaPP); // 统一成「帮他那一方的净胜率变化」
    const s = sigOf(e.wins, e.runs, n.wins, n.runs);
    const sigMark = !s ? '' : (s.sig ? ' ✓' : ' ≈');
    const sigTitle = !s ? '' : ` title="95% 置信区间 ${s.ciLo * 100 >= 0 ? '+' : ''}${(s.ciLo * 100).toFixed(1)}pp ~ ${s.ciHi * 100 >= 0 ? '+' : ''}${(s.ciHi * 100).toFixed(1)}pp；|z|=${s.z.toFixed(2)}${s.sig ? '，显著' : '，仍在噪声内'}"`;
    const dcls = isNaN(deltaPP) ? 'dim' : 'mid';
    const dstr = isNaN(deltaPP) ? '—' : (deltaPP > 0 ? '+' : '') + deltaPP.toFixed(1) + 'pp' + sigMark;
    const ccls = isNaN(contribPP) ? 'dim' : (contribPP > 0.5 ? 'pos' : contribPP < -0.5 ? 'neg' : 'mid');
    const cstr = isNaN(contribPP) ? '—' : (contribPP > 0 ? '+' : '') + contribPP.toFixed(1) + 'pp';
    html += `<tr><td>${w.name}</td><td class="sub">${w.side === 'ally' ? '明教' : '六大派'}</td><td>${e.runs}</td>
      <td class="mid">${pctStr(e.wins, e.runs)}</td><td>${pctStr(n.wins, n.runs)}</td>
      <td class="${dcls}"${sigTitle}>${dstr}</td>
      <td class="${ccls}" title="统一方向：帮他那一方的净胜率变化（明教侧=Δ，六大派侧=−Δ）">${cstr}</td>
      <td>${pctStr(e.sumSurv, e.runs)}</td><td>${Math.round(e.sumDmg / e.runs)}</td><td>${Math.round(e.sumTaken / e.runs)}</td><td>${Math.round(e.sumHeal / e.runs)}</td>
      <td>${topList(e.skills, e.runs, 6)}</td><td>${topList(e.probes, e.runs, 4)}</td></tr>`;
  }
  html += '</table><div class="sub" style="margin-top:4px">Δ(明教)=精英臂−自然臂的明教胜率（负=明教更难赢）；<b>对本方贡献</b>=把他那一方的净胜率变化统一成同向（绿=帮他那方、红=拖他那方），免得把「六大派精英负Δ」误读成「弱」。✓=显著，≈=噪声。表按贡献从高到低排序。</div>';

  // 一句话结论（V1.1.0）：机制连到结果，免得只摆数字
  html += '<h2>一句话结论</h2><div class="detail">';
  for (const w of WEAK_ELITES) {
    const e = totals(w.name, 'elite');
    const n = totals(w.name, 'natural');
    if (!e.runs || !n.runs) continue;
    const deltaPP = (e.wins / e.runs - n.wins / n.runs) * 100;
    const contribPP = w.side === 'ally' ? deltaPP : -deltaPP;
    const s = sigOf(e.wins, e.runs, n.wins, n.runs);
    html += `<div style="margin:4px 0">· ${verdictOf(w, e, contribPP, s && s.sig)}</div>`;
  }
  html += '</div>';

  html += '<h2>分关 Δ（精英臂 − 自然臂）</h2><table><tr><th>弱精英</th>';
  for (const st of STAGES) html += `<th>第${st}关</th>`;
  html += '</tr>';
  for (const w of WEAK_ELITES) {
    if (!by[w.name]) continue;
    html += `<tr><td>${w.name}</td>`;
    for (const st of STAGES) {
      const s = by[w.name][st];
      if (!s || !s.elite || !s.elite.runs) { html += '<td class="dim">—</td>'; continue; }
      const er = s.elite.wins / s.elite.runs;
      const nr = s.natural && s.natural.runs ? s.natural.wins / s.natural.runs : NaN;
      if (isNaN(nr)) { html += '<td class="dim">—</td>'; continue; }
      const d = (er - nr) * 100;
      const contrib = w.side === 'ally' ? d : -d; // 贡献方向统一：绿=帮他那方
      const sg = sigOf(s.elite.wins, s.elite.runs, s.natural.wins, s.natural.runs);
      const mark = !sg ? '' : (sg.sig ? ' ✓' : ' ≈');
      const title = !sg ? '' : ` title="95%CI ${(sg.ciLo * 100).toFixed(1)}~${(sg.ciHi * 100).toFixed(1)}pp；|z|=${sg.z.toFixed(2)}"`;
      html += `<td class="${contrib > 0.5 ? 'pos' : contrib < -0.5 ? 'neg' : 'mid'}"${title}>${d > 0 ? '+' : ''}${d.toFixed(1)}${mark}<span class="sub"> / ${s.elite.runs}场</span></td>`;
    }
    html += '</tr>';
  }
  html += '</table><div class="sub" style="margin-top:4px">分关 Δ 着色：<span class="pos">绿=帮他那一方</span> / <span class="neg">红=拖他那一方</span>；✓=显著（95%置信区间不含0），≈=仍在噪声内（该关样本少，别当真信号）。</div>';

  html += '<h2>机制观测明细（精英臂，每场均值）</h2><div class="detail">';
  for (const w of WEAK_ELITES) {
    const e = totals(w.name, 'elite');
    if (!e.runs) continue;
    const facts = Object.entries(e.factsSelf || {}).sort((a, b) => b[1] - a[1]).slice(0, 8)
      .map(([k, v]) => `${k} ${per(v, e.runs)}`).join('；') || '—';
    const target = Object.entries(e.factsTarget || {}).sort((a, b) => b[1] - a[1]).slice(0, 6)
      .map(([k, v]) => `${k} ${per(v, e.runs)}`).join('；') || '—';
    html += `<div><b class="mid">${w.name}</b>（${e.runs} 场）：自身 fact → ${facts}<br>
      <span class="sub">被指向 fact → ${target}　｜　关键字探针 → ${topList(e.probes, e.runs, 6)}</span></div>`;
  }
  html += '</div><div class="sub" style="margin-top:8px">' + VERSION + ' · 观测口径 = 战斗日志逐条计数，不含任何估算或折算。</div>';

  // 与 112 弱精英 Δ 交叉印证（V1.2.0）：两份独立测量互证，方向/量级一致才站得住
  const cc = crossCheck112();
  if (cc) {
    html += '<h2>与 112 弱精英 Δ 交叉印证</h2><div class="detail">';
    html += `<div class="sub">138 配对实验 vs 112 弱精英评测快照（${new Date(cc.snapAge).toLocaleDateString('zh-CN')}）同口径比 Δ，看是否互相印证。差 ≤5pp 算一致。</div>`;
    for (const r of cc.rows) {
      const cls = r.tag === '一致' ? 'pos' : (r.tag.indexOf('相反') >= 0 ? 'neg' : 'mid');
      const diffTxt = Math.abs(r.diff) > 0.05 ? `（差 ${r.diff > 0 ? '+' : ''}${r.diff.toFixed(1)}pp）` : '';
      html += `<div style="margin:4px 0">· <b>${r.name}</b>（${r.side === 'ally' ? '明教' : '六大派'}）：138 ${r.d138 >= 0 ? '+' : ''}${r.d138.toFixed(1)}pp / 112 ${r.d112 >= 0 ? '+' : ''}${r.d112.toFixed(1)}pp ｜ <span class="${cls}">${r.tag}</span>${diffTxt}</div>`;
    }
    html += '</div>';
  }

  resultEl.innerHTML = html;
}

document.getElementById('loadBtn').addEventListener('click', () => {
  loadContrib();
});

runBtn.addEventListener('click', async () => {
  const perStage = Math.max(20, parseInt(runsInput.value, 10) || 120);
  setErr('');
  resultEl.innerHTML = '';
  progressEl.textContent = '准备中…';
  runBtn.disabled = true;
  const t0 = Date.now();
  const jobs = [];
  const masterSeed = Date.now();
  WEAK_ELITES.forEach((w, eliteIdx) => {
    for (const stage of STAGES) {
      const chunks = Math.ceil(perStage / CHUNK);
      for (let c = 0; c < chunks; c++) {
        const runs = Math.min(CHUNK, perStage - c * CHUNK);
        const seed = masterSeed + stage * 131 + eliteIdx * 7717;
        for (const arm of ['elite', 'natural']) {
          jobs.push({
            stage, seed, startIndex: c * CHUNK, runs,
            elite: w.name, side: w.side, arm,
            probes: PROBES[w.name] || [],
            label: `${w.name}·第${stage}关·${arm === 'elite' ? '精英臂' : '自然臂'}#${c + 1}`
          });
        }
      }
    }
  });
  let done = 0;
  try {
    await runParallel({
      jobs,
      nextJobMsg: (job, id) => ({
        jobId: id, kind: 'weakContrib', stage: job.stage, seed: job.seed, startIndex: job.startIndex,
        runs: job.runs, elite: job.elite, side: job.side, arm: job.arm, probes: job.probes
      }),
      onJobDone: (finished, total, job, part) => {
        for (const [v, agg] of Object.entries(part.variants || {})) {
          addInto(slot(job.elite, job.stage, job.arm), agg);
        }
        done += job.runs;
        const sec = ((Date.now() - t0) / 1000).toFixed(0);
        progressEl.textContent = `⏳ ${finished}/${total} 片 · ${done} 场/臂 · ${sec}s`;
      }
    });
    progressEl.textContent = `✅ 完成：${jobs.length} 片 · 用时 ${((Date.now() - t0) / 1000).toFixed(1)}s（${VERSION}）`;
    saveContrib();
    render();
  } catch (err) {
    setErr(`跑批失败：${err && err.message ? err.message : err}\n（查浏览器控制台全栈；worker 抛错时 117 会终止整池）`);
    progressEl.textContent = '';
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
