<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>飘字落点对比 · 光明顶5v5</title>
<style>
    body { margin:0; background:#1a1a1a; color:#ddd; font-family:"Microsoft YaHei","PingFang SC",sans-serif; padding:16px 18px 28px; }
    h1 { font-size:15px; margin:0 0 4px; }
    .tip { font-size:11px; color:#8f8f8f; margin-bottom:12px; }
    .bar { margin-bottom:12px; }
    .bar button { background:#2f6fb0; color:#fff; border:0; border-radius:5px; padding:6px 14px; font-size:12px; cursor:pointer; }
    .bar button:hover { background:#3a83cc; }
    .wrap { display:flex; gap:14px; flex-wrap:wrap; }
    .panel { background:#232323; border:1px solid #3a3a3a; border-radius:8px; padding:10px 12px 14px; width:338px; }
    .panel h2 { font-size:13px; margin:0 0 6px; color:#e8e8e8; }
    .panel .desc { font-size:11px; color:#9a9a9a; line-height:1.6; min-height:60px; }
    .panel .desc b { color:#d9d9d9; }
    .stage { position:relative; height:152px; margin-top:8px; background:#2b2b2b; border-radius:6px; }
    /* 格子：虚线框即格子边界，用于直观区分“格子内 / 格子外” */
    .cell { position:absolute; width:64px; height:64px; border-radius:6px; background:#3a3a3a; border:1px dashed #7a7a7a; box-sizing:border-box; }
    .cell .role { font-size:26px; line-height:62px; text-align:center; }
    /* 复用游戏 index.html 的飘字类与动画；demo 内把 fixed 改成 absolute 以限制在 stage 里 */
    .stage .dmg-float, .stage .heal-float { position:absolute; }
    .dmg-float { z-index:2; pointer-events:none; font-size:12px; font-weight:bold; color:#c0392b; animation:dmgUp 1.2s ease-out forwards; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
    @keyframes dmgUp { 0%{opacity:1;transform:translate(0,0) scale(1.2);} 20%{opacity:1;transform:translate(0,-6px) scale(1);} 80%{opacity:1;} 100%{opacity:0;transform:translate(4px,-22px) scale(0.9);} }
    .heal-float { z-index:2; pointer-events:none; font-size:12px; font-weight:bold; color:#2e7d32; animation:healUp 1.2s ease-out forwards; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
    @keyframes healUp { 0%{opacity:1;transform:translate(0,0) scale(1.2);} 20%{opacity:1;transform:translate(-6px,-6px) scale(1);} 80%{opacity:1;} 100%{opacity:0;transform:translate(-10px,-22px) scale(0.9);} }
    .stagemark { position:absolute; font-size:10px; color:#6f6f6f; }
</style>
</head>
<body>
<h1>飘字落点对比 · 光明顶 5v5</h1>
<div class="tip">虚线框 = 格子边界。点「▶ 重播动画」看初始落点与上飘轨迹。</div>
<div class="bar"><button id="replay">▶ 重播动画</button></div>

<div class="wrap" id="wrap"></div>

<script>
// 模拟一个格子（与真实 snapshotUnitCell 返回的 rect 同结构）
const CELL = { left: 126, top: 62, width: 64, height: 64 };
CELL.right = CELL.left + CELL.width;
CELL.bottom = CELL.top + CELL.height;

// 两个方案
const VARIANTS = [
    {
        title: 'A · 改前（V6.2.9）',
        desc: '⚔/🛡️ 落在<b>格子内部垂直居中</b>（0.38 / 0.62 宽处）；💥/❤ 顶边距格顶 4px。'
    },
    {
        title: 'B · 最终（V6.3.2）',
        desc: '四类飘字<b>初始高度一致</b>：顶边距格顶 4px（`rect.top - 4`），随后统一由动画往上飘。<br>水平仍按类型错开：⚔ 偏左 0.38、🛡️ 偏右 0.62。'
    }
];

function mkEl(cls, text, color) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    if (color) el.style.color = color;
    return el;
}

// v: 'A' 改前 | 'B' 最终
function placeFloats(stage, v) {
    stage.querySelectorAll('.dmg-float,.heal-float').forEach(n => n.remove());
    const r = CELL;
    const items = [
        { cls: 'heal-float', text: '⚔+5',   color: '#d2691e', kind: 'atk'  },
        { cls: 'heal-float', text: '🛡️+50', color: '#1e6bb8', kind: 'def'  },
        { cls: 'dmg-float',  text: '💥-20',  color: '#c0392b', kind: 'dmg'  },
        { cls: 'heal-float', text: '❤+10',   color: '#2e7d32', kind: 'heal' }
    ];
    items.forEach(it => {
        const el = mkEl(it.cls, it.text, it.color);
        stage.appendChild(el);                       // 先入 DOM 才能量宽
        const w = el.offsetWidth;
        let left, top;
        if (it.kind === 'atk') {                     // ⚔ 居中偏左
            left = r.left + r.width * 0.38 - w / 2;
            top  = (v === 'A') ? r.top + r.height * 0.5 - el.offsetHeight / 2   // 旧：格子内垂直居中
                               : r.top - 4;                                     // 最终：与掉血/回血同初始高度
        } else if (it.kind === 'def') {              // 🛡️ 居中偏右
            left = r.left + r.width * 0.62 - w / 2;
            top  = (v === 'A') ? r.top + r.height * 0.5 - el.offsetHeight / 2
                               : r.top - 4;
        } else if (it.kind === 'dmg') {              // 💥 格右缘外 +4
            left = r.right + 4 - w;
            top  = r.top - 4;
        } else {                                     // ❤ 格左缘 +12
            left = r.left + 12;
            top  = r.top - 4;
        }
        el.style.left = Math.round(left) + 'px';
        el.style.top  = Math.round(top) + 'px';
    });
}

function buildPanels() {
    const wrap = document.getElementById('wrap');
    wrap.innerHTML = '';
    VARIANTS.forEach((vd, i) => {
        const v = ['A', 'B'][i];
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.innerHTML = '<h2>' + vd.title + '</h2><div class="desc">' + vd.desc + '</div>';
        const stage = document.createElement('div');
        stage.className = 'stage';
        [30, CELL.left, 262].forEach((lx, idx) => {
            const c = document.createElement('div');
            c.className = 'cell';
            c.style.left = lx + 'px';
            c.style.top = CELL.top + 'px';
            if (idx === 1) c.innerHTML = '<div class="role">🛡️</div>';
            stage.appendChild(c);
        });
        const mark = document.createElement('div');
        mark.className = 'stagemark';
        mark.textContent = '↓ 格子顶边';
        mark.style.left = (CELL.left + 4) + 'px';
        mark.style.top = (CELL.top - 12) + 'px';
        stage.appendChild(mark);
        panel.appendChild(stage);
        wrap.appendChild(panel);
        placeFloats(stage, v);
    });
}

function replay() {
    document.querySelectorAll('.stage .dmg-float,.stage .heal-float').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;                 // 强制回流，重置动画
        el.style.animation = '';
    });
}

document.getElementById('replay').addEventListener('click', replay);
buildPanels();
setTimeout(replay, 60);
</script>
</body>
</html>
