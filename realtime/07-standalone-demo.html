<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新架构最终演示 - 光明顶5v5</title>
    <style>
        body { background: #f5f0e0; font-family: 'Segoe UI', monospace; display: flex; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden; padding: 4px 6px; color: #333; user-select: none; }
        h1 { color: #b8860b; text-align: center; margin: 8px 0; font-size: 1.2rem; }
        .battlefield { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; position: relative; overflow-y: auto; }
        .team-row { display: flex; align-items: center; gap: 4px; max-width: 500px; margin: 0 auto; width: 100%; }
        .team-label { writing-mode: vertical-lr; font-weight: bold; font-size: 13px; width: 18px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 5.5dvh); gap: 2px; flex: 1; background: #d9d0b5; padding: 3px; border-radius: 6px; }
        .cell { background: #e8e6e0; border: 2px solid #bbb; border-radius: 5px; padding: 2px 4px; display: flex; align-items: center; gap: 4px; font-size: 9px; height: 5.5dvh; transition: background 0.6s ease; position: relative; overflow: hidden; }
        .cell-dead { opacity: 0.5; }
        .cell-icon { font-size: 13px; width: 14px; text-align: center; flex-shrink: 0; }
        .cell-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .cell-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; }
        .cell-stats { font-size: 7px; color: #555; display: flex; gap: 2px; }
        .hp-bar-wrap { width: 8px; height: 100%; background: #ccc; border-radius: 3px; flex-shrink: 0; align-self: stretch; position: relative; }
        .hp-bar-inner { position: absolute; bottom: 0; width: 100%; border-radius: 3px; transition: height 0.6s ease; }
        .dead-mark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 20px; color: rgba(180,0,0,0.9); pointer-events: none; z-index: 1; font-weight: bold; }
        .hp-green { color: #2e7d32; } .hp-orange { color: #d2691e; } .hp-red { color: #c0392b; }
        .controls { text-align: center; padding: 8px 0; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; background: #ffd700; color: #1a1a2e; }
        .log { background: #f5f0e0; border: 2px solid #b8a88a; border-radius: 6px; padding: 8px; margin-top: 8px; max-height: 150px; overflow-y: auto; font-size: 10px; }
    </style>
</head>
<body>
<h1>光明顶5v5 · 新架构演示</h1>
<div class="battlefield">
    <div class="team-row"><span class="team-label" style="color:#d2691e;">六大派</span><div class="grid" id="enemyGrid"></div></div>
    <div class="team-row"><span class="team-label" style="color:#1e6bb8;">明 教</span><div class="grid" id="allyGrid"></div></div>
</div>
<div class="controls">
    <button onclick="startBattle()">⚔️ 自动战斗</button>
</div>
<div class="log" id="logPanel"><div>准备就绪，点击按钮开始战斗</div></div>

<script type="module">
import { adaptTeam } from './08-old-unit-adapter.js';
import { CONFIG } from '../core/01config-5v5-test.js';
import { Unit } from '../core/02unit.js';
import { rand } from '../core/03battle-utils.js';

// 动态生成真实单位数据
function generateRealUnits() {
    const MING_SQUADS = CONFIG.MING_SQUADS;
    const ENEMY_SQUADS = CONFIG.ENEMY_SQUADS;
    const MING_M = CONFIG.MING_M;
    const ROLES = CONFIG.ROLES;
    const currentStage = 1;

    let allyTeam = [], enemyTeam = [];
    const mingSquad = MING_SQUADS[currentStage];
    
    if (mingSquad) {
        let mingConfig;
        if (currentStage === 1 && Array.isArray(mingSquad[0])) {
            mingConfig = mingSquad[rand(0, mingSquad.length - 1)];
        } else {
            mingConfig = mingSquad;
        }
        if (!Array.isArray(mingConfig)) mingConfig = [mingConfig];
        for (let item of mingConfig) {
            let name, mVal;
            if (typeof item === 'string') { name = item; mVal = MING_M[name] || 95; }
            else { mVal = item; name = '明教弟子' + (allyTeam.length + 1); }
            let role = name === '张无忌' ? '远程' : (name === '韦一笑' ? '飞行' : ROLES[rand(0, 3)]);
            let unit = new Unit(name, mVal, role, 'ally');
            if (name === '张无忌') unit.isZhang = true;
            if (name === '韦一笑') unit.isWei = true;
            unit.init(); unit.applyBonus();
            allyTeam.push(unit);
        }
    }

    const enemySquad = ENEMY_SQUADS[currentStage];
    if (enemySquad) {
        for (let item of enemySquad) {
            if (typeof item === 'object' && item.name) {
                let unit = new Unit(item.name, item.m, item.role, 'enemy');
                unit.init(); unit.applyBonus();
                enemyTeam.push(unit);
            } else {
                let mVal = item;
                let name = '六大派弟子';
                let role = ROLES[rand(0, 3)];
                let unit = new Unit(name, mVal, role, 'enemy');
                unit.init(); unit.applyBonus();
                enemyTeam.push(unit);
            }
        }
    }

    return { ally: allyTeam, enemy: enemyTeam };
}

// ==================== 状态仓库 ====================
function createStore(initialState, reducer) {
    let state = initialState;
    const listeners = [];
    return {
        getState: () => state,
        dispatch: (action) => {
            const newState = reducer(state, action);
            if (newState === state) return;
            state = newState;
            listeners.forEach(fn => { try { fn(state, action); } catch(e) {} });
        },
        subscribe: (fn) => { listeners.push(fn); }
    };
}

// ==================== 工具函数 ====================
function calcDamage(atk, def) { if(def<=0)return atk; const d=atk*(atk/(atk+def)); return Math.max(d, atk*0.1); }

// ==================== Reducer ====================
function gameReducer(state, action) {
    switch(action.type) {
        case 'APPLY_DAMAGE': {
            const { unitId, attackerId, newHp, isDead, dmgDealt, dmgTaken } = action.payload;
            const newUnits = state.units.map(u => {
                if (u.uid === unitId) return { ...u, hp: newHp, alive: !isDead };
                if (u.uid === attackerId) return { ...u, dmgDealt: (u.dmgDealt||0)+(dmgDealt||0) };
                return u;
            });
            return { ...state, units: newUnits };
        }
        case 'APPLY_HEAL': {
            const { unitId, newHp, newMaxHp } = action.payload;
            const newUnits = state.units.map(u => {
                if (u.uid !== unitId) return u;
                return { ...u, hp: newHp, maxHp: newMaxHp !== undefined ? newMaxHp : u.maxHp };
            });
            return { ...state, units: newUnits };
        }
        case 'UNIT_DIED': {
            const newUnits = state.units.map(u => {
                if (u.uid !== action.payload.unitId) return u;
                return { ...u, hp: 0, alive: false };
            });
            return { ...state, units: newUnits };
        }
        default: return state;
    }
}

// ==================== 攻击引擎 ====================
function executeAttack(store, attackerUid, defenderUid) {
    const state = store.getState();
    const att = state.units.find(u => u.uid === attackerUid);
    const def = state.units.find(u => u.uid === defenderUid);
    if (!att || !def || !att.alive || !def.alive) return { success: false };

    // 未命中判定
    if (!att.isWei && (att.role==='远程'||att.role==='飞行') && Math.random()<=0.05) {
        return { success: true, dmg: 0, isDead: false, isMiss: true, attackerName: att.name, defenderName: def.name };
    }

    // 伤害计算
    const atkAct = att.atk + Math.floor(Math.random() * 7);
    const defAct = def.def + Math.floor(Math.random() * 5);
    const dmg = Math.floor(calcDamage(atkAct, defAct));
    const newHp = Math.max(0, def.hp - dmg);
    const isDead = newHp <= 0;

    store.dispatch({ type: 'APPLY_DAMAGE', payload: { unitId: def.uid, attackerId: att.uid, newHp, isDead, dmgDealt: dmg, dmgTaken: dmg } });
    if (isDead) store.dispatch({ type: 'UNIT_DIED', payload: { unitId: def.uid } });

    // 韦一笑吸血
    if (att.isWei && dmg > 0) {
        const heal = Math.floor(dmg * 0.15);
        const newMax = att.maxHp + heal;
        const newAttHp = Math.min(att.hp + heal, newMax);
        store.dispatch({ type: 'APPLY_HEAL', payload: { unitId: att.uid, newHp: newAttHp, newMaxHp: newMax } });
    }

    // 张无忌九阳神功
    if (att.isZhang && att.alive) {
        const heal = Math.floor(att.maxHp * 0.05);
        store.dispatch({ type: 'APPLY_HEAL', payload: { unitId: att.uid, newHp: Math.min(att.maxHp, att.hp + heal) } });
    }

    return { success: true, dmg, isDead, isMiss: false, attackerName: att.name, defenderName: def.name };
}

// ==================== 回合循环 ====================
async function runBattleLoop(store, onUpdate) {
    let round = 1;
    while (true) {
        const state = store.getState();
        const allyAlive = state.units.filter(u => u.alive && u.camp === 'ally');
        const enemyAlive = state.units.filter(u => u.alive && u.camp === 'enemy');
        if (!allyAlive.length || !enemyAlive.length) break;

        // 敌方随机攻击
        const attacker = enemyAlive[Math.floor(Math.random() * enemyAlive.length)];
        const defender = allyAlive[Math.floor(Math.random() * allyAlive.length)];
        let result = executeAttack(store, attacker.uid, defender.uid);
        if (onUpdate) onUpdate(round, result);

        const state2 = store.getState();
        const allyAlive2 = state2.units.filter(u => u.alive && u.camp === 'ally');
        const enemyAlive2 = state2.units.filter(u => u.alive && u.camp === 'enemy');
        if (!allyAlive2.length || !enemyAlive2.length) break;

        // 己方随机攻击
        const attacker2 = allyAlive2[Math.floor(Math.random() * allyAlive2.length)];
        const defender2 = enemyAlive2[Math.floor(Math.random() * enemyAlive2.length)];
        result = executeAttack(store, attacker2.uid, defender2.uid);
        if (onUpdate) onUpdate(round, result);

        round++;
        await new Promise(r => setTimeout(r, 400));
    }
}

// ==================== UI 渲染 ====================
function renderGrid(containerId, units) {
    const grid = document.getElementById(containerId);
    grid.innerHTML = '';
    const positions = [1,2,3,4,5,6,7,8,9];
    
    positions.forEach(pos => {
        const unit = units.find(u => u.pos === pos);
        const div = document.createElement('div');
        div.className = 'cell' + (unit && !unit.alive ? ' cell-dead' : '');

        if (!unit) {
            div.innerHTML = '<span style="color:#999;">空</span>';
        } else {
            const pct = unit.maxHp > 0 ? Math.max(0, (unit.hp / unit.maxHp) * 100) : 0;
            const barColor = pct > 70 ? '#4caf50' : (pct > 30 ? '#ff9800' : '#f44336');
            const roleIcon = unit.role === '战士' ? '⚔️' : (unit.role === '防战' ? '🛡️' : (unit.role === '远程' ? '🏹' : '🦅'));
            const hpColorClass = pct > 70 ? 'hp-green' : (pct > 30 ? 'hp-orange' : 'hp-red');

            div.innerHTML = `
                <span class="cell-icon">${roleIcon}</span>
                <div class="cell-info">
                    <span class="cell-name">${unit.name}${unit.isZhang ? ' [无忌]' : ''}${unit.isWei ? ' [韦一笑]' : ''}</span>
                    <span class="cell-stats">攻${unit.atk} 防${unit.def} <span class="${hpColorClass}">血${unit.hp}</span></span>
                </div>
                <div class="hp-bar-wrap"><div class="hp-bar-inner" style="height:${pct}%;background:${barColor};"></div></div>
                ${!unit.alive ? '<span class="dead-mark">✕</span>' : ''}
            `;
        }
        grid.appendChild(div);
    });
}

function renderAll(state) {
    renderGrid('allyGrid', state.units.filter(u => u.camp === 'ally'));
    renderGrid('enemyGrid', state.units.filter(u => u.camp === 'enemy'));
}

// ==================== 初始化 ====================
const realUnits = generateRealUnits();
const allUnits = [...adaptTeam(realUnits.ally), ...adaptTeam(realUnits.enemy)];
allUnits.forEach((u, i) => { u.pos = (i % 9) + 1; });

const initialState = { units: allUnits, round: 1, winner: null, isOver: false };
const store = createStore(initialState, gameReducer);
store.subscribe(renderAll);
renderAll(store.getState());

// ==================== 暴露到全局 ====================
window.startBattle = function() {
    const log = document.getElementById('logPanel');
    log.innerHTML = '<div>战斗开始</div>';
    function addLog(msg) { const d = document.createElement('div'); d.textContent = msg; log.appendChild(d); log.scrollTop = log.scrollHeight; }
    
    runBattleLoop(store, (round, result) => {
        if (result.isMiss) { addLog(`${result.attackerName} 未命中 ${result.defenderName}`); }
        else { addLog(`${result.attackerName} → ${result.defenderName} 伤害 ${result.dmg}${result.isDead?' (击杀)':''}`); }
    }).then(() => {
        const s = store.getState();
        const ally = s.units.filter(u => u.camp==='ally' && u.alive).length;
        const enemy = s.units.filter(u => u.camp==='enemy' && u.alive).length;
        addLog(`🏁 结束！明教 ${ally} : ${enemy} 六大派`);
    });
};
</script>
</body>
</html>
