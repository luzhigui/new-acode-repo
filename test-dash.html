<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>唐文亮冲刺 · 纯特效独立舞台</title>
<style>
    :root { --c-parchment: #f5f0e0; --c-tan: #b8a88a; --c-ming-blue: #1e6bb8; --c-sect-orange: #d2691e; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button { padding: 10px 20px; border-radius: 8px; border: 1px solid #555; background: #2a2a4e; color: #ffd700; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .battlefield { background: var(--c-parchment); border: 3px solid #8b7355; border-radius: 12px; padding: 10px; width: 100%; max-width: 520px; position: relative; }
    .team-row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .team-label { width: 20px; font-size: 12px; font-weight: bold; text-align: center; writing-mode: vertical-lr; }
    .team-label.ally { color: var(--c-ming-blue); }
    .team-label.enemy { color: var(--c-sect-orange); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 60px); gap: 4px; background: #d9d0b5; padding: 4px; border-radius: 6px; flex: 1; }
    
    .cell { background: #e8e6e0; border: 2px solid #bbb; border-radius: 5px; padding: 2px 4px; display: flex; align-items: center; gap: 4px; font-size: 10px; color: #333; position: relative; overflow: visible; }
    .cell-icon { font-size: 14px; width: 16px; text-align: center; flex-shrink: 0; }
    .cell-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .cell-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; }
    .cell-stats { font-size: 8px; color: #555; display: flex; gap: 2px; }
    .hp-bar-wrap { width: 6px; height: 100%; background: #ccc; border-radius: 3px; flex-shrink: 0; align-self: stretch; position: relative; }
    .hp-bar-inner { position: absolute; bottom: 0; width: 100%; border-radius: 3px; background: #4caf50; }

    .clone-cell { position: fixed; margin: 0; pointer-events: none; display: flex; align-items: center; box-sizing: border-box; border-radius: 5px; z-index: 10070; }

    /* 慢速档样式 */
    .fx94-lock { animation: fx94Lock .8s ease-in-out infinite !important; }
    .fx94-tw { animation: fx94Tw .5s ease-in-out infinite !important; }
    @keyframes fx94Lock { 0%,100% { box-shadow: 0 0 0 2px rgba(255,90,40,.95), 0 0 14px rgba(255,90,40,.55); } 50% { box-shadow: 0 0 0 3px rgba(255,140,70,1), 0 0 30px rgba(255,90,40,.95); } }
    @keyframes fx94Tw { 0%,100% { box-shadow: 0 0 0 2px rgba(255,209,102,.95), 0 0 22px rgba(255,209,102,.8); } 50% { box-shadow: 0 0 0 3px rgba(255,255,255,1), 0 0 34px rgba(255,215,0,1); } }
    .shake { animation: shake 0.42s ease-in-out; }
    @keyframes shake { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-4px,3px);} 50%{transform:translate(4px,-3px);} 75%{transform:translate(-3px,-4px);} }
</style>
</head>
<body>
    <div class="controls">
        <button id="btnFast">▶ 播放快版冲刺</button>
        <button id="btnSlow">▶ 播放慢版冲刺(子弹时间)</button>
        <button id="btnReset">↻ 重置</button>
    </div>
    
    <div class="battlefield" id="battlefield">
        <!-- 六大派在上 -->
        <div class="team-row"><div class="team-label enemy">六大派</div><div class="grid" id="enemyGrid"></div></div>
        <!-- 明教在下 -->
        <div class="team-row"><div class="team-label ally">明 教</div><div class="grid" id="allyGrid"></div></div>
    </div>

<script>
/* =========================================================
   基建：模拟 clock 和引擎数据 (纯纯的仿制，只为了跑动画)
   ========================================================= */
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const clock = {
    wait: (ms) => wait(ms),
    waitReal: (ms) => wait(ms),
    animate: (ms, fn) => new Promise(res => {
        const start = performance.now();
        const loop = now => { const p = Math.min(1, (now - start)/ms); fn(p); if(p<1) requestAnimationFrame(loop); else res(); };
        requestAnimationFrame(loop);
    }),
    animateReal: (ms, fn) => new Promise(res => {
        const start = performance.now();
        const loop = now => { const p = Math.min(1, (now - start)/ms); fn(p); if(p<1) requestAnimationFrame(loop); else res(); };
        requestAnimationFrame(loop);
    })
};
const GlobalStore = { get: () => false };

// 真实数据：唐文亮在明教 4 号位，灭绝在六大派 7 号位
const initUnits = [
    { uid: 'tw', camp: 'ally', pos: 4, name: '唐文亮', icon: '🪠', hp: 100, maxHp: 100, atk: 40, def: 30 },
    { uid: 'e1', camp: 'enemy', pos: 7, name: '灭绝', icon: '⚔️', hp: 120, maxHp: 120, atk: 45, def: 20 }
];
let units = JSON.parse(JSON.stringify(initUnits));

function cardHtmlFromUnit(u) {
    return `<span class="cell-icon">${u.icon}</span><div class="cell-info"><span class="cell-name">${u.name}</span><span class="cell-stats">血${u.hp}</span></div><div class="hp-bar-wrap"><div class="hp-bar-inner" style="height:100%"></div></div>`;
}
function render() {
    ['enemyGrid', 'allyGrid'].forEach(id => {
        const grid = document.getElementById(id);
        grid.innerHTML = '';
        const camp = id === 'enemyGrid' ? 'enemy' : 'ally';
        for (let p = 1; p <= 9; p++) {
            const d = document.createElement('div');
            d.className = 'cell';
            d.dataset.pos = p;
            d.dataset.camp = camp;
            const u = units.find(x => x.camp === camp && x.pos === p);
            if (u) {
                d.dataset.uid = u.uid;
                d.innerHTML = cardHtmlFromUnit(u);
            }
            grid.appendChild(d);
        }
    });
}
render();

function getCellByPos(camp, pos) {
    return document.querySelector(`#${camp === 'ally' ? 'allyGrid' : 'enemyGrid'} [data-pos="${pos}"]`);
}
function rectOf(camp, pos) {
    if (camp == null || pos == null) return null;
    const el = getCellByPos(camp, pos);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { left: r.left, top: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
}

/* =========================================================
   fx/616 原封不动照抄的代码
   ========================================================= */
function makeGhost(camp, fromPos, toPos, z, uid) {
    const r = rectOf(camp, fromPos);
    if (!r) return null;
    const src = getCellByPos(camp, toPos);
    let g = null;
    if (src && (src.querySelector('.cell-icon') || src.textContent.trim())) {
        g = src.cloneNode(true);
        g.classList.remove('ready', 'acted');
        g.removeAttribute('data-flash');
    }
    if (!g) {
        const u = units.find(x => x.uid === uid);
        if (!u) return null;
        g = document.createElement('div');
        g.className = 'cell';
        g.innerHTML = cardHtmlFromUnit(u);
    }
    g.className += ' clone-cell';
    g.style.left = r.left + 'px';
    g.style.top = r.top + 'px';
    g.style.width = r.w + 'px';
    g.style.height = r.h + 'px';
    g.style.zIndex = z;
    document.body.appendChild(g);
    return { el: g, from: r };
}

function edgeOf(r, tx, ty) {
    const cx = r.left + r.w / 2, cy = r.top + r.h / 2;
    const dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    const kx = dx ? (r.w / 2) / Math.abs(dx) : Infinity;
    const ky = dy ? (r.h / 2) / Math.abs(dy) : Infinity;
    const k = Math.min(kx, ky);
    return { x: cx + dx * k, y: cy + dy * k };
}

function injectSlowStyle() {
    if (document.getElementById('fx94-slow-style')) return;
    const st = document.createElement('style');
    st.id = 'fx94-slow-style';
    st.textContent = `@keyframes fx94Lock{0%,100%{box-shadow:0 0 0 2px rgba(255,90,40,.95),0 0 14px rgba(255,90,40,.55)}50%{box-shadow:0 0 0 3px rgba(255,140,70,1),0 0 30px rgba(255,90,40,.95)}}@keyframes fx94Tw{0%,100%{box-shadow:0 0 0 2px rgba(255,209,102,.95),0 0 22px rgba(255,209,102,.8)}50%{box-shadow:0 0 0 3px rgba(255,255,255,1),0 0 34px rgba(255,215,0,1)}}.fx94-lock{animation:fx94Lock .8s ease-in-out infinite !important;}.fx94-tw{animation:fx94Tw .5s ease-in-out infinite !important;}`;
    document.head.appendChild(st);
}

async function performFinishingPunch(twEl, targetEl, T = (v) => v) {
    const twR = twEl.getBoundingClientRect();
    const tgR = targetEl.getBoundingClientRect();
    const dx = tgR.left - twR.left;
    const dy = tgR.top - twR.top;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist, ny = dy / dist;
    const reach = Math.min(dist * 0.42, 54);

    await clock.animateReal(T(100), (p) => {
        const e = 1 - Math.pow(1 - p, 3);
        twEl.style.transform = `translate(${-nx * 10 * e}px, ${-ny * 10 * e}px) scale(${1 - 0.08 * e})`;
    });

    await clock.animateReal(T(110), (p) => {
        const e = p * p * p;
        twEl.style.transform = `translate(${-nx * 10 + nx * (reach + 10) * e}px, ${-ny * 10 + ny * (reach + 10) * e}px) scale(1.05)`;
    });

    const px = twR.left + twR.width / 2 + nx * reach;
    const py = twR.top + twR.height / 2 + ny * reach;

    const flash = document.createElement('div');
    flash.style.cssText = `position:fixed;left:${tgR.left}px;top:${tgR.top}px;width:${tgR.width}px;height:${tgR.height}px;border-radius:6px;background:radial-gradient(circle at 50% 45%,#fff 0%,rgba(255,255,255,.9) 30%,rgba(255,240,180,.35) 68%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:10080;`;
    document.body.appendChild(flash);
    clock.animateReal(T(230), (p) => {
        flash.style.opacity = String(1 - p);
        flash.style.transform = `scale(${1 + p * 0.18})`;
    }).then(() => flash.remove());

    targetEl.classList.add('shake');
    setTimeout(() => targetEl.classList.remove('shake'), 420);

    sparkBurstAt(px, py, '#fff2b0', 16);
    sparkBurstAt(px, py, '#ff9f43', 10);
    impactRing({ left: tgR.left, top: tgR.top, w: tgR.width, h: tgR.height, cx: tgR.left + tgR.width/2, cy: tgR.top + tgR.height/2 }, 'rgba(255,255,255,0.95)');
    screenShake();

    await clock.animateReal(T(200), (p) => {
        const e = 1 - Math.pow(1 - p, 3);
        twEl.style.transform = `translate(${nx * reach * (1 - e)}px, ${ny * reach * (1 - e)}px) scale(1)`;
    });
    twEl.style.transform = '';
}

function impactRing(rect, color) {
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;left:${rect.cx}px;top:${rect.cy}px;width:${rect.w}px;height:${rect.h}px;border:2px solid ${color};border-radius:9px;pointer-events:none;z-index:10080;box-shadow:0 0 16px ${color};`;
    document.body.appendChild(d);
    clock.animateReal(430, (p) => {
        const e = 1 - Math.pow(1 - p, 2);
        d.style.transform = `translate(-50%,-50%) scale(${0.55 + e * 0.95})`;
        d.style.opacity = String(1 - p);
    }).then(() => d.remove());
}

function sparkBurstAt(cx, cy, color, n) {
    for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + Math.random() * 0.6;
        const sp = 20 + Math.random() * 32;
        const sz = 2 + Math.random() * 3;
        const d = document.createElement('div');
        d.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;border-radius:50%;background:${color};box-shadow:0 0 7px ${color};pointer-events:none;z-index:10086;`;
        document.body.appendChild(d);
        const dur = 280 + Math.random() * 200;
        clock.animateReal(dur, (p) => {
            const e = 1 - Math.pow(1 - p, 2.4);
            d.style.transform = `translate(${Math.cos(a) * sp * e}px,${Math.sin(a) * sp * e + 26 * p * p}px) scale(${1 - p * 0.7})`;
            d.style.opacity = String(1 - p * p);
        }).then(() => d.remove());
    }
}

function screenShake() {
    const bf = document.getElementById('battlefield');
    clock.animateReal(220, (p) => {
        const s = 2 * (1 - p);
        bf.style.transform = `translate(${(Math.random() - 0.5) * 2 * s}px,${(Math.random() - 0.5) * 2 * s}px)`;
    }).then(() => { bf.style.transform = ''; });
}

async function showTangWenLiangDashSlow(dash) {
    let moves = dash.moves.filter(m => m.from !== m.to);
    const ghosts = [];
    const T = (v) => v; // 近似参数

    const mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.34);z-index:9990;pointer-events:none;opacity:0;';
    document.body.appendChild(mask);
    const skipBtn = document.createElement('div');
    skipBtn.textContent = '跳过';
    skipBtn.style.cssText = 'position:fixed;bottom:12%;right:8%;z-index:10090;color:rgba(255,255,255,0.72);font-size:18px;font-weight:bold;cursor:pointer;transform:rotate(-30deg);';
    document.body.appendChild(skipBtn);

    for (const m of moves) {
        const isMain = !!m.isDash || m.uid === dash.targetUid;
        const g = makeGhost(m.camp, m.from, m.to, isMain ? 10070 : 10040, m.uid);
        if (g) ghosts.push({ ...m, g, toRect: rectOf(m.camp, m.to) });
    }

    const twGH = ghosts.find(x => x.isDash);
    const tgtGH = ghosts.find(x => x.uid === dash.targetUid);

    injectSlowStyle();
    const hlList = [];
    const addHl = (el, cls) => { if (!el) return; el.classList.add(cls); hlList.push([el, cls]); };
    addHl(twGH.g.el, 'fx94-tw');
    addHl(tgtGH.g.el, 'fx94-lock');

    const afterImgs = [];
    if (twGH) {
        for (let i = 0; i < 3; i++) {
            const im = twGH.g.el.cloneNode(true);
            im.classList.remove('fx94-tw');
            im.style.cssText = twGH.g.el.style.cssText + `;z-index:${10066 - i};opacity:0;filter:blur(1.6px) saturate(1.5);`;
            document.body.appendChild(im);
            afterImgs.push(im);
        }
    }

    await clock.animateReal(T(350), (p) => { mask.style.opacity = String(0.34 * p); });

    const chainGlow = document.createElement('div');
    chainGlow.style.cssText = 'position:fixed;height:12px;border-radius:8px;pointer-events:none;opacity:0;z-index:10072;background:linear-gradient(90deg,rgba(255,214,96,.25),rgba(255,160,60,.85));filter:blur(4px);transform-origin:0 50%;';
    document.body.appendChild(chainGlow);
    const chainCore = document.createElement('div');
    chainCore.style.cssText = 'position:fixed;height:5px;border-radius:3px;pointer-events:none;opacity:0;z-index:10073;background:linear-gradient(90deg,#fff7d6,#ffd166 42%,#ff9f43);box-shadow:0 0 14px rgba(255,200,90,.95),0 0 30px rgba(255,150,60,.6);transform-origin:0 50%;';
    document.body.appendChild(chainCore);
    const chainHead = document.createElement('div');
    chainHead.style.cssText = 'position:fixed;width:11px;height:11px;border-radius:50%;pointer-events:none;opacity:0;z-index:10074;background:radial-gradient(circle,#fff 0%,#ffe9a8 35%,rgba(255,170,60,0) 72%);';
    document.body.appendChild(chainHead);

    const chainSet = (p) => {
        const ra = twGH.g.el.getBoundingClientRect(), rb = tgtGH.g.el.getBoundingClientRect();
        const pa = edgeOf(ra, rb.left + rb.width/2, rb.top + rb.height/2);
        const pb = edgeOf(rb, ra.left + ra.width/2, ra.top + ra.height/2);
        const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy) || 1;
        const ang = Math.atan2(dy, dx) * 180 / Math.PI;
        const sc = Math.max(0.0001, p);
        [[chainGlow, 12], [chainCore, 5]].forEach(([el, h]) => {
            el.style.left = pa.x + 'px'; el.style.top = (pa.y - h / 2) + 'px';
            el.style.width = len + 'px';
            el.style.transform = `rotate(${ang}deg) scaleX(${sc})`;
        });
        chainHead.style.left = (pb.x - 5.5) + 'px'; chainHead.style.top = (pb.y - 5.5) + 'px';
    };

    if (twGH && tgtGH) {
        await clock.animateReal(T(240), (p) => {
            chainSet(p); chainGlow.style.opacity = String(0.9 * p); chainCore.style.opacity = String(p); chainHead.style.opacity = String(p);
        });
    }

    const twFrom = twGH.g.from, twTo = twGH.toRect;
    const tgtFrom = tgtGH.g.from, tgtTo = tgtGH.toRect;

    await clock.animateReal(T(620), (p) => {
        if (twFrom && twTo) {
            const dx = twTo.left - twFrom.left, dy = twTo.top - twFrom.top;
            const dist = Math.hypot(dx, dy) || 1;
            const ux = dx / dist, uy = dy / dist;
            const ovMax = Math.min(16, dist * 0.22);
            const easeOut = (q) => 1 - Math.pow(1 - q, 3);
            let e, ov;
            if (p < 0.68) { const q = p / 0.68; e = easeOut(q); ov = ovMax * easeOut(q); }
            else { const q = (p - 0.68) / 0.32; e = 1; ov = ovMax * (1 - easeOut(q)); }
            const x = dx * e + ux * ov, y = dy * e + uy * ov;
            twGH.g.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
            afterImgs.forEach((im, i) => {
                const k = (i + 1) * 6 * Math.min(1, e * 3);
                im.style.transform = `translate(${(x - ux * k).toFixed(1)}px,${(y - uy * k).toFixed(1)}px)`;
                im.style.opacity = String((0.26 / (i + 1)) * Math.min(1, e * 2.6));
            });
        }
        if (tgtFrom && tgtTo) {
            const q = Math.max(0, (p - 0.16) / 0.84);
            const e2 = 1 - Math.pow(1 - q, 3);
            tgtGH.g.el.style.transform = `translate(${((tgtTo.left - tgtFrom.left) * e2).toFixed(1)}px,${((tgtTo.top - tgtFrom.top) * e2).toFixed(1)}px)`;
        }
        chainSet(1);
    });

    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:10080;pointer-events:none;opacity:0;';
    document.body.appendChild(flash);
    await clock.animateReal(T(400), (p) => {
        flash.style.opacity = p < 0.35 ? String(0.75 * (p / 0.35)) : String(Math.max(0, 0.75 * (1 - (p - 0.35) / 0.65)));
    });

    if (twGH && twGH.toRect) { impactRing(twGH.toRect, 'rgba(255,209,102,0.95)'); sparkBurstAt(twGH.toRect.cx, twGH.toRect.cy, '#ffd166', 12); }
    if (tgtGH && tgtGH.toRect) { impactRing(tgtGH.toRect, 'rgba(255,120,80,0.95)'); sparkBurstAt(tgtGH.toRect.cx, tgtGH.toRect.cy, '#ff6b3d', 10); }
    screenShake();
    chainGlow.style.opacity = '0'; chainCore.style.opacity = '0'; chainHead.style.opacity = '0';

    const hits = dash.hits || [];
    hits.forEach((h, i) => {
        if (!(h.dmg > 0) || h.uid == null) return;
        setTimeout(() => {
            const el = document.querySelector(`[data-uid="${h.uid}"]`);
            const r = el ? el.getBoundingClientRect() : null;
            if (!r) return;
            const d = document.createElement('div');
            d.textContent = '−' + h.dmg;
            d.style.cssText = `position:fixed;left:${r.left + r.width/2}px;top:${r.top + r.height*0.18}px;transform:translate(-50%,0);font-size:32px;font-weight:900;color:#ffe9a8;text-shadow:0 0 12px rgba(255,200,80,0.95);z-index:10085;pointer-events:none;opacity:0;`;
            document.body.appendChild(d);
            clock.animateReal(T(900), (p) => {
                d.style.opacity = p < 0.12 ? String(p/0.12) : String(1 - (p-0.12)/0.88);
                d.style.transform = `translate(-50%,${(-46 * (1 - Math.pow(1 - p, 2.2))).toFixed(1)}px) scale(${(1 + 0.2 * (1 - Math.abs(2*p-1))).toFixed(2)})`;
            }).then(() => d.remove());
        }, T(120 + i * 90));
    });
    await wait(T(900));

    await clock.animateReal(T(400), (p) => { mask.style.opacity = String(0.34 * (1 - p)); });
    if (skipBtn.parentNode) skipBtn.remove();
    
    const twEl = twGH.g.el;
    const tgtEl = tgtGH.g.el;
    if (twEl && tgtEl) await performFinishingPunch(twEl, tgtEl, T);

    [mask, chainGlow, chainCore, chainHead, flash].forEach(e => e.remove());
    afterImgs.forEach(e => e.remove());
    ghosts.forEach(g => g.g.el.remove());
}

async function showTangWenLiangDash(dash) {
    let moves = dash.moves.filter(m => m.from !== m.to);
    const ghosts = [];
    for (const m of moves) {
        const g = makeGhost(m.camp, m.from, m.to, m.isDash ? 70 : 50, m.uid);
        if (g) ghosts.push({ ...m, g, toRect: rectOf(m.camp, m.to) });
    }

    const twG = ghosts.find(x => x.isDash);
    const tgG = ghosts.find(x => !x.isDash);

    await clock.animateReal(560, (p) => {
        const e = 1 - Math.pow(1 - p, 3);
        for (const gh of ghosts) {
            const t = gh.toRect; if (!t) continue;
            const f = gh.g.from;
            const dx = t.left - f.left, dy = t.top - f.top;
            let x = f.left + dx * e, y = f.top + dy * e;
            if (gh.isDash && (dx || dy)) {
                const d = Math.hypot(dx, dy) || 1;
                const ov = Math.min(14, d * 0.2);
                const off = p < 0.68 ? ov * (1 - Math.pow(1 - p / 0.68, 3)) : ov * (1 - (1 - Math.pow(1 - (p - 0.68) / 0.32, 3)));
                x += (dx / d) * off; y += (dy / d) * off;
            }
            gh.g.el.style.left = x.toFixed(1) + 'px';
            gh.g.el.style.top = y.toFixed(1) + 'px';
        }
    });

    const land = twG.toRect;
    if (land) { impactRing(land, '#ffd166'); sparkBurstAt(land.cx, land.cy, '#ffd166', 12); screenShake(); }
    if (tgG && tgG.toRect) impactRing(tgG.toRect, '#ff6b6b');
    
    if (twG && twG.g.el && tgG && tgG.g.el) await performFinishingPunch(twG.g.el, tgG.g.el, (v) => v);

    await clock.animateReal(160, (p) => { ghosts.forEach(g => g.g.el.style.opacity = String(1 - p)); });
    ghosts.forEach(g => g.g.el.remove());
}
