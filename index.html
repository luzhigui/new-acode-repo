    <script>
    window.addEventListener('error', function(e) {
        var panel = document.getElementById('errorCapturePanel') || (function(){
            var p = document.createElement('div');
            p.id = 'errorCapturePanel';
            p.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:25vh;overflow-y:auto;background:rgba(20,0,0,0.92);color:#f88;font-size:10px;z-index:99999;padding:4px 8px;font-family:monospace;display:none;';
            document.body.appendChild(p);
            return p;
        })();
        panel.style.display = 'block';
        var line = document.createElement('div');
        line.style.marginBottom = '4px';
        line.textContent = '[模块加载错误] ' + (e.message || e.filename || '未知错误');
        panel.appendChild(line);
    });
    window.addEventListener('unhandledrejection', function(e) {
        var panel = document.getElementById('errorCapturePanel');
        if (panel) {
            panel.style.display = 'block';
            var line = document.createElement('div');
            line.style.marginBottom = '4px';
            line.textContent = '[Promise错误] ' + String(e.reason);
            panel.appendChild(line);
        }
    });
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        /* 2026-09-20 宽屏留黑：html 涂纯黑当影院底色，body 限宽 520px 居中当"手机柱"——

           520 比 .team-row 的 max-width:500px 略宽，格子两侧各留 2px 呼吸位。 */
        :root{
          --c-gold:#b8860b;
          --c-gold-bright:#ffd700;
          --c-gold-orange:#ffaa00;
          --c-brown:#5c4033;
          --c-brown-border:#8b7355;

          --c-green:#2e7d32;
          --c-dark:#1a1a2e;

        html { background: #000; }

        /* 2026-09-20 夸克兼容：dvh 是 2022 年底的新单位，夸克等国产浏览器内核老不认识 → 所有高度声明作废，
           页面塌成"内容挤在顶上、下方全空、日志区压扁"。修法=每处 dvh 前面先垫一行 vh 老单位兜底：
           老浏览器认 vh 不认 dvh（用兜底），新浏览器两行都认（后者覆盖，行为不变）。 */

        h2 { color: var(--c-gold); font-size: 0.85rem; letter-spacing: -0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; }
        .score-badge { color: var(--c-gold); font-weight: bold; font-size: 0.95rem; margin-left: 2px; position: relative; white-space: nowrap; }
        .score-float { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); font-size: 1.3rem; font-weight: bold; color: var(--c-gold-bright); text-shadow: 0 0 8px rgba(255,215,0,0.8); animation: scoreFlash 3.5s ease-out forwards; pointer-events: none; white-space: nowrap; margin-left: 4px; }
        @keyframes scoreFlash { 0%{ opacity:0; transform:translateY(-50%) translateX(-8px) scale(0.6); } 10%{ opacity:1; transform:translateY(-50%) translateX(0) scale(1.5); } 25%{ transform:translateY(-50%) translateX(0) scale(1); } 65%{ opacity:1; } 100%{ opacity:0; transform:translateY(-50%) translateX(6px) scale(1.1); } }
        .debug-toggle-btn { background: #9b59b6; border: 1px solid #7d3c98; padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; color: white; height: 26px; white-space: nowrap; }
        .debug-toggle-btn.active { background: #7d3c98; }
        .upper-area { flex: 0 0 52vh; flex: 0 0 52dvh; display: flex; flex-direction: column; overflow: hidden; }
        .battlefield { flex: 0 0 42.5vh; flex: 0 0 42.5dvh; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; padding-top: 6px; position: relative; }
        /* 联网从机执六大派：战场纵向翻转，自己队伍显示在下方（column-reverse 只改视觉，不动 DOM 顺序与事件绑定） */
        #battlefield.guest-view { flex-direction: column-reverse; justify-content: flex-end; }
        .team-row { display: flex; align-items: center; gap: 4px; flex: 1; max-width: 500px; margin: 0 auto; width: 100%; }

        .team-label { writing-mode: vertical-lr; font-weight: bold; font-size: 13px; width: 18px; text-align: center; }

        .camp-side { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 18px; flex-shrink: 0; }

        .cell.ready { background: #d4edda; border-color: #28a745; }
        .cell.acted { background: #e2e3e5; border-color: #aaa; }

        .cell.adjust-selected { border-color: var(--c-gold-bright); box-shadow: 0 0 10px var(--c-gold-bright); }
        .cell.cell-blocked { animation: blockedFlash 0.5s ease-in-out 2; }
        @keyframes blockedFlash { 0%, 100% { border-color: var(--c-gold-bright); } 50% { border-color: #ff4444; } }

        .cell.cell-protected { animation: protectedFlash 0.6s ease-in-out 2; }

        .cell-cheer { border-color: var(--c-gold-bright) !important; box-shadow: 0 0 12px var(--c-gold-bright); animation: cheerBounce 0.3s ease-in-out infinite; }
        .cell[data-flash="attack"] { background: var(--c-ming-blue) !important; border-color: #0d4f8b !important; box-shadow: 0 0 20px var(--c-ming-blue); z-index: 999 !important; transform: scale(1.1); }

        /* 金刚不坏护罩（空见）：淡金色半透明罩子扣在格子上，数据源 unit.state._immuneShield */
        .cell.has-immune-shield::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 9px;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at 50% 28%,
                rgba(255,246,210,0.30) 0%,
                rgba(255,226,140,0.16) 46%,
                rgba(255,196,70,0.06) 100%);
            border: 1.5px solid rgba(255,214,102,0.78);
            box-shadow:
                inset 0 1px 6px rgba(255,248,220,0.55),
                inset 0 -6px 10px rgba(255,190,60,0.22),
                0 0 9px rgba(255,200,80,0.42);
            animation: immuneShieldBreath 2.6s ease-in-out infinite;
        }
        /* 罩子顶面高光：倒扣感 */
        .cell.has-immune-shield::before {
            content: '';
            position: absolute;
            left: 14%; right: 14%; top: -1px;
            height: 44%;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            pointer-events: none;
            z-index: 4;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.42) 0%,
                rgba(255,255,255,0.10) 62%,
                rgba(255,255,255,0) 100%);
        }
        @keyframes immuneShieldBreath {
            0%, 100% { opacity: 0.86; }
            50%      { opacity: 1; }
        }
        /* 碎裂：撞上瞬间罩子放大淡出 */
        .cell.immune-shield-breaking::after {
            animation: immuneShieldBreak 320ms cubic-bezier(0.3, 0.8, 0.4, 1) forwards;

        @keyframes immuneShieldBreak {

            100% { opacity: 0; transform: scale(1.22); }
