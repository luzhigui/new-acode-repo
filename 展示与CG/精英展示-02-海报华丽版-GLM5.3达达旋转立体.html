  z-index:5;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#hint.show{opacity:1}

<body>
<div id="bg"></div>
<div id="stars"></div>
<div id="halo"></div>

<div id="title">
  <div class="main">明 教 四 杰 · 张 无 忌</div>
  <div class="sub">拖动旋转视角</div>
</div>

<div id="stage">
  <div id="shadow"></div>
  <div id="heroBox">
    <div class="slice sL" id="sl"></div>
    <div class="slice sC" id="sc"></div>
    <div class="slice sR" id="sr"></div>
  </div>
</div>
<div id="angleTag">左 侧</div>

<button class="arrow" id="arrowL">‹</button>
<button class="arrow" id="arrowR">›</button>

<div id="info">
  <div class="card" id="card">
    <div class="name-row">
      <span class="name">张无忌</span>
      <div class="tags">
        <span class="tag">明教</span><span class="tag gold">远程</span><span class="tag gold">精英</span>
      </div>
    </div>
    <div class="quote">「少林武当，也不过如此。」</div>
    <div class="skills">
      <div class="skill"><span class="icon">☀️</span><div><div class="sname">九阳神功</div><div class="sdesc">每次攻击后回复最大生命 8%</div></div></div>
      <div class="skill"><span class="icon">✨</span><div><div class="sname">乾坤大挪移</div><div class="sdesc">保护 4/6 号位队友，减伤 10% 并反弹 10% 伤害</div></div></div>
      <div class="skill"><span class="icon">⚔️</span><div><div class="sname">近战切换</div><div class="sdesc">前排无友军时切换近战形态，攻防血大幅提升</div></div></div>
      <div class="skill"><span class="icon">🔥</span><div><div class="sname">融会贯通</div><div class="sdesc">近战 3 次后激活，附加目标攻防差 50% 的额外伤害</div></div></div>
    </div>
  </div>
</div>

<div id="hint">← 按住拖动 · 旋转视角 →</div>

<script>
/* 三档视角：左(-1) 正(0) 右(+1)，rotY 连续值 [-1,1] 控制交叉淡化 */
let rotY = 0, target = 0, dragging = false, startX = 0, startRot = 0;
const sl = document.getElementById('sl');
const sc = document.getElementById('sc');
const sr = document.getElementById('sr');
const stage = document.getElementById('stage');
const tag = document.getElementById('angleTag');
const heroBox = document.getElementById('heroBox');
const TAGS = ['左 侧','正 面','右 侧'];

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function frame(){
  rotY += (target - rotY) * 0.14;

  /* 交叉淡化：中心图恒定，两侧图按角度淡入，形成"转动"错觉 */
  const l = clamp(-rotY * 1.6 - 0.18, 0, 1);
  const r = clamp( rotY * 1.6 - 0.18, 0, 1);
  sl.style.opacity = l.toFixed(3);
  sr.style.opacity = r.toFixed(3);
  sc.style.opacity = (1 - Math.max(l, r) * 0.85).toFixed(3);

  /* 转动错觉增强：轻微透视 + 亮度（侧脸档略暗） */
  const skew = rotY * 4;
  heroBox.style.transform = `perspective(900px) rotateY(${(rotY*8).toFixed(2)}deg)`;
  heroBox.style.filter = `brightness(${(1 - Math.abs(rotY)*0.08).toFixed(3)})`;

  const idx = rotY < -0.4 ? 0 : rotY > 0.4 ? 2 : 1;
  if (tag.textContent !== TAGS[idx]) tag.textContent = TAGS[idx];

  requestAnimationFrame(frame);
}
frame();

stage.addEventListener('pointerdown', e => {
  dragging = true; startX = e.clientX; startRot = rotY;
  stage.setPointerCapture(e.pointerId);
  document.getElementById('hint').classList.remove('show');
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  target = clamp(startRot + (e.clientX - startX) / 150, -1, 1);
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  /* 松手吸附到最近档位 */
  target = rotY < -0.33 ? -1 : rotY > 0.33 ? 1 : 0;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* 箭头：档位切换 */
function step(d){
  const cur = target < -0.33 ? -1 : target > 0.33 ? 1 : 0;
  target = clamp(cur + d, -1, 1);
}
document.getElementById('arrowL').addEventListener('click', () => step(-1));
document.getElementById('arrowR').addEventListener('click', () => step(1));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

/* 星空 */
const sb = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.setProperty('--o',(0.05+Math.random()*0.18).toFixed(2));
  s.style.setProperty('--t',(2.5+Math.random()*4).toFixed(1)+'s');
  s.style.animationDelay = (-Math.random()*6).toFixed(1)+'s';
  sb.appendChild(s);
}

document.getElementById('hint').classList.add('show');
setTimeout(()=>document.getElementById('hint').classList.remove('show'),3200);
</script>
</body>
