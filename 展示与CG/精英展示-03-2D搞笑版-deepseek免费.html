<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>明教四杰 · 立绘图鉴</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:'LXGW WenKai','KaiTi','STKaiti',sans-serif;color:#c8d0e0;user-select:none;-webkit-tap-highlight-color:transparent}

/* 背景星空 */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,#141e36 0%,#0a0e1c 40%,#05070d 100%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#cdd8f0;
  animation:twinkle var(--t,4s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:var(--o,.1)}50%{opacity:calc(var(--o,.1) * 2.5)}}

/* 标题 */
#title{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:10;pointer-events:none}
#title .main{font-size:clamp(13px,3vmin,17px);letter-spacing:.75em;text-indent:.75em;color:rgba(200,168,100,.55)}
#title .sub{font-size:clamp(9px,2vmin,11px);letter-spacing:.4em;text-indent:.4em;color:rgba(200,168,100,.28);margin-top:.5em}

/* 舞台：3D圆柱旋转 */
#stage{position:fixed;top:0;left:0;right:0;height:62vh;
  perspective:1400px;perspective-origin:50% 45%;
  z-index:2;cursor:grab;touch-action:pan-y}
#stage:active{cursor:grabbing}
#pivot{position:absolute;left:50%;bottom:0;width:0;height:0;
  transform-style:preserve-3d;
  transition:transform .15s linear}

/* 每个角色一层，独立旋转 */
.layer{position:absolute;left:0;bottom:0;transform-style:preserve-3d;
  transform-origin:50% 100%;
  transition:opacity .5s ease, transform .6s cubic-bezier(.22,.8,.36,1);
  opacity:0;pointer-events:none}
.layer.active{opacity:1;pointer-events:auto}

/* 角色各层景深 */
.depth-back{transform:translateZ(-60px)}
.depth-mid{transform:translateZ(0px)}
.depth-front{transform:translateZ(60px)}

/* 光晕 */
#halo{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);
  width:80vmin;height:80vmin;border-radius:50%;
  background:radial-gradient(circle,var(--halo-c,rgba(120,180,255,.35)) 0%,transparent 55%);
  z-index:1;pointer-events:none;filter:blur(20px);
  animation:haloPulse 5s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}}

/* 立绘 SVG */
.portrait{display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}

/* 箭头 */
.arrow{position:fixed;top:30%;transform:translateY(-50%);z-index:20;
  width:clamp(42px,8vmin,58px);height:clamp(42px,8vmin,58px);border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:rgba(255,255,255,.8);font-size:clamp(20px,4vmin,28px);
  font-family:inherit;transition:.25s;backdrop-filter:blur(6px)}
.arrow:hover{background:rgba(255,255,255,.1);border-color:rgba(255,200,120,.6);color:#ffc266}
.arrow:active{transform:translateY(-50%) scale(.92)}
#arrowL{left:max(12px,env(safe-area-inset-left,0px))}
#arrowR{right:max(12px,env(safe-area-inset-right,0px))}

/* 底部信息卡 */
#info{position:fixed;left:0;right:0;bottom:0;z-index:15;
  padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.card{max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(10,14,24,.88),rgba(6,9,16,.96));
  border:1px solid rgba(200,168,100,.22);border-radius:14px;
  padding:14px 18px 12px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 -6px 30px rgba(0,0,0,.7);
  pointer-events:auto;transition:opacity .35s ease, transform .35s ease}
.card.switching{opacity:0;transform:translateY(14px)}

.name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.name{font-size:clamp(18px,4.5vmin,26px);font-weight:700;letter-spacing:.18em;line-height:1;transition:color .3s}
.name.zw{color:#8cc0ff;text-shadow:0 0 16px rgba(140,192,255,.55)}
.name.wy{color:#c09aff;text-shadow:0 0 16px rgba(192,154,255,.55)}
.name.xz{color:#ff9ade;text-shadow:0 0 16px rgba(255,154,222,.55)}
.name.xm{color:#ff6a8a;text-shadow:0 0 16px rgba(255,106,138,.55)}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:clamp(9px,1.8vmin,11px);padding:2px 8px;border-radius:10px;letter-spacing:.14em;border:1px solid}
.tag.blue{color:#8cc0ff;border-color:rgba(140,192,255,.4);background:rgba(140,192,255,.08)}
.tag.purple{color:#c09aff;border-color:rgba(192,154,255,.4);background:rgba(192,154,255,.08)}
.tag.pink{color:#ff9ade;border-color:rgba(255,154,222,.4);background:rgba(255,154,222,.08)}
.tag.red{color:#ff6a8a;border-color:rgba(255,106,138,.4);background:rgba(255,106,138,.08)}
.tag.gold{color:#e8c27a;border-color:rgba(232,194,122,.4);background:rgba(232,194,122,.08)}

.quote{font-size:clamp(11px,2.4vmin,13px);color:rgba(216,207,192,.55);letter-spacing:.06em;
  margin:6px 0 10px;font-style:italic;line-height:1.5;
  border-left:2px solid rgba(200,168,100,.3);padding-left:10px}

.skills{display:flex;flex-direction:column;gap:6px;max-height:22vh;overflow-y:auto;padding-right:4px}
.skills::-webkit-scrollbar{width:4px}
.skills::-webkit-scrollbar-thumb{background:rgba(200,168,100,.3);border-radius:2px}
.skill{display:flex;gap:10px;align-items:flex-start;font-size:clamp(11px,2.3vmin,13px);line-height:1.5}
.skill .icon{flex-shrink:0;width:1.6em;text-align:center;font-size:clamp(13px,2.6vmin,16px)}
.skill .body{flex:1;min-width:0}
.skill .sname{color:#e8c27a;font-weight:600;letter-spacing:.08em}
.skill .sdesc{color:rgba(216,207,192,.72);font-size:clamp(10px,2.1vmin,12px);margin-top:1px}

.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s;cursor:pointer;pointer-events:auto}
.dot.active{background:#ffc266;box-shadow:0 0 8px rgba(255,194,102,.7);transform:scale(1.3)}

#hint{position:fixed;top:58%;left:50%;transform:translateX(-50%);
  font-size:clamp(10px,1.9vmin,12px);color:rgba(255,255,255,.35);letter-spacing:.3em;
  z-index:5;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#hint.show{opacity:1}
</style>
</head>
<body>

<div id="bg"></div>
<div id="stars"></div>
<div id="halo"></div>

<div id="title">
  <div class="main">明 教 四 杰</div>
  <div class="sub">拖动旋转 · 左右切换</div>
</div>

<div id="stage">
  <div id="pivot"></div>
</div>

<button class="arrow" id="arrowL">‹</button>
<button class="arrow" id="arrowR">›</button>

<div id="info">

    <div class="name-row">

/* ==================== 场景初始化 ==================== */
const pivot = document.getElementById('pivot');
const stage = document.getElementById('stage');
const halo = document.getElementById('halo');

/* 生成星空 */
const starsBox = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.setProperty('--o', (0.05 + Math.random() * 0.2).toFixed(2));
  s.style.setProperty('--t', (2.5 + Math.random() * 4).toFixed(1) + 's');
  s.style.animationDelay = (-Math.random() * 6).toFixed(1) + 's';
  s.style.transform = 'scale(' + (0.6 + Math.random() * 1.2).toFixed(2) + ')';
  starsBox.appendChild(s);
}

/* 生成每层立绘 */
HEROES.forEach((h, i) => {
  const layer = document.createElement('div');
  layer.className = 'layer' + (i === 0 ? ' active' : '');
  layer.dataset.key = h.key;

  /* 三层景深包装 */
  const wrap = document.createElement('div');
  wrap.style.position = 'absolute';
  wrap.style.left = '50%';
  wrap.style.bottom = '0';
  wrap.style.width = 'min(78vmin, 460px)';
  wrap.style.height = 'min(78vmin, 460px)';
  wrap.style.transform = 'translateX(-50%)';
  wrap.style.transformStyle = 'preserve-3d';
  wrap.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center">${h.portrait()}</div>`;

  layer.appendChild(wrap);
  pivot.appendChild(layer);
  h.el = layer;
});

/* ==================== 3D 旋转控制 ==================== */
let rotY = 0;
let targetRotY = 0;
let dragging = false;
let startX = 0;
let startRot = 0;

function applyRotation() {
  /* 立绘围绕 Y 轴旋转，范围 ±28 度 */
  const maxRot = 28;
  const r = Math.max(-maxRot, Math.min(maxRot, rotY));

  /* 分层视差：中间层旋转少，前后层旋转多 */
  const layers = document.querySelectorAll('.layer.active');
  layers.forEach(layer => {
    const back = layer.querySelector('.depth-back');
    const mid = layer.querySelector('.depth-mid');
    const front = layer.querySelector('.depth-front');
    /* 未使用深度分层，改为整体旋转 + 光晕跟随 */
    layer.style.transform = `rotateY(${r}deg)`;
  });
}

stage.addEventListener('pointerdown', e => {
  dragging = true;
  startX = e.clientX;
  startRot = rotY;
  stage.setPointerCapture(e.pointerId);
  document.getElementById('hint').classList.remove('show');
});

stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  /* 拖动 200px 转 30 度 */
  targetRotY = startRot + dx * 0.15;
  targetRotY = Math.max(-28, Math.min(28, targetRotY));
});

stage.addEventListener('pointerup', () => {
  dragging = false;
  /* 松手回到正面（弹回） */
  setTimeout(() => {
    if (!dragging) targetRotY = 0;
  }, 300);
});

stage.addEventListener('pointercancel', () => {
  dragging = false;
});

/* 主循环：平滑旋转 */
function loop() {
  rotY += (targetRotY - rotY) * 0.12;
  applyRotation();
  requestAnimationFrame(loop);
}
loop();

/* ==================== 切换角色 ==================== */
let currentIndex = 0;
let switching = false;

const nameEl = document.getElementById('heroName');
const tagsEl = document.getElementById('heroTags');
const quoteEl = document.getElementById('heroQuote');
const skillsEl = document.getElementById('heroSkills');
const dotsEl = document.getElementById('dots');
const cardEl = document.getElementById('card');

HEROES.forEach((h, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => { if (!switching && i !== currentIndex) switchTo(i); });
  dotsEl.appendChild(d);
});

function renderInfo(idx) {
  const h = HEROES[idx];
  nameEl.textContent = h.name;
  nameEl.className = 'name ' + h.key;
  tagsEl.innerHTML = h.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('');
  quoteEl.textContent = h.quote;
  skillsEl.innerHTML = h.skills.map(s =>
    `<div class="skill"><span class="icon">${s.icon}</span><div class="body"><div class="sname">${s.name}</div><div class="sdesc">${s.desc}</div></div></div>`
  ).join('');
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === idx));

  /* 光晕颜色跟随 */
  halo.style.setProperty('--halo-c', h.halo);
}

function switchTo(idx) {
  if (switching || idx === currentIndex) return;
  switching = true;
  cardEl.classList.add('switching');

  const oldLayer = HEROES[currentIndex].el;
  const newLayer = HEROES[idx].el;

  /* 旧层淡出 + 缩小 */
  oldLayer.classList.remove('active');

  /* 新层淡入 + 从下方升起 */
  newLayer.style.opacity = '0';
  newLayer.style.transform = 'translateY(40px) rotateY(0deg) scale(.85)';
  requestAnimationFrame(() => {
    newLayer.classList.add('active');
    requestAnimationFrame(() => {
      newLayer.style.opacity = '1';
      newLayer.style.transform = 'translateY(0) rotateY(0deg) scale(1)';
    });
  });

  targetRotY = 0;
  rotY = 0;

  setTimeout(() => {
    currentIndex = idx;
    renderInfo(idx);
    cardEl.classList.remove('switching');
    setTimeout(() => { switching = false; }, 400);
  }, 420);
}

document.getElementById('arrowL').addEventListener('click', () => {
  switchTo((currentIndex - 1 + HEROES.length) % HEROES.length);
});
document.getElementById('arrowR').addEventListener('click', () => {
  switchTo((currentIndex + 1) % HEROES.length);
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') document.getElementById('arrowL').click();
  else if (e.key === 'ArrowRight') document.getElementById('arrowR').click();
});

/* 初始渲染 */
renderInfo(0);
document.getElementById('hint').classList.add('show');
setTimeout(() => document.getElementById('hint').classList.remove('show'), 3000);
</script>
