<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>明教四杰 · 立绘图鉴（AI立绘版）</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;
  font-family:'LXGW WenKai','KaiTi','STKaiti',sans-serif;color:#c8d0e0;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* 背景 */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 22%,#16203a 0%,#0a0f1e 45%,#05070d 100%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#d5def0;
  animation:twinkle var(--t,4s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:var(--o,.1)}50%{opacity:calc(var(--o,.1) * 2.4)}}

/* 背景光晕（跟随角色主色） */
#halo{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
  width:86vmin;height:86vmin;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,var(--halo-c,rgba(120,170,255,.30)) 0%,transparent 58%);
  filter:blur(24px);animation:haloPulse 5.5s ease-in-out infinite;transition:background 1s}
@keyframes haloPulse{0%,100%{opacity:.5}50%{opacity:.85}}

#title{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;
  text-align:center;z-index:10;pointer-events:none}
#title .main{font-size:clamp(13px,3vmin,17px);letter-spacing:.75em;text-indent:.75em;color:rgba(212,178,105,.6)}
#title .sub{font-size:clamp(9px,2vmin,11px);letter-spacing:.4em;text-indent:.4em;color:rgba(212,178,105,.3);margin-top:.5em}

/* 人物舞台（轻视差，不再旋转） */
#stage{position:fixed;inset:0;z-index:2;touch-action:pan-y}
#heroBox{position:absolute;left:50%;top:0;width:min(80vmin,560px);height:100%;
  transform:translateX(-50%)}
#heroBox img{width:100%;height:100%;object-fit:contain;object-position:center 30%;
  filter:drop-shadow(0 24px 50px rgba(0,0,0,.75));
  animation:heroIn .9s cubic-bezier(.2,.8,.3,1) both, heroFloat 5.5s ease-in-out 1s infinite}
@keyframes heroIn{from{opacity:0;transform:translateY(46px) scale(.94);filter:blur(10px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* 地面投影 */
#shadow{position:fixed;left:50%;top:66%;transform:translateX(-50%);
  width:min(52vmin,380px);height:5vmin;border-radius:50%;z-index:1;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);
  animation:shadowPulse 5.5s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.6}
  50%{transform:translateX(-50%) scale(.88);opacity:.4}}

/* 箭头 */
.arrow{position:fixed;top:34%;transform:translateY(-50%);z-index:20;
  width:clamp(42px,8vmin,56px);height:clamp(42px,8vmin,56px);border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:rgba(255,255,255,.8);font-size:clamp(20px,4vmin,26px);
  font-family:inherit;transition:.25s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.arrow:hover{background:rgba(255,255,255,.1);border-color:rgba(220,185,110,.55);color:#e8c27a}
.arrow:active{transform:translateY(-50%) scale(.9)}
#arrowL{left:max(12px,env(safe-area-inset-left,0px))}
#arrowR{right:max(12px,env(safe-area-inset-right,0px))}

/* 信息卡 */
#info{position:fixed;left:0;right:0;bottom:0;z-index:15;
  padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.card{max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(10,14,24,.86),rgba(6,9,16,.95));
  border:1px solid rgba(210,175,105,.24);border-radius:14px;
  padding:14px 18px 12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 -6px 30px rgba(0,0,0,.7);
  pointer-events:auto;transition:opacity .32s ease,transform .32s ease}
.card.switching{opacity:0;transform:translateY(16px)}

.name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.name{font-size:clamp(18px,4.5vmin,26px);font-weight:700;letter-spacing:.18em;line-height:1}
.name.zw{color:#9ec7ff;text-shadow:0 0 16px rgba(140,190,255,.5)}
.name.wy{color:#c3a4ff;text-shadow:0 0 16px rgba(190,155,255,.5)}
.name.xz{color:#ffa2df;text-shadow:0 0 16px rgba(255,155,220,.5)}
.name.xm{color:#ff7391;text-shadow:0 0 16px rgba(255,110,140,.5)}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:clamp(9px,1.8vmin,11px);padding:2px 8px;border-radius:10px;letter-spacing:.14em;border:1px solid}
.tag.blue{color:#9ec7ff;border-color:rgba(140,190,255,.4);background:rgba(140,190,255,.08)}
.tag.purple{color:#c3a4ff;border-color:rgba(190,155,255,.4);background:rgba(190,155,255,.08)}
.tag.pink{color:#ffa2df;border-color:rgba(255,155,220,.4);background:rgba(255,155,220,.08)}
.tag.red{color:#ff7391;border-color:rgba(255,110,140,.4);background:rgba(255,110,140,.08)}
.tag.gold{color:#e8c27a;border-color:rgba(230,195,120,.4);background:rgba(230,195,120,.08)}

.quote{font-size:clamp(11px,2.4vmin,13px);color:rgba(216,207,192,.58);letter-spacing:.06em;
  margin:6px 0 10px;font-style:italic;line-height:1.5;
  border-left:2px solid rgba(210,175,105,.35);padding-left:10px}

.skills{display:flex;flex-direction:column;gap:6px;max-height:24vh;overflow-y:auto;padding-right:4px}
.skills::-webkit-scrollbar{width:4px}
.skills::-webkit-scrollbar-thumb{background:rgba(210,175,105,.3);border-radius:2px}
.skill{display:flex;gap:10px;align-items:flex-start;font-size:clamp(11px,2.3vmin,13px);line-height:1.5}
.skill .icon{flex-shrink:0;width:1.6em;text-align:center;font-size:clamp(13px,2.6vmin,16px)}
.skill .body{flex:1;min-width:0}
.skill .sname{color:#e8c27a;font-weight:600;letter-spacing:.08em}
.skill .sdesc{color:rgba(216,207,192,.72);font-size:clamp(10px,2.1vmin,12px);margin-top:1px}

.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s;cursor:pointer;pointer-events:auto}
.dot.active{background:#e8c27a;box-shadow:0 0 8px rgba(232,194,122,.7);transform:scale(1.3)}

#hint{position:fixed;top:56%;left:50%;transform:translateX(-50%);
  font-size:clamp(10px,1.9vmin,12px);color:rgba(255,255,255,.35);letter-spacing:.3em;
  z-index:5;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#hint.show{opacity:1}
</style>
</head>

/* ==================== 场景 ==================== */
const starsBox = document.getElementById('stars');
for (let i = 0; i < 50; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 60 + '%';
  s.style.setProperty('--o', (0.05 + Math.random() * 0.18).toFixed(2));
  s.style.setProperty('--t', (2.5 + Math.random() * 4).toFixed(1) + 's');
  s.style.animationDelay = (-Math.random() * 6).toFixed(1) + 's';
  starsBox.appendChild(s);
}

const heroBox = document.getElementById('heroBox');
const heroImg = document.getElementById('heroImg');
const nameEl = document.getElementById('heroName');
const tagsEl = document.getElementById('heroTags');
const quoteEl = document.getElementById('heroQuote');
const skillsEl = document.getElementById('heroSkills');
const dotsEl = document.getElementById('dots');
const cardEl = document.getElementById('card');
const haloEl = document.getElementById('halo');

HEROES.forEach((h, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => { if (!switching && i !== currentIndex) switchTo(i); });
  dotsEl.appendChild(d);
});

function renderInfo(idx) {
  const h = HEROES[idx];
  heroImg.src = h.img;
  heroImg.alt = h.name;
  heroImg.style.animation = 'none';
  void heroImg.offsetHeight;                 /* 重启进场动画 */
  heroImg.style.animation = '';
  nameEl.textContent = h.name;
  nameEl.className = 'name ' + h.key;
  tagsEl.innerHTML = h.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('');
  quoteEl.textContent = h.quote;
  skillsEl.innerHTML = h.skills.map(s =>
    `<div class="skill"><span class="icon">${s.icon}</span><div class="body"><div class="sname">${s.name}</div><div class="sdesc">${s.desc}</div></div></div>`
  ).join('');
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === idx));
  haloEl.style.setProperty('--halo-c', h.halo);
}

/* ==================== 切换 ==================== */
let currentIndex = 0, switching = false;

function switchTo(idx) {
  if (switching || idx === currentIndex) return;
  switching = true;
  cardEl.classList.add('switching');
  heroBox.style.transition = 'opacity .34s ease, transform .34s ease';
  heroBox.style.opacity = '0';
  heroBox.style.transform = 'translateX(-50%) translateY(26px) scale(.93)';
  setTimeout(() => {
    currentIndex = idx;
    renderInfo(idx);                          /* 换图并重启进场动画 */
    heroBox.style.transition = '';
    heroBox.style.opacity = '';
    heroBox.style.transform = '';
    cardEl.classList.remove('switching');
    setTimeout(() => { switching = false; }, 350);
  }, 350);
}

document.getElementById('arrowL').addEventListener('click', () => switchTo((currentIndex - 1 + HEROES.length) % HEROES.length));
document.getElementById('arrowR').addEventListener('click', () => switchTo((currentIndex + 1) % HEROES.length));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') document.getElementById('arrowL').click();
  else if (e.key === 'ArrowRight') document.getElementById('arrowR').click();
});

/* 轻视差：指针移动时人物与光晕反向微移（替代原3D旋转） */
window.addEventListener('pointermove', e => {
  if (switching) return;
  const nx = (e.clientX / window.innerWidth - .5);
  const ny = (e.clientY / window.innerHeight - .5);
  heroImg.style.translate = `${(-nx * 14).toFixed(1)}px ${(-ny * 8).toFixed(1)}px`;
  haloEl.style.translate = `${(nx * 22).toFixed(1)}px ${(ny * 10).toFixed(1)}px`;
});

renderInfo(0);
document.getElementById('hint').classList.add('show');
setTimeout(() => document.getElementById('hint').classList.remove('show'), 3000);
</script>
