name: Build APK

# 手动触发：Actions 页 → Run workflow
# 或 push 到 main 时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 复制游戏文件到 web/
        run: node scripts/prepare-web.mjs

      - name: 生成 App 图标
        run: |
          npm install sharp
          node scripts/make-icon.mjs

      - name: 安装 Capacitor
        run: |
          npm install

      - name: 添加安卓平台
        run: npx cap add android

      - name: 应用图标到安卓工程
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "resources/ic_launcher_${d}.png"  "$RES/mipmap-$d/ic_launcher.png"
            cp "resources/ic_launcher_round_${d}.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done
          # 移除 adaptive icon（方形完整显示，不裁切）
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "图标已应用"


      - name: 同步 web 资源
        run: npx cap sync android

      - name: 构建 APK
        run: cd android && ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: guangmingding5v5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
