name: Build APK

# 触发：仅手动，无 push 自动触发。
# 想打包时：仓库 Actions 页 → Build APK → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 复制游戏文件到 web/
        run: node scripts/prepare-web.mjs

      - name: 生成 App 图标
        run: |
          npm install sharp
          node scripts/make-icon.mjs

      - name: 安装 Capacitor
        run: |
          npm install

      - name: 添加安卓平台
        run: npx cap add android

      - name: 缓存调试签名 keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 生成调试签名（仅首次缓存未命中时）
        run: |
          set -e
          # 每次 fresh runner 的 debug keystore 都不同 → 签名不一致 → 无法覆盖安装。
          # 首次生成后由 actions/cache 缓存，之后每次复用同一 keystore，签名一致可覆盖。
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "已生成调试 keystore（将自动缓存）"
          else
            echo "复用缓存中的 keystore"
          fi

      - name: 应用图标到安卓工程
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "resources/ic_launcher_${d}.png"  "$RES/mipmap-$d/ic_launcher.png"
            cp "resources/ic_launcher_round_${d}.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done
          # 移除 adaptive icon（方形完整显示，不裁切）
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "图标已应用"


      - name: 同步 web 资源
        run: npx cap sync android

      - name: 写入递增版本号
        run: node scripts/set-version.mjs

      - name: 构建 APK
        run: cd android && ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: guangmingding5v5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
