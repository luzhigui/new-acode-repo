  .caption {

  .cap-state { font-size:11px; color:#484f58; }
  .cap-state.warn { color:#d29922; }

  .seg { display:flex; background:#161b22; border:1px solid #30363d; border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .seg button {

    font-size:13px; cursor:pointer; font-family:inherit;
  }
  .seg button.on { background:#21262d; color:#e6edf3; font-weight:600; }

  .play {
    width:100%; padding:15px 0; border:none; border-radius:12px;
    background:linear-gradient(135deg,#238636,#2ea043); color:#fff;
    font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .play:active { opacity:.75; }
  .play:disabled { opacity:.45; }
  .stop {
    width:100%; margin-top:8px; padding:11px 0; border:1px solid #f85149;
    border-radius:12px; background:none; color:#f85149; font-size:14px;
    cursor:pointer; font-family:inherit;
  }
  .stop:disabled { opacity:.3; }

  .progress { display:flex; gap:4px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:#21262d; border:1px solid #30363d; }
  .dot.done { background:#2ea043; border-color:#2ea043; }
  .dot.now { background:#79c0ff; border-color:#79c0ff; }

  .note { font-size:11px; color:#484f58; margin-top:16px; line-height:1.8; }
  .note b { color:#8b949e; }

  #loader {
    position:fixed; left:0; right:0; top:0; bottom:0; background:#0d1117;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:99; gap:14px; transition:opacity .3s;
  }
  #loader .ring {
    width:38px; height:38px; border-radius:50%;
    border:3px solid #21262d; border-top-color:#2ea043;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loader p { font-size:13px; color:#8b949e; }

const $ = id => document.getElementById(id);

/* ===== 战报原文渲染（每个步骤一块，重复行只显示一次） ===== */
const seen = new Set();
const logRows = []; // {el, keys}
for(const s of STEPS){
  for(const line of s.log){
    const key = line;
    if(seen.has(key)) continue;
    seen.add(key);
    const el = document.createElement('div');
    el.className = 'row';
    el.textContent = line;
    $('logbox').appendChild(el);
    logRows.push({ el, line });
  }
}
function highlight(lines){
  const set = new Set(lines);
  for(const r of logRows){
    r.el.className = 'row' + (set.has(r.line) ? ' hot' : '');
    if(set.has(r.line)) r.el.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}

/* ===== 进度点 ===== */
const prog = $('prog');
STEPS.forEach(()=>{ const d=document.createElement('div'); d.className='dot'; prog.appendChild(d); });
const dots = prog.children;

/* ===== Web Audio 引擎（云端模式） ===== */
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null;
const buffers = {};
async function initAudio(){
  if(!AC) throw new Error('no-webaudio');
  actx = new AC();
  const total = STEPS.length; let done = 0;
  for(const s of STEPS){
    const res = await fetch(EMBED[s.f]);
    const ab = await res.arrayBuffer();
    buffers[s.f] = await new Promise((ok,no)=>{
      const p = actx.decodeAudioData(ab, ok, no);
      if(p && p.then) p.then(ok).catch(no);
    });
    done++;
    $('loadTxt').textContent = '正在解码解说音频 ' + done + ' / ' + total;
  }
}
async function ensureRunning(){
  if(actx && actx.state === 'suspended'){ try{ await actx.resume(); }catch(e){} }
}

let token = 0;
let curSrc = null;
function stopAll(){
  token++;
  if(curSrc){ try{ curSrc.stop(); }catch(e){} curSrc = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ===== 播放主流程（两种模式共用骨架） ===== */
let mode = 'cloud';
function setUI(i, playing){
  const cap = $('cap'), st = $('st');
  if(i >= STEPS.length){
    cap.textContent = '—— 解说完毕，六大派获胜 ——';
    st.textContent = '';
    for(const d of dots) d.className = 'dot done';
    return;
  }
  cap.textContent = STEPS[i].cap;
  cap.style.color = mode === 'cloud' ? '#79c0ff' : '#3fb950';
  st.textContent = (mode === 'cloud' ? '☁️ 云端解说 · ' : '📱 手机朗读 · ') + (i+1) + ' / ' + STEPS.length;
  for(let k=0;k<dots.length;k++){
    dots[k].className = 'dot' + (k < i ? ' done' : k === i ? ' now' : '');
  }
  highlight(STEPS[i].log);
}

$('btnPlay').onclick = async () => {
  stopAll();
  const my = ++token;
  $('btnPlay').disabled = true; $('btnStop').disabled = false;
  if(mode === 'cloud'){
    await ensureRunning();
    for(let i=0; i<STEPS.length; i++){
      if(my !== token) return;
      setUI(i, true);
      await new Promise(res=>{
        const s = actx.createBufferSource();
        s.buffer = buffers[STEPS[i].f];
        s.connect(actx.destination);
        s.onended = res;
        curSrc = s;
        s.start();
      }).catch(()=>{});
      if(my !== token) return;
      await new Promise(r=>setTimeout(r, 500));
    }
    if(my === token){ setUI(STEPS.length, false); endPlayback(); }
  } else {
    // 手机朗读模式
    if(!('speechSynthesis' in window)){
      $('st').textContent = '❌ 此环境不支持语音合成';
      $('st').className = 'cap-state warn';
      endPlayback();
      return;
    }
    const vs = speechSynthesis.getVoices();
    const zh = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
    for(let i=0; i<STEPS.length; i++){
      if(my !== token) return;
      setUI(i, true);
      await new Promise(res=>{
        const u = new SpeechSynthesisUtterance(TEXTS[i]);
        if(zh) u.voice = zh;
        u.lang = 'zh-CN'; u.rate = 0.95;
        u.onend = res; u.onerror = res;
        speechSynthesis.speak(u);
      });
      if(my !== token) return;
      await new Promise(r=>setTimeout(r, 300));
    }
    if(my === token){ setUI(STEPS.length, false); endPlayback(); }
  }
};
function endPlayback(){
  $('btnPlay').disabled = false; $('btnStop').disabled = true;
}
$('btnStop').onclick = () => {
  stopAll();
  $('cap').textContent = '已停止';
  endPlayback();
};

/* ===== 模式切换 ===== */
$('segMode').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  stopAll();
  [...$('segMode').children].forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.m;
  if(mode === 'browser'){
    if('speechSynthesis' in window){
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => {
        const vs = speechSynthesis.getVoices();
        const zh = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang));
        $('st').textContent = zh ? '本机中文声音：' + zh.name : '未找到中文声音，可能读不出来';
        $('st').className = zh ? 'cap-state' : 'cap-state warn';
      };
      const vs = speechSynthesis.getVoices();
      const zh = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang));
      if(vs.length){
        $('st').textContent = zh ? '本机中文声音：' + zh.name : '未找到中文声音，可能读不出来';
        $('st').className = zh ? 'cap-state' : 'cap-state warn';
      } else {
        $('st').textContent = '声音列表为空——此环境可能不带朗读引擎';
        $('st').className = 'cap-state warn';
      }
    } else {
      $('st').textContent = '❌ 此环境不支持语音合成';
      $('st').className = 'cap-state warn';
    }
  } else {
    $('st').textContent = ''; $('st').className = 'cap-state';
  }
});

/* ===== 启动 ===== */
(async () => {
  try {
    await initAudio();
    const ld = $('loader');
    ld.style.opacity = '0';
    setTimeout(()=> ld.remove(), 350);
  } catch(e) {
    $('loadTxt').textContent = '音频解码失败：' + e.message + '（手机朗读模式不受影响）';
    setTimeout(()=>{ const l=$('loader'); if(l) l.remove(); }, 2500);
  }
})();
</script>
