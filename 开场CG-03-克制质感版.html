<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开场CG V2 - Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
  h1{font-size:18px;color:#c9a96e;letter-spacing:.3em;font-weight:400;}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  button{background:rgba(201,169,110,.1);color:#c9a96e;border:1px solid rgba(201,169,110,.3);padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;letter-spacing:.15em;transition:all .2s;}
  button:hover{background:rgba(201,169,110,.2);border-color:rgba(201,169,110,.5);}
  .info{color:#666;font-size:12px;}
  .stage{width:min(92vw,900px);aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;position:relative;border:1px solid #1a1a1a;box-shadow:0 20px 60px rgba(0,0,0,.6);}
</style>
</head>
<body>
  <h1>开 场 CG · V2</h1>
  <div class="btns">
    <button id="btnPlay">重新播放</button>
    <button id="btnAct1">第一幕</button>
    <button id="btnAct2">第二幕</button>
    <button id="btnAct3">第三幕</button>
  </div>
  <div class="info">点击画面 = 快进 / 下一幕 &nbsp;·&nbsp; 右上角跳过 = 结束</div>
  <div class="stage" id="stage"></div>

<script>
/* ============================================================
   开场CG V2 - 克制质感版
   核心意象：圣火 · 明暗 · 呼吸
   ============================================================ */

const ACTS = [
  {
    mood: 'dying',
    chapter: '第一幕 · 圣火将熄',
    lines: [
      { t: '元末乱世，正邪对峙。', gap: 1.0 },
      { t: '六大派合围光明顶，', gap: 1.2 },
      { t: '血战三日，十不存三。', gap: 1.4 },
      { t: '圣火将熄', big: true, gap: 2.0 }
    ]
  },
  {
    mood: 'ignite',
    chapter: '第二幕 · 临危受命',
    sigil: '明',
    lines: [
      { t: '危亡之际，', gap: 1.0 },
      { t: '你继任第三十四代教主——', gap: 1.4 },
      { t: '执圣火令，号令群雄。', gap: 1.6 },
      { t: '光明顶，永不陷落', big: true, fire: true, gap: 2.2 }
    ]
  },
  {
    mood: 'blaze',
    chapter: '第三幕 · 点将开战',
    lines: [
      { t: '战鼓已擂，山门在望。', gap: 1.0 },
      { t: '教主——', gap: 1.3 },
      { t: '点将布阵，', gap: 1.2 },
      { t: '让他们见识明教的怒火！', big: true, fire: true, gap: 2.0 }
    ]
  }
];

/* ============ 样式 ============ */
const CSS = `
#cgV2{position:absolute;inset:0;background:#050505;cursor:pointer;overflow:hidden;
  font-family:'LXGW WenKai','KaiTi','STKaiti','Noto Serif SC',serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#cgV2.fade-out{animation:v2FadeOut 1s ease forwards;pointer-events:none;}
@keyframes v2FadeOut{to{opacity:0;}}

/* ---- 远景山（极淡，营造纵深感） ---- */
.v2-mount-far{position:absolute;left:0;right:0;bottom:30%;height:25%;
  background:linear-gradient(to top,rgba(20,12,8,.9),transparent);
  clip-path:polygon(0 100%,0 60%,10% 75%,22% 48%,34% 70%,48% 38%,60% 65%,72% 45%,84% 68%,94% 52%,100% 72%,100% 100%);
  opacity:.7;z-index:2;}

/* ---- 近景山（深色剪影） ---- */
.v2-mount-near{position:absolute;left:0;right:0;bottom:0;height:38%;
  background:#0a0604;z-index:5;
  clip-path:polygon(0 100%,0 50%,8% 65%,18% 38%,30% 58%,44% 28%,58% 55%,70% 36%,82% 60%,92% 46%,100% 58%,100% 100%);}

/* ---- 圣火令底座（近景山前的石台） ---- */
.v2-altar{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:6;
  width:28vmin;height:6vmin;
  background:linear-gradient(to bottom,#1a1008,#0a0604);
  border-radius:4px;
  box-shadow:0 -2px 20px rgba(255,120,40,.1);}
.v2-altar::before{content:'';position:absolute;top:-4px;left:-8%;right:-8%;height:4px;
  background:linear-gradient(to right,transparent,#2a1a0c,transparent);border-radius:2px;}

/* ---- 火焰光晕（最外层） ---- */
.v2-fire-halo{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:4;
  width:80vmin;height:45vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 65%,rgba(255,100,30,.35),rgba(200,50,10,.15) 40%,transparent 70%);
  filter:blur(30px);}

/* ---- 火焰中层 ---- */
.v2-fire-mid{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);z-index:7;
  width:36vmin;height:24vmin;border-radius:50% 50% 40% 40%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 70%,rgba(255,180,60,.7),rgba(255,100,30,.5) 45%,transparent 75%);
  filter:blur(12px);}

/* ---- 火焰核心 ---- */
.v2-fire-core{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:8;
  width:18vmin;height:14vmin;border-radius:50% 50% 35% 35%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 65%,rgba(255,245,200,.95),rgba(255,180,80,.85) 40%,rgba(255,120,40,.6) 70%,transparent 90%);
  filter:blur(4px);}

/* ---- 火焰内焰（最亮） ---- */
.v2-fire-inner{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:9;
  width:8vmin;height:7vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,#fff8e0,rgba(255,220,140,.9) 50%,transparent 80%);
  filter:blur(2px);}

/* ---- 三态动画：将熄 / 燃起 / 旺盛 ---- */
/* dying: 微弱挣扎，偏暗红 */
#cgV2[data-mood="dying"] .v2-fire-halo{animation:v2HaloDying 4s ease-in-out infinite;opacity:.4;}
#cgV2[data-mood="dying"] .v2-fire-mid{animation:v2MidDying 3.2s ease-in-out infinite;opacity:.5;}
#cgV2[data-mood="dying"] .v2-fire-core{animation:v2CoreDying 2.5s ease-in-out infinite;opacity:.6;}
#cgV2[data-mood="dying"] .v2-fire-inner{animation:v2InnerDying 2s ease-in-out infinite;opacity:.7;}
@keyframes v2HaloDying{0%,100%{transform:translateX(-50%) scale(.85);opacity:.3;}25%{transform:translateX(-50%) scale(.95);opacity:.45;}50%{transform:translateX(-50%) scale(.8);opacity:.25;}75%{transform:translateX(-50%) scale(.92);opacity:.4;}}
@keyframes v2MidDying{0%,100%{transform:translateX(-50%) scale(.8);opacity:.4;}30%{transform:translateX(-50%) scale(.95);opacity:.6;}60%{transform:translateX(-50%) scale(.75);opacity:.35;}80%{transform:translateX(-50%) scale(.88);opacity:.55;}}
@keyframes v2CoreDying{0%,100%{transform:translateX(-50%) scale(.75);opacity:.5;}25%{transform:translateX(-50%) scale(.9);opacity:.7;}55%{transform:translateX(-50%) scale(.7);opacity:.45;}80%{transform:translateX(-50%) scale(.85);opacity:.65;}}
@keyframes v2InnerDying{0%,100%{transform:translateX(-50%) scale(.6);opacity:.4;}40%{transform:translateX(-50%) scale(.85);opacity:.8;}70%{transform:translateX(-50%) scale(.55);opacity:.35;}}

/* ignite: 从弱到强，稳定燃烧 */
#cgV2[data-mood="ignite"] .v2-fire-halo{animation:v2HaloIgnite 5s ease-in-out infinite;}
#cgV2[data-mood="ignite"] .v2-fire-mid{animation:v2MidIgnite 3.5s ease-in-out infinite;}
#cgV2[data-mood="ignite"] .v2-fire-core{animation:v2CoreIgnite 2.2s ease-in-out infinite;}
#cgV2[data-mood="ignite"] .v2-fire-inner{animation:v2InnerIgnite 1.6s ease-in-out infinite;}
@keyframes v2HaloIgnite{0%,100%{transform:translateX(-50%) scale(1);opacity:.6;}50%{transform:translateX(-50%) scale(1.08);opacity:.8;}}
@keyframes v2MidIgnite{0%,100%{transform:translateX(-50%) scale(1);opacity:.7;}50%{transform:translateX(-50%) scale(1.06);opacity:.85;}}
@keyframes v2CoreIgnite{0%,100%{transform:translateX(-50%) scale(1);opacity:.85;}50%{transform:translateX(-50%) scale(1.05);opacity:1;}}
@keyframes v2InnerIgnite{0%,100%{transform:translateX(-50%) scale(1);opacity:.8;}50%{transform:translateX(-50%) scale(1.1);opacity:1;}}

/* blaze: 旺盛狂暴，快速跳动 */
#cgV2[data-mood="blaze"] .v2-fire-halo{animation:v2HaloBlaze 1.8s ease-in-out infinite;}
#cgV2[data-mood="blaze"] .v2-fire-mid{animation:v2MidBlaze 1.2s ease-in-out infinite;}
#cgV2[data-mood="blaze"] .v2-fire-core{animation:v2CoreBlaze .8s ease-in-out infinite;}
#cgV2[data-mood="blaze"] .v2-fire-inner{animation:v2InnerBlaze .5s ease-in-out infinite;}
@keyframes v2HaloBlaze{0%,100%{transform:translateX(-50%) scale(1.1);opacity:.75;}50%{transform:translateX(-50%) scale(1.2);opacity:1;}}
@keyframes v2MidBlaze{0%,100%{transform:translateX(-50%) scale(1.05);opacity:.8;}50%{transform:translateX(-50%) scale(1.15);opacity:.95;}}
@keyframes v2CoreBlaze{0%,100%{transform:translateX(-50%) scale(1);opacity:.9;}50%{transform:translateX(-50%) scale(1.12);opacity:1;}}
@keyframes v2InnerBlaze{0%,100%{transform:translateX(-50%) scale(1);opacity:.85;}50%{transform:translateX(-50%) scale(1.2);opacity:1;}}

/* ---- 火星粒子 ---- */
.v2-sparks{position:absolute;inset:0;z-index:10;pointer-events:none;}
.v2-sparks i{position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--c,#ffb347);box-shadow:0 0 4px var(--c,#ffb347);
  opacity:0;animation:v2Spark var(--d,4s) ease-out infinite;
  animation-delay:var(--delay,0s);}
@keyframes v2Spark{
  0%{opacity:0;transform:translate(0,0) scale(1);}
  15%{opacity:1;}
  70%{opacity:.4;}
  100%{opacity:0;transform:translate(var(--x,0),var(--y,-60vh)) scale(.2);}}

/* 火星数量随 mood */
#cgV2[data-mood="dying"] .v2-sparks i{animation-play-state:paused;opacity:0;}
#cgV2[data-mood="dying"] .v2-sparks i:nth-child(-n+4){animation-play-state:running;}

/* ---- 烟雾/热气（模糊上升扰动） ---- */
.v2-heat{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);z-index:3;
  width:60vmin;height:80vmin;pointer-events:none;
  background:radial-gradient(ellipse at 50% 80%,rgba(255,150,80,.08),transparent 60%);
  filter:blur(20px);opacity:0;}
#cgV2[data-mood="ignite"] .v2-heat{animation:v2HeatRise 6s ease-in-out infinite;opacity:1;}
#cgV2[data-mood="blaze"] .v2-heat{animation:v2HeatRise 3s ease-in-out infinite;opacity:1;}
@keyframes v2HeatRise{
  0%,100%{transform:translateX(-50%) translateY(0);opacity:.5;}
  50%{transform:translateX(-50%) translateY(-5%);opacity:.8;}}

/* ---- 教徽"明"字 ---- */
.v2-sigil{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;
  font-size:clamp(100px,26vmin,240px);font-weight:700;line-height:1;
  color:#f5d080;pointer-events:none;opacity:0;
  text-shadow:0 0 40px rgba(255,170,60,.5),0 0 100px rgba(255,120,30,.3);
  letter-spacing:.05em;}
.v2-sigil.show{animation:v2SigilIn 2.4s cubic-bezier(.22,.7,.3,1) forwards;}
.v2-sigil.glow{animation:v2SigilIn 2.4s cubic-bezier(.22,.7,.3,1) forwards,
  v2SigilBreath 4s ease-in-out 2.4s infinite;}
@keyframes v2SigilIn{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.5);filter:blur(20px);}
  40%{opacity:.8;filter:blur(5px);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}}
@keyframes v2SigilBreath{
  0%,100%{text-shadow:0 0 40px rgba(255,170,60,.5),0 0 100px rgba(255,120,30,.3);}
  50%{text-shadow:0 0 60px rgba(255,200,90,.8),0 0 140px rgba(255,140,40,.55);}}

/* ---- 文字区 ---- */
.v2-text{position:absolute;top:12%;left:50%;transform:translateX(-50%);
  width:min(84vw,800px);text-align:center;z-index:20;}
.v2-text.out{animation:v2TextOut .7s ease forwards;}
@keyframes v2TextOut{to{opacity:0;transform:translateX(-50%) translateY(-10px);}}

.v2-chapter{font-size:clamp(10px,2.4vmin,20px);letter-spacing:.7em;text-indent:.7em;
  color:rgba(201,169,110,.4);margin-bottom:2em;opacity:0;
  animation:v2LineIn 1s ease-out var(--d,0s) forwards;}

.v2-line{font-size:clamp(15px,4.4vmin,36px);line-height:2.1;color:#c9bfae;margin:.3em 0;
  opacity:0;animation:v2LineIn 1.2s cubic-bezier(.22,.7,.3,1) var(--d,0s) forwards;
  text-shadow:0 2px 12px rgba(0,0,0,.85);font-weight:300;}

.v2-line.big{font-size:clamp(28px,9.5vmin,80px);font-weight:600;
  letter-spacing:.35em;text-indent:.35em;color:#e8c47a;margin-top:.6em;
  text-shadow:0 0 20px rgba(255,160,60,.4),0 0 50px rgba(255,110,30,.25);
  animation:v2LineIn 2s cubic-bezier(.22,.7,.3,1) var(--d,0s) forwards,
    v2BigGlow 4s ease-in-out var(--glow,2.5s) infinite;}
.v2-line.big.fire{color:#ffae5c;
  text-shadow:0 0 24px rgba(255,140,50,.55),0 0 60px rgba(255,90,20,.35);}

@keyframes v2LineIn{
  from{opacity:0;transform:translateY(18px);filter:blur(6px);}
  to{opacity:1;transform:translateY(0);filter:blur(0);}}
@keyframes v2BigGlow{
  0%,100%{text-shadow:0 0 20px rgba(255,160,60,.4),0 0 50px rgba(255,110,30,.25);}
  50%{text-shadow:0 0 32px rgba(255,180,80,.65),0 0 70px rgba(255,130,40,.45);}}

/* ---- 底部提示 ---- */
.v2-hint{position:absolute;bottom:5%;left:0;right:0;text-align:center;
  font-size:clamp(10px,2.4vmin,20px);letter-spacing:.35em;
  color:rgba(201,185,160,.55);opacity:0;z-index:21;}
.v2-hint.show{animation:v2HintBreath 3s ease-in-out infinite;}
@keyframes v2HintBreath{0%,100%{opacity:.18;}50%{opacity:.6;}}

/* ---- 跳过 ---- */
.v2-skip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));
  right:calc(10px + env(safe-area-inset-right,0px));z-index:22;
  background:transparent;color:rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.15);border-radius:999px;
  font-size:clamp(10px,2.4vmin,16px);letter-spacing:.2em;padding:.4em 1em .4em 1.2em;
  font-family:inherit;cursor:pointer;transition:all .3s;}
.v2-skip:hover{color:rgba(255,255,255,.7);border-color:rgba(255,200,120,.4);}

/* ---- 转场：火焰吞没 ---- */
.v2-burn{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,130,50,.9),rgba(255,70,20,.7) 25%,#000 70%);
  opacity:0;}
.v2-burn.in{animation:v2BurnIn 1.1s ease-in forwards;}
.v2-burn.out{animation:v2BurnOut .9s ease-out forwards;}
@keyframes v2BurnIn{to{opacity:1;}}
@keyframes v2BurnOut{from{opacity:1;}to{opacity:0;}}

/* ---- 暗角 ---- */
.v2-vignette{position:absolute;inset:0;z-index:15;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.5) 100%);}
`;

/* ============ 引擎 ============ */
let _ctx = null;

function playCG(container, startAct, onDone) {
    if (_ctx) { _ctx.el.remove(); _ctx = null; }

    if (!document.getElementById('cgV2Styles')) {
        const s = document.createElement('style');
        s.id = 'cgV2Styles';
        s.textContent = CSS;
        document.head.appendChild(s);
    }

    const el = document.createElement('div');
    el.id = 'cgV2';
    el.dataset.mood = ACTS[startAct || 0].mood;
    el.innerHTML = `
        <div class="v2-mount-far"></div>
        <div class="v2-heat"></div>
        <div class="v2-fire-halo"></div>
        <div class="v2-fire-mid"></div>
        <div class="v2-mount-near"></div>
        <div class="v2-altar"></div>
        <div class="v2-fire-core"></div>
        <div class="v2-fire-inner"></div>
        <div class="v2-sparks"></div>
        <div class="v2-sigil"></div>
        <div class="v2-vignette"></div>
        <div class="v2-burn"></div>
        <div class="v2-text"></div>
        <button class="v2-skip" type="button">跳过 ›</button>
        <div class="v2-hint"></div>
    `;
    container.appendChild(el);

    const ctx = {
        el,
        text: el.querySelector('.v2-text'),
        hint: el.querySelector('.v2-hint'),
        sparks: el.querySelector('.v2-sparks'),
        sigil: el.querySelector('.v2-sigil'),
        burn: el.querySelector('.v2-burn'),
        act: startAct || 0,
        ready: false,
        switching: false,
        done: false,
        timers: []
    };
    _ctx = ctx;

    function t(fn, ms) {
        const id = setTimeout(fn, ms);
        ctx.timers.push(id);
        return id;
    }
    function clearTimers() {
        ctx.timers.forEach(clearTimeout);
        ctx.timers = [];
    }

    /* 火星 */
    function buildSparks(n, fast) {
        ctx.sparks.innerHTML = '';
        const colors = ['#ffe08a', '#ffc466', '#ff9a3d', '#ff6f28', '#fff0b8'];
        for (let i = 0; i < n; i++) {
            const s = document.createElement('i');
            const dur = (fast ? 2.5 : 4) + Math.random() * (fast ? 2 : 3.5);
            s.style.left = 'calc(50% + ' + ((Math.random() * 120 - 60) | 0) + 'px)';
            s.style.bottom = (20 + Math.random() * 8) + '%';
            s.style.setProperty('--c', colors[i % colors.length]);
            s.style.setProperty('--d', dur.toFixed(1) + 's');
            s.style.setProperty('--delay', (-Math.random() * dur).toFixed(1) + 's');
            s.style.setProperty('--x', ((Math.random() * 100 - 50) | 0) + 'px');
            s.style.setProperty('--y', '-' + (30 + (Math.random() * 30 | 0)) + 'vh');
            const sz = 1.5 + Math.random() * 2.5;
            s.style.width = sz + 'px';
            s.style.height = sz + 'px';
            ctx.sparks.appendChild(s);
        }
    }

    function setHint(txt) { ctx.hint.textContent = txt; ctx.hint.classList.add('show'); }
    function clearHint() { ctx.hint.classList.remove('show'); }
    function hintText() {
        return ctx.act === ACTS.length - 1 ? '— 点击任意处 · 开战 —' : '— 点击任意处继续 —';
    }

    function renderAct(idx) {
        const a = ACTS[idx];
        ctx.act = idx;
        ctx.ready = false;
        ctx.switching = false;
        clearHint();
        clearTimers();

        el.dataset.mood = a.mood;

        // 火星数量
        const sparkN = { dying: 4, ignite: 14, blaze: 24 }[a.mood] || 10;
        buildSparks(sparkN, a.mood === 'blaze');

        // 教徽
        if (a.sigil) {
            ctx.sigil.textContent = a.sigil;
            t(() => ctx.sigil.classList.add('glow'), 1500);
        } else {
            ctx.sigil.classList.remove('show', 'glow');
            ctx.sigil.textContent = '';
        }

        // 文字
        ctx.text.classList.remove('out');
        ctx.text.innerHTML = '';

        let time = 0.3;
        const ch = document.createElement('p');
        ch.className = 'v2-chapter';
        ch.textContent = a.chapter;
        ch.style.setProperty('--d', time + 's');
        ctx.text.appendChild(ch);
        time += 0.7;

        for (const ln of a.lines) {
            time += ln.gap || 0.8;
            const p = document.createElement('p');
            p.className = 'v2-line' + (ln.big ? ' big' : '') + (ln.fire ? ' fire' : '');
            p.textContent = ln.t;
            p.style.setProperty('--d', time + 's');
            if (ln.big) {
                p.style.setProperty('--glow', (time + 2) + 's');
            }
            ctx.text.appendChild(p);
        }

        const total = time + 1.2;
        t(() => {
            ctx.ready = true;
            setHint(hintText());
        }, total * 1000);
    }

    function fastForward() {
        clearTimers();
        ctx.text.querySelectorAll('.v2-line,.v2-chapter').forEach(e => {
            e.style.animationDuration = '.25s';
            e.style.setProperty('--d', '0s');
            e.style.setProperty('--glow', '.3s');
        });
        if (ctx.sigil.textContent) {
            ctx.sigil.style.animationDuration = '.5s';
            ctx.sigil.classList.add('glow');
        }
        ctx.ready = true;
        t(() => setHint(hintText()), 300);
    }

    function nextAct() {
        ctx.switching = true;
        clearHint();
        ctx.text.classList.add('out');
        ctx.burn.classList.remove('out');
        ctx.burn.classList.add('in');

        t(() => {
            renderAct(ctx.act + 1);
            ctx.burn.classList.remove('in');
            ctx.burn.classList.add('out');
            t(() => ctx.burn.classList.remove('out'), 900);
        }, 700);
    }

    function finish() {
        if (ctx.done) return;
        ctx.done = true;
        clearTimers();
        ctx.burn.classList.add('in');
        t(() => {
            el.classList.add('fade-out');
            t(() => {
                el.remove();
                _ctx = null;
                if (onDone) onDone();
            }, 900);
        }, 600);
    }

    el.addEventListener('pointerdown', () => {
        if (ctx.done || ctx.switching) return;
        if (!ctx.ready) { fastForward(); return; }
        if (ctx.act < ACTS.length - 1) nextAct();
        else finish();
    });
    el.querySelector('.v2-skip').addEventListener('pointerdown', e => {
        e.stopPropagation();
        finish();
    });

    renderAct(ctx.act);
}

playCG(stage, 0);
