    <script>
    window.addEventListener('error', function(e) {
        var panel = document.getElementById('errorCapturePanel') || (function(){
            var p = document.createElement('div');
            p.id = 'errorCapturePanel';
            p.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:25vh;overflow-y:auto;background:rgba(20,0,0,0.92);color:#f88;font-size:10px;z-index:99999;padding:4px 8px;font-family:monospace;display:none;';
            document.body.appendChild(p);
            return p;
        })();
        panel.style.display = 'block';
        var line = document.createElement('div');
        line.style.marginBottom = '4px';
        line.textContent = '[模块加载错误] ' + (e.message || e.filename || '未知错误');
        panel.appendChild(line);
    });
    window.addEventListener('unhandledrejection', function(e) {
        var panel = document.getElementById('errorCapturePanel');
        if (panel) {
            panel.style.display = 'block';
            var line = document.createElement('div');
            line.style.marginBottom = '4px';
            line.textContent = '[Promise错误] ' + String(e.reason);
            panel.appendChild(line);
        }
    });
    </script>

                const xiaoZhao = allyTeam.find(u => u.isXiaoZhaoSister && u.alive && !u._stunned);
                if (xiaoZhao) {
                    let reduce = Math.max(1, Math.floor(bonusDmg * target.def / (ES.xiaoZhao.defToReduce || 100)));
                    target.hp = Math.min(target.maxHp, target.hp + reduce);
                    target.dmgTaken -= reduce;
                    const aliveAllies = allyTeam.filter(u => u.alive && !u.isHorse);
                    if (aliveAllies.length > 0) {
                        const healTarget = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
                        let heal = Math.max(ES.xiaoZhao.minHeal || 0.5, Math.floor(healTarget.def / (ES.xiaoZhao.defToHeal || 5)));
                        healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + heal);
                        healTarget.healDone += heal;
                        emitEvent(healTarget, 'hp-change', { hp: healTarget.hp, maxHp: healTarget.maxHp, alive: healTarget.alive, atk: healTarget.atk, def: healTarget.def });
                        const atkTarget = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
                        let atkGain = Math.max(ES.xiaoZhao.minAtk || 0.5, Math.floor(atkTarget.def / (ES.xiaoZhao.defToAtk || 10)));
                        atkTarget.atk += atkGain;
                        if (atkTarget._baseAtk !== undefined) atkTarget._baseAtk += atkGain;
                        emitEvent(atkTarget, 'hp-change', { hp: atkTarget.hp, maxHp: atkTarget.maxHp, alive: atkTarget.alive, atk: atkTarget.atk, def: atkTarget.def });
                        log.push({
                            type: 'info',
                            text: `<span class="gold">🦋 乾坤衍生：${target.name}减伤${reduce}，${healTarget.name}治疗+${heal}，${atkTarget.name}攻击+${atkGain}</span>`,
                            isHealEntry: true,
                            healAmount: heal,
                            healUnitUid: healTarget.uid
                        });
                    }
                }
            }
        }

        // 宋青书回血
        const songQingShu = battleState?.ally ? null : null;
        const allUnitsForClaw = [...(battleState?.ally || []), ...(battleState?.enemy || [])];
        const song = allUnitsForClaw.find(u => u.name === '宋青书' && u.alive);
        if (song && bonusDmg > 0) {
            const healAmount = Math.min(bonusDmg, song.maxHp - song.hp);
            if (healAmount > 0) {
                song.hp += healAmount;
                song.healDone += healAmount;
            }
            emitEvent(song, 'hp-change', { hp: song.hp, maxHp: song.maxHp, alive: song.alive, atk: song.atk, def: song.def });
            log.push({
                type: 'info',
                text: `<span class="green">💚 宋青书因九阴白骨爪回复${healAmount > 0 ? healAmount : 0}点生命${healAmount === 0 ? '（已满血）' : ''}</span>`,
                isHealEntry: true,
                healAmount: healAmount > 0 ? healAmount : bonusDmg,
                healUnitUid: song.uid,
                fastEntry: true
            });
        }

        depth++;
        if (isExecute) break;
    }
    return totalBonus;
}

/**
 * 宋青书 - 叛逆突袭：锁定血量百分比最高目标
 */
function getRebelTarget(attacker, enemySide) {
    if (attacker.name !== '宋青书') return null;
    const alive = enemySide.filter(u => u.alive);
    if (alive.length === 0) return null;
    return alive.reduce((a, b) => (a.hp / a.maxHp) > (b.hp / b.maxHp) ? a : b);
}

function getRebelDmgBonus(attacker) {
    if (attacker.name !== '宋青书') return 0;
    return ES.rebelStrike.dmgBonus;
}

function getRebelTrueDmg(attacker, target) {
    if (attacker.name !== '宋青书') return 0;
    return Math.floor(target.hp * ES.rebelStrike.currentHpRatio);
}

function getPhantomThunderBonus(attacker) {
    if (attacker.name !== '成昆') return 0;
    const lostHp = attacker.maxHp - attacker.hp;
    return Math.floor(lostHp * ES.phantomThunder.lostHpRatio);
}

function applyXuanmingPalm(attacker, target) {
    if (attacker.name !== '鹿杖客') return null;
    const s = ES.xuanmingPalm;
    target._xuanmingPoison = {
        remaining: s.duration,
        dotPercents: [...s.dotPercents]
    };
    const firstDot = Math.floor(target.maxHp * s.dotPercents[0]);
    return {
        type: 'info',
        text: `<span class="purple">❄️ ${attacker.name} 的玄冥神掌使 ${target.name} 中毒！每回合损失生命（4%→2%→1%→消失）</span>`
    };
}

function tickXuanmingPoison(unit) {
    if (!unit._xuanmingPoison || unit._xuanmingPoison.remaining <= 0) return 0;
    unit._xuanmingPoison.remaining--;
    const idx = Math.min(unit._xuanmingPoison.dotPercents.length - 1, ES.xuanmingPalm.duration - 1 - unit._xuanmingPoison.remaining);
    const pct = unit._xuanmingPoison.dotPercents[idx] || 0;
    const dot = Math.floor(unit.maxHp * pct);
    unit.hp -= dot;
    if (unit.hp <= 0) {
        unit.hp = 0;
        unit.alive = false;
        unit._isDead = true;
        if (!unit._deathTime) unit._deathTime = Date.now();
    }
    emitEvent(unit, 'hp-change', {
        hp: unit.hp,
        maxHp: unit.maxHp,
        alive: unit.alive,
        atk: unit.atk,
        def: unit.def,
        _isDead: unit._isDead || false,
        _isAbsolute: true
    });
    return dot;
}

function getHornStrikeBonus(attacker, target) {
    if (attacker.name !== '鹤笔翁') return { defIgnore: 0, dmgMultiplier: 1 };
    const s = ES.hornStrike;
    const poisoned = target._xuanmingPoison && target._xuanmingPoison.remaining > 0;
    return {
        defIgnore: s.defIgnore,
        dmgMultiplier: poisoned ? 1 + s.poisonedBonus : 1
    };
}

function applyDamageModifiers(unit, target, dmg, allySide, enemySide, log) {
    let modifiedDmg = dmg;
    const entries = [];
    const ES = CONFIG.ELITE_SKILLS;

    const xiaoZhao = allySide.find(u => (u.isXiaoZhaoSister || u.isXiaoZhaoBrother) && u.alive);
    const zhangUpgraded = allySide.find(c => c.isZhang && c.alive);
    if (target.camp === 'ally' && xiaoZhao && zhangUpgraded && [2, 4, 6, 8].includes(target.pos)) {
        const reducedDmg = Math.round(dmg * (1 - ES.xiaoZhao.upgradedReducePct));
        const rebound = Math.floor(dmg * (ES.xiaoZhao.upgradedReboundPct || 0.20));
        const selfDmg = Math.max(1, Math.floor(dmg * (ES.xiaoZhao.upgradedSelfDmgPct || 0.10)));

        unit.hp = Math.max(0, unit.hp - rebound);
        unit.dmgTaken += rebound;
        zhangUpgraded.reboundDone += rebound;
        if (unit.hp <= 0) {
            unit.alive = false;
            unit._isDead = true;
            if (!unit._deathTime) unit._deathTime = Date.now();
        }

        zhangUpgraded.hp -= selfDmg;
        zhangUpgraded.dmgTaken += selfDmg;

        emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def, _isDead: unit._isDead || false });
        emitEvent(zhangUpgraded, 'hp-change', { hp: zhangUpgraded.hp, maxHp: zhangUpgraded.maxHp, alive: zhangUpgraded.alive, atk: zhangUpgraded.atk, def: zhangUpgraded.def });

        entries.push({
            type: 'info',
            text: `<span class="gold">🦋 乾坤大挪移（升级版）：减伤30%，反弹${rebound}给${unit.name}（无忌自伤${selfDmg}）</span>`,
            buffType: 'rebound',
            reboundDmg: rebound,
            reboundUid: unit.uid,
            selfDmg: selfDmg,
            selfDmgUid: zhangUpgraded.uid
        });

        modifiedDmg = reducedDmg;
    }

    return { modifiedDmg, entries };
}

// ==================== 宋青书/周芷若联动技能 ====================

function checkKuLian(allyTeam) {
    const song = allyTeam.find(u => u.name === '宋青书' && u.alive);
    if (!song) return null;
    const zhou = allyTeam.find(u => u.name === '周芷若' && u.alive);

}

function applyXingFenGrant(allyTeam, log) {
    const zhou = allyTeam.find(u => u.name === '周芷若' && u.alive);
    const song = allyTeam.find(u => u.name === '宋青书' && u.alive);

    song._xingFenActive = true;
    log.push({
        type: 'buff-summary',
        text: `<span class="gold">💗 性奋：${song.name} 受${zhou.name}激励，本回合每次攻击后可再次攻击！</span>`,
        buffType: 'elite_xingfen'
    });
}

function applyXinHunDeduction(attacker, allyTeam, log) {
    if (attacker.name !== '宋青书') return;
    const zhou = allyTeam.find(u => u.name === '周芷若' && u.alive);
    if (!zhou) return;
    zhou.hp = Math.max(0, zhou.hp - ES.xinHun.hpDeduct);
    zhou.dmgTaken += ES.xinHun.hpDeduct;
    emitEvent(zhou, 'hp-change', {
        hp: zhou.hp,
        maxHp: zhou.maxHp,
        alive: zhou.alive,
        atk: zhou.atk,

    });
    zhou._kuaiLeStack.push({ healPct: ES.xinHun.healLevels[0] });
    log.push({
        type: 'info',
        text: `<span class="gold">💒 新婚：${attacker.name}攻击，${zhou.name}被扣除${ES.xinHun.hpDeduct}点血量，叠加一层快乐(16%)！当前快乐层数：${zhou._kuaiLeStack.length}</span>`,
        buffType: 'elite_xinhun',
        zhouUid: zhou.uid,
        zhouHpAfter: zhou.hp
    });
    if (zhou.hp <= 0) {
        zhou.hp = 0;
        zhou.alive = false;
        zhou._isDead = true;
        if (!zhou._deathTime) zhou._deathTime = Date.now();
        emitEvent(zhou, 'hp-change', {
            hp: 0,
            maxHp: zhou.maxHp,
            alive: false,
            atk: zhou.atk,
            def: zhou.def,
            _isDead: true,
            _isAbsolute: true
        });
        log.push({
            type: 'info',
            text: `<span class="red">💀 ${zhou.name} 因新婚扣血而阵亡！</span>`,

            isDead: true
        });
    }
}

function tickKuaiLeHeal(allUnits, log) {
    allUnits.forEach(unit => {
        if (!unit._kuaiLeStack || unit._kuaiLeStack.length === 0) return;
        if (!unit.alive) return;
        let totalHeal = 0;
        const newStack = [];
        unit._kuaiLeStack.forEach(layer => {
            const healAmount = Math.floor(unit.maxHp * layer.healPct);
            totalHeal += healAmount;
            const levels = ES.xinHun.healLevels;
            const currentIdx = levels.indexOf(layer.healPct);
            if (currentIdx >= 0 && currentIdx < levels.length - 1) {
                newStack.push({ healPct: levels[currentIdx + 1] });
            }
        });
        if (totalHeal > 0) {
            const hpBefore = unit.hp;
            unit.hp = Math.min(unit.maxHp, unit.hp + totalHeal);
            unit.healDone += totalHeal;
            emitEvent(unit, 'hp-change', {
                hp: unit.hp,
                maxHp: unit.maxHp,
                alive: unit.alive,
                atk: unit.atk,
                def: unit.def,
                _isAbsolute: true
            });
            log.push({
                type: 'info',
                text: `<span class="green">💚 快乐回血：${unit.name} 回复${totalHeal}点生命（${unit._kuaiLeStack.length}层触发），血量 ${Math.floor(hpBefore)} → ${Math.floor(unit.hp)}</span>`,
                buffType: 'elite_kuaile_heal',
                zhouUid: unit.uid,
                zhouHpAfter: unit.hp
            });
        }
        unit._kuaiLeStack = newStack;
    });
}

function canXingFenTrigger(attacker) {
    if (attacker.name !== '宋青书') return false;
    if (!attacker._xingFenActive) return false;
    if (!attacker.alive) return false;
    return true;
}

function consumeXingFen(attacker) {
    attacker._xingFenActive = false;
}

function applyXingFenPenalty(attacker, log) {
    if (attacker.name !== '宋青书') return;
    if (!attacker._xingFenActive) return;
    if (!attacker._xingFenPenaltyCount) attacker._xingFenPenaltyCount = 0;
    attacker._xingFenPenaltyCount++;
    const penalty = attacker._xingFenPenaltyCount;
    if (penalty > 0 && attacker.maxHp > 1) {
        const oldMaxHp = attacker.maxHp;
        attacker.maxHp = Math.max(1, attacker.maxHp - penalty);
        attacker.hp = Math.min(attacker.hp, attacker.maxHp);
        emitEvent(attacker, 'hp-change', { hp: attacker.hp, maxHp: attacker.maxHp, alive: attacker.alive, atk: attacker.atk, def: attacker.def });
        if (log) log.push({ type:'info', text:`<span class="red">💗 性奋代价：${attacker.name} 血量上限 ${oldMaxHp} → ${attacker.maxHp}（-${penalty}）</span>` });
    }
}

// ==================== 🦋 小昭·姊 — 蝶变附身 ====================

/**
 * 明教第一个攻击者出手前触发。姊附身到4号位后面最近的队友。
 */
function butterflyAttach(unit, allyTeam, log) {
    if (!unit.isXiaoZhaoSister || !unit.alive || unit._butterflyHost) return;
    if (unit.pos !== 4) return;

    const order = [5, 6, 7, 8, 9, 1, 2, 3];
    let host = null;
    for (const p of order) {
        const u = allyTeam.find(a => a.pos === p && a.alive && !a.isHorse && a.uid !== unit.uid);
        if (u) { host = u; break; }
    }
    if (!host) {
        unit.hp = 0; unit.alive = false; unit._isDead = true;
        if (!unit._deathTime) unit._deathTime = Date.now();
        emitEvent(unit, 'hp-change', { hp: 0, maxHp: unit.maxHp, alive: false, atk: unit.atk, def: unit.def, _isDead: true });
        log.push({ type:'info', text:`<span class="red">🦋 蝶变：${unit.name} 无队友可附身，香消玉殒！</span>` });
        return;
    }

    unit._butterflyAtk = unit.atk;
    unit._butterflyDef = unit.def;
    unit._butterflyHp = unit.hp;

    const atkTransfer = Math.floor(unit.atk / 2);
    const defTransfer = Math.floor(unit.def / 2);
    const hpTransfer = Math.floor(unit.maxHp / 2);
    host.atk += atkTransfer;
    host.def += defTransfer;
    host.maxHp += hpTransfer;
    host.hp = Math.min(host.maxHp, host.hp + hpTransfer);
    emitEvent(host, 'hp-change', { hp: host.hp, maxHp: host.maxHp, alive: host.alive, atk: host.atk, def: host.def });

    const aliveAllies = allyTeam.filter(a => a.alive && !a.isHorse && a.uid !== unit.uid);
    const totalHp = aliveAllies.reduce((sum, a) => sum + a.hp, 0);
    const totalMaxHp = aliveAllies.reduce((sum, a) => sum + a.maxHp, 0);
    if (totalMaxHp > 0) {
        unit.hp = Math.floor(unit.maxHp * (totalHp / totalMaxHp));
    }
    unit._butterflyHost = host.uid;
    unit._flyMode = 'butterfly';

    emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def });
    log.push({ type:'info', text:`<span class="gold">🦋 蝶变：${unit.name} 化为蝴蝶附身于 ${host.name}！攻+${atkTransfer} 防+${defTransfer} 血上限+${hpTransfer}</span>` });
}

function butterflyReturn(unit, allyTeam, log) {
    if (!unit.isXiaoZhaoSister || !unit._butterflyHost) return;

    unit.atk = unit._butterflyAtk;
    unit.def = unit._butterflyDef;
    unit.hp = unit._butterflyHp;
    // 收回加给宿主的攻防血
    const host = allyTeam.find(a => a.uid === unit._butterflyHost);
    if (host) {
        const atkTransfer = Math.floor(unit._butterflyAtk / 2);
        const defTransfer = Math.floor(unit._butterflyDef / 2);
        const hpTransfer = Math.floor(unit._butterflyHp / 2);
        host.atk = Math.max(0, host.atk - atkTransfer);
        host.def = Math.max(0, host.def - defTransfer);
        host.maxHp = Math.max(1, host.maxHp - hpTransfer);
        host.hp = Math.min(host.hp, host.maxHp);
        emitEvent(host, 'hp-change', { hp: host.hp, maxHp: host.maxHp, alive: host.alive, atk: host.atk, def: host.def });
    }

    unit._butterflyAtk = 0; unit._butterflyDef = 0; unit._butterflyHp = 0;
    unit._flyMode = null;
    unit._butterflyHost = null;

    const order = [4, 5, 6, 7, 8, 9, 1, 2, 3];
    const occupied = new Set(allyTeam.filter(a => a.alive && !a.isHorse && a.uid !== unit.uid).map(a => a.pos));
    for (const p of order) {
        if (!occupied.has(p)) { unit.pos = p; break; }
    }

    emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def });
    log.push({ type:'info', text:`<span class="gold">🦋 蝶变：${unit.name} 飞回，落在${unit.pos}号位！</span>` });
}

// ==================== 🕷️ 小昭·妹 — 蛛变 + 飞天 ====================

function spiderTransform(unit, log) {
    if (!unit.isXiaoZhaoBrother || !unit.alive) return;
    const roles = ['战士', '防战', '远程', '飞行'];
    let availableRoles = unit._lastRole ? roles.filter(r => r !== unit._lastRole) : roles;
    if (availableRoles.length === 0) availableRoles = roles;
    const newRole = availableRoles[Math.floor(Math.random() * availableRoles.length)];
    unit._lastRole = newRole;

    if (!unit._masteredRoles) unit._masteredRoles = [];
    if (!unit._masteredRoles.includes(newRole)) {
        unit._masteredRoles.push(newRole);
    }

    const newStats = ROLE_BONUS[newRole] || { atk: 0, def: 0, maxHp: 0 };
    unit.role = newRole;
    unit.atk += newStats.atk;
    unit.def += newStats.def;

    let hpDelta = newStats.maxHp + 5;
    unit.maxHp += hpDelta;
    if (hpDelta > 0) { unit.hp += hpDelta; } else { unit.hp = Math.min(unit.hp, unit.maxHp); }

    emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def, role: unit.role, _masteredRoles: unit._masteredRoles });
    log.push({ type:'info', text:`<span class="gold">🕷️ 蛛变：${unit.name} 变换为<span class="gold">${newRole}</span>（已精通${unit._masteredRoles.length}/4）</span>` });
}

function spiderFlyCheck(unit, allyTeam, log, incomingDmg) {
    if (!unit.isXiaoZhaoBrother || !unit.alive || unit._spiderFlying) return false;
    if (unit._flyMode === 'spider') return false;

    const hpBefore = unit.hp;
    const hpAfter = incomingDmg !== undefined ? hpBefore - incomingDmg : hpBefore;
    const maxHp = unit.maxHp;

    let reason = '';
    let remaining = 0;

    if (!unit._spiderTriggered70 && hpBefore > maxHp * 0.7 && hpAfter <= maxHp * 0.7) {
        reason = '血量即将低于70%';
        unit._spiderTriggered70 = true;
    } else if (!unit._spiderTriggered40 && hpBefore > maxHp * 0.4 && hpAfter <= maxHp * 0.4) {
        reason = '血量即将低于40%';
        unit._spiderTriggered40 = true;
    } else if (!unit._spiderTriggeredDeath && hpAfter <= 0) {
        reason = '即将阵亡';
        unit._spiderTriggeredDeath = true;
    }

    if (!reason) return false;

    remaining = 3 - (unit._spiderTriggered70 ? 1 : 0) - (unit._spiderTriggered40 ? 1 : 0) - (unit._spiderTriggeredDeath ? 1 : 0);

    unit._spiderFlying = true;
    unit._flyMode = 'spider';
    unit._spiderAttacked = unit._acted;

    log.push({ type:'info', text:`<span class="gold">🕷️ 飞天：${unit.name} ${reason}，免疫本次攻击的 ${incomingDmg || 0} 点伤害，化为蜘蛛遁走！剩余次数：${remaining}</span>` });
    return true;
}

function spiderReturn(unit, allyTeam, enemySide, log) {
    if (!unit.isXiaoZhaoBrother || !unit._spiderFlying) return;

    unit._spiderFlying = false;
    unit._flyMode = null;
    unit._acted = false;

    const order = [4, 5, 6, 7, 8, 9, 1, 2, 3];
    const occupied = new Set(allyTeam.filter(a => a.alive && !a.isHorse && a.uid !== unit.uid).map(a => a.pos));
    for (const p of order) {
        if (!occupied.has(p)) { unit.pos = p; break; }
    }

    emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def });
    log.push({ type:'info', text:`<span class="gold">🕷️ 蛛落：${unit.name} 从天而降，落在${unit.pos}号位！</span>` });

    // 落地攻击随机敌人
    const aliveEnemies = enemySide.filter(u => u.alive);
    if (aliveEnemies.length > 0) {
        const target = aliveEnemies[rand(0, aliveEnemies.length - 1)];
        const penetrationDmg = Math.floor(unit.atk * (unit.atk / (unit.atk + target.def)));
        const extraDmg = (unit._masteredRoles?.length || 0) * 10;
        const totalDmg = penetrationDmg + extraDmg;
        target.hp = Math.max(0, target.hp - totalDmg);
        unit.dmgDealt += totalDmg;
        target.dmgTaken += totalDmg;
        if (target.hp <= 0) { target.hp = 0; target.alive = false; target._isDead = true; if (!target._deathTime) target._deathTime = Date.now(); }
        emitEvent(target, 'hp-change', { hp: target.hp, maxHp: target.maxHp, alive: target.alive, atk: target.atk, def: target.def, _isDead: target._isDead || false });
        log.push({ type:'info', text:`<span class="gold">🕷️ 蛛袭：${unit.name} 落地攻击 ${target.name}，穿透${penetrationDmg} + 精通${extraDmg} = ${totalDmg} 伤害！</span>`, uidA: unit.uid, uidD: target.uid, isDead: !target.alive });
    }
}

// ==================== 小昭共通 — 精通 + 永久海克斯 ====================

function computeButterflyMastery(unit) {
    if (!unit.isXiaoZhaoBrother || !unit._masteredRoles) return { atk: 0, def: 0, hp: 0 };
    const count = unit._masteredRoles.length;
    const extra = count >= 4 ? 1 : 0;
    return {
        atk: (count + extra) * 1.5,
        def: (count + extra) * 2,
        hp: (count + extra) * 10
    };
}

function addPermanentBuff(xiaoZhao, buffKey, buffName, extraFields = {}) {
    if (!xiaoZhao || !(xiaoZhao.isXiaoZhaoSister || xiaoZhao.isXiaoZhaoBrother || xiaoZhao.isXiaoZhao)) return;
    if (!xiaoZhao._permanentBuffs) xiaoZhao._permanentBuffs = [];
    xiaoZhao._permanentBuffs.push({
        key: buffKey,
        target: 'ally',
        remaining: Infinity,
        name: buffName,
        ...extraFields
    });
}

function isXiaoZhaoPermanentActive(unit, activeBuffs, buffKey) {
    if (!unit || !(unit.isXiaoZhaoSister || unit.isXiaoZhaoBrother || unit.isXiaoZhao) || !unit._permanentBuffs) return false;
    if (activeBuffs && hasBuff(activeBuffs, buffKey)) return false;
    return unit._permanentBuffs.some(b => b.key === buffKey);
}

function applyXiaoZhaoDerived(allyTeam, target, dmg, group) {
    const xiaoZhao = allyTeam.find(u => u.isXiaoZhaoSister && u.alive);
    if (!xiaoZhao || xiaoZhao._stunned) return;
    const zhang = allyTeam.find(u => u.isZhang && u.alive);
    if (zhang) return;
    const s = ES.xiaoZhao;
    if (!s) return;

    let reduce = Math.max(s.minReduce || 1, Math.floor(dmg * target.def / (s.defToReduce || 100)));
    target.hp = Math.min(target.maxHp, target.hp + reduce);
    target.dmgTaken -= reduce;

    const aliveAllies = allyTeam.filter(u => u.alive && !u.isHorse);
    if (aliveAllies.length > 0) {
        const healTarget = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
        let heal = Math.max(s.minHeal || 1, Math.floor(healTarget.def / (s.defToHeal || 5)));
        healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + heal);
        healTarget.healDone += heal;
        emitEvent(healTarget, 'hp-change', { hp: healTarget.hp, maxHp: healTarget.maxHp, alive: healTarget.alive, atk: healTarget.atk, def: healTarget.def });

        const atkTarget = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
        let atkGain = Math.max(s.minAtk || 1, Math.floor(atkTarget.def / (s.defToAtk || 10)));
        atkTarget.atk += atkGain;
        if (atkTarget._baseAtk !== undefined) atkTarget._baseAtk += atkGain;
        emitEvent(atkTarget, 'hp-change', { hp: atkTarget.hp, maxHp: atkTarget.maxHp, alive: atkTarget.alive, atk: atkTarget.atk, def: atkTarget.def });

        if (group && group.entries) {
            group.entries.push({
                type: 'info',
                text: `<span class="gold">🦋 乾坤衍生：${target.name}减伤${reduce}，${healTarget.name}治疗+${heal}，${atkTarget.name}攻击+${atkGain}</span>`,
                isHealEntry: true,
                healAmount: heal,
                healUnitUid: healTarget.uid
            });
        }
    }
}

function applyPhantomDisguise(unit, enemySide, allySide = null) {
    if (unit.camp !== 'ally') return null;
    const chengkun = enemySide.find(u => u.name === '成昆' && u.alive && u._phantomTarget);
    if (!chengkun || unit._isLinkAttack) return null;
    if (chengkun._phantomTarget === unit.uid) return null;
    const lostPct = (chengkun.maxHp - chengkun.hp) / chengkun.maxHp;
    const chance = ES.phantomDisguise.baseChance + Math.floor(lostPct * 10) * ES.phantomDisguise.per10pctLost;
    if (Math.random() < chance) {
        const fakeTarget = allySide ? allySide.find(u => u.uid === chengkun._phantomTarget && u.alive && !u.isHorse) : null;
        if (fakeTarget) {

        }
    }

}

function applyXiaoZhaoMindControl(unit, allySide, enemySide) {
    if (unit.camp !== 'enemy') return null;
    const xiaoZhao = enemySide.find(u => (u.isXiaoZhaoSister || u.isXiaoZhaoBrother || u.isXiaoZhao) && u.alive);
    if (!xiaoZhao || !xiaoZhao._permanentBuffs || !xiaoZhao._permanentBuffs.some(b => b.key === 'mindControl')) return null;
    if (hasBuff(enemySide._activeBuffs, 'mindControl')) return null;

        if (xzFakeTarget) {
            return { target: xzFakeTarget, log: `🦋 蝶舞迷心！${unit.name}被小昭迷惑，误攻队友${xzFakeTarget.name}！` };
        }
    }
    return null;
}

function checkXiaoZhaoPermanentDoubleStrike(unit, activeBuffs) {
    if (!(unit.isXiaoZhaoSister || unit.isXiaoZhaoBrother || unit.isXiaoZhao) || !unit.alive || !unit._permanentBuffs) return false;
    if (!unit._permanentBuffs.some(b => b.key === 'doubleStrike')) return false;
    if (unit._xiaoZhaoDoubleStriked) return false;
    if (hasBuff(activeBuffs, 'doubleStrike')) return false;
    const chance = ES.xiaoZhaoDoubleStrike ? ES.xiaoZhaoDoubleStrike.chance * 100 : 80;

}

function getXiaoZhaoHexEnhance(allyTeam, activeBuffs, hexKey) {

    const s = ES.xiaoZhao;
    if (!s || !s.hexEnhance || !s.hexEnhance[hexKey]) return null;

}

function computeBuffStats(unit, activeBuffs, allyTeam) {
    // console.log('computeBuffStats called, activeBuffs:', JSON.stringify(activeBuffs?.map(b => ({ key: b.key, target: b.target, remaining: b.remaining }))));
    let atkBonus = 0, defBonus = 0, dodgeBonus = 0, hpBonus = 0;
    if (!activeBuffs) return { atkBonus, defBonus, dodgeBonus, hpBonus };


    // carry 加成是绝对值，单独返回，不混入 atkBonus/defBonus（那两个字段是比率，供 calcAttackDamage 做乘法用）
    let carryAtkAbs = 0, carryDefAbs = 0, carryHpAbs = 0;
    const hasCarry = hasBuff(activeBuffs, 'carry') || isXiaoZhaoPermanentActive(unit, activeBuffs, 'carry');
    const carryPosOk = hasCarry && (
        unit.pos === 5 ||
        (unit.pos >= 4 && unit.pos <= 6 && allyTeam && allyTeam.some(u => u.isXiaoZhao && u.alive))
    );
    if (carryPosOk && unit.alive) {
        if (allyTeam) {
            let allAllies = allyTeam.filter(u => u.uid !== unit.uid && !u.isHorse);
            allAllies.forEach(a => {
                let mult = a.alive ? 1 : (C.BUFFS.carry.deathMultiplier || 3);
                carryAtkAbs += Math.floor(a.atk * (C.BUFFS.carry.atkBonus || 0.08) * mult);
                carryDefAbs += Math.floor(a.def * (C.BUFFS.carry.defBonus || 0.08) * mult);
                if (C.BUFFS.carry.hpBonus) carryHpAbs += Math.floor(a._baseMaxHp ? a._baseMaxHp * C.BUFFS.carry.hpBonus * mult : 0);
            });
        }
    }
    if (hasBuff(activeBuffs, 'fortify') && unit.role === '防战' && unit.camp === 'ally') { defBonus += C.BUFFS.fortify.defBonus; }
    if (hasBuff(activeBuffs, 'cloudBody') && unit.camp === 'ally') { dodgeBonus = C.BUFFS.cloudBody.dodgeBonus; }
    // 小昭永久海克斯：根据当前职业匹配职业限定Buff（仅团队海克斯消失后激活）
    if (unit.isXiaoZhao && unit._permanentBuffs) {
        const roleMap = { fortify: '防战', bloodthirst: '战士', meteorShower: '远程', windAssault: '飞行' };
        unit._permanentBuffs.forEach(b => {
            if (roleMap[b.key] && unit.role !== roleMap[b.key]) return; // 职业不匹配，跳过
            if (activeBuffs && hasBuff(activeBuffs, b.key)) return; // 团队还有，不用小昭的
            if (b.key === 'fortify' && unit.role === '防战') defBonus += 0.5;
            if (b.key === 'cloudBody' && !hasBuff(activeBuffs, 'cloudBody')) dodgeBonus = 0.25;
        });
    }

    // 小昭变身精通加成：永久生效，独立于 carry，回合开始时直接加到属性
    let masteryAtkAbs = 0, masteryDefAbs = 0, masteryHpAbs = 0;
    if (unit.isXiaoZhao) {
        const mastery = computeButterflyMastery(unit);
        masteryAtkAbs = mastery.atk;
        masteryDefAbs = mastery.def;
        masteryHpAbs = mastery.hp;
    }

    // 圣火令加成
    if (hasBuff(activeBuffs, 'holyFlame')) {
        const holyFlameBuff = activeBuffs.find(b => b.key === 'holyFlame');
        if (holyFlameBuff) {
            const enhance = getXiaoZhaoHexEnhance(allyTeam, activeBuffs, 'holyFlame');
            const cols = holyFlameBuff.cols || (holyFlameBuff.col != null ? [holyFlameBuff.col] : []);
            const rows = holyFlameBuff.rows || (holyFlameBuff.row != null ? [holyFlameBuff.row] : []);
            if (unit.camp === 'ally') {
                if (cols.includes(getUnitCol(unit.pos))) atkBonus += C.BUFFS.holyFlame.atkBonus;
                if (rows.includes(getUnitRow(unit.pos))) defBonus += C.BUFFS.holyFlame.defBonus;
            }
        }
    } else if (unit.isXiaoZhao && isXiaoZhaoPermanentActive(unit, activeBuffs, 'holyFlame')) {
        atkBonus += C.BUFFS.holyFlame.atkBonus;
        defBonus += C.BUFFS.holyFlame.defBonus;
    }

    return { atkBonus, defBonus, dodgeBonus, hpBonus, carryAtkAbs, carryDefAbs, carryHpAbs, masteryAtkAbs, masteryDefAbs, masteryHpAbs };
}

const C = CONFIG;

function spawnHorse(allyTeam, log, enemyTeam, force = false) {
    let buffs = allyTeam._activeBuffs || [];
    if (!force && !hasBuff(buffs, 'horseFormation')) return;
    let occupiedPositions = new Set(
        allyTeam.filter(u => u.alive).map(u => u.pos)
    );
    let available = [1,2,3,4,5,6,7,8,9].filter(p => !occupiedPositions.has(p));
    if (available.length === 0) return;
    // Fisher–Yates 洗牌，确保真正的随机性
    for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
    }
    let horsePos = available[0];
    let horse = new Unit('拒马', 20, '防战', allyTeam[0].camp);
    const xiaoHEnhance = getXiaoZhaoHexEnhance(allyTeam, allyTeam._activeBuffs || [], 'horseFormation');
    horse.atk = 0;
    if (xiaoHEnhance) {
        horse.def = xiaoHEnhance.horseDef;
        horse.maxHp = xiaoHEnhance.horseHp;
    } else {
        horse.def = 5;
        horse.maxHp = 25;
    }
    horse.hp = horse.maxHp;
    horse._baseMaxHp = horse.maxHp;  // 防止 carry 误判 _baseMaxHp=0 把马打成 maxHp=0
    horse.pos = horsePos; horse.isHorse = true; horse._originalPos = horsePos;
    allyTeam.push(horse);
    // 返回生成的拒马单位，让调用方自己写日志
    return horse;
}

function destroyHorse(allyTeam, log) {
    let buffs = allyTeam._activeBuffs || [];
    if (!hasBuff(buffs, 'horseFormation')) return;
    let horses = allyTeam.filter(u => u.isHorse && u.alive);
    if (horses.length === 0) return;
    if (rand(1,100) <= 50) {
        let horse = horses[rand(0, horses.length-1)];
        horse.hp = 0; horse.alive = false; horse._isDead = true;
        log.push({type:'buff-destroy', text:`<span class="gray">🐴 拒马阵：拒马在${horse.pos}号位消散</span>`, buffType:'destroy', horseUid: horse.uid});
    }
}
  window.spawnHorse = spawnHorse;
  window.destroyHorse = destroyHorse;
})();

function processUnitAttack(unit, allySide, enemySide, log, A, B, state, doubleStrikeUnitUid, lockedTargetUid) {

                unit._acted = true;

    // 步骤1：选择目标

    if (lockedTargetUid) {

        phantomLog = null;

            let emptyGroup = { type:'attack-group', uidA:unit.uid, uidD:null, entries:[], isMiss:true, _fxSnapshot:null, waveTaunt:null, waveUnit:null, buffEffects: [] };
            emptyGroup.entries.push({type:'combat-text', text:`<span class="${unit.camp==='ally'?'blue':'orange'}">${unit.camp==='ally'?'明教':'六大派'} ${unit.name}</span> 无法选择目标`});

    if (!target) {

        emptyGroup.entries.push({type:'combat-text', text:`<span class="${unit.camp==='ally'?'blue':'orange'}">${unit.camp==='ally'?'明教':'六大派'} ${unit.name}</span> 无法选择目标`});

    let unitAllyTeam = unit.camp === 'ally' ? A : B;
    if (hasBuff(unitActiveBuffs, 'carry') && unit.camp === 'ally') {
        unitAllyTeam = unitAllyTeam.concat((state.allAllies || state.ally).filter(c => !c.alive));
        unitAllyTeam = unitAllyTeam.filter((u, i, arr) => arr.findIndex(v => v.uid === u.uid) === i);
    }
    let attackerBuffStats = computeBuffStats(unit, unitActiveBuffs, unitAllyTeam);
    unit.buffAtkBonus = attackerBuffStats.atkBonus;
    unit.buffDefBonus = attackerBuffStats.defBonus;
    unit.buffDodgeBonus = attackerBuffStats.dodgeBonus;
    unit.buffHpBonus = attackerBuffStats.hpBonus;

    let targetActiveBuffs = target.camp === 'ally' ? A._activeBuffs : B._activeBuffs;
    let targetAllyTeam = target.camp === 'ally' ? A : B;
    let defenderBuffStats = computeBuffStats(target, targetActiveBuffs, targetAllyTeam);
    target.buffAtkBonus = defenderBuffStats.atkBonus;
    target.buffDefBonus = defenderBuffStats.defBonus;

    if (unit.name === '成昆' && unit._phantomTarget) {
        delete unit._phantomTarget;

    let hitResult = resolveAttackHit(unit, target, attackerBuffStats, defenderBuffStats, log, A, B, doubleStrikeUnitUid);
    if (hitResult.skipped) {

    if (!unit || unit.pos == null) return null;
    const grid = document.getElementById(unit.camp === 'ally' ? 'allyGrid' : 'enemyGrid');
    if (!grid) return null;
    const order = unit.camp === 'enemy' ? [7,8,9,4,5,6,1,2,3] : [1,2,3,4,5,6,7,8,9];
    const idx = order.indexOf(unit.pos);
    return idx >= 0 ? grid.children[idx] : null;
}

function getCellCenter(unit) {
    if (!unit?.pos) return null;
    const cell = getCellElement(unit);
    if (!cell) return null;
    const rect = cell.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, width: rect.width, height: rect.height };

 */

    const fromCell = getCellElement(fromUnit);
    const toCell = getCellElement(toUnit);

    const fromCenter = getCellCenter(fromUnit);
    const toCenter = getCellCenter(toUnit);
    if (!fromCenter || !toCenter) return;

    fromCell.style.transition = 'transform 0.3s ease, opacity 0.3s';

    document.body.appendChild(butterfly);

    const startX = fromCenter.x, startY = fromCenter.y;
    const endX = toCenter.x, endY = toCenter.y;
    const dx = endX - startX, dy = endY - startY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const duration = 600;

    await new Promise(res => {
        function step(ts) {
            const elapsed = ts - startTime;

            const waveAmplitude = 12 * Math.sin(t * Math.PI * 4);
            const curX = startX + dx * t + perpX * waveAmplitude;
            const curY = startY + dy * t + perpY * waveAmplitude;
            butterfly.style.left = curX + 'px';
            butterfly.style.top = curY + 'px';
            const scale = 1 + 0.15 * Math.sin(elapsed * 0.03);

class AnimationScheduler {
    constructor() {
        this.tasks = [];
        this.now = 0;
        this.speed = 1;
        this.paused = false;
    }
    schedule(type, delay, callback) {
        this.tasks.push({ type, startTime: this.now + delay, callback });
        this.tasks.sort((a, b) => a.startTime - b.startTime);
    }
    clear(type) { this.tasks = this.tasks.filter(t => t.type !== type); }
    tick(deltaMs) {
        if (this.paused) return;
        this.now += deltaMs * this.speed;
        while (this.tasks.length > 0 && this.tasks[0].startTime <= this.now) {
            const task = this.tasks.shift();
            try { task.callback(); } catch(e) {}
        }
    }
    pause() { this.paused = true; }
    resume() { this.paused = false; }
    setSpeed(s) { this.speed = s; }
}

function createStore(initialState, reducer) {
    let state = initialState;
    const listeners = [];
    return {
        getState: () => state,
        dispatch: (action) => {
            const next = reducer(state, action);
            if (next === state) return;
            state = next;
            listeners.forEach(fn => { try { fn(state, action); } catch(e) { console.error('Store subscriber error:', e); } });
        },
        subscribe: (fn) => { listeners.push(fn); return () => { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); }; }
    };
}

        case 'SET_FLASH': {
            let next = state.units.map(u => {

                return { ...u, _flash: action.flash };
            });
            return { ...state, units: next };
        }
        case 'SET_VISUAL': {
            let next = state.units.map(u => {
                if (u.uid !== action.uid) return u;
                const patch = {};
                if (action._acted !== undefined) patch._acted = action._acted;
                if (action._resting !== undefined) patch._resting = action._resting;
                if (action._blocked !== undefined) patch._blocked = action._blocked;
                if (action._isDead !== undefined) patch._isDead = action._isDead;

                        if (p._resting !== undefined) next[idx]._resting = p._resting;
                        if (p._blocked !== undefined) next[idx]._blocked = p._blocked;
                        if (p._phantomTarget !== undefined) next[idx]._phantomTarget = p._phantomTarget;
                        if (p._masteredRoles !== undefined) next[idx]._masteredRoles = p._masteredRoles;
                        if (ev.eventType === 'zhang-switch') {
                            if (p.rangedForm !== undefined) next[idx].rangedForm = p.rangedForm;
                            if (p.role) next[idx].role = p.role;
                        }
                    }
                } else if (ev.eventType === 'unit-add') {
                    const p = ev.payload;
                    if (!next.find(u => u.uid === p.uid)) {
                        next.push({
                            uid: p.uid, name: p.name, role: p.role, camp: p.camp, pos: p.pos,
                            hp: p.hp, maxHp: p.maxHp, atk: p.atk, def: p.def, alive: p.alive,
                            isHorse: p.isHorse || false, _isDead: p._isDead || false,
                            _phantomTarget: p._phantomTarget || null,
                            dmgDealt: 0, dmgTaken: 0, healDone: 0, reboundDone: 0, leechDone: 0,
                            dodgeCount: 0, critCount: 0, survivedRounds: 0,
                            buffAtkBonus: 0, buffDefBonus: 0, buffDodgeBonus: 0, buffHpBonus: 0,
                            _flash: null, _acted: false, _resting: false, _blocked: false
                        });
                    }
                } else if (ev.eventType === 'unit-remove') {
                    next = next.filter(u => u.uid !== ev.payload.uid);
                } else if (ev.eventType === 'pos-change') {
                    const idx = next.findIndex(u => u.uid === ev.uid);
                    if (idx >= 0) {
                        next[idx].pos = ev.pos;
                    }
                }
            }
            return { ...state, units: next };
        }
        case 'SYNC_UNIT': {
            let next = state.units.map(u => {
                if (u.uid !== action.uid) return u;
                return { ...u, ...action.fields };
            });
            return { ...state, units: next };
        }
        case 'ADD_UNIT': {
            if (state.units.find(u => u.uid === action.unit.uid)) return state;
            return { ...state, units: [...state.units, action.unit] };
        }
        case 'REMOVE_UNIT': {
            return { ...state, units: state.units.filter(u => u.uid !== action.uid) };
        }
        default: return state;
    }
}

    let lastDiv=null,healDiv=null, blockDelay=false;
    for(let entry2 of textEntries){

        if(!c.detailMode&&entry2.type==='detail'){ let hiddenDiv=document.createElement('div'); hiddenDiv.className='detail-hidden'; hiddenDiv.innerHTML=entry2.text+'<br>'; document.getElementById('log').appendChild(hiddenDiv); c.autoScrollLog(); continue; }

async function handleRoundStart(c, entry, isFirstAttackRef) {
    c.UI.round = parseInt(entry.text.match(/\d+/)[0])||1;
    if (isFirstAttackRef) isFirstAttackRef.value = true;
    let div=document.createElement('div');div.innerHTML=entry.text+'<br>';document.getElementById('log').appendChild(div);c.autoScrollLog();
    document.getElementById('roundDisplay').innerText = `📜 日志（第${c.UI.round}回合）`;
    await new Promise(r=>setTimeout(r, window._fastForwardActive ? 1 : c.speed/3));
    c.updateUI(c.UI);
}

async function handleRoundEnd(c, entry, log, i) {
    let div=document.createElement('div');div.innerHTML=entry.text + '<br>';document.getElementById('log').appendChild(div); c.autoScrollLog(); document.getElementById('roundDisplay').innerText = `📜 日志（第${c.UI.round}回合）`;
    if (c.updateBuffSlots) { c.updateBuffSlots(); }
    if (window._refreshGlowCells) window._refreshGlowCells();
    await new Promise(r=>setTimeout(r,c.speed/3));
}

function shouldStartNewGroup(entry, lastType) {
    if (!lastType) return false;
    if (lastType === 'round-end') return false;
    if (lastType === 'round-start') return false;
    if (entry.type === 'round-end') return false;
    if (entry.type === 'round-start') return false;
    if (lastType === 'attack-group' && entry.type === 'attack-group') return true;
    if (lastType === 'attack-group' && entry.type === 'info') return true;
    // buff-bonus/buff-splash 是攻击触发的效果，与攻击者之间不需要分隔符
    if (lastType === 'attack-group' && (entry.type === 'buff-bonus' || entry.type === 'buff-splash')) return false;
    if (lastType === 'attack-group' && entry.type !== 'attack-group' && entry.type !== 'info') return true;
    if (lastType !== 'attack-group' && entry.type === 'attack-group') return true;
    return false;
}

async function playLogEntries(c, log, roundResult, isFirstAttackRef) {
    let abortSig = c.abortController ? c.abortController.signal : null;
    let lastEntryType = c._lastLogType || null;

    try {
        for (let i = 0; i < log.length; i++) {
            if (abortSig && abortSig.aborted) return { isBattleOver: false };
            await c.waitWhilePaused();
            let entry = log[i];

            if (shouldStartNewGroup(entry, lastEntryType)) {
                let sepDiv = document.createElement('div');
                sepDiv.innerHTML = '<span class="separator">- - - - -</span><br>';
                document.getElementById('log').appendChild(sepDiv);
                c.autoScrollLog();
            }

            switch (entry.type) {
                case 'buff-summon':
                    await handleBuffSummon(c, entry, i > 0 ? log[i-1] : null);
                    lastEntryType = entry.type;
                    break;
                case 'buff-destroy':
                    await handleBuffDestroy(c, entry, i > 0 ? log[i-1] : null);
                    lastEntryType = entry.type;
                    break;
                case 'buff-leech':
                    if (entry.buffType === 'hotBlood') {
                        let div=document.createElement('div');div.innerHTML=entry.text+'<br>';
                        document.getElementById('log').appendChild(div);c.autoScrollLog();
                        let healUnit = c.UI.allyTeam.concat(c.UI.enemyTeam).find(u => u.uid === entry.healUnitUid);
                        if (healUnit && entry.healAmount) {
                            showHealFloat(healUnit, entry.healAmount);
                        }
                        c.isPaused = true; window.bulletTimeActive = true;
                        let bannerText = entry.text.includes('翻倍') ? '❤️‍🔥 热血奋战(翻倍)！' : '❤️ 热血奋战！';
                        await showBuffBanner(bannerText);
                        window.bulletTimeActive = false; c.isPaused = false;
                    } else {
                        await handleBuffLeech(c, entry);
                    }
                    lastEntryType = entry.type;
                    break;
                case 'buff-splash':
                    c.isPaused = true; window.bulletTimeActive = true;
                    if (entry.buffType === 'wind_assault') await showBuffBanner('🦅 乘风突袭！');
                    else if (entry.buffType === 'meteor_splash') await showBuffBanner('☄️ 流星赶月！');
                    else await showBuffBanner('🦅 乘风突袭！');
                    window.bulletTimeActive = false;
                    let div=document.createElement('div');div.innerHTML=entry.text+'<br>';
                    document.getElementById('log').appendChild(div);c.autoScrollLog();
                    if (entry.splashUids && entry.splashDmg) {
                        if (entry.attackerUid && entry.primaryUid) {
                            let attacker = c.UI.allyTeam.concat(c.UI.enemyTeam).find(u => u.uid === entry.attackerUid);
                            let primary = c.UI.allyTeam.concat(c.UI.enemyTeam).find(u => u.uid === entry.primaryUid);
                            let splashTargets = entry.splashUids.map(uid => c.UI.allyTeam.concat(c.UI.enemyTeam).find(u => u.uid === uid)).filter(u => u);
                            if (attacker && primary && splashTargets.length > 0) showSplashArrows(attacker, primary, splashTargets, c.speed, () => c.isPaused);
                        }
                        entry.splashUids.forEach(uid => {
                            let targetUnit = c.UI.allyTeam.concat(c.UI.enemyTeam).find(u => u.uid === uid);
                            if (targetUnit) {
                                // 流星赶月溅射掉血字幕延迟0.15s，让分裂箭飞完再飘
                                if (entry.buffType === 'meteor_splash') {
                                    setTimeout(() => showDamageFloat(targetUnit, entry.splashDmg), 150);
                                } else {
                                    showDamageFloat(targetUnit, entry.splashDmg);
                                }
                            }
                        });
                    }
                    if (entry.buffType === 'meteor_splash') await new Promise(r=>setTimeout(r, window._fastForwardActive ? 1 : 600));
                    c.isPaused = false;
                    lastEntryType = entry.type;
                    break;
                case 'buff-bonus':           await handleBuffBonus(c, entry); lastEntryType = entry.type; break;
                case 'buff-swap':            await handleBuffSwap(c, entry); lastEntryType = entry.type; break;
                case 'buff-push':            await handleBuffPush(c, entry); lastEntryType = entry.type; break;
                case 'buff-summary':         { let div2=document.createElement('div');div2.innerHTML=entry.text+'<br>';document.getElementById('log').appendChild(div2);c.autoScrollLog(); if(entry.buffType==='elite_xingfen'){let song=c.UI.allyTeam.concat(c.UI.enemyTeam).find(u=>u.name==='宋青书');if(song)c.store.dispatch({type:'SET_VISUAL',uid:song.uid,_hasXingFen:true});} lastEntryType = entry.type; } break;
                case 'buff-rebound-fortify': await handleBuffReboundFortify(c, entry); lastEntryType = entry.type; break;
                case 'round-start':
                    // 重置所有单位的已行动状态
                    c.UI.allyTeam.forEach(u => { if (u.alive) c.store.dispatch({ type: 'SET_VISUAL', uid: u.uid, _acted: false }); });
                    c.UI.enemyTeam.forEach(u => { if (u.alive) c.store.dispatch({ type: 'SET_VISUAL', uid: u.uid, _acted: false }); });
                    // 先应用回合开始事件，再渲染 UI，避免 buffDefBonus 等延迟一帧
                    if (roundResult && roundResult.events && roundResult.events.length > 0) {
                        c.store.dispatch({ type: 'APPLY_EVENTS', events: roundResult.events });
                        roundResult.events = [];
                    }
                    await handleRoundStart(c, entry, isFirstAttackRef);
                    if (roundResult && roundResult.doubleStrikeUid) {
                        c.currentDoubleStrikeUid = roundResult.doubleStrikeUid;
                    }
                    c.updateUI(c.UI);
                    lastEntryType = entry.type;
                    break;
                case 'attack-group': {
                    let result = await handleAttackGroup(c, entry, roundResult, abortSig, isFirstAttackRef);
                    // 动画完成后立即应用本组事件，保证血量在下一个 attack-group 开始前已同步
                    if (entry._events && entry._events.length > 0) {
                        c.store.dispatch({ type: 'APPLY_EVENTS', events: entry._events });
                    }
                    lastEntryType = entry.type;
                    if (result && result.isBattleOver) return result;
                    break;
                }
                case 'info':  await handleInfo(c, entry); lastEntryType = entry.type; break;
                case 'round-end': await handleRoundEnd(c, entry, log, i); lastEntryType = entry.type; break;
            }

            if (abortSig && abortSig.aborted) return { isBattleOver: false };
        }
    } catch (e) {
        window.bulletTimeActive = false;
        console.error('playLogEntries 错误:', e);
        return { isBattleOver: false };
    }
    c._lastLogType = lastEntryType;
    return { isBattleOver: false };
}

async function playBattle() {
    const c = getCtx();
    if (!c || !c.snapshot || !c.snapshot.ally || !c.snapshot.ally.length) return;
    const scheduler = new AnimationScheduler();
    c._scheduler = scheduler;

    GlobalStore.effect('fastForwardActive', (isActive) => {
        if (isActive) {
            if (!c._originalSpeed) c._originalSpeed = c.speed;
            c.speed = 1;
            if (c._scheduler && c._scheduler.setSpeed) c._scheduler.setSpeed(50);
        } else {
            c.speed = c._originalSpeed || 500;
            if (c._scheduler && c._scheduler.setSpeed) c._scheduler.setSpeed(1);
        }
    });

    let lastTime = performance.now();
    function frameLoop() {
        const now = performance.now();
        if (c.isPaused) {
            window.bulletTimeActive = false;
            lastTime = now;
            if (!c._battleEnded) requestAnimationFrame(frameLoop);
            return;
        }
        scheduler.paused = false;
        scheduler.tick(Math.min(now - lastTime, 100));
        lastTime = now;
        if (!c._battleEnded) requestAnimationFrame(frameLoop);
    }
    requestAnimationFrame(frameLoop);

    let abortSig = c.abortController ? c.abortController.signal : null;
    c._battleEnded = false;

    const initialUnits = [
        ...c.snapshot.ally.map(u => { let u2 = u.clone(); u2.hp = u2.maxHp; u2.alive = true; u2._isDead = false; u2._flash = null; u2._acted = false; u2._resting = false; u2._blocked = false; u2.camp = 'ally'; return u2; }),
        ...c.snapshot.enemy.map(u => { let u2 = u.clone(); u2.hp = u2.maxHp; u2.alive = true; u2._isDead = false; u2._flash = null; u2._acted = false; u2._resting = false; u2._blocked = false; u2.camp = 'enemy'; return u2; })
    ];
    c.store = createStore({ units: initialUnits, round: 1 }, battleReducer);
    GlobalStore.set('battleStore', c.store);
    setRenderStore(c.store);
    updateUI();

    c.store.subscribe((state) => {
        if (!c.UI || !c.UI.allyTeam || !c.UI.enemyTeam) return;
        const syncFields = (uiUnit) => {
            const su = state.units.find(u => u.uid === uiUnit.uid);
            if (!su) return;
            GAME_STATE_FIELDS.forEach(f => { if (su[f] !== undefined) uiUnit[f] = su[f]; });
            if (su._flash !== undefined) uiUnit._flash = su._flash;
            if (su._acted !== undefined) uiUnit._acted = su._acted;
            if (su._resting !== undefined) uiUnit._resting = su._resting;
            if (su._blocked !== undefined) uiUnit._blocked = su._blocked;
            if (su._isDead && !uiUnit._isDead) {
                uiUnit._isDead = true;
                uiUnit._flash = 'dead';
            }
        };
        c.UI.allyTeam.forEach(syncFields);
        c.UI.enemyTeam.forEach(syncFields);
        state.units.forEach(su => {
            if (su.camp === 'ally' && !c.UI.allyTeam.find(u => u.uid === su.uid)) c.UI.allyTeam.push({...su});
            if (su.camp === 'enemy' && !c.UI.enemyTeam.find(u => u.uid === su.uid)) c.UI.enemyTeam.push({...su});

        // 死亡后保留 3 秒展示特效，然后移除

function isUnitBenefitedByBuff(unit, buffKey, allyTeam, doubleStrikeUid, activeBuffs) {
    switch (buffKey) {
        case 'carry': return unit.pos === 5 && unit.alive;

        case 'bloodthirst': return unit.role === '战士';

            const holyBuffs = activeBuffs.filter(b => b.key === 'holyFlame');
            return holyBuffs.some(b => {
                const cols = b.cols || (b.col != null ? [b.col] : []);
                const rows = b.rows || (b.row != null ? [b.row] : []);
                return cols.includes(getUnitCol(unit.pos)) || rows.includes(getUnitRow(unit.pos));

        let buffs = [];
        for (let j = 0; j < 4; j++) {
            const choices = generateBuffChoices();
            const picked = autoPickBuff(choices, preferredBuffs);
            if (picked) buffs.push({ key: picked, target: 'ally', remaining: C.BUFFS[picked].duration || C.BUFF_DURATION });
        }
        const result = runBattle(snap, buffs);
        if (result.winner === '明教') wins.ally++;
        else if (result.winner === '六大派') wins.enemy++;
        else wins.draw++;
        if (onProgress) onProgress(i + 1, rounds);
    }
    return wins;
}

  window.autoPickBuff = autoPickBuff;
  window.runAutoBattle = runAutoBattle;

function createBuffObject(key, duration) {
    const buff = { key, target: 'ally', remaining: duration, name: CONFIG.BUFFS[key]?.name || key };
    if (key === 'holyFlame') {
        const cols = [];
        while (cols.length < 2) { const c = rand(1, 3); if (!cols.includes(c)) cols.push(c); }
        cols.sort((a, b) => a - b);
        const rows = [];
        while (rows.length < 2) { const r = rand(1, 3); if (!rows.includes(r)) rows.push(r); }
        rows.sort((a, b) => a - b);
        buff.cols = cols;
        buff.rows = rows;
    }
    return buff;
}

function generateBuffChoices(activeBuffs, allyTeam = []) {
    let activeBuffKeys = activeBuffs.map(b => b.key);
    let available = ALL_BUFF_KEYS.filter(k => {
        if (activeBuffKeys.includes(k)) return false;
        // 严阵以待：首次选海克斯不出现，必须3回合后
        if (k === 'fortify' && !activeBuffs.some(b => b.remaining > 0)) return false;
        const requiredRole = C.BUFF_ROLE_REQUIREMENTS[k];
        if (requiredRole && !allyTeam.some(u => u.alive && u.role === requiredRole)) return false;
        return true;
    });
    let shuffled = [...available].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, C.BUFF_CHOICES);
}

function updateBuffSlots(activeBuffs, selectedBuffIndex) {
    for (let i = 0; i < 2; i++) {
        let slot = document.getElementById('buffSlot' + i);
        if (!slot) continue;
        if (i < activeBuffs.length) {
            let buff = activeBuffs[i];
            slot.textContent = buff.name + '/' + buff.remaining + '回';
            slot.classList.add('glow');
            if (selectedBuffIndex === i) slot.classList.add('active');
            else slot.classList.remove('active');
        } else {
            slot.textContent = 'buff' + (i + 1);
            slot.classList.remove('active', 'glow');
        }
    }
}

function tickBuffDurations(activeBuffs, selectedBuffIndex, updateBuffSlotsFn) {
    activeBuffs = activeBuffs.map(b => ({...b, remaining: b.remaining - 1})).filter(b => b.remaining > 0);
    if (selectedBuffIndex >= activeBuffs.length) selectedBuffIndex = -1;
    updateBuffSlotsFn();
    return { activeBuffs, selectedBuffIndex };
}

function getActiveBuffList(activeBuffs) {
    return activeBuffs.map(b => b.name + '(' + b.remaining + '回)').join('、') || '无';

function logTeamInfo(label, UI, gs, battleResultForInfo, activeBuffs, hasLoggedTeam) {

    let appendDiv = (html) => { let d = document.createElement('div'); d.innerHTML = html + '<br>'; logDiv.appendChild(d); };
    let lbl = label || '阵容详情', contextNote = '';
    if (gs === 'RUNNING' || gs === 'PAUSED') contextNote = `（当前：第${UI.round||'?'}回合${gs==='PAUSED'?' 已暂停':''}）`;
    else if (gs === 'GAMEOVER') contextNote = '（当前：战斗已结束）';
    else contextNote = '（当前：准备阶段）';
    appendDiv(`<div class="separator">📋 ${lbl} ${contextNote}</div>`);
    appendDiv(`<span class="gold">[Buff: ${getActiveBuffList(activeBuffs)}]</span>`);
    let hasStats = (gs === 'GAMEOVER' && battleResultForInfo) || gs === 'RUNNING' || gs === 'PAUSED';
    [
        {name:'明教', color:'blue', data:ally},
        {name:'六大派', color:'orange', data:enemy}
    ].forEach(camp => {
        appendDiv(`<span class="${camp.color}">【${camp.name}】</span>`);
        camp.data.forEach(u => {
            let aliveText = u.alive ? '存活' : '💀阵亡';
            let displayPos = u.pos === -1 ? (u._originalPos || '?') : u.pos;
            let infoParts = [
                `${u.name}(${u.role} M${u.m})`,
                u.isHorse ? '[拒马]' : '',
                `站位${displayPos}`,
                `攻${Math.floor(u.atk)} 防${Math.floor(u.def)}`,
                `血${Math.floor(u.hp)}/${Math.floor(u.maxHp)}`,
                aliveText,
                u.isZhang ? '[无忌]' : '',
                u.isWei ? '[韦一笑]' : ''
            ].filter(Boolean);
            appendDiv('  ' + infoParts.join(' '));
            let statParts = [];
            if (hasStats) {
                if (u.dmgDealt !== undefined && u.dmgDealt > 0) statParts.push(`输出${u.dmgDealt}`);
                if (u.dmgTaken !== undefined && u.dmgTaken > 0) statParts.push(`承伤${u.dmgTaken}`);
            }
            if (u.dodgeCount > 0) statParts.push(`闪避${u.dodgeCount}次`);
            if (u.healDone > 0) statParts.push(`治疗${u.healDone}`);
            if (u.reboundDone > 0) statParts.push(`反弹${u.reboundDone}`);
            if (u.leechDone > 0) statParts.push(`吸血${u.leechDone}`);
            if (u.critCount > 0) statParts.push(`暴击${u.critCount}次`);

            if (statParts.length > 0) appendDiv('    └ ' + statParts.join(' | '));
        });
    });

}

    function hexToRgb(hex) { const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 }; }
    function resizeCanvas() { const rect = battlefield.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height; }
    function collectCellsData() {
        let buffKey = (selectedBuffIndex >= 0 && selectedBuffIndex < getState.activeBuffs().length) ? getState.activeBuffs()[selectedBuffIndex].key : null;
        const allCells = document.querySelectorAll('#allyGrid .cell.occupied');
        const battlefieldRect = battlefield.getBoundingClientRect();
        cellsLightData = [];
        allCells.forEach(cell => {
            let pos = parseInt(cell.dataset.pos);
            if (isNaN(pos)) return;

            if (buffKey && buffKey !== 'doubleStrike' && !isUnitBenefitedByBuff(unit, buffKey, getState.UI().allyTeam)) return;
            const rect = cell.getBoundingClientRect();
            cellsLightData.push({ cell, frame: { x: rect.left - battlefieldRect.left + 1, y: rect.top - battlefieldRect.top + 1, w: rect.width - 2, h: rect.height - 2, color: currentLightColor, rgb: hexToRgb(currentLightColor) }, lights: [] });
        });
        cellsLightData.forEach(data => { if (data.lights.length === 0) for (let i = 0; i < 3; i++) data.lights.push({ progress: i / 3 }); });
    }
    function getPointOnPath(frame, p) {
        const perimeter = 2 * (frame.w + frame.h); p = ((p % 1) + 1) % 1; const dist = p * perimeter;
        if (dist <= frame.w) return { x: frame.x + dist, y: frame.y };
        else if (dist <= frame.w + frame.h) return { x: frame.x + frame.w, y: frame.y + (dist - frame.w) };
        else if (dist <= 2 * frame.w + frame.h) return { x: frame.x + frame.w - (dist - frame.w - frame.h), y: frame.y + frame.h };
        else return { x: frame.x, y: frame.y + frame.h - (dist - 2 * frame.w - frame.h) };
    }
    function drawLight(data, time) {}
    let lastTime = 0;
    function animate(time) {}
    resizeCanvas(); collectCellsData(); requestAnimationFrame(animate);
    window.addEventListener('resize', () => { resizeCanvas(); collectCellsData(); });
}

            {text:'📋 复制全部日志', value:'all', cls:'buff'}
        ], (choice)=>{
            let logDiv=document.getElementById('log');
            let lines=[];
            let seen=new Set();
            const allDivs = logDiv.querySelectorAll('div');
            allDivs.forEach(div=>{
                let t=div.textContent||'';
                t=t.trim();
                if(!t) return;
                if(t.includes('回合开始')||t.includes('回合结束')){
                    let key=t.substring(0,20);
                    if(seen.has(key)) return;
                    seen.add(key);
                }
                if(t.includes('初始阵容')||t.includes('阵容详情')){
                    let key=t.substring(0,15);
                    if(seen.has(key)) return;
                    seen.add(key);
                }
                if(t.includes('获得Buff')){
                    // Buff 获取日志不做去重，始终保留
                }
                if(choice==='health'){
                    if(t.includes('[体检]')) lines.push(t);

                } else {
                    lines.push(t);
                }
            });
            let text=lines.join('\n');
            if(!text.trim()){showAlert('没有匹配的日志');return;}

<div id="pwaInstallBar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#2c1810;color:#ffd700;padding:10px 14px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-family:monospace;">
    <span>📲 添加到桌面，体验更流畅</span>
    <div style="display:flex;gap:8px;">
        <button id="pwaInstallBtn" style="background:#b8860b;border:none;color:#fff;padding:6px 14px;border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;">安装</button>
        <button id="pwaDismissBtn" style="background:transparent;border:1px solid #666;color:#999;padding:6px 10px;border-radius:4px;font-size:13px;cursor:pointer;">✕</button>
    </div>
    </div>
<script>
    (function(){
        var deferredPrompt;
        var bar = document.getElementById('pwaInstallBar');
        var installBtn = document.getElementById('pwaInstallBtn');
        var dismissBtn = document.getElementById('pwaDismissBtn');

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            bar.style.display = 'flex';
        });

        installBtn.addEventListener('click', function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(r) {
                    bar.style.display = 'none';
                    deferredPrompt = null;
                });
            } else {
                // 国产浏览器备用：提示用户手动操作
                alert('请点击浏览器菜单 → "添加到桌面" 或 "添加快捷方式"');
            }
        });

        dismissBtn.addEventListener('click', function() {
            bar.style.display = 'none';
        });

        // 3秒后自动显示（国产浏览器不触发 beforeinstallprompt）
        setTimeout(function() {
            if (!deferredPrompt && bar.style.display === 'none') {
                bar.style.display = 'flex';
            }
        }, 3000);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    })();
    </script>
