    <script>
    window.addEventListener('error', function(e) {
        var panel = document.getElementById('errorCapturePanel') || (function(){
            var p = document.createElement('div');
            p.id = 'errorCapturePanel';
            p.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:25vh;overflow-y:auto;background:rgba(20,0,0,0.92);color:#f88;font-size:10px;z-index:99999;padding:4px 8px;font-family:monospace;display:none;';
            document.body.appendChild(p);
            return p;
        })();
        panel.style.display = 'block';
        var line = document.createElement('div');
        line.style.marginBottom = '4px';
        line.textContent = '[模块加载错误] ' + (e.message || e.filename || '未知错误');
        panel.appendChild(line);
    });
    window.addEventListener('unhandledrejection', function(e) {
        var panel = document.getElementById('errorCapturePanel');
        if (panel) {
            panel.style.display = 'block';
            var line = document.createElement('div');
            line.style.marginBottom = '4px';
            line.textContent = '[Promise错误] ' + String(e.reason);
            panel.appendChild(line);
        }
    });
    </script>

let gameData = null;

async function loadGameData() {
    if (gameData) return gameData;
    try {
        const resp = await fetch('./content/64game-data.json');
        gameData = await resp.json();
        return gameData;
    } catch (e) {
        console.warn('游戏数据加载失败，使用内置默认值', e);
        return null;
    }
}

function getGameData() {
    return gameData;
}

function getSkillParams(characterName, skillKey) {
    const ch = gameData?.characters?.[characterName];
    const skill = ch?.skills?.[skillKey];
    return skill?.params || null;
}

function getSkillParamsJealous(characterName, skillKey) {
    const ch = gameData?.characters?.[characterName];
    const skill = ch?.skills?.[skillKey];
    return skill?.paramsJealous || null;
}

function getSkillName(characterName, skillKey) {
    const ch = gameData?.characters?.[characterName];
    const skill = ch?.skills?.[skillKey];
    return skill?.name || skillKey;
}

function getSkillDesc(characterName, skillKey, jealous) {
    const ch = gameData?.characters?.[characterName];
    const skill = ch?.skills?.[skillKey];
    if (!skill) return '';
    const template = jealous ? (skill.descJealous || skill.desc) : skill.desc;
    const params = jealous ? (skill.paramsJealous || skill.params) : (skill.params || {});
    // 替换 {key} 占位符
    return template.replace(/\{(\w+)\}/g, (_, key) => {
        let val = params[key];
        if (val === undefined || val === null) return `{${key}}`;
        if (Array.isArray(val)) return val.map(v => v + '%').join('→');
        if (key.toLowerCase().includes('ratio') || key === 'currentHpRatio') return val + '%';
        return val;
    });
}

function calcDamage(atk, def) { if (def <= 0) return atk; let d = atk * (atk / (atk + def)); return Math.max(d, atk * 0.1); }
function getFangLevel(def, m) { let ratio = def / m; for (let i = C.FANG_LEVELS.length - 1; i >= 0; i--) { if (ratio >= C.FANG_LEVELS[i]) return i; } return 0; }

/**
 * 飞行突进选目标：后排优先、中排次之、前排最后
 * 返回可选目标，无则返回 null
 */
function selectFlyTarget(unit, enemySide) {
    if (unit.role !== '飞行' || unit.isWei) return null; // 韦一笑有自己的选目标逻辑
    const alive = enemySide.filter(u => u.alive && !(u.state._flyMode === 'butterfly') && !(u.state._flyMode === 'spider') && !u.state._spiderFlying && !(u._fsm && (u._fsm.is('attached') || u._fsm.is('flying'))));
    if (alive.length === 0) return null;

    // 优先顺序：后排(789) > 中排(456) > 前排(123)
    const backRow = [7,8,9], midRow = [4,5,6], frontRow = [1,2,3];
    const priorityOrder = [...backRow, ...midRow, ...frontRow];
    
    // 获取第一排空位
    const occupiedFront = new Set(alive.filter(u => [1,2,3].includes(u.pos)).map(u => u.pos));
    const emptySlots = [1,2,3].filter(p => !occupiedFront.has(p));
    if (emptySlots.length === 0) return null; // 第一排全满，无法入场

    // 按优先级找目标
    for (const pos of priorityOrder) {
        const target = alive.find(u => u.pos === pos);
        if (!target) continue;
        
        // 找能攻击到目标的攻击位置（十字相邻）
        const col = (target.pos - 1) % 3 + 1;
        const row = Math.ceil(target.pos / 3);
        const attackPositions = [];
        // 上
        if (row > 1) attackPositions.push(target.pos - 3);
        // 下
        if (row < 3) attackPositions.push(target.pos + 3);
        // 左
        if (col > 1) attackPositions.push(target.pos - 1);
        // 右
        if (col < 3) attackPositions.push(target.pos + 1);

        // 检查是否有空位能到达某个攻击位置
        for (const attackPos of attackPositions) {
            for (const slot of emptySlots) {
                if (canReach(slot, attackPos, alive)) {
                    return target;
                }
            }
        }
    }
    return null;
}

/**
 * 判断从空位 slot 到目标位置 targetPos 是否有直线无障碍路径
 */
function canReach(slot, targetPos, enemies) {
    const slotCol = (slot - 1) % 3 + 1;
    const slotRow = Math.ceil(slot / 3);
    const targetCol = (targetPos - 1) % 3 + 1;
    const targetRow = Math.ceil(targetPos / 3);

    // 同列：纵向移动
    if (slotCol === targetCol) {
        const minRow = Math.min(slotRow, targetRow);
        const maxRow = Math.max(slotRow, targetRow);
        for (let r = minRow; r <= maxRow; r++) {
            const checkPos = (r - 1) * 3 + slotCol;
            // 终点位置可以有人（那是要停的位置），但路径中间不能有敌方阻挡
            if (checkPos !== targetPos && enemies.some(e => e.pos === checkPos && e.alive)) {
                return false;
            }
        }
        return true;
    }

    // 同行：横向移动
    if (slotRow === targetRow) {
        const minCol = Math.min(slotCol, targetCol);
        const maxCol = Math.max(slotCol, targetCol);
        for (let c = minCol; c <= maxCol; c++) {
            const checkPos = (slotRow - 1) * 3 + c;
            if (checkPos !== targetPos && enemies.some(e => e.pos === checkPos && e.alive)) {
                return false;
            }
        }
        return true;
    }

    // 不同行不同列：需要拐弯。先横后竖或先竖后横，两条路都试试
    // 先横向再纵向
    const corner1 = (slotRow - 1) * 3 + targetCol;
    if (!enemies.some(e => e.pos === corner1 && e.alive) || corner1 === targetPos) {
        // 横向段（slot → corner1，不含起点）
        const minCol1 = Math.min(slotCol, targetCol);
        const maxCol1 = Math.max(slotCol, targetCol);
        let blocked = false;
        for (let c = minCol1; c <= maxCol1; c++) {
            const p = (slotRow - 1) * 3 + c;
            if (p !== slot && p !== corner1 && enemies.some(e => e.pos === p && e.alive)) {
                blocked = true; break;
            }
        }
        if (!blocked) {
            const minRow1 = Math.min(slotRow, targetRow);
            const maxRow1 = Math.max(slotRow, targetRow);
            for (let r = minRow1; r <= maxRow1; r++) {
                const p = (r - 1) * 3 + targetCol;
                if (p !== corner1 && p !== targetPos && enemies.some(e => e.pos === p && e.alive)) {
                    blocked = true; break;
                }
            }
        }
        if (!blocked) return true;
    }

    // 先纵向再横向
    const corner2 = (targetRow - 1) * 3 + slotCol;
    if (!enemies.some(e => e.pos === corner2 && e.alive) || corner2 === targetPos) {
        const minRow2 = Math.min(slotRow, targetRow);
        const maxRow2 = Math.max(slotRow, targetRow);
        let blocked = false;
        for (let r = minRow2; r <= maxRow2; r++) {
            const p = (r - 1) * 3 + slotCol;
            if (p !== slot && p !== corner2 && enemies.some(e => e.pos === p && e.alive)) {
                blocked = true; break;
            }
        }
        if (!blocked) {
            const minCol2 = Math.min(slotCol, targetCol);
            const maxCol2 = Math.max(slotCol, targetCol);
            for (let c = minCol2; c <= maxCol2; c++) {
                const p = (targetRow - 1) * 3 + c;
                if (p !== corner2 && p !== targetPos && enemies.some(e => e.pos === p && e.alive)) {
                    blocked = true; break;
                }
            }
        }
        if (!blocked) return true;
    }

    return false;
}

function getBloodAuraBonus(allUnits) {
    let totalBonus = 0;

}

/**

 */
function getAuraBonuses(unit, allySide, enemySide) {

function registerWarriorExecute(eventBus) {

        const { unit, target, allySide, declarations } = data;
        if (unit.role !== '战士' || !unit.alive) return;
        if (!target || !target.alive || target.hp <= 0) return;
        const unitBuffs = (allySide && allySide._activeBuffs) || [];

    function tryFortify(unit, chance, group, log, label, skipStatChange) {
        if (unit.role !== '防战') return;
        if (unit._fortifyThisRound === undefined) unit._fortifyThisRound = 0;
        if (!unit._fortifyStacks) unit._fortifyStacks = 0;
        const increment = unit._fortifyIncrement || 1;
        const cap = unit._fortifyCap || 3;
        if (unit._fortifyThisRound + increment > cap) return;
        if (getBattleRng().nextInt(1, 100) > chance) return;
        unit._fortifyStacks += increment;
        unit._fortifyThisRound += increment;
        if (!skipStatChange) {
            applyStatChange(unit, 'def', increment, null, '坚盾');
        }
        if (unit._baseDef !== undefined) unit._baseDef += increment;
        const text = `<span class="blue small">🛡️ ${unit.name} ${label}：防御+${increment}（已叠${unit._fortifyThisRound}/${cap}）</span>`;
        if (group && group.entries) {
            group.entries.push({type:'detail', text});
        } else if (log) {
            log.push({type:'detail', text});
        }
    }

    // 被攻击时触发（60% 概率）
    eventBus.on('afterDamageApplied', L.AFTER_DAMAGE_APPLIED.SHIELD_DEFEND, (data) => {
        const { target, dmg, group } = data;
        if (dmg <= 0) return;
        const prevStacks = target._fortifyStacks || 0;
        tryFortify(target, 60, group, null, '坚盾', true);
        if ((target._fortifyStacks || 0) > prevStacks) {
            const increment = (target._fortifyStacks || 0) - prevStacks;
            if (!data.declarations) data.declarations = [];
            data.declarations.push({
                type: 'statChange',
                field: 'def',
                delta: increment,
                target: target,
                logText: null
            });
        }
    });

    // 攻击时触发（80% 概率，与被攻击共享每回合上限）
    eventBus.on('afterAttack', L.AFTER_ATTACK.SHIELD_ATTACK, (data) => {
        const { unit, group, log } = data;
        tryFortify(unit, 80, group, log, '攻盾');
    });
}

function registerDoubleStrike(eventBus, doubleStrikeUnitUid, allyTeam, activeBuffs) {

    }

 * @param {Unit} unit - 小昭妹妹单位
 * @returns {{ atk: number, def: number, hp: number }} 精通加成的绝对值
 */
function computeButterflyMastery(unit) {
    if (!unit.isXiaoZhaoBrother || !unit._masteredRoles) return { atk: 0, def: 0, hp: 0 };
    const count = unit._masteredRoles.length;
    let layers = count;
    if (count >= 4) layers = count + 2;
    const m = getSkillParams('小昭', 'mastery') || { atkPer: 2, defPer: 2, hpPer: 5 };
    return {
        atk: layers * (m.atkPer || 2),
        def: layers * (m.defPer || 2),
        hp: layers * (m.hpPer || 5)
    };
}

/**
 * 应用 carry 加成（绝对值），含激活和清除逻辑
 * @param {Unit} unit - 当前单位
 * @param {Unit[]} A - 己方存活单位
 * @param {object} state - 战斗状态，需包含 allAllies
 * @param {string[]} log - 日志数组
 * @param {object} stats - computeBuffStats 的返回值
 */
function applyCarryBonus(unit, A, state, log, stats) {
    if (unit.camp !== 'ally') return;
    const activeBuffs = A._activeBuffs || [];
    const hasCarryActive = hasBuff(activeBuffs, 'carry');
    const sister = A.some(a => a.isXiaoZhaoSister && a.alive);
    const carryPositions = sister ? [4, 5, 6] : [5];

    if (hasCarryActive && carryPositions.includes(unit.pos) && unit._baseMaxHp !== undefined && !unit.isHorse && !unit.isXiaoZhaoSister && !unit.isXiaoZhaoBrother) {
        // carry 生效：先回到基础血上限，再叠加本次 carry 加成
        applyMaxHpChange(unit, unit._baseMaxHp, null, 'carry归位血上限');
        applyStatChange(unit, 'atk', (unit._baseAtk || unit.atk) + (unit._butterflyAtkBonus || 0) - unit.atk, null, 'carry归位');
        applyStatChange(unit, 'def', (unit._baseDef || unit.def) + (unit._butterflyDefBonus || 0) - unit.def, null, 'carry归位');

        const oldCarryAtk = unit._carryAtkBonus || 0;
        const oldCarryDef = unit._carryDefBonus || 0;
        unit._carryAtkBonus = Math.floor(stats.carryAtkAbs);
        unit._carryDefBonus = Math.floor(stats.carryDefAbs);
        unit._carryHpBonus = Math.floor(stats.carryHpAbs);

        const atkDelta = unit._carryAtkBonus - oldCarryAtk;
        const defDelta = unit._carryDefBonus - oldCarryDef;
        if (atkDelta !== 0) applyStatChange(unit, 'atk', atkDelta, null, 'carry激活');
        if (defDelta !== 0) applyStatChange(unit, 'def', defDelta, null, 'carry激活');

        if (unit._carryHpBonus) {
            let newMaxHp = Math.min(unit._baseMaxHp + unit._carryHpBonus, unit._baseMaxHp * 2);
            applyMaxHpChange(unit, newMaxHp, null, 'carry血上限提升');
        }

        if (stats.carryAtkAbs || stats.carryDefAbs || stats.carryHpAbs) {
            log.push({ type:'info', text:`<span class="gold">👑 carry：${unit.name} 获得队友属性加成 攻+${stats.carryAtkAbs} 防+${stats.carryDefAbs} 血上限+${stats.carryHpAbs}</span>` });
        }
    } else if (!unit.isHorse && !hasCarryActive && !unit.isXiaoZhaoSister && !unit.isXiaoZhaoBrother) {
        // carry 消失：清除加成，恢复基值
        if (carryPositions.includes(unit.pos) && (unit._carryAtkBonus || unit._carryDefBonus || unit._carryHpBonus)) {
            if (unit._carryHpBonus) applyMaxHpChange(unit, unit._baseMaxHp, null, 'carry清除血上限');
            const clearAtk = unit._carryAtkBonus || 0;
            const clearDef = unit._carryDefBonus || 0;
            unit._carryAtkBonus = 0;
            unit._carryDefBonus = 0;
            unit._carryHpBonus = 0;
            applyStatChange(unit, 'atk', -clearAtk, null, 'carry清除');
            applyStatChange(unit, 'def', -clearDef, null, 'carry清除');
        }
    }
}

function computeBuffStats(unit, activeBuffs, allyTeam) {
    let atkBonus = 0, defBonus = 0, dodgeBonus = 0, hpBonus = 0;
    if (!activeBuffs) return { atkBonus, defBonus, dodgeBonus, hpBonus };

    // carry 加成是绝对值，单独返回

    const hasCarry = hasBuff(activeBuffs, 'carry');
    if (hasCarry && unit.alive && allyTeam) {
        const hasSister = allyTeam.some(u => u.isXiaoZhaoSister && u.alive);
        if (hasSister) {
            const bonus = calcCarryBonus_Sister(unit, allyTeam);
            carryAtkAbs = bonus.atkAbs; carryDefAbs = bonus.defAbs; carryHpAbs = bonus.hpAbs;
        } else {
            const bonus = calcCarryBonus_Normal(unit, allyTeam);
            carryAtkAbs = bonus.atkAbs; carryDefAbs = bonus.defAbs; carryHpAbs = bonus.hpAbs;
        }
    }

    // ---- 严阵以待防御（比率） ----
    if (hasBuff(activeBuffs, 'fortify') && unit.role === '防战' && unit.camp === 'ally') {
        if (allyTeam && allyTeam.some(u => u.isXiaoZhaoSister && u.alive)) applyFortifyDef_Sister(unit, { defBonus });
        else applyFortifyDef_Normal(unit, { defBonus });
    } else if (unit.isXiaoZhaoBrother && query('xiaoPermanentActive', unit, activeBuffs, 'fortify') && unit.role === '防战') {
        applyFortifyDef_Brother(unit, { defBonus });
    }

    // ---- 流云身法闪避 ----
    if (hasBuff(activeBuffs, 'cloudBody') && unit.camp === 'ally') {
        if (allyTeam && allyTeam.some(u => u.isXiaoZhaoSister && u.alive)) applyCloudBodyDodge_Sister(unit, { dodgeBonus });
        else applyCloudBodyDodge_Normal(unit, { dodgeBonus });
    } else if (unit.isXiaoZhaoBrother && query('xiaoPermanentActive', unit, activeBuffs, 'cloudBody')) {
        applyCloudBodyDodge_Brother(unit, { dodgeBonus });
    }

    // ---- 小昭变身精通加成 ----
    let masteryAtkAbs = 0, masteryDefAbs = 0, masteryHpAbs = 0;
    if (unit.isXiaoZhaoBrother) {
        const mastery = query('butterflyMastery', unit);
        masteryAtkAbs = mastery.atk; masteryDefAbs = mastery.def; masteryHpAbs = mastery.hp;
    }

    // ---- 圣火令（比率） ----
    const holyFlameTeam = hasBuff(activeBuffs, 'holyFlame');
    if (holyFlameTeam) {
        if (allyTeam && allyTeam.some(u => u.isXiaoZhaoSister && u.alive)) applyHolyFlame_Sister(unit, allyTeam, activeBuffs, { atkBonus, defBonus });
        else applyHolyFlame_Normal(unit, allyTeam, activeBuffs, { atkBonus, defBonus });
    } else if (unit.isXiaoZhaoBrother && query('xiaoPermanentActive', unit, activeBuffs, 'holyFlame')) {
        applyHolyFlame_Brother(unit, allyTeam, activeBuffs, { atkBonus, defBonus });
    }

    return { atkBonus, defBonus, dodgeBonus, hpBonus, carryAtkAbs, carryDefAbs, carryHpAbs, masteryAtkAbs, masteryDefAbs, masteryHpAbs };
}

function spawnHorse(allyTeam, log, enemyTeam, force = false) {
    let buffs = allyTeam._activeBuffs || [];
    if (!force && !hasBuff(buffs, 'horseFormation')) return;
    let occupiedPositions = new Set(
        allyTeam.filter(u => u.alive).map(u => u.pos)
    );
    let available = [1,2,3,4,5,6,7,8,9].filter(p => !occupiedPositions.has(p));
    if (available.length === 0) return;
    // Fisher–Yates 洗牌，确保真正的随机性
    const rng = getBattleRng();
    for (let i = available.length - 1; i > 0; i--) {
        const j = rng.nextInt(0, i);
        [available[i], available[j]] = [available[j], available[i]];
    }
    let horsePos = available[0];
    let horse = new Unit('拒马', 20, '防战', allyTeam[0].camp);
    const xiaoHEnhance = query('xiaoHexEnhance', allyTeam, allyTeam._activeBuffs || [], 'horseFormation');
    horse.atk = 0;
    if (xiaoHEnhance) {
        applyStatChange(horse, 'def', xiaoHEnhance.horseDef, null, '拒马初始化');
        applyStatChange(horse, 'maxHp', xiaoHEnhance.horseHp, null, '拒马初始化');
    } else {
        applyStatChange(horse, 'def', 5, null, '拒马初始化');
        applyStatChange(horse, 'maxHp', 25, null, '拒马初始化');
    }
    applyStatChange(horse, 'hp', horse.maxHp, null, '拒马初始化');
    horse._baseMaxHp = horse.maxHp;  // 防止 carry 误判 _baseMaxHp=0 把马打成 maxHp=0
    horse.pos = horsePos; horse.isHorse = true; horse._originalPos = horsePos;

    return horse;
}

function destroyHorse(allyTeam, log) {
    let buffs = allyTeam._activeBuffs || [];
    if (!hasBuff(buffs, 'horseFormation')) return;
    let horses = allyTeam.filter(u => u.isHorse && u.alive).sort((a, b) => b.pos - a.pos);
    if (horses.length === 0) return;

    let currentProb = 50;
    const rng = getBattleRng();
    for (const horse of horses) {
        const roll = rng.nextInt(1, 100);
        const success = roll <= currentProb;
        if (success) {
            applyStatChange(horse, 'hp', -horse.hp, null, '拒马消散');
            horse.alive = false;
            horse.state._isDead = true;
            log.push({type:'buff-destroy', text:`<span class="gray">🐴 拒马阵：${horse.pos}号位拒马消散（成功率${currentProb}%，${roll}）</span>`, buffType:'destroy', horseUid: horse.uid, needsSeparator: true});
            currentProb = Math.floor(currentProb / 2);
        } else {
            log.push({type:'info', text:`<span class="gray">🐴 拒马阵：${horse.pos}号位拒马未消散（成功率${currentProb}%，${roll}）</span>`});
            currentProb = 50;
        }
    }
}

 * @param {Array} allySide - 攻击者所在阵营
 * @param {Array} enemySide - 目标所在阵营

 * @param {Array} A - 明教方单位数组

    // 统一拦截：眩晕单位无法响应任何攻击指令

 * @param {EventBus} eventBus - 事件总线实例
 * @returns {{ skipped: boolean, retry: boolean, lockedTargetUid: string|null, missGroup?: object, dodgeGroup?: object }}
 *   返回命中结果：skipped=true 表示跳过后续伤害步骤，retry=true 需递归重试
 */
function resolveAttackHit(unit, target, attackerBuffStats, defenderBuffStats, log, A, B, doubleStrikeUnitUid, eventBus) {
    const rng = getBattleRng();
    let missChance = 0;
    if (unit.role === '远程') { missChance = 3; }
    else if (unit.role === '飞行') {
        missChance = 6;
        // 飞行攻击残血目标时，场上每有一个残血单位，未命中率 +3%
        const allUnits = [...(A || []), ...(B || [])];
        const lowHpCount = allUnits.filter(u => u.alive && u.hp / u.maxHp < 0.4).length;
        missChance += lowHpCount * 3;
    }
    else { missChance = 1; }

    if (missChance > 0 && rng.nextInt(1,100) <= missChance) {
        // 未命中 — 返回日志数据让调用方拼接
        const missData = {
            skipped: true, retry: false, lockedTargetUid: null,
            missGroup: {
                type:'attack-group', uidA:unit.uid, uidD:target.uid, entries:[], isMiss:true,
                _fxSnapshot:makeFXSnapshot(unit,target), waveTaunt:null, waveUnit:null,
                buffEffects: [], needsSeparator: true,
                combatText: `<span class="${unit.camp==='ally'?'blue':'orange'}">${unit.camp==='ally'?'明教':'六大派'} ${unit.name}</span> 的攻击`,
                infoText: `<span class="gray">未命中！</span>`
            }
        };
        unit.state._acted = true;
        missData.missGroup._events = flushBattleEvents();

        if (eventBus) {
            let afterMissData = { unit, target, log, retry: false, retryTargetUid: null };
            eventBus.emit('afterMiss', afterMissData);
            if (afterMissData.retry) {
                return { skipped: true, retry: true, lockedTargetUid: afterMissData.retryTargetUid };
            }
        }

        return missData;
    }

    const allyBuffs = (target.camp === 'ally' && A ? A._activeBuffs : (target.camp === 'enemy' && B ? B._activeBuffs : []));
    if (target.state._stunned) return { skipped: false, retry: false, lockedTargetUid: null };
    const hasCloudBody = hasBuff(allyBuffs, 'cloudBody') || ((target.isXiaoZhaoSister || target.isXiaoZhaoBrother) && target._permanentBuffs && target._permanentBuffs.some(b => b.key === 'cloudBody'));
    if (target.alive && (target.isWei || hasCloudBody || !target.state._acted)) {
        // 各闪避来源独立判定（乘法叠加），任一触发即闪避
        let dodgeTriggered = false;
        for (const ruleFn of _dodgeRules) {
            const rate = ruleFn(target, unit) || 0;
            if (rate > 0 && rng.nextInt(1, 100) <= rate * 100) {
                dodgeTriggered = true;
                break;
            }
        }
        if (!dodgeTriggered) {
            let buffDodge = defenderBuffStats.dodgeBonus || 0;
            if (buffDodge > 0 && rng.nextInt(1, 100) <= buffDodge * 100) {
                dodgeTriggered = true;
            }
        }
        // 将最终总闪避率写入单位，供面板显示（含所有规则 + Buff）
        let totalDodge = (defenderBuffStats.dodgeBonus || 0);
        for (const ruleFn of _dodgeRules) {
            totalDodge += ruleFn(target, unit) || 0;
        }
        target._dodgeChance = Math.round(totalDodge * 100);
        if (dodgeTriggered) {
            target.dodgeCount++;
            let reboundDmg = Math.floor((target.atk + target.def) * C.DODGE_REBOUND_RATIO);
            let unitHpBeforeRebound = Math.floor(unit.hp);

            // ---------- 闪避后效果声明收集 ----------
            const dodgeDeclarations = [];
            // 反击伤害提交声明
            dodgeDeclarations.push({ type: 'rebound', value: reboundDmg });
            // 眩晕提交声明
            dodgeDeclarations.push({ type: 'stun' });

            // 韦一笑吸血等组件通过 onDodge 追加声明
            eventBus.emit('onDodge', { unit, target, reboundDmg, declarations: dodgeDeclarations });

            // ---------- 裁判执行闪避后效果 ----------
            resolveDodgeEffects(dodgeDeclarations, unit, target);

            unit.state._acted = true;
            emitEvent(unit, 'hp-change', { hp: unit.hp, maxHp: unit.maxHp, alive: unit.alive, atk: unit.atk, def: unit.def, _stunned: true });

            const dodgeData = {
                skipped: true, retry: false, lockedTargetUid: null,
                dodgeGroup: {
                    type:'attack-group', uidA:target.uid, uidD:unit.uid, entries:[], isDodge:true,
                    hpAfter:unit.hp, alive:unit.alive,
                    _fxSnapshot:makeFXSnapshot(target,unit), waveTaunt:null, waveUnit:null,
                    buffEffects:[], _atkBonus:0, _defBonus:0, needsSeparator: true,
                    isDead: unit.hp <= 0,
                    combatText: `<span class="${unit.camp==='ally'?'blue':'orange'}">${unit.camp==='ally'?'明教':'六大派'} ${unit.name}</span>(攻${Math.floor(unit.atk)} 血${unitHpBeforeRebound}) → <span class="${target.camp==='ally'?'blue':'orange'}">${target.camp==='ally'?'明教':'六大派'} ${target.name}</span>(防${Math.floor(target.def)} 血${Math.floor(target.hp)})`,
                    dodgeText: `<span class="gray">🦅 ${target.name}闪避了攻击！</span>`,
                    reboundText: `<span class="red">🦅 ${target.name}反击 → ${unit.name} 造成 ${reboundDmg} 真实伤害（${unitHpBeforeRebound} → ${Math.floor(unit.hp)}）</span>`,
                    stunText: `<span class="gray">😵 ${unit.name} 被反击眩晕，本回合无法行动！</span>`,
                    weiHealData: dodgeDeclarations.find(d => d.type === 'weiHeal')?.data || null,
                    _events: flushBattleEvents()
                }
            };
            return dodgeData;
        }
    }
    return { skipped: false, retry: false, lockedTargetUid: null };
}

// ==================== 步骤3：伤害计算 ====================
/**
 * 计算本次攻击的最终伤害值
 * 第一步收集组件声明的破防/忽略防御/附加伤害/增伤倍率，第二步裁判统一结算，第三步基础伤害公式计算
 * @param {Unit} unit - 攻击者
 * @param {Unit} target - 目标
 * @param {object} attackerBuffStats - 攻击者 Buff 统计
 * @param {object} defenderBuffStats - 目标 Buff 统计
 * @param {Array} allySide - 攻击者阵营单位数组
 * @param {Array} enemySide - 目标阵营单位数组
 * @param {Array} log - 日志数组
 * @returns {{ atkBase: number, defBase: number, dmg: number, ... }} 伤害计算完整数据包
 */
function calcFinalDamage(unit, target, attackerBuffStats, defenderBuffStats, allySide, enemySide, log) {
    // ---------- 第一步：伤害声明收集 ----------
    // 组件一次性声明所有效果，格式 { type: 'breakDef'|'ignoreDef'|'bonusDmg'|'dmgMultiplier', value: number, target }
    const damageDeclarations = [];
    eventBus.emit('beforeDamageCalc', { unit, target, allySide, enemySide, log, declarations: damageDeclarations });

    // ---------- 第二步：裁判应用声明 ----------
    let defBase = Math.floor(target.def);
    let defReduced = 0;
    let ignoreDefRatio = 0;
    let bonusDmgTotal = 0;
    let dmgMultiplier = 1;

    for (const decl of damageDeclarations) {
        if (decl.type === 'breakDef') {
            const reduce = Math.min(decl.value || 0, defBase);
            defBase -= reduce;
            applyStatChange(target, 'def', -reduce, unit, '破防');
            defReduced = reduce;
            if (reduce > 0) {
                unit._pendingDefReduceEntry = {type:'detail', text:`<span class="purple small">🗡️ ${unit.name} 破防：${target.name} 防御 -${reduce}</span>`};
                emitEvent(target, 'hp-change', { hp: target.hp, maxHp: target.maxHp, alive: target.alive, atk: target.atk, def: defBase, _isDead: target.state._isDead || false });
            }
        } else if (decl.type === 'ignoreDef') {
            ignoreDefRatio = Math.max(ignoreDefRatio, decl.value || 0);
        } else if (decl.type === 'bonusDmg') {
            bonusDmgTotal += decl.value || 0;
        } else if (decl.type === 'dmgMultiplier') {
            dmgMultiplier *= decl.value || 1;
        } else if (decl.type === 'dmgReduction') {
            // 乾坤衍生减伤：追加到 bonusDmgTotal（负数）或直接调整 raw
            bonusDmgTotal -= (decl.value || 0);
        }
    }

    if (ignoreDefRatio > 0) {
        defBase = Math.floor(defBase * (1 - ignoreDefRatio));
    }

    // ---------- 第三步：基础伤害计算 ----------
    let atkBase = Math.floor(unit.atk);
    const rng = getBattleRng();
    let atkVar = rng.nextInt(1, C.ATK_VAR), defVar = rng.nextInt(1, C.DEF_VAR), hpBonus = rng.nextInt(C.HP_BONUS_MIN + 1, C.HP_BONUS_MAX);
    let atkAct = atkBase + atkVar, defAct = defBase + defVar;
    let hpBefore = Math.floor(target.hp);
    applyStatChange(target, 'hp', hpBonus, unit, '伤害波动回血');
    let waveTaunt = null, waveUnit = null;
    if (atkVar === C.ATK_VAR) { waveTaunt = getRandomTaunt(unit); waveUnit = unit; unit.critCount++; }
    else if (defVar + hpBonus >= 7) { waveTaunt = DT[rng.nextInt(0, DT.length - 1)]; waveUnit = target; }
    if (unit.isZhang && !unit.rangedForm && unit.nearAtkCount < 3) {
        let zt = getZhangNearTaunt(unit.nearAtkCount + 1);
        if (zt && !waveTaunt) { waveTaunt = zt; waveUnit = unit; }
    }
    let raw, rawFormula, hpRatio = 0;
    if (unit.role === '防战') {
        let displayDef = Math.floor(unit.def);
        let lv = getFangLevel(displayDef, unit.m), k = C.FANG_K[lv] !== undefined ? C.FANG_K[lv] : C.FANG_K[C.FANG_K.length - 1];
        let penPart = calcDamage(atkAct, defAct);
        const maxHpRatio = unit.maxHp / unit.m;
        if (maxHpRatio >= 1.85) hpRatio = 0.060;
        else if (maxHpRatio >= 1.775) hpRatio = 0.050;
        else if (maxHpRatio >= 1.725) hpRatio = 0.039;
        else if (maxHpRatio >= 1.675) hpRatio = 0.033;
        else if (maxHpRatio >= 1.60) hpRatio = 0.028;
        else if (maxHpRatio >= 1.55) hpRatio = 0.022;
        else if (maxHpRatio >= 1.475) hpRatio = 0.017;
        else if (maxHpRatio >= 1.425) hpRatio = 0.013;
        else hpRatio = 0.01;
        raw = penPart + displayDef * k + unit.maxHp * hpRatio;
    } else {
        raw = calcDamage(atkAct, defAct);
    }

    // ---------- 第四步：声明增伤结算 ----------
    raw += bonusDmgTotal;
    raw *= dmgMultiplier;

    let dmg = Math.floor(raw);
    let bonusEntries = [];
    const modifierResult = query('damageModifiers', unit, target, dmg, enemySide, allySide, log);
    dmg = modifierResult.modifiedDmg;
    bonusEntries = modifierResult.entries || [];

    return { atkBase, defBase, atkAct, defAct, hpBonus, hpBefore, waveTaunt, waveUnit, raw, rawFormula: null, thunderBonus: 0, hornDmgMultiplier: 1, hornDefIgnore: 0, trueDmg: 0, dmg, bonusEntries, defReduced, defReduction: null, bonusDmgTotal, dmgMultiplier, hpRatio: unit.role === '防战' ? hpRatio : 0 };
}

// ==================== 步骤4：应用伤害结果 ====================
/**
 * 将计算好的伤害应用到目标，处理击杀、掉落、拒马反伤、严阵以待反弹声明
 * @param {Unit} unit - 攻击者
 * @param {Unit} target - 目标
 * @param {object} dmgCalc - calcFinalDamage 的返回值（伤害计算数据包）
 * @param {Array} A - 明教方单位数组
 * @param {Array} B - 六大派方单位数组
 * @returns {{ dmg: number, dead: boolean, fortifyDeclarations: Array|null, ... }}
 */
function applyAttackResult(unit, target, dmgCalc, attackerBuffStats, defenderBuffStats, allySide, enemySide, log, A, B, state, doubleStrikeUnitUid) {
    const rng = getBattleRng();
    let { atkBase, defBase, atkAct, defAct, hpBonus, hpBefore, waveTaunt, waveUnit, raw, rawFormula, thunderBonus, hornDmgMultiplier, trueDmg, dmg, bonusEntries, defReduction } = dmgCalc;

    let hpAfter = Math.floor(target.hp) - dmg;
    let dead = hpAfter <= 0;
    applyStatChange(target, 'hp', -dmg, unit, '攻击伤害');
    if (dead) {
        target.alive = false;
        target._pendingDeath = true;
        if (!target._deathTime) target._deathTime = Date.now();
    }

    // 战士斩杀 — 已由 registerBloodthirst 通过 afterDamageApplied 声明提交并执行
    unit.dmgDealt += dmg; target.dmgTaken += dmg;
    if (dead && target.camp === 'enemy' && unit.camp === 'ally' && !target._tokenDropped) {
        const stage = getBattleState('currentStage') || 1;
        const dropRate = (C.TOKEN_DROP_RATES[stage] || 0) / 100;
        if (rng.next() < dropRate) {
            target._tokenDropped = true;
            const currentToken = getBattleState('holyToken') || 0;
            setBattleState('holyToken', currentToken + 1);
            localStorage.setItem('ming_holy_token_5v5_test', String(currentToken + 1));
            pushBattleEvent({ unitUid: unit.uid, eventType: 'info', payload: { text: `🔥 圣火令掉落！${unit.name} 击杀 ${target.name}，获得1枚圣火令！当前总数：${currentToken + 1}`, fastEntry: true } });
            log.push({type:'info', text:`<span class="gold">🔥 圣火令掉落！${unit.name} 击杀 ${target.name}，获得1枚圣火令！当前总数：${currentToken + 1}</span>`, fastEntry: true, unitUid: unit.uid});
        }
    }
    if (dead && target.camp === 'enemy' && unit.camp === 'ally' && !target._chestDropped) {
        const chestKillRate = C.CHEST_DROP_RATE / 100;
        if (rng.next() < chestKillRate) {
            target._chestDropped = true;
            let chests = parseInt(localStorage.getItem('ming_chest_count') || '0');
            chests++;
            localStorage.setItem('ming_chest_count', String(chests));
            setBattleState('chestCount', chests);
            pushBattleEvent({ unitUid: unit.uid, eventType: 'info', payload: { text: `🎁 宝箱掉落！${unit.name} 击杀 ${target.name}，获得1个宝箱！当前总数：${chests}`, fastEntry: true } });
        }
    }

    // 拒马反伤
    let horseReboundEntry = null;
    const xiaoHEnhance = query('xiaoHexEnhance', A, A._activeBuffs, 'horseFormation');
    if (target.isHorse && dmg > 0 && xiaoHEnhance && hasBuff(A._activeBuffs, 'horseFormation')) {
        const rebound = xiaoHEnhance.reboundDmg;
        applyStatChange(unit, 'hp', -rebound, target, '巨马反伤');
        horseReboundEntry = {type:'info', text:`<span class="red">🐴 巨马反伤：${unit.name} 受到 ${rebound} 点反伤</span>`};
    }

    // 防战坚盾已迁移至事件总线监听器
    emitEvent(target, 'hp-change', { hp: target.hp, maxHp: target.maxHp, alive: target.alive, atk: target.atk, def: target.def, _isDead: target.state._isDead || false });

    // 小昭姐乾坤衍生已迁移至事件总线 allyDamaged 信号

    // 严阵以待反弹 — 提交声明，由攻击后效果边裁统一执行
    let reboundEntry = null;
    let fortifyDeclarations = null;
    let allyBuffs_fortify = (target.camp === 'ally' ? A._activeBuffs : B._activeBuffs) || [];
    if (hasBuff(allyBuffs_fortify, 'fortify') && target.role === '防战' && dmg > 0) {
        const reboundDmg = Math.floor((atkAct - Math.floor(atkAct * (atkAct / (atkAct + defAct)))) / 2);
        if (reboundDmg > 0) {
            const hasSister = A && A.some(u => u.isXiaoZhaoSister && u.alive);
            fortifyDeclarations = [{
                type: 'rebound',
                value: reboundDmg,
                source: target,
                target: unit,
                hasSister,
                logText: hasSister
                    ? `<span class="gold">🛡️ 严阵以待反弹${reboundDmg}给${unit.name}（姐姐强化：回复${reboundDmg}）</span>`
                    : `<span class="gold">🛡️ 严阵以待反弹${reboundDmg}给${unit.name}</span>`
            }];
        }
    }

    return { dmg, dead, horseReboundEntry, reboundEntry, bonusEntries, hpBefore, defReduction, waveTaunt, waveUnit, rawFormula, thunderBonus, hornDmgMultiplier, trueDmg, atkAct, defAct, hpBonus, fortifyDeclarations };
}

// ==================== 死亡结算边裁 ====================
// 裁判统一裁定死亡：扫描待死亡单位 → 发射声明 → 执行死亡 → 移除
function resolveDeaths(allySide, enemySide, log) {
    const allUnits = [...allySide, ...enemySide];
    const pending = allUnits.filter(u => u._pendingDeath && u.alive);
    if (pending.length === 0) return;

    // 发射死亡前声明（预留亡语接口）
    eventBus.emit('onBeforeDeath', { units: pending, allySide, enemySide, log });

    // 执行死亡 — 走统一状态变更入口
    for (const u of pending) {
        applyStatChange(u, 'hp', -u.hp, null, '死亡结算');
        u.alive = false;
        u.state._isDead = true;
        u._pendingDeath = false;
        emitEvent(u, 'unit-remove', { uid: u.uid });
    }

    // 死亡完成后广播（被动技能监听，如张无忌前排检测）
    if (pending.length > 0) {
        eventBus.emit('onUnitDeath', { deadUnits: pending, allySide, enemySide, log });
    }
}

// ==================== 伤害免疫边裁 ====================
// 收集所有免疫声明，统一裁定本次伤害是否免疫
// 当前规则：任一声明要求免疫即免疫。预留扩展为多声明时按 priority 选一个生效
function resolveDamageImmune(declarations) {
    if (!declarations || declarations.length === 0) return null;
    const immuneDecls = declarations.filter(d => d.immune);
    if (immuneDecls.length === 0) return null;
    // 多个免疫声明时取第一个（后续可改为按 priority 排序取最优）
    return immuneDecls[0];
}

// ==================== 攻击后效果结算 ====================
/**
 * 裁判统一执行攻击后附加效果。裁决顺序：额外伤害 → 吸血 → 回血 → 溅射 → 反弹 → 属性变更 → 斩杀 → 其他
 * @param {Array} declarations - 攻击后效果声明数组，组件通过 afterDamageApplied 信号提交
 * @param {Unit} unit - 攻击者
 * @param {Unit} target - 目标
 * @param {object} group - 攻击组日志对象（未使用，预留）
 * @returns {Array} 已执行的声明列表，供调用方拼接日志
 */
function resolveAfterDamageEffects(declarations, unit, target, group) {
    if (!declarations || declarations.length === 0) return [];

    const executed = []; // 记录已执行的声明，供调用方拼接日志

    // 0. 主目标额外伤害
    for (const decl of declarations.filter(d => d.type === 'bonusDmg')) {
        if (!decl.target || !decl.target.alive) continue;
        applyStatChange(decl.target, 'hp', -(decl.value || 0), unit, '额外伤害');
        executed.push(decl);
    }

    // 1. 吸血
    for (const decl of declarations.filter(d => d.type === 'leech')) {
        if (!decl.source || !decl.source.alive) continue;
        const capped = Math.min(decl.value || 0, decl.source.maxHp - decl.source.hp);
        applyStatChange(decl.source, 'hp', capped, null, '吸血');
        decl.source.leechDone = (decl.source.leechDone || 0) + capped;
        executed.push(decl);
    }

    // 2. 回血
    for (const decl of declarations.filter(d => d.type === 'heal')) {
        if (!decl.source || !decl.source.alive) continue;
        const capped = Math.min(decl.value || 0, decl.source.maxHp - decl.source.hp);
        if (capped > 0) {
            applyStatChange(decl.source, 'hp', capped, null, '回血');
            if (decl.source.dmgTaken !== undefined) decl.source.dmgTaken -= capped;
        }
        executed.push(decl);
    }

    // 3. 溅射
    for (const decl of declarations.filter(d => d.type === 'splash')) {
        if (!decl.targets || decl.targets.length === 0) continue;
        for (const st of decl.targets) {
            if (!st.alive) continue;
            applyStatChange(st, 'hp', -(decl.value || 0), unit, '溅射');
        }
        // 流星赶月溅射触发远程成长：每命中一个目标 +2 攻
        if (unit && unit.role === '远程' && decl.buffType === 'meteor_splash') {
            const hitCount = decl.targets.filter(t => t.alive).length;
            if (hitCount > 0) {
                applyStatChange(unit, 'atk', hitCount * 2, null, '流星溅射成长');
                if (unit._baseAtk !== undefined) unit._baseAtk += hitCount * 2;
                decl.logText += ` <span class="gold">⚡ ${unit.name} 攻击+${hitCount * 2}</span>`;
            }
        }
        executed.push(decl);
    }

    // 3.5 反弹
    for (const decl of declarations.filter(d => d.type === 'rebound')) {
        if (!decl.target || !decl.target.alive) continue;
        applyStatChange(decl.target, 'hp', -(decl.value || 0), decl.source, '反弹');
        if (decl.source) decl.source.reboundDone = (decl.source.reboundDone || 0) + (decl.value || 0);
        if (decl.hasSister && decl.source && decl.source.alive) {
            applyStatChange(decl.source, 'hp', decl.value || 0, null, '反弹回复');
        }
        executed.push(decl);
    }

    // 3.5 属性变更（乾坤衍生加攻等）
    for (const decl of declarations.filter(d => d.type === 'statChange')) {
        if (!decl.target || !decl.target.alive) continue;
        applyStatChange(decl.target, decl.field, decl.delta, null, '乾坤衍生');
        if (decl.field === 'atk' && decl.target._baseAtk !== undefined) {
            decl.target._baseAtk += decl.delta;
        }
        executed.push(decl);
    }

    // 3.6 斩杀（战士斩杀等）
    for (const decl of declarations.filter(d => d.type === 'execute')) {
        if (!decl.target || !decl.target.alive) continue;
        applyStatChange(decl.target, 'hp', -decl.target.hp, decl.source, '斩杀');
        // 斩杀产生的事件（hp-change/_isDead）立即收集，避免被后续攻击组抢占

    /**
     * @param {Object<string, {onEnter?: Function, onExit?: Function}>} states - 状态定义

     * @param {Object<string, string[]>} [transitions] - 可选，合法转换表 { fromState: [toState, ...] }
     *   不传则允许任意转换（兼容旧代码）

    constructor(states, initialState, transitions) {

        this.current = initialState;
        this.previous = null;
        this.transitions = transitions || null;
    }

     * 状态转换
     * @param {string} newState - 目标状态名
     * @param {*} data - 传递给 onEnter/onExit 的数据
     * @returns {boolean} 是否允许转换（目标状态存在且合法则允许）
     */
    transition(newState, data) {
        const old = this.states[this.current];
        const next = this.states[newState];
        if (!next) {
            console.warn(`[FSM] 目标状态 "${newState}" 不存在，当前="${this.current}"`);
            return false;
        }

        if (this.transitions) {
            const allowed = this.transitions[this.current];
            if (!allowed || !allowed.includes(newState)) {
                console.warn(`[FSM] 非法转换: "${this.current}" → "${newState}"，允许: ${allowed ? allowed.join(', ') : '无'}`);
                return false;
            }
        }
        if (old && old.onExit) old.onExit(data);
        this.previous = this.current;
        this.current = newState;
        if (next.onEnter) next.onEnter(data);
        return true;
    }

    constructor(seed) {
        if (typeof seed === 'string') {

            for (let i = 0; i < seed.length; i++) {

        t ^= t << 13;
        t ^= t >> 17;

    }

    nextInt(min, max) {
        return Math.floor(this.next() * (max - min + 1)) + min;

        return this._state;
    }

    setState(state) {
        this._state = state >>> 0;

class AnimationScheduler {
    constructor() {
        this.tasks = [];
        this.now = 0;
        this.speed = 1;
        this.paused = false;
    }
    schedule(type, delay, callback) {
        this.tasks.push({ type, startTime: this.now + delay, callback });
        this.tasks.sort((a, b) => a.startTime - b.startTime);
    }
    clear(type) { this.tasks = this.tasks.filter(t => t.type !== type); }
    tick(deltaMs) {
        if (this.paused) return;
        this.now += deltaMs * this.speed;
        while (this.tasks.length > 0 && this.tasks[0].startTime <= this.now) {
            const task = this.tasks.shift();
            try { task.callback(); } catch(e) {}
        }
    }
    pause() { this.paused = true; }
    resume() { this.paused = false; }
    setSpeed(s) { this.speed = s; }
}

        case 'hotBlood': return true;
        case 'doubleStrike': return unit.uid === doubleStrikeUid && doubleStrikeUid != null;
        case 'horseFormation': return false;
        case 'mindControl': {
            if (!allyTeam) return false;
            let frontUnit = allyTeam.filter(u => u.alive && !u.isHorse).sort((a, b) => a.pos - b.pos)[0];
            return frontUnit && unit.uid === frontUnit.uid;
        }
        default: return false;
    }
}

let detailPopupUnit = null;
let detailPopupInterval = null;

function openDetailPopup(unit) {

function renderAtkDetail(u, buffStats, ctx) {
    let initAtk = u._initAtk !== undefined ? u._initAtk : u.atk;
    let holyAtkBonus = Math.floor(initAtk * buffStats.atkBonus);
    let carryAtk = u._carryAtkBonus || 0;
    let butterflyAtk = u._butterflyAtkBonus || 0;
    let finalAtk = u.atk;
    let permChange = finalAtk - initAtk - holyAtkBonus - carryAtk - butterflyAtk;
    let parts = [String(initAtk)];
    if (permChange > 0) parts.push(`<span style="color:#2e7d32;">+${permChange}永</span>`);
    else if (permChange < 0) parts.push(`<span style="color:#c0392b;">${permChange}永</span>`);
    if (butterflyAtk > 0) parts.push(`<span style="color:#daa520;">+${butterflyAtk}附身</span>`);
    if (holyAtkBonus > 0) parts.push(`<span style="color:#ff8c00;">+${holyAtkBonus}临</span>`);
    if (carryAtk > 0) parts.push(`<span style="color:#ff8c00;">+${carryAtk}临</span>`);
    const enemyTeamForAura = ctx.UI.enemyTeam || [];
    const allyTeamForAura = ctx.UI.allyTeam || [];
    const auraSideA = u.camp === 'ally' ? allyTeamForAura : enemyTeamForAura;
    const auraSideB = u.camp === 'ally' ? enemyTeamForAura : allyTeamForAura;
    const aura = getAuraBonuses(u, auraSideA, auraSideB);
    if (aura.emptyCol > 0) parts.push(`<span style="color:#ff8c00;">+${aura.emptyCol}光环</span>`);
    if (aura.bloodAura > 0) parts.push(`<span style="color:#ff8c00;">+${aura.bloodAura}光环</span>`);
    if (parts.length === 1) return parts[0];
    return parts.join(' ') + ' = <span style="color:#daa520;font-weight:bold;">' + finalAtk + '</span>';
}

function renderDefDetail(u, buffStats) {
    let initDef = u._initDef !== undefined ? u._initDef : u.def;
    let holyDefBonus = Math.floor(initDef * buffStats.defBonus);
    let carryDef = u._carryDefBonus || 0;
    let butterflyDef = u._butterflyDefBonus || 0;
    let fortifyStacks = u._fortifyStacks || 0;
    let fortifyDef = fortifyStacks;
    let finalDef = Math.round(u.def);
    let permChange = finalDef - Math.round(initDef) - holyDefBonus - carryDef - butterflyDef - fortifyDef;
    let parts = [String(Math.round(initDef))];
    if (permChange > 0) parts.push(`<span style="color:#2e7d32;">+${permChange}永</span>`);
    else if (permChange < 0) parts.push(`<span style="color:#c0392b;">${permChange}永</span>`);
    if (butterflyDef > 0) parts.push(`<span style="color:#daa520;">+${butterflyDef}附身</span>`);
    if (holyDefBonus > 0) parts.push(`<span style="color:#ff8c00;">+${holyDefBonus}临</span>`);
    if (carryDef > 0) parts.push(`<span style="color:#ff8c00;">+${carryDef}临</span>`);
    if (fortifyDef > 0) parts.push(`<span style="color:#ff8c00;">+${fortifyDef}坚盾(${fortifyStacks}层)</span>`);
    if (parts.length === 1) return parts[0];
    return parts.join(' ') + ' = <span style="color:#daa520;font-weight:bold;">' + finalDef + '</span>';
}

            <span style="color:#888;">造成伤害</span><span>${u.dmgDealt || 0}</span>

            <span style="color:#888;">Buff</span><span>${buffText}</span>
            ${masteryText}
            ${(() => {

function closeDetailPopup() {

function closeDetailPopupOnClick(e) { if (detailPopup && !detailPopup.contains(e.target)) closeDetailPopup(); }

// ==================== 核心渲染函数 ====================

function renderGrid(id, camp) {
    let grid = document.getElementById(id);
    if (!grid) return;
    grid.innerHTML = '';

    const store = getStore();
    const ctx = getCtx();
    let team = [];
    if (store) {
        const state = store.getState();
        team = state.units.filter(u => u.camp === camp);
    } else if (ctx && ctx.UI) {
        team = camp === 'ally' ? (ctx.UI.allyTeam || []) : (ctx.UI.enemyTeam || []);
    }

    let displayOrder = camp === 'enemy' ? [7,8,9,4,5,6,1,2,3] : [1,2,3,4,5,6,7,8,9];
    let isAdjustMode = ctx ? ctx.adjustMode : false;
    let selectedPos = ctx ? ctx.selectedAdjustPos : null;
    let activeBuffs = ctx ? (ctx.activeBuffs || []) : [];
    let allyTeam = ctx ? (ctx.UI.allyTeam || []) : [];
    let doubleStrikeUid = ctx ? ctx.currentDoubleStrikeUid : null;

    for (let i = 0; i < displayOrder.length; i++) {
        let pos = displayOrder[i], unit = team.find(c => c.pos === pos);
        // 确保每个单位都有 state 字典
        if (unit && !unit.state) unit.state = {};
        if (unit && !unit.isHorse) {
            if ((unit.state && unit.state._flyMode) || (unit._fsm && (unit._fsm.is('attached') || unit._fsm.is('flying')))) {
                let div = document.createElement('div');
                div.className = 'cell occupied';
                div.dataset.pos = pos;
                div.dataset.uid = unit.uid;
                if (unit.state._flyMode === 'fly') {
                    div.style.background = 'transparent';
                    div.style.border = '2px solid transparent';
                    div.style.boxShadow = 'none';
                } else if (unit.state._flyMode === 'ghost') {
                    let roleIcon = unit.role==='战士'?'⚔️':(unit.role==='防战'?'🛡️':(unit.role==='远程'?'🏹':'🦅'));
                    div.innerHTML = `<span class="cell-icon">${roleIcon}</span><div class="cell-info"><span class="cell-name">${unit.name}</span><span class="cell-stats">攻${Math.floor(unit.atk)} 防${Math.floor(unit.def)} 血${Math.floor(unit.hp)}</span></div>`;
                    div.style.opacity = '0.5';
                    div.style.background = 'rgba(30,100,255,0.28)';
                    div.style.border = '2px solid rgba(100,150,255,0.6)';
                    div.style.boxShadow = '0 0 12px rgba(100,150,255,0.5)';
                } else if (unit.state._flyMode === 'butterfly' || (unit._fsm && unit._fsm.is('attached'))) {
                    const crashMode = window.GlobalStore?.get('crashMode') || 'ghost';
                    if (crashMode === 'fly') {
                        div.innerHTML = '<span class="cell-icon">🦋</span>';
                        div.style.background = 'transparent';
                        div.style.border = '2px solid transparent';
                    } else {
                        div.innerHTML = '<span class="cell-icon">🦋</span><div class="cell-info"><span class="cell-name">蝴蝶</span></div>';
                        div.style.opacity = '0.4';
                        div.style.background = 'rgba(255, 192, 203, 0.15)';
                        div.style.border = '2px solid rgba(255, 105, 180, 0.4)';
                    }
                } else if (unit.state._flyMode === 'spider' || (unit._fsm && unit._fsm.is('flying'))) {
                    const crashMode = window.GlobalStore?.get('crashMode') || 'ghost';
                    if (crashMode === 'fly') {
                        div.innerHTML = '<span class="cell-icon">🕷️</span>';
                        div.style.background = 'transparent';
                        div.style.border = '2px solid transparent';
                    } else {
                        div.innerHTML = '<span class="cell-icon">🕷️</span><div class="cell-info"><span class="cell-name">蜘蛛</span></div>';
                        div.style.opacity = '0.4';
                        div.style.background = 'rgba(128, 0, 128, 0.1)';
                        div.style.border = '2px solid rgba(128, 0, 128, 0.4)';
                    }
                }
                grid.appendChild(div);
                continue;
            }
            if (unit.state && unit.state._isDead) {
                unit = { ...unit, _flash: 'dead', _resting: false, _acted: false, _blocked: false };
            }
        }
        if (!unit) {
            let div = document.createElement('div');
            div.className = 'cell';
            div.innerHTML = '<span style="color:#999;">空</span>';
            div.dataset.pos = pos;
            if (camp === 'ally' && isAdjustMode) div.classList.add('adjustable');
            if (camp === 'ally' && isAdjustMode && selectedPos === pos) div.classList.add('adjust-selected');
            grid.appendChild(div); continue;
        }
        let hasFlash = !!unit._flash;
        let isDead = (unit._flash==='dead' || !unit.alive || unit.state._isDead);
        let isBlocked = (unit.state && unit.state._blocked) || false;
        let isResting = (unit.state && unit.state._resting) || false;
        let isStunned = (unit.state && unit.state._stunned) || false;

        let roleIcon;
        if (isStunned && !isDead) {
            roleIcon = '😵';
        } else if (unit.isZhang && !unit.rangedForm) {
            roleIcon = '⚔️';
        } else if (unit.isHorse) {
            roleIcon = '🐴';
        } else {
            roleIcon = unit.role==='战士'?'⚔️':(unit.role==='防战'?'🛡️':(unit.role==='远程'?'🏹':'🦅'));
        }
        let displayName = unit.name;
        let displayIsZhang = unit.isZhang || false;
        if (unit.isXiaoZhaoSister) displayName += '·姊';
        if (unit.isXiaoZhaoBrother) displayName += '·妹';
        if (unit.name === '成昆' && unit.state && unit.state._phantomTarget) {
            const allUnits = (ctx.UI.allyTeam || []).concat(ctx.UI.enemyTeam || []);
            const mimicTarget = allUnits.find(u => u.uid === unit.state._phantomTarget);
            if (mimicTarget) {
                displayName = mimicTarget.name;
                displayIsZhang = mimicTarget.isZhang || false;
                roleIcon = mimicTarget.role==='战士'?'⚔️':(mimicTarget.role==='防战'?'🛡️':(mimicTarget.role==='远程'?'🏹':'🦅'));
            }
        }
        let latestUnit = unit;
        if (store) {
            const state = store.getState();
            const freshUnit = state.units.find(u => u.uid === unit.uid);
            if (freshUnit) {
                latestUnit = freshUnit;
            }
        }

        let buffStats = computeBuffStats(latestUnit, activeBuffs, allyTeam);
        let atkBonusVal = Math.floor(latestUnit.atk * buffStats.atkBonus);
        let defBonusVal = Math.floor((latestUnit._baseDef || latestUnit.def) * buffStats.defBonus);
        let hpBonusVal = Math.floor(latestUnit.maxHp * buffStats.hpBonus);
        let displayAtk = Math.round(latestUnit.atk + (latestUnit._carryAtkBonus || 0) + atkBonusVal);
        let initAtk = latestUnit._initAtk !== undefined ? latestUnit._initAtk : latestUnit.atk;
        let totalChange = displayAtk - initAtk;
        let atkDisplayHtml = `${displayAtk}`;
        if (totalChange > 0) {
            atkDisplayHtml = `<span style="color:#daa520;font-weight:bold;">${displayAtk}</span>`;
        } else if (totalChange < 0) {
            atkDisplayHtml = `<span style="color:#c0392b;font-weight:bold;">${displayAtk}</span>`;
        }
        let displayDef = Math.round(latestUnit.def + defBonusVal);
        let initDef = latestUnit._initDef !== undefined ? Math.round(latestUnit._initDef) : Math.round(latestUnit.def);
        let totalDefChange = displayDef - initDef;
        let defDisplayHtml = `${displayDef}`;
        if (totalDefChange > 0) {
            defDisplayHtml = `<span style="color:#daa520;font-weight:bold;">${displayDef}</span>`;
        } else if (totalDefChange < 0) {
            defDisplayHtml = `<span style="color:#c0392b;font-weight:bold;">${displayDef}</span>`;
        }
        let hpPct = unit.alive ? Math.floor((unit.hp / unit.maxHp) * 100) : 0;
        let hpColorClass = hpPct>70?'hp-text-green':(hpPct>40?'hp-text-orange':'hp-text-red');
        let barColor = hpPct>70?'#4caf50':(hpPct>40?'#ff9800':'#f44336');
        let hpDisplayHtml = `${Math.floor(unit.hp)}`;
        const hasButterflyHpBonus = (latestUnit._butterflyHpBonus || 0) > 0;
        if (hpBonusVal > 0 || (latestUnit._baseMaxHp !== undefined && latestUnit.maxHp > latestUnit._baseMaxHp) || hasButterflyHpBonus) {
            hpDisplayHtml = `<span style="color:#daa520;font-weight:bold;">${Math.floor(unit.hp)}</span>`;
        }
        let readyClass = (!hasFlash && !(unit.state && unit.state._acted) && unit.alive && !isDead) ? 'ready' : '';
        let actedClass = (!hasFlash && (unit.state && unit.state._acted) && unit.alive && !isDead) ? 'acted' : '';
        let cheerClass = (hasFlash && unit._flash==='cheer' && !isDead) ? 'cell-cheer' : '';
        let restingClass = (isBlocked && unit.alive && isResting && !(unit.isZhang && unit.rangedForm) && !isDead) ? 'resting' : '';
        let div = document.createElement('div');
        div.className = `cell occupied ${readyClass} ${actedClass} ${cheerClass} ${restingClass}`;
        if (isDead) { div.setAttribute('data-flash', 'dead'); div.style.transition = 'none'; }
        else if (unit._flash) { div.setAttribute('data-flash', unit._flash); div.style.transition = 'none'; }
        div.dataset.pos = pos;
        div.dataset.uid = unit.uid;
        if (camp === 'ally' && isAdjustMode) {
            if (unit.fixed) { div.classList.add('fixed-unit'); }
            else { div.classList.add('swappable'); if (selectedPos === pos) div.classList.add('adjust-selected'); }
        }
        if (unit._phantomFlash) {
            div.style.animation = 'phantomFlash 0.4s ease-in-out 2';

function copyLogToClipboard(choice) {
    let logDiv = document.getElementById('log');
    let lines = [];
    let seen = new Set();
    if (choice === 'detailed') choice = 'all';
    if (choice === 'brief') choice = 'normal';
    if (choice === 'debug') choice = 'all';
    if (choice === 'recent15') {
        const allDivs = logDiv.querySelectorAll('div');
        const recent = Array.from(allDivs).slice(-15);
        let text = recent.map(div => (div.textContent || '').trim()).filter(t => t).join('\n');
        if (!text.trim()) { showAlert('没有匹配的日志'); return; }
        navigator.clipboard.writeText(text).then(() => showAlert('最新15行日志已复制'));
        return;
    }
    const allDivs = logDiv.querySelectorAll('div');
    allDivs.forEach(div => {
        let t = div.textContent || '';
        t = t.trim();
        if (!t) return;
        if (t.includes('获得Buff') || t.includes('🗯️') || t.includes('🗣️')) {
            if (choice === 'normal' || choice === 'all') lines.push(t);
            return;
        }
        if (t.includes('回合开始') || t.includes('回合结束')) {
            let key = t.substring(0, 20);
            if (seen.has(key)) return;
            seen.add(key);
        }
        if (t.includes('初始阵容') || t.includes('阵容详情')) {
            let key = t.substring(0, 15);
            if (seen.has(key)) return;
            seen.add(key);
        }
        if (choice === 'health') {
            if (t.includes('[体检]')) lines.push(t);
        } else if (choice === 'normal') {
            if (!t.includes('[体检]') && !t.includes('[版本信息]') && !t.includes('[子模块]')) lines.push(t);
        } else {
            lines.push(t);
        }
    });
    let text = lines.join('\n');
    if (!text.trim()) { showAlert('没有匹配的日志'); return; }
    navigator.clipboard.writeText(text).then(() => showAlert('日志已复制'));
}

(function() {

﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿// ui/35main-battle.js - 光明顶5v5 战斗初始化
// V5.3.3 | 2026-08-05 精英出场率改为80%/15%/5% + ELITE_RATE加权选人
const VER = 'ui/35main-battle.js V5.4.0';










const C = CONFIG;
const ALL_BUFF_KEYS = Object.keys(C.BUFFS);

// ==================== 阵容生成 ====================
function doInitBattle(currentStage, UI, snapshot, activeBuffs, selectedBuffIndex, currentDoubleStrikeUid) {
    if (!UI || !snapshot) return;
    // 确定性 RNG：确保 init() 属性分配具有确定性，回放时可复现
    const _rng = snapshot._rngSeed ? new SeededRNG(snapshot._rngSeed) : new SeededRNG(Date.now());
    const _rand = (min, max) => _rng.nextInt(min, max);
    let allyTeam = [], enemyTeam = [];
    const mingSquadTemplate = C.MING_SQUADS && C.MING_SQUADS[currentStage] ? C.MING_SQUADS[currentStage] : null;
    const elitePower = C.ELITE_POWER || {};
    const eliteRate = C.ELITE_RATE || {};
    const normalPower = C.NORMAL_POWER || {};
    const targetPower = C.MING_TARGET_POWER && C.MING_TARGET_POWER[currentStage] ? C.MING_TARGET_POWER[currentStage] : null;

    // 精英出场率：80%一个、15%两个、5%三个，按 ELITE_RATE 权重选人
    // 精英先占坑，剩余位置和预算给普通兵
    const eliteConfigs = [
        { name: '张无忌', m: 115, role: '远程', isZhang: true, power: elitePower['张无忌'] || 140 },
        { name: '韦一笑', m: 107, role: '飞行', isWei: true, power: elitePower['韦一笑'] || 120 },
        { name: '小昭', m: 107, role: '远程', isXiaoZhaoBrother: true, power: elitePower['小昭'] || 135 }
    ];
    const eliteRoll = _rng.next();
    let eliteCount;
    if (eliteRoll < 0.05) {
        eliteCount = 3;
    } else if (eliteRoll < 0.20) {
        eliteCount = 2;
    } else if (eliteRoll < 0.80) {
        eliteCount = 1;
    } else {
        eliteCount = 0;
    }

    let usedPower = 0;

    // 强制精英模式：张无忌/韦一笑独立覆盖
    const forceZhang = GlobalStore.get('forceZhang') || localStorage.getItem('_forceZhang') === '1';
    const forceWei = GlobalStore.get('forceWei') || localStorage.getItem('_forceWei') === '1';
    if (forceZhang || forceWei) {
        // 重置精英计数器，强制覆盖
        eliteCount = Math.max(eliteCount, 1);
        // 从 eliteConfigs 中找到对应精英配置
        if (forceZhang) {
            const cfg = eliteConfigs.find(c => c.name === '张无忌');
            if (cfg && !allyTeam.some(u => u.name === '张无忌')) {
                let unit = new Unit(cfg.name, cfg.m, cfg.role, 'ally');
                unit.isZhang = true;
                unit.init(_rng); unit.applyBonus();
                unit.pos = null;
                allyTeam.push(unit);
                usedPower += cfg.power;
            }
        }
        if (forceWei) {
            const cfg = eliteConfigs.find(c => c.name === '韦一笑');
            if (cfg && !allyTeam.some(u => u.name === '韦一笑')) {
                let unit = new Unit(cfg.name, cfg.m, cfg.role, 'ally');
                unit.isWei = true;
                unit.init(_rng); unit.applyBonus();
                unit.pos = null;
                allyTeam.push(unit);
                usedPower += cfg.power;
            }
        }
        // 清理标记，防止影响后续战斗
        // 不清理标记，选关后仍可强制精英出场
    }

    if (eliteCount > 0 && !forceZhang && !forceWei) {
        const picked = [];
        const pool = [...eliteConfigs];
        // 加权抽取：按 ELITE_RATE 权重选精英，不重复
        function weightedPick(arr) {
            const total = arr.reduce((s, c) => s + (eliteRate[c.name] || 1 / arr.length), 0);
            let r = _rng.next() * total;
            for (let i = 0; i < arr.length; i++) {
                r -= (eliteRate[arr[i].name] || 1 / arr.length);
                if (r <= 0) return i;
            }
            return arr.length - 1;
        }
        if (eliteCount === 3) {
            picked.push(...pool);
        } else if (eliteCount === 2) {
            const i1 = weightedPick(pool);
            const rest = pool.filter((_, i) => i !== i1);
            const i2 = weightedPick(rest);
            picked.push(pool[i1], rest[i2]);
        } else {
            picked.push(pool[weightedPick(pool)]);
        }

        // 精英直接占坑
        for (const c of picked) {
            let unit = new Unit(c.name, c.m, c.role, 'ally');
            if (c.isZhang) unit.isZhang = true;
            if (c.isWei) unit.isWei = true;
            if (c.isXiaoZhaoBrother) {
                if (_rng.next() < 0.5) { unit.isXiaoZhaoSister = true; }
                else { unit.isXiaoZhaoBrother = true; }
                unit.initXiaoZhao(); unit.applyBonus();
                unit._baseMaxHp = unit.maxHp; unit._baseAtk = unit.atk; unit._baseDef = unit.def;
            } else {
                unit.init(_rng); unit.applyBonus();
            }
            unit.pos = null;
            allyTeam.push(unit);
            usedPower += c.power;
        }
    }

    // 普通兵候选池
    const candidatePool = [];
    for (const [name, m] of Object.entries(C.MING_M)) {
        if (['张无忌','韦一笑','小昭'].includes(name)) continue;
        if (m >= 95 && m <= 104) candidatePool.push({ name, m, role: null, power: normalPower[m] || 90 });
    }
    candidatePool.sort((a, b) => a.power - b.power);

    const remainingCandidates = [...candidatePool];
    let remainingPower = (targetPower || 500) - usedPower;
    let remainingSlots = 5 - allyTeam.length;
    for (let slot = 0; slot < remainingSlots; slot++) {
        const avgPower = remainingSlots > 0 ? remainingPower / remainingSlots : 90;
        const candidates = [];
        const above = remainingCandidates.filter(c => c.power >= avgPower).sort((a, b) => a.power - b.power).slice(0, 3);
        const below = remainingCandidates.filter(c => c.power < avgPower).sort((a, b) => b.power - a.power).slice(0, 2);
        candidates.push(...above);
        for (const c of below) { if (!candidates.some(x => x.name === c.name)) candidates.push(c); }
        if (candidates.length === 0) candidates.push(...remainingCandidates.slice(0, 5));
        const pick = candidates[_rand(0, candidates.length - 1)];
        const idx = remainingCandidates.findIndex(c => c.name === pick.name);
        if (idx >= 0) remainingCandidates.splice(idx, 1);
        const role = C.ROLES[_rand(0, 3)];
        const unit = new Unit(pick.name, pick.m, role, 'ally');
        unit.init(_rng); unit.applyBonus();
        unit.pos = null;
        allyTeam.push(unit);
        remainingPower -= pick.power;
    }

    // 强制小昭模式：如有小昭则修正标志，如无则添加
    const forceXzMode = GlobalStore.get('forceXiaoZhao');
    if (forceXzMode === 'sister' || forceXzMode === 'brother') {
        const existingXz = allyTeam.find(u => u.isXiaoZhaoSister || u.isXiaoZhaoBrother);
        if (existingXz) {
            // 场上已有小昭，直接修正标志
            existingXz.isXiaoZhaoSister = (forceXzMode === 'sister');
            existingXz.isXiaoZhaoBrother = (forceXzMode === 'brother');
        } else {
            // 场上没有小昭，新增一个
            const swappable = allyTeam.find(u => !u.isZhang && !u.isWei);
            if (swappable) {
                allyTeam.splice(allyTeam.indexOf(swappable), 1);
                remainingPower += (normalPower[swappable.m] || 90);
            }
            let xzUnit = new Unit('小昭', 107, C.ROLES[_rand(0, 3)], 'ally');
            xzUnit.isXiaoZhaoSister = (forceXzMode === 'sister');
            xzUnit.isXiaoZhaoBrother = (forceXzMode === 'brother');
            xzUnit.initXiaoZhao(); xzUnit.applyBonus();
            xzUnit._baseMaxHp = xzUnit.maxHp; xzUnit._baseAtk = xzUnit.atk; xzUnit._baseDef = xzUnit.def;
            xzUnit.pos = swappable ? swappable.pos : null;
            allyTeam.push(xzUnit);
            remainingPower -= (elitePower['小昭'] || 140);
        }
    }

    // 至少一个前排
    if (!allyTeam.some(u => u.role === '防战' || u.role === '战士')) {
        const nonFixed = allyTeam.filter(u => !u.isZhang && !u.isWei && !u.isXiaoZhaoSister && !u.isXiaoZhaoBrother);
        if (nonFixed.length > 0) {
            nonFixed[0].role = _rand(0, 1) === 0 ? '防战' : '战士';
            nonFixed[0].init(_rng); nonFixed[0].applyBonus();
        }
    }

    // 站位
    const takenPos = new Set();
    let zhang = allyTeam.find(u => u.isZhang);
    let wei = allyTeam.find(u => u.isWei);
    let xz = allyTeam.find(u => u.isXiaoZhaoSister || u.isXiaoZhaoBrother);
    if (zhang) { zhang.pos = 5; takenPos.add(5); }
    if (wei) { wei.pos = 6; takenPos.add(6); }
    if (xz) { xz.pos = 4; takenPos.add(4); }
    let others = allyTeam.filter(u => !u.isZhang && !u.isWei && !u.isXiaoZhaoSister && !u.isXiaoZhaoBrother);
    if (others.length > 0 && zhang && !takenPos.has(2)) { others[0].pos = 2; takenPos.add(2); others.shift(); }
    let emptySlots = [1,2,3,4,5,6,7,8,9].filter(p => !takenPos.has(p));
    // Fisher–Yates 洗牌
    for (let i = emptySlots.length - 1; i > 0; i--) {
        const j = _rng.nextInt(0, i);
        [emptySlots[i], emptySlots[j]] = [emptySlots[j], emptySlots[i]];
    }
    for (let u of others) {
        if (emptySlots.length > 0) { u.pos = emptySlots.shift(); takenPos.add(u.pos); }
        else { u.pos = 5; }
    }
    let toLock = [zhang, wei, xz].filter(Boolean);
    while (toLock.length < 3) { let pool = allyTeam.filter(u => !toLock.includes(u)); if (pool.length === 0) break; let pick = pool[_rand(0, pool.length - 1)]; toLock.push(pick); }
    toLock.forEach(u => { u.fixed = true; });

    // ==================== 六大派阵容生成 ====================
    const enemySquad = C.ENEMY_SQUADS && C.ENEMY_SQUADS[currentStage] ? C.ENEMY_SQUADS[currentStage] : null;
    let enemyUnits = [];
    const usedEnemyNames = [];

    if (enemySquad) {
        let enemyPosSet = new Set();
        let xuanmingPairCount = 0;
        for (let item of enemySquad) {
            if (typeof item === 'object' && item.name) {
                let unit = new Unit(item.name, item.m, item.role, 'enemy');
                unit.pos = null; unit.init(_rng); unit.applyBonus();
                enemyUnits.push(unit);
                usedEnemyNames.push(item.name);
                if (item.name === '鹿杖客' || item.name === '鹤笔翁') xuanmingPairCount++;
            } else {
                let mVal = item;
                let pool = Object.entries(ENEMY_M).filter(([n, v]) => v === mVal);
                let name = null;
                const squadDefs = Object.values(C.ENEMY_SQUADS).flat();
                for (let def of squadDefs) { if (typeof def === 'object' && def.m === mVal && !usedEnemyNames.includes(def.name)) { name = def.name; break; } }
                if (!name && pool.length > 0) {
                    let attempts = 0;
                    while ((!name || usedEnemyNames.includes(name)) && attempts < 50) { let pick = pool[_rand(0, pool.length - 1)]; name = pick[0]; attempts++; }
                }
                if (!name) {
                    // 兜底名字加序号，避免重名
                    const fallbackSects = ['少林弟子', '武当弟子', '峨眉弟子', '昆仑弟子', '崆峒弟子'];
                    const fallbackName = fallbackSects[_rand(0, fallbackSects.length - 1)];
                    const existingCount = usedEnemyNames.filter(n => n.startsWith(fallbackName)).length;
                    name = fallbackName + (existingCount > 0 ? String(existingCount + 1) : '');
                }
                let role = C.ROLES[_rand(0, 3)];
                let unit = new Unit(name, mVal, role, 'enemy');
                unit.pos = null; unit.init(_rng); unit.applyBonus();
                enemyUnits.push(unit);
                usedEnemyNames.push(name);
            }
        }
        if (currentStage === 5 && xuanmingPairCount === 2) {
            let extraM = 104;
            let pool = Object.entries(ENEMY_M).filter(([n, v]) => v === extraM);
            let usedNames = enemyUnits.map(u => u.name);
            let name = null;
            while ((!name || usedNames.includes(name)) && pool.length > 0) {
                let pick = pool[_rand(0, pool.length - 1)];
                name = pick[0];
                if (usedNames.includes(name)) { name = null; pool.splice(pool.indexOf(pick), 1); }
            }
            if (!name) {
                const fallbackSects = ['少林弟子', '武当弟子', '峨眉弟子', '昆仑弟子', '崆峒弟子'];
                const fallbackName = fallbackSects[_rand(0, fallbackSects.length - 1)];
                const existingCount = usedEnemyNames.filter(n => n.startsWith(fallbackName)).length;
                name = fallbackName + (existingCount > 0 ? String(existingCount + 1) : '');
            }
            let role = C.ROLES[_rand(0, 3)];
            let extraUnit = new Unit(name, extraM, role, 'enemy');
            extraUnit.init(_rng); extraUnit.applyBonus();
            enemyUnits.push(extraUnit);
        }
        let allUnits = [...enemyUnits];
        let template = C.ENEMY_POS_TEMPLATES && C.ENEMY_POS_TEMPLATES[currentStage] ? C.ENEMY_POS_TEMPLATES[currentStage] : null;
        let eliteUnits = allUnits.filter(u => C.ELITE_POOL && C.ELITE_POOL[currentStage] && C.ELITE_POOL[currentStage].some(e => e.name === u.name));
        let normalUnits = allUnits.filter(u => !eliteUnits.includes(u));
        if (template) {
            let roleCounts = { '战士': 0, '防战': 0, '远程': 0, '飞行': 0 };
            normalUnits.forEach(u => { if (roleCounts[u.role] !== undefined) roleCounts[u.role]++; });
            let templateNeeds = {};
            for (let [role, poses] of Object.entries(template)) { if (role === 'random') continue; templateNeeds[role] = poses.length; }
            for (let role of ['防战', '远程', '飞行', '战士']) {
                let need = templateNeeds[role] || 0;
                let current = roleCounts[role] || 0;

            if (!placed) { let backPos = zhouPos + 1; if (backPos <= 9) { let displaced = normalUnits.find(u => u.pos === backPos); if (displaced) { displaced.pos = null; displaced._originalPos = -1; } song.pos = backPos; song._originalPos = backPos; enemyPosSet.add(backPos); } }

function createBuffObject(key, duration) {
    const buff = { key, target: 'ally', remaining: duration, name: CONFIG.BUFFS[key]?.name || key };
    if (key === 'holyFlame') {
        const cols = [];
        const rng = getBattleRng();
        while (cols.length < 2) { const c = rng.nextInt(1, 3); if (!cols.includes(c)) cols.push(c); }
        cols.sort((a, b) => a - b);
        const rows = [];
        while (rows.length < 2) { const r = rng.nextInt(1, 3); if (!rows.includes(r)) rows.push(r); }
        rows.sort((a, b) => a - b);
        buff.cols = cols;
        buff.rows = rows;
    }
    return buff;
}

function generateBuffChoices(activeBuffs, allyTeam = [], rng = null) {
    let activeBuffKeys = activeBuffs.map(b => b.key);
    let available = ALL_BUFF_KEYS.filter(k => {
        if (activeBuffKeys.includes(k)) return false;
        if (k === 'fortify' && !activeBuffs.some(b => b.remaining > 0)) return false;
        const requiredRole = C.BUFF_ROLE_REQUIREMENTS[k];
        if (requiredRole && !allyTeam.some(u => u.alive && u.role === requiredRole)) return false;
        return true;
    });
    const shuffled = [...available];
    const r = rng || getBattleRng();
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = r.nextInt(0, i);
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, C.BUFF_CHOICES);
}

    appendDiv(`<div class="separator">📋 ${lbl} ${contextNote}</div>`);

    [
        {name:'明教', color:'blue', data:ally},
        {name:'六大派', color:'orange', data:enemy}

            let aliveText = u.alive ? '存活' : '💀阵亡';
            let displayPos = u.pos === -1 ? (u._originalPos || '?') : u.pos;
            let infoParts = [
                `${u.name}(${u.role} M${u.m})`,
                u.isHorse ? '[拒马]' : '',
                `站位${displayPos}`,
                `攻${Math.floor(u.atk)} 防${Math.floor(u.def)}`,
                `血${Math.floor(u.hp)}/${Math.floor(u.maxHp)}`,
                aliveText,
                u.isZhang ? '[无忌]' : '',
                u.isWei ? '[韦一笑]' : ''
            ].filter(Boolean);
            appendDiv('  ' + infoParts.join(' '));
            let statParts = [];
            if (hasStats) {
                if (u.dmgDealt !== undefined && u.dmgDealt > 0) statParts.push(`输出${u.dmgDealt}`);
                if (u.dmgTaken !== undefined && u.dmgTaken > 0) statParts.push(`承伤${u.dmgTaken}`);
            }
            if (u.dodgeCount > 0) statParts.push(`闪避${u.dodgeCount}次`);
            if (u.healDone > 0) statParts.push(`治疗${u.healDone}`);
            if (u.reboundDone > 0) statParts.push(`反弹${u.reboundDone}`);
            if (u.leechDone > 0) statParts.push(`吸血${u.leechDone}`);
            if (u.critCount > 0) statParts.push(`暴击${u.critCount}次`);
            if (u.survivedRounds > 0) statParts.push(`存活${u.survivedRounds}回合`);
            if (statParts.length > 0) appendDiv('    └ ' + statParts.join(' | '));
        });
    });
    logDiv.scrollTop = logDiv.scrollHeight;
    return true;
}

let manualSpeedLock = false;
let manualSpeedValue = null;
let slideSpeedActive = true;
let preManualSpeedLock = false;
let preManualSpeedValue = null;

function getButtonBySpeedValue(val, isDebug) {
    if (val === 600) {
        return isDebug ? document.getElementById('btnSpeed2x') : document.getElementById('btnSpeed2');
    } else if (val === 100) {
        return document.getElementById('btnSpeed8x');
    } else if (val === 300) {
        return document.getElementById('btnSpeed4x');
    } else if (val === 1600) {
        return isDebug ? document.getElementById('btnSpeed05x') : document.getElementById('btnSpeed05');
    }
    return null;
}

function updateSpeedButtons() {
    const debugMode = getState.debugMode();
    const speed = getState.speed();
    const btn2 = document.getElementById('btnSpeed2');
    const btn05 = document.getElementById('btnSpeed05');
    const btn8x = document.getElementById('btnSpeed8x');
    const btn4x = document.getElementById('btnSpeed4x');
    const btn2x = document.getElementById('btnSpeed2x');
    const btn05x = document.getElementById('btnSpeed05x');
    const grpH = document.getElementById('speedGroupHigh');
    const grpL = document.getElementById('speedGroupLow');

    if (debugMode) {
        if(btn2) btn2.style.display='none';
        if(btn05) btn05.style.display='none';
        if(grpH) grpH.style.display='flex';
        if(grpL) grpL.style.display='flex';
    } else {
        if(btn2) btn2.style.display='';
        if(btn05) btn05.style.display='';
        if(grpH) grpH.style.display='none';
        if(grpL) grpL.style.display='none';
    }

    [btn2, btn05, btn8x, btn4x, btn2x, btn05x].forEach(b => {
        if (!b) return;
        b.classList.remove('active', 'semi-active');
    });

    if (!slideSpeedActive) {
        const btn05Target = debugMode ? btn05x : btn05;
        if (btn05Target) btn05Target.classList.add('active');
        if (manualSpeedLock && manualSpeedValue && manualSpeedValue !== 1600) {
            const lockedBtn = getButtonBySpeedValue(manualSpeedValue, debugMode);
            if (lockedBtn) lockedBtn.classList.add('semi-active');
        }
    } else if (manualSpeedLock) {
        const activeBtn = getButtonBySpeedValue(speed, debugMode);
        if (activeBtn) activeBtn.classList.add('active');
    }
}

function updateBuffSlots(activeBuffs) {
    for (let i = 0; i < 2; i++) {
        let slot = document.getElementById('buffSlot' + i);
        if (!slot) continue;
        if (i < activeBuffs.length) {
            let buff = activeBuffs[i];
            slot.textContent = buff.name + '/' + buff.remaining + '回';
            slot.classList.add('glow');
        } else {
            slot.textContent = 'buff' + (i + 1);
            slot.classList.remove('glow');
        }
    }
}

function setSpeed(val, lock) {
    setState.speed(val);
    if (lock) {
        manualSpeedLock = true;
        manualSpeedValue = val;
        slideSpeedActive = true;
    }
    updateSpeedButtons();
}

function attachSpeedButton(id, speedVal) {
    let btn = document.getElementById(id); if (!btn) return;
    btn.addEventListener('click', function() {
        if (typeof window.onAnyButtonClick === 'function') window.onAnyButtonClick();
        if (btn.classList.contains('active')) {
            setState.speed(1000);
            manualSpeedLock = false;
            manualSpeedValue = null;
            slideSpeedActive = true;
            const ctx = GlobalStore.get('playerContext');
            if (ctx) {
                ctx.speed = 1000;
                if (ctx._scheduler) {
                    ctx._scheduler.paused = false;
                    ctx._scheduler.setSpeed(1);
                }
            }
            document.querySelectorAll('.controls button').forEach(b => {
                b.classList.remove('active', 'semi-active');
            });
            updateSpeedButtons();
        } else {
            setSpeed(speedVal, true);
        }
    });
}

function activateScrollSlowdown() {
    if (window.GlobalStore?.get('fastForwardActive')) return;
    const speed = getState.speed();
    if (speed === 1600) return;
    preManualSpeedLock = manualSpeedLock;
    preManualSpeedValue = manualSpeedValue;
    slideSpeedActive = false;
    setState.speed(1600);
    updateSpeedButtons();
}

function restoreSpeedFromScroll() {
    if (slideSpeedActive) return;
    slideSpeedActive = true;
    if (preManualSpeedLock) {
        manualSpeedLock = true;
        manualSpeedValue = preManualSpeedValue;
        setState.speed(preManualSpeedValue);
    } else {
        manualSpeedLock = false;
        manualSpeedValue = null;
        setState.speed(1000);
    }
    updateSpeedButtons();
    const ctx = GlobalStore.get('playerContext');
    if (ctx && ctx._scheduler) ctx._scheduler.setSpeed(1);
}
