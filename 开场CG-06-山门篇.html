<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>开场CG · 山门篇 | 光明顶5v5</title>
<style>
html,body{margin:0;height:100%;background:#020208;overflow:hidden;font-family:'LXGW WenKai','KaiTi','STKaiti','Noto Serif SC',serif;user-select:none;-webkit-tap-highlight-color:transparent}
#demoBar{position:fixed;top:0;left:0;right:0;z-index:100000;display:flex;align-items:center;gap:10px;background:rgba(5,5,12,.92);color:#a8b4c8;padding:8px 14px;font-size:13px;-webkit-tap-highlight-color:transparent}
#demoBar b{color:#ffb860}
#demoBar button{background:rgba(255,255,255,.07);color:#c8d0e0;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12px;-webkit-tap-highlight-color:transparent}
#demoBar button:hover{border-color:#ffb860;color:#ffb860}
#demoBar .spacer{flex:1}
</style>
</head>
<body>
<div id="demoBar"><b>开场CG · 山门篇（字下 / 人上）</b><span class="spacer"></span><button id="btnReplay">重播 CG</button></div>

<script>
(function(){
'use strict';

/* ============ 剧本 ============ */
var ACTS = [
  {
    chapter:'第一幕 · 兵临城下',
    mood:'siege',
    lines:[
      {t:'光明顶，最后一道山门。',d:0.8},
      {t:'少林、武当、峨眉、昆仑、崆峒——',d:1.6},
      {t:'五派合围，山门下旌旗如林。',d:1.5},
      {t:'圣火将熄',big:true,d:2.2}
    ],
    showOrange:true, showBlue:false
  },
  {
    chapter:'第二幕 · 五旗归位',
    mood:'rise',
    sigil:'明',
    lines:[
      {t:'你接过圣火令。',d:0.7},
      {t:'明教五旗，应召归位。',d:1.5},
      {t:'教众同心，蓝焰重燃。',d:1.5},
      {t:'光明顶，永不陷落',big:true,fire:true,d:2.3}
    ],
    showOrange:true, showBlue:true
  },
  {
    chapter:'第三幕 · 点将开战',
    mood:'battle',
    lines:[
      {t:'战鼓已擂。',d:0.7},
      {t:'五人对五人，一战定生死。',d:1.5},
      {t:'教主，点将！',d:1.3},
      {t:'让明教的怒火烧穿山门！',big:true,fire:true,d:2.2}
    ],
    showOrange:true, showBlue:true
  }
];

/* ============ 双方阵容 ============ */
var ORANGE_TEAM = [
  {name:'空闻', weapon:'crosier'},
  {name:'空智', weapon:'crosier'},
  {name:'清虚', weapon:'sword'},
  {name:'何太冲', weapon:'sword'},
  {name:'静玄', weapon:'sword'}
];
var BLUE_TEAM = [
  {name:'张无忌', weapon:'sword', star:true},
  {name:'韦一笑', weapon:'dagger'},
  {name:'杨逍', weapon:'sword'},
  {name:'殷天正', weapon:'sword'},
  {name:'范遥', weapon:'sword'}
];

/* ============ 音效 ============ */
var Snd = {
  ac:null, master:null, muted:false, live:false,
  rainGain:null, rainSrc:null, humGain:null, humOscs:null,
  ensure:function(){
    if(this.ac) return this.ac;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=this.muted?0:.5;
      var comp=this.ac.createDynamicsCompressor();
      comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.22;
      this.master.connect(comp);comp.connect(this.ac.destination);
    }catch(e){this.ac=null}
    return this.ac;
  },
  unlock:function(){var ac=this.ensure();if(ac&&ac.state==='suspended')ac.resume()},
  begin:function(){this.live=true},
  stopAll:function(){this.live=false;this.stopRain();this.stopHum()},
  startRain:function(){
    if(this.muted||this.rainGain)return;
    var ac=this.ac;if(!ac||ac.state!=='running')return;
    var len=ac.sampleRate*2;
    var buf=ac.createBuffer(1,len,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=750;lp.Q.value=.4;
    var g=ac.createGain();g.gain.value=.06;
    src.connect(lp);lp.connect(g);g.connect(this.master);
    src.start();
    this.rainGain=g;this.rainSrc=src;
  },
  stopRain:function(){
    if(this.rainGain){try{this.rainSrc.stop()}catch(e){}this.rainGain=null;this.rainSrc=null}
  },
  startHum:function(){
    if(this.muted||this.humGain)return;
    var ac=this.ac;if(!ac||ac.state!=='running')return;
    var o1=ac.createOscillator(),o2=ac.createOscillator();
    o1.type='sine';o1.frequency.value=62;
    o2.type='sine';o2.frequency.value=124;
    var g1=ac.createGain();g1.gain.value=.028;
    var g2=ac.createGain();g2.gain.value=.01;
    var g=ac.createGain();g.gain.value=.3;
    o1.connect(g1);g1.connect(g);
    o2.connect(g2);g2.connect(g);
    g.connect(this.master);
    o1.start();o2.start();
    this.humGain=g;this.humOscs=[o1,o2];
  },
  stopHum:function(){
    if(this.humGain){try{this.humOscs.forEach(function(o){o.stop()})}catch(e){}this.humGain=null;this.humOscs=null}
  },
  drum:function(vol){
    if(this.muted||!this.live)return;
    var ac=this.ensure();if(!ac||ac.state!=='running')return;
    var t=ac.currentTime;
    var v=(vol==null?.35:vol)*(.85+Math.random()*.3);
    var det=.95+Math.random()*.1;
    var o1=ac.createOscillator(),g1=ac.createGain();
    o1.type='sine';o1.frequency.setValueAtTime(84*det,t);
    o1.frequency.exponentialRampToValueAtTime(52*det,t+.4);
    g1.gain.setValueAtTime(.0001,t);
    g1.gain.exponentialRampToValueAtTime(v,t+.01);
    g1.gain.exponentialRampToValueAtTime(.0001,t+.45);
    o1.connect(g1);g1.connect(this.master);
    o1.start(t);o1.stop(t+.5);
    var len=Math.floor(ac.sampleRate*.05);
    var buf=ac.createBuffer(1,len,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var src=ac.createBufferSource();src.buffer=buf;
    var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=300;bp.Q.value=.9;
    var g2=ac.createGain();g2.gain.value=v*.5;
    src.connect(bp);bp.connect(g2);g2.connect(this.master);
    src.start(t);
  }
};

/* ============ 样式 ============ */
var STYLE = `
#cgGate{position:fixed;inset:0;z-index:99990;overflow:hidden;cursor:pointer;background:#020208;user-select:none;-webkit-user-select:none;font-family:'LXGW WenKai','KaiTi','STKaiti','Noto Serif SC',serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#cgGate.hide{animation:cgGateFade 1.2s ease forwards;pointer-events:none}
@keyframes cgGateFade{to{opacity:0}}

/* --- 背景层：山门（极淡剪影） --- */
#cgGateBody{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.32}
#cgGateBody .gate-mountain{position:absolute;left:0;right:0;bottom:0;height:80%;background:#06060e;clip-path:polygon(0 100%,0 78%,10% 70%,20% 78%,32% 62%,44% 74%,56% 52%,68% 72%,80% 62%,90% 76%,100% 68%,100% 100%)}
#cgGateBody .gate-arch{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:28vmin;height:38vmin;background:#010106;clip-path:polygon(34% 100%,34% 48%,42% 22%,50% 0%,58% 22%,66% 48%,66% 100%)}

/* --- 背景层：雨幕 --- */
#cgRain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 2s ease}
#cgGate[data-mood="siege"] #cgRain{opacity:1}
#cgGate[data-mood="rise"] #cgRain{opacity:.35}
#cgGate[data-mood="battle"] #cgRain{opacity:.25}
#cgRain canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-tap-highlight-color:transparent}

/* --- 背景层：圣火（两军之间偏右） --- */
#cgHolyFire{position:absolute;left:70%;top:24%;transform:translate(-50%,-50%);z-index:3;width:min(12vmin,80px);height:min(12vmin,80px);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#cgGate[data-mood="siege"] #cgHolyFire{opacity:.35}
#cgGate[data-mood="rise"] #cgHolyFire{opacity:.85}
#cgGate[data-mood="battle"] #cgHolyFire{opacity:1}
#cgHolyFire .f1{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:60%;height:80%;border-radius:50% 50% 45% 55%/55% 60% 40% 45%;background:radial-gradient(closest-side at 50% 70%,#fff3cf,#ffd267 52%,rgba(255,150,40,0) 74%);animation:cgFireMorph 1.2s ease-in-out infinite}
#cgHolyFire .f2{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:82%;height:92%;border-radius:50% 50% 46% 54%/55% 60% 40% 45%;background:radial-gradient(closest-side at 50% 65%,rgba(255,178,64,.95),rgba(240,110,30,.55) 55%,rgba(230,90,20,0) 76%);animation:cgFireMorph2 1.5s ease-in-out infinite}
#cgHolyFire .f3{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;height:100%;border-radius:50% 50% 45% 55%/50% 55% 45% 50%;background:radial-gradient(closest-side at 50% 62%,rgba(224,88,26,.75),rgba(200,60,18,.4) 52%,rgba(190,50,15,0) 74%);animation:cgFireMorph 1.8s ease-in-out infinite reverse}
@keyframes cgFireMorph{0%,100%{transform:translateX(-50%) scaleY(1) rotate(-2deg)}50%{transform:translateX(-50%) scaleY(1.08) rotate(2deg)}}
@keyframes cgFireMorph2{0%,100%{transform:translateX(-50%) scaleY(.96) rotate(1.5deg)}50%{transform:translateX(-50%) scaleY(1.1) rotate(-2deg)}}

/* --- 人物层：上方六大派 / 下方明教 --- */
.army{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,1.6vmin,18px);z-index:10;pointer-events:none;padding:0 8px}
#cgOrangeArmy{top:4%;height:22vh;opacity:0;transition:opacity 1.4s ease}
#cgBlueArmy{top:30%;height:22vh;opacity:0;transition:opacity 1.4s ease}
#cgGate.showOrange #cgOrangeArmy{opacity:1}
#cgGate.showBlue #cgBlueArmy{opacity:1}

.unit{display:flex;flex-direction:column;align-items:center;gap:.22em;opacity:0;transform:translateY(14px);animation:unitRise .8s cubic-bezier(.22,.8,.36,1) forwards}
@keyframes unitRise{to{opacity:1;transform:translateY(0)}}
.unit .silhouette{width:clamp(26px,6vmin,54px);height:clamp(48px,11vmin,100px);display:block;color:currentColor;filter:drop-shadow(0 0 5px currentColor)}
.unit .silhouette path,.unit .silhouette circle,.unit .silhouette rect,.unit .silhouette line{fill:currentColor;stroke:currentColor}
.unit.orange .silhouette{color:#ff8c3a}
.unit.blue .silhouette{color:#5aa0ff}
.unit .hp-bar{width:clamp(28px,6vmin,56px);height:clamp(3px,.7vmin,5px);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.unit .hp-fill{height:100%}
.unit.orange .hp-fill{background:linear-gradient(90deg,#ffb060,#e07020);box-shadow:0 0 4px rgba(255,150,60,.5)}
.unit.blue .hp-fill{background:linear-gradient(90deg,#6cb4ff,#3070c0);box-shadow:0 0 4px rgba(90,160,255,.5)}
.unit .unit-name{font-size:clamp(9px,1.9vmin,14px);letter-spacing:.06em;white-space:nowrap;line-height:1}
.unit.orange .unit-name{color:#ffc080;text-shadow:0 0 6px rgba(255,140,60,.5)}
.unit.blue .unit-name{color:#a8d0ff;text-shadow:0 0 6px rgba(90,160,255,.5)}
.unit.star .silhouette{filter:drop-shadow(0 0 10px currentColor) drop-shadow(0 0 20px rgba(90,160,255,.55))}
.unit.star .unit-name{font-weight:700;color:#e8ecf8}
/* 六大派名字在下（默认顺序），明教名字在上（列反转） */
#cgBlueArmy .unit{flex-direction:column-reverse}

/* --- 明字（文字区背景水印） --- */
#cgSigil{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);z-index:4;font-size:clamp(120px,32vmin,260px);line-height:1;color:rgba(140,190,255,.14);font-weight:700;pointer-events:none;opacity:0;transition:opacity 2s ease;letter-spacing:.05em}
#cgGate.sigilOn #cgSigil{opacity:1}

/* --- 文字层（下方） --- */
#cgText{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(88vw,900px);text-align:center;z-index:50;transition:opacity .8s ease}
#cgText.out{opacity:0}
.cg-chapter{font-size:clamp(11px,2.6vmin,20px);letter-spacing:.5em;text-indent:.5em;color:rgba(255,200,140,.55);margin:0 0 .7em;opacity:0;animation:cgTextRise 1s ease-out var(--d,0s) forwards}
.cg-line{font-size:clamp(14px,3.6vmin,30px);line-height:1.8;color:#d8cfc0;margin:0 0 .18em;opacity:0;animation:cgTextRise 1.3s cubic-bezier(.22,.8,.36,1) var(--d,0s) forwards;text-shadow:0 2px 14px rgba(0,0,0,.95)}
.cg-line.big{font-size:clamp(28px,7vmin,56px);font-weight:700;letter-spacing:.2em;text-indent:.2em;color:#ffc266;margin-top:.35em;text-shadow:0 0 16px rgba(255,150,50,.65),0 0 40px rgba(255,110,30,.45);animation:cgTextRise 2.2s cubic-bezier(.22,.8,.36,1) var(--d,0s) forwards,cgGoldBreath 3.5s ease-in-out var(--ed,2.5s) infinite}
.cg-line.big.fire{color:#ff9a4d;text-shadow:0 0 20px rgba(255,120,40,.75),0 0 50px rgba(255,80,20,.55)}
@keyframes cgTextRise{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes cgGoldBreath{0%,100%{text-shadow:0 0 16px rgba(255,150,50,.65),0 0 40px rgba(255,110,30,.45)}50%{text-shadow:0 0 28px rgba(255,180,70,.9),0 0 60px rgba(255,130,40,.65)}}

/* --- 提示（最下边缘，极低调） --- */
#cgHint{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;font-size:clamp(10px,2.2vmin,15px);letter-spacing:.28em;color:rgba(216,207,192,.7);opacity:0;z-index:51;text-shadow:0 1px 3px rgba(0,0,0,.85)}
#cgHint.show{animation:cgHintB 2.6s ease-in-out infinite}
@keyframes cgHintB{0%,100%{opacity:.18}50%{opacity:.7}}

/* --- 跳过 --- */
#cgSkip{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:52;background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:999px;font-size:clamp(11px,2.5vmin,16px);letter-spacing:.2em;padding:.45em 1.2em;font-family:inherit;cursor:pointer;transition:.3s;-webkit-tap-highlight-color:transparent}
#cgSkip:hover{color:#fff;border-color:rgba(255,200,120,.6)}

/* --- 震屏 --- */
#cgGate.shake{animation:cgGateShake .4s ease-out}
@keyframes cgGateShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,4px)}80%{transform:translate(2px,-1px)}}
`;

/* 人物剪影 SVG */
function makeSilhouette(weapon){
  var body='<circle cx="20" cy="14" r="9"/>'+
           '<path d="M 10 22 Q 20 28 30 22 L 33 62 Q 20 70 7 62 Z"/>'+
           '<rect x="13" y="62" width="5" height="32" rx="1"/>'+
           '<rect x="22" y="62" width="5" height="32" rx="1"/>';
  var wp='';
  if(weapon==='sword'){
    wp='<line x1="30" y1="38" x2="46" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
  }else if(weapon==='dagger'){
    wp='<line x1="30" y1="40" x2="40" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
  }else if(weapon==='crosier'){
    wp='<line x1="28" y1="10" x2="34" y2="80" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>'+
       '<circle cx="28" cy="10" r="4" stroke="currentColor" stroke-width="2" fill="none"/>';
  }
  return '<svg viewBox="0 0 50 100" class="silhouette">'+body+wp+'</svg>';
}

/* ============ 引擎 ============ */
var _active=null;

function showOpeningCg(){
  if(_active) return;
  if(!document.getElementById('cgGateStyles')){
    var st=document.createElement('style');
    st.id='cgGateStyles';st.textContent=STYLE;
    document.head.appendChild(st);
  }

  var overlay=document.createElement('div');
  overlay.id='cgGate';
  overlay.dataset.mood='siege';
  overlay.innerHTML=[
    '<div id="cgGateBody"><div class="gate-mountain"></div><div class="gate-arch"></div></div>',
    '<div id="cgRain"><canvas id="cgRainCanvas"></canvas></div>',
    '<div id="cgHolyFire"><div class="f3"></div><div class="f2"></div><div class="f1"></div></div>',
    '<div id="cgSigil">明</div>',
    '<div id="cgOrangeArmy" class="army"></div>',
    '<div id="cgBlueArmy" class="army"></div>',
    '<div id="cgText"></div>',
    '<button id="cgSkip">跳过 ›</button>',
    '<div id="cgHint"></div>'
  ].join('');
  document.body.appendChild(overlay);

  var text=overlay.querySelector('#cgText');
  var hint=overlay.querySelector('#cgHint');
  var orangeArmy=overlay.querySelector('#cgOrangeArmy');
  var blueArmy=overlay.querySelector('#cgBlueArmy');
  var rainCanvas=overlay.querySelector('#cgRainCanvas');

  var ctx={overlay:overlay,text:text,hint:hint,orangeArmy:orangeArmy,blueArmy:blueArmy,act:0,linesReady:false,switching:false,readyTimer:null,done:false,timers:[]};
  _active=ctx;

  function later(fn,ms){var t=setTimeout(fn,ms);ctx.timers.push(t);return t}
  function clearTimers(){ctx.timers.forEach(function(t){clearTimeout(t)});ctx.timers=[]}

  /* 雨幕 */
  var rainCtx=null,rainDrops=[];
  function initRain(){
    rainCanvas.width=window.innerWidth;
    rainCanvas.height=window.innerHeight;
    rainCtx=rainCanvas.getContext('2d');
    rainDrops=[];
    for(var i=0;i<200;i++){
      rainDrops.push({
        x:Math.random()*rainCanvas.width,
        y:Math.random()*rainCanvas.height,
        len:8+Math.random()*18,
        speed:6+Math.random()*12,
        opacity:.1+Math.random()*.26
      });
    }
  }
  function tickRain(){
    if(!rainCtx)return;
    rainCtx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
    rainCtx.strokeStyle='rgba(180,200,240,1)';
    for(var i=0;i<rainDrops.length;i++){
      var d=rainDrops[i];
      rainCtx.globalAlpha=d.opacity;
      rainCtx.lineWidth=1;
      rainCtx.beginPath();
      rainCtx.moveTo(d.x,d.y);
      rainCtx.lineTo(d.x-3,d.y+d.len);
      rainCtx.stroke();
      d.y+=d.speed;
      if(d.y>rainCanvas.height){d.y=-20;d.x=Math.random()*rainCanvas.width}
    }
    rainCtx.globalAlpha=1;
    requestAnimationFrame(tickRain);
  }
  initRain();
  tickRain();

  /* 阵容 */
  function buildArmy(box,team,color){
    box.innerHTML='';
    team.forEach(function(u,i){
      var unit=document.createElement('div');
      unit.className='unit '+color+(u.star?' star':'');
      unit.style.animationDelay=(0.6+i*0.15)+'s';
      var hp=80+Math.floor(Math.random()*20);
      unit.innerHTML=
        makeSilhouette(u.weapon)+
        '<div class="hp-bar"><div class="hp-fill" style="width:'+hp+'%"></div></div>'+
        '<div class="unit-name">'+u.name+'</div>';
      box.appendChild(unit);
    });
  }
  buildArmy(orangeArmy,ORANGE_TEAM,'orange');
  buildArmy(blueArmy,BLUE_TEAM,'blue');

  function setHint(t){hint.textContent=t;hint.classList.add('show')}
  function clearHint(){hint.classList.remove('show')}
  function lastHint(){return ctx.act===ACTS.length-1?'— 点击任意处 · 开战 —':'— 点击任意处继续 —'}

  function shake(){
    overlay.classList.remove('shake');
    void overlay.offsetWidth;
    overlay.classList.add('shake');
  }

  function renderAct(idx){
    var a=ACTS[idx];
    ctx.act=idx;ctx.linesReady=false;ctx.switching=false;
    clearHint();
    overlay.dataset.mood=a.mood;

    overlay.classList.toggle('showOrange',!!a.showOrange);
    overlay.classList.toggle('showBlue',!!a.showBlue);
    overlay.classList.toggle('sigilOn',!!a.sigil);

    /* 第三幕战鼓 */
    if(a.mood==='battle'){
      Snd.drum(.4);
      later(function(){Snd.drum(.3)},800);
      later(function(){Snd.drum(.35)},1600);
    }

    /* 文字（下方） */
    text.classList.remove('out');
    text.innerHTML='';
    var t=0.5;
    var ch=document.createElement('p');
    ch.className='cg-chapter';ch.textContent=a.chapter;
    ch.style.setProperty('--d',t+'s');
    text.appendChild(ch);t+=0.7;

    for(var i=0;i<a.lines.length;i++){
      var ln=a.lines[i];
      var p=document.createElement('p');
      p.className='cg-line'+(ln.big?' big':'')+(ln.fire?' fire':'');
      p.textContent=ln.t;
      t+=ln.d;
      p.style.setProperty('--d',t+'s');
      if(ln.big){
        p.style.setProperty('--ed',(t+2)+'s');
        (function(tt){later(function(){shake()},(tt+.3)*1000)})(t);
      }
      text.appendChild(p);
    }

    var total=t+1.2;
    ctx.readyTimer=later(function(){ctx.linesReady=true;setHint(lastHint())},total*1000);
  }

  function fastForward(){
    clearTimeout(ctx.readyTimer);
    text.querySelectorAll('.cg-line,.cg-chapter').forEach(function(el){
      el.style.setProperty('--d','0s');
      el.style.setProperty('--ed','.4s');
      el.style.animationDuration='.3s';
    });
    ctx.linesReady=true;
    later(function(){setHint(lastHint())},400);
  }

  function nextAct(){
    ctx.switching=true;
    clearHint();
    text.classList.add('out');
    later(function(){renderAct(ctx.act+1)},600);
  }

  function finish(){
    if(ctx.done)return;
    ctx.done=true;
    clearTimers();
    Snd.stopAll();
    overlay.classList.add('hide');
    setTimeout(function(){overlay.remove();_active=null},1300);
  }

  /* pointerdown 替代 click：无延迟、无点击高亮 */
  overlay.addEventListener('pointerdown',function(e){
    if(e.button && e.button!==0) return;
    if(ctx.done||ctx.switching)return;
    Snd.unlock();
    if(!ctx.linesReady){fastForward();return}
    if(ctx.act<ACTS.length-1)nextAct();
    else finish();
  });

  overlay.querySelector('#cgSkip').addEventListener('pointerdown',function(e){
    e.stopPropagation();
    finish();
  });

  later(function(){Snd.startRain();Snd.startHum()},400);
  renderAct(0);
}

window.playGateCg=showOpeningCg;
document.addEventListener('DOMContentLoaded',function(){
  showOpeningCg();
  document.getElementById('btnReplay').addEventListener('click',function(){showOpeningCg()});
});

})();
</script>
