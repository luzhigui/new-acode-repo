        // ==================== 独立背景音乐（Web Audio 缓存模式） ====================
        var bgmCtx = null;
        var bgmBuffer = null;
        var bgmSource = null;
        var bgmGainNode = null;
        var bgmPlaying = false;

        function getBgmCtx() {
            try {
                if (!bgmCtx) bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
                return bgmCtx;
            } catch (e) {
                // 移动端无用户手势时创建 AudioContext 会报错，静默忽略
                return null;
            }
        }

        async function loadBgm() {
            try {
                const ctx = getBgmCtx();
                if (!ctx) return;
                // 随机选一首可商用 BGM（不侵权；不用 sfx_xinai）
                const BGM_LIST = ['assets/bgm-wuxia.mp3', 'assets/bgm-chinese.mp3'];
                const pick = BGM_LIST[Math.floor(Math.random() * BGM_LIST.length)];
                const resp = await fetch(pick);
                const buf = await resp.arrayBuffer();
                try {
                    bgmBuffer = await ctx.decodeAudioData(buf);
                } catch (e) {
                    // decodeAudioData 在移动端可能被拒
                    bgmBuffer = null;
                }
            } catch (e) { bgmBuffer = null; }
        }

        function playBgm() {
            if (!bgmBuffer) return;
            const ctx = getBgmCtx();
            if (!ctx) return;
            try { if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
            stopBgm();
            try {
                bgmSource = ctx.createBufferSource();
                bgmSource.buffer = bgmBuffer;
                bgmSource.loop = true;
                bgmGainNode = ctx.createGain();
                let savedVol = 0.6;
                try {
                    savedVol = parseFloat(localStorage.getItem('ming_bgm_volume') || '0.6');
                } catch (e) {}
                bgmGainNode.gain.setValueAtTime(savedVol, ctx.currentTime);
                bgmSource.connect(bgmGainNode);
                bgmGainNode.connect(ctx.destination);
                bgmSource.start();
                bgmPlaying = true;
            } catch (e) {
                // 移动端 AudioContext 受限，静默失败
                bgmPlaying = false;
            }
        }

        function stopBgm() {
            if (bgmSource) {
                try { bgmSource.stop(); } catch (e) {}
                bgmSource.disconnect();
                bgmSource = null;
            }
            if (bgmGainNode) {
                bgmGainNode.disconnect();
                bgmGainNode = null;
            }
            bgmPlaying = false;
        }

        document.getElementById('btnBGM').addEventListener('click', () => {
            const btn = document.getElementById('btnBGM');
            if (!bgmBuffer) {
                loadBgm().then(() => {
                    if (bgmBuffer) { playBgm(); btn.textContent = '🎵 背景音乐：播放中'; btn.classList.remove('muted'); }
                });
                return;
            }
            if (bgmPlaying) {
                stopBgm();
                btn.textContent = '🔇 背景音乐：已暂停';
                btn.classList.add('muted');
            } else {
                playBgm();
                btn.textContent = '🎵 背景音乐：播放中';
                btn.classList.remove('muted');
            }
        });

        // 2026-09-20 时间戳：改原来副标题/页脚里写死的"12:15"（共两处）为实时值——
        // 读 GitHub 仓库最新提交时间（真值，一推代码就变）。加载失败时不显示，不留过期数字。
        (function () {
            const s1 = document.getElementById('devStamp1');
            const s2 = document.getElementById('devStamp2');
            fetch('https://api.github.com/repos/luzhigui/new-acode-repo/commits?per_page=1')
                .then(r => r.ok ? r.json() : null)
                .then(arr => {
                    const t = arr && arr[0] && arr[0].commit && arr[0].commit.committer && arr[0].commit.committer.date;
                    if (!t) return;
                    const txt = new Date(t).toLocaleString('zh-CN', { hour12: false });
                    if (s1) s1.textContent = txt;
                    if (s2) s2.textContent = txt;
                })
                .catch(() => {});
        })();

    </script>

</body>
</html>
